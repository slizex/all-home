/* ---------- Abschreiben (einmal je Dokument, danach dauerhaft gespeichert) ---------- */
async function nkaAbschreiben(d){
  var bilder=(d.weitere_seiten||[]).length||/^image\//.test(d.mime_type||""),text="";
  if(!bilder){
    var dl=await sb.storage.from(BUCKET).download(d.storage_path);
    if(dl.error)throw new Error(t("Datei konnte nicht geladen werden."));
    var bytes=new Uint8Array(await dl.data.arrayBuffer());
    if(bytes.length>10*1024*1024)throw new Error(t("Datei zu groß zum Abschreiben."));
    var b=await edgeRuf(EDGE_EXTRACT,{modus:"text",fileBase64:bytesBase64(bytes),mimeType:"application/pdf",lang:curLang});
    text=String(b.text||"");
  }else{
    var seiten=await bilderDesDokuments(d),teile=[];
    for(var i=0;i<seiten.length;i+=4){
      var paket=seiten.slice(i,i+4),bl=[],streifen=[];
      for(var j=0;j<paket.length;j++){var st=await textStreifen(paket[j]);streifen.push(st.length);bl=bl.concat(st);}
      var b2=await edgeRuf(EDGE_EXTRACT,{modus:"text",bilder:bilderFuerKi(bl),streifen:streifen,ab:i+1,mimeType:"image/jpeg",lang:curLang});
      teile.push(String(b2.text||"").trim());
    }
    text=teile.filter(Boolean).join("\n\n");
  }
  text=text.trim().slice(0,200000);
  if(text){var u=await sb.from("documents").update({volltext:text}).eq("id",d.id);if(u.error)throw u.error;}
  return text;
}
/* Neue Nebenkosten-Datei: Text gleich im Hintergrund abschreiben (Fehler still – der Bot holt es sonst nach) */
function nkaTextImHintergrund(id,v){
  if(!id||!v||!v.bytes)return;
  if(v.mime==="application/pdf")volltextAusPdf(id,v.bytes);else volltextHolen(id,[v.bytes]);
}

/* ---------- Analyse starten ---------- */
async function nkaLos(q){
  if(!HH||!NKA||NKA.laeuft)return;
  NKA.laeuft=true;closeModal(true);
  var A=NKA,hh=HH.id;
  try{
    /* 1. fehlende Texte abschreiben */
    for(var i=0;i<A.fehlend.length;i++){
      nkArbeit(tf("Dokument {0} von {1} wird abgeschrieben …",i+1,A.fehlend.length));
      try{await nkaAbschreiben(A.fehlend[i]);}
      catch(e){if(nkKiGesperrt(e))throw e;}   /* einzelnes Dokument kaputt: ohne Text weiter */
    }
    if(A.fehlend.length)await nkaTexteLaden();
    /* 2. analysieren */
    nkArbeit(t("Die KI analysiert alle Jahre … (30–120 Sek.)"));
    var fakten=nkaFakten(),vorher=A.berichte[0]?nkaVorherKurz(A.berichte[0].bericht):null;
    var b=await edgeRuf(EDGE_NKA,{modus:"bericht",qualitaet:q,fakten:fakten,texte:A.texte.map(function(x){return {titel:x.titel,text:x.text};}),
      gedaechtnis:nkaGedaechtnisTexte(),vorher:vorher,lang:curLang});
    if(!b.bericht)throw new Error(t("Nichts erkannt."));
    /* 3. speichern (Bericht + neue Gedächtnis-Einträge) */
    nkArbeitText(t("Wird gespeichert …"));
    var ins=await sb.from("nk_berichte").insert({household_id:hh,modell:b.modell||null,qualitaet:q,kosten_usd:b.kosten_usd||null,lang:b.lang||curLang,
      stand:nkaStandJetzt(),bericht:b.bericht,fakten:fakten}).select("id").single();
    if(ins.error)throw ins.error;
    await nkaMerkenAusBot(b.bericht.gedaechtnis_neu,ins.data.id);
    await ladeNkAnalyse();
    closeModal(true);go("#/nkanalyse?id="+ins.data.id);
    toast(t("Bericht erstellt")+" ✅"+(b.kosten_usd?" · "+kiEur(b.kosten_usd):""));
  }catch(x){
    closeModal(true);
    if(nkKiGesperrt(x))nkLeseFehler(x,[],null);
    else if(/546|504|timeout|zeitüberschreitung|non-2xx|failed to fetch/i.test(errMsg(x)))toast(t("Die Analyse hat zu lange gedauert. Bitte „Schnell“ wählen oder später erneut versuchen."),true);
    else toast(t("Analyse fehlgeschlagen")+": "+errMsg(x),true);
  }finally{A.laeuft=false;}
}
/* Was vom vorigen Bericht für „Seit dem letzten Bericht“ gebraucht wird */
function nkaVorherKurz(b){
  if(!b)return null;
  return {kurzfazit:b.kurzfazit||"",pruefpunkte:(b.pruefpunkte||[]).map(function(p){return {titel:p.titel,betrag:p.betrag,jahr:p.jahr};}),
    todos:(b.todos||[]).map(function(x){return x.text;})};
}
function nkaNorm(s){return String(s||"").toLowerCase().replace(/\s+/g," ").replace(/[„“"'«»]/g,"").trim();}
async function nkaMerkenAusBot(liste,berichtId){
  var da={};nkaGedaechtnisTexte().forEach(function(g){da[nkaNorm(g)]=1;});
  var neu=(Array.isArray(liste)?liste:[]).map(function(x){return String(x||"").trim().slice(0,300);})
    .filter(function(x){return x.length>=2&&!da[nkaNorm(x)]&&(da[nkaNorm(x)]=1);}).slice(0,5);
  if(!neu.length||!HH)return;
  var r=await sb.from("nk_gedaechtnis").insert(neu.map(function(x){return {household_id:HH.id,text:x,quelle:"bot",bericht_id:berichtId||null};}));
  if(r.error)console.warn("Gedächtnis:",errMsg(r.error));
}

/* ---------- Nachprüfen, was die KI schreibt ---------- */
/* Zitat steht (bis auf Leerraum und Groß/klein) im Text eines Dokuments? Lange Zitate: die ersten 60 Zeichen genügen. */
/* Zitat-Abgleich nur über Buchstaben und Ziffern: Tabellenstriche, Zeilenumbrüche und €/EUR aus dem Abschreiben stören nicht */
function nkaKern(s){return String(s||"").toLowerCase().replace(/€/g,"eur").replace(/[^0-9a-zäöüß]+/g,"");}
function nkaBelegOk(beleg,texte,namen){
  var z=nkaKern(beleg);if(z.length<5)return false;
  if(z.length>70)z=z.slice(0,50);
  return (texte||[]).some(function(x){return nkaKern(x.text).indexOf(z)>=0;})||
    (namen||[]).some(function(n){var k=nkaKern(n);return k.length>=5&&(k===z||k.indexOf(z)>=0);});
}
var NKA_STUFE_RUNTER={sicher:"wahrscheinlich",wahrscheinlich:"pruefen",pruefen:"pruefen"};
function nkaGeprueft(b,texte){
  var labels={},sum={},namen=[];nkMitWerten(nkSortiert()).forEach(function(n){labels[nkLabel(n)]=n;sum[nkLabel(n)]=nkSumme(n);
    nkPos(n).forEach(function(p){if(p.bez)namen.push(p.bez);});});
  var maxSumme=Math.max.apply(null,[0].concat(Object.keys(sum).map(function(k){return sum[k];})));
  var mitText=(texte||[]).some(function(x){return String(x.text||"").trim().length>50;});
  var pp=(b.pruefpunkte||[]).map(function(p){
    var x=Object.assign({},p),belegOk=x.beleg?nkaBelegOk(x.beleg,texte,namen):null;
    x.belegOk=belegOk;
    if(x.jahr&&!labels[x.jahr])x.jahr=null;
    if(x.kategorie&&!NK_KAT[x.kategorie])x.kategorie=null;
    var grenze=x.jahr?sum[x.jahr]:maxSumme;
    x.betragOk=x.betrag==null||(Number(x.betrag)>0&&Number(x.betrag)<=grenze*1.001);
    if(!x.betragOk)x.betrag=null;
    if(!NKA_STUFE_RUNTER[x.sicherheit])x.sicherheit="pruefen";
    /* unbelegt = eine Stufe vorsichtiger (nur wenn Text zum Abgleich da ist) */
    if(mitText&&!belegOk)x.sicherheit=NKA_STUFE_RUNTER[x.sicherheit];
    return x;
  }).sort(function(a,c){return (Number(c.betrag)||0)-(Number(a.betrag)||0);});
  var tr=Object.assign({},b.treiber||{});
  var L=Object.keys(labels);
  if(!labels[tr.bis])tr.bis=L[L.length-1];
  if(!labels[tr.von]||tr.von===tr.bis)tr.von=L.length>1?L[L.indexOf(tr.bis)-1]||L[L.length-2]:null;
  tr.punkte=(tr.punkte||[]).filter(function(x){return NK_KAT[x.kategorie];}).map(function(x){return Object.assign({},x,{belegOk:x.beleg?nkaBelegOk(x.beleg,texte,namen):null});});
  var pr=Object.assign({},b.prognose||{}),letzte=L.length?sum[L[L.length-1]]*nkFaktor(labels[L[L.length-1]]):null;
  pr.unsicher=pr.kosten!=null&&letzte>0&&(pr.kosten<letzte*0.5||pr.kosten>letzte*2);
  var todos=(b.todos||[]).map(function(x){return Object.assign({},x,{frist:/^\d{4}-\d{2}-\d{2}$/.test(String(x.frist||""))?x.frist:null});})
    .sort(function(a,c){return (a.frist||"9999")<(c.frist||"9999")?-1:1;});
  var potenzial=pp.filter(function(x){return x.betrag&&x.sicherheit!=="pruefen";}).reduce(function(s,x){return s+Number(x.betrag);},0);
  return Object.assign({},b,{pruefpunkte:pp,treiber:tr,prognose:pr,todos:todos,potenzial:potenzial});
}

/* ---------- Kostentreiber: Veränderung je Kategorie zwischen zwei Zeiträumen (auf 12 Monate) ---------- */
function nkaTreiberDaten(von,bis){
  var a=nkMitWerten(nkSortiert()).filter(function(n){return nkLabel(n)===von;})[0],b=nkMitWerten(nkSortiert()).filter(function(n){return nkLabel(n)===bis;})[0];
  if(!a||!b)return null;
  var ka=nkKat(a),kb=nkKat(b),fa=nkFaktor(a),fb=nkFaktor(b),keys={};
  Object.keys(ka).concat(Object.keys(kb)).forEach(function(k){keys[k]=1;});
  var l=Object.keys(keys).map(function(k){return {k:k,diff:(kb[k]||0)*fb-(ka[k]||0)*fa,vergleichbar:nkVergleichbarKat(k,a,b)};})
    .filter(function(x){return Math.abs(x.diff)>=1;}).sort(function(x,y){return Math.abs(y.diff)-Math.abs(x.diff);});
  return {von:a,bis:b,start:nkSumme(a)*fa,ende:nkSumme(b)*fb,zeilen:l};
}
function nkaTreiberHtml(T,punkte){
  if(!T||!T.zeilen.length)return "";
  var max=Math.max.apply(null,T.zeilen.map(function(x){return Math.abs(x.diff);}).concat([1])),diff=T.ende-T.start;
  var urs={};(punkte||[]).forEach(function(p){urs[p.kategorie]=p;});
  return '<div class="nkatr"><div class="nkatrkopf"><span>'+esc(nkLabel(T.von))+' <b>'+eur0(T.start)+'</b></span><span>→</span>'+
      '<span>'+esc(nkLabel(T.bis))+' <b>'+eur0(T.ende)+'</b></span><span class="nkd '+(diff>0?"hoch":"runter")+'">'+(diff>0?"+":"−")+eur0(Math.abs(diff))+'</span></div>'+
    T.zeilen.slice(0,8).map(function(x){
      var w=Math.max(2,Math.round(Math.abs(x.diff)/max*50)),p=urs[x.k];
      return '<div class="nkatrz"><div class="nkatrl"><span>'+NK_KAT[x.k].icon+' '+esc(t(NK_KAT[x.k].l))+(x.vergleichbar?"":' <span class="mut">*</span>')+'</span>'+
          '<b class="nkd '+(x.diff>0?"hoch":"runter")+'">'+(x.diff>0?"+":"−")+eur0(Math.abs(x.diff))+'</b></div>'+
        '<div class="nkatrbahn"><i class="'+(x.diff>0?"hoch":"runter")+'" style="'+(x.diff>0?"left:50%":"right:50%")+';width:'+w+'%"></i></div>'+
        (p?'<div class="nkatru">'+esc(p.ursache||"")+nkaBelegHtml(p)+'</div>':"")+'</div>';
    }).join("")+
    (T.zeilen.some(function(x){return !x.vergleichbar;})?'<p class="hint" style="margin:6px 0 0">* '+t("nur eingeschränkt vergleichbar (Teilzeitraum)")+'</p>':"")+
  '</div>';
}
function nkaBelegHtml(p){
  if(!p||!p.beleg)return "";
  return '<span class="nkabeleg'+(p.belegOk?" ok":"")+'" translate="no">„'+esc(p.beleg)+'“'+(p.dokument?' <span class="mut">– '+esc(p.dokument)+'</span>':"")+

/* Antworttext: Absätze und Aufzählungen, sonst nur Text */
/* Web-Quellen der Recherche: nur echte http(s)-Adressen verlinken */
function nkaQuellen(a){return (a&&Array.isArray(a.quellen)?a.quellen:[]).filter(function(x){return x&&/^https?:\/\//i.test(String(x.url||""));});}
function nkaFett(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*/g,"");}
function nkaAbsatz(txt){
  txt=String(txt||"").replace(/^\s*#{1,6}\s+/gm,"").replace(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/gm,"");
  return txt.split(/\n{2,}/).filter(function(a){return a.trim();}).map(function(abs){
    var z=abs.split("\n");
    if(z.every(function(x){return /^\s*([-*•]|\d+[.)])\s+/.test(x);}))return '<ul>'+z.map(function(x){return '<li>'+nkaFett(x.replace(/^\s*([-*•]|\d+[.)])\s+/,""))+'</li>';}).join("")+'</ul>';
    return '<p>'+z.map(nkaFett).join("<br>")+'</p>';
  }).join("");
}

/* Bericht in die eigene Sprache übersetzen (nur für diese Sitzung) */
async function nkaUebersetzen(id){
  var B=(NKA.berichte||[]).filter(function(x){return x.id===id;})[0];if(!B)return;
  var kopie=JSON.parse(JSON.stringify(B.bericht||{})),zitate=[];
  function weg(o){if(o&&o.beleg){zitate.push([o,o.beleg,o.dokument]);o.beleg="#"+(zitate.length-1);o.dokument=null;}}
  (kopie.pruefpunkte||[]).forEach(weg);((kopie.treiber||{}).punkte||[]).forEach(weg);
  try{var b=await edgeRuf("butler-translate",{texte:kopie,ziel:curLang,quelle:B.lang||"de",level:"basic"});
    if(!b.uebersetzung)throw new Error(t("Nichts erkannt."));
    var u=b.uebersetzung;
    function zurueckLegen(o){var m=o&&/^#(\d+)$/.exec(String(o.beleg||""));if(m&&zitate[+m[1]]){o.beleg=zitate[+m[1]][1];o.dokument=zitate[+m[1]][2];}}
    (u.pruefpunkte||[]).forEach(zurueckLegen);((u.treiber||{}).punkte||[]).forEach(zurueckLegen);
    NKA.uebersetzt[id]=u;render();}
  catch(e){toast(t("Übersetzen fehlgeschlagen")+": "+errMsg(e),true);}
}

   alles stumm. Neue Web-Funktionen brauchen deshalb keine neue APK; eine
   neue APK nur, wenn sich am nativen Teil etwas ändert. */

function istApp(){

  catch(e){return false;}

/* ---- Base64 ↔ Blob (die Brücke kennt nur Text) ---- */
function blobBase64(blob){
  return new Promise(function(ok,nein){
    var r=new FileReader();
    r.onload=function(){var s=String(r.result||"");ok(s.slice(s.indexOf(",")+1));};
    r.onerror=function(){nein(r.error||new Error(t("Datei konnte nicht gelesen werden.")));};
    r.readAsDataURL(blob);
  });
}
function base64Blob(b64,mime){
  var bin=atob(b64||""),n=bin.length,b=new Uint8Array(n);
  for(var i=0;i<n;i++)b[i]=bin.charCodeAt(i);
  return new Blob([b],{type:mime||"application/octet-stream"});
}

/* ================= Start ================= */
async function appStart(){
  if(!istApp()){appUpdatePruefen(true);return;}   /* Browser: nur die Versionsangabe für den Download-Block */
  document.documentElement.classList.add("in-app");
  var A=appP("AllHome");
  try{APP=await A.info();}catch(e){APP={};}
  A.addListener("geteilt",function(){geteiltAbholen();});
  A.addListener("updateFortschritt",function(p){appUpdateFortschritt(p);});
  var Ap=appP("App");
  if(Ap){
    Ap.addListener("backButton",appZurueck);
    Ap.addListener("appUrlOpen",function(d){appLink(d&&d.url);});
    Ap.addListener("resume",appWiederDa);
  }
  var LN=appP("LocalNotifications");
  if(LN)LN.addListener("localNotificationActionPerformed",function(a){
    var x=a&&a.notification&&a.notification.extra;
    if(x&&x.href)appSprung(x.href,x.hh||null);
  });
  systemLeisten();
  appUpdatePruefen(true);
  if(!me||booting)render();   /* Versionszeile auf der Anmeldeseite */
}

    var r=await fetch("android-app.json?t="+Date.now(),{cache:"no-store"});

    if(!j||!(j.code>0)||!/^https:\/\/github\.com\/slizex\/all-home\/releases\/download\//.test(String(j.url||"")))return;
    var vorher=APP_UPDATE?APP_UPDATE.code:0;
    APP_UPDATE={version:String(j.version||""),code:+j.code,mindest:+j.mindest||0,url:String(j.url),sha256:String(j.sha256||""),groesse:+j.groesse||0};
    if(APP_UPDATE.code!==vorher&&$("#root"))render();

}

/* ================= Dokument-Ansicht in der App =================
   PDFs zeichnet Androids eigener PDF-Renderer seitenweise als Bild,
   Bilder zeigt die Seite direkt. Nichts landet in „Downloads“. */
var APP_ANSICHT=null;   /* {d, blob, name, pdf:bool, seiten, url} */
async function appDokAnsicht(d){
  var A=appP("AllHome");
  ansichtZu();
  APP_ANSICHT={d:d,laedt:true};
  ansichtZeichnen();
  try{
    var dl=await sb.storage.from(BUCKET).download(d.storage_path);
    if(dl.error)throw new Error(t("Datei konnte nicht geladen werden."));
    if(!APP_ANSICHT||APP_ANSICHT.d!==d)return;
    var blob=dl.data,pdf=istPdfDok(d)||blob.type==="application/pdf";
    APP_ANSICHT={d:d,blob:blob,name:dateiNameFuer(d,pdf),pdf:pdf,seiten:0,zoom:1};
    if(pdf){
      var r=await A.pdfOeffnen({daten:await blobBase64(blob)});
      if(!APP_ANSICHT||APP_ANSICHT.d!==d)return;
      APP_ANSICHT.seiten=(r&&r.seiten)||0;
    }else APP_ANSICHT.url=URL.createObjectURL(blob);
    ansichtZeichnen();
    if(pdf)ansichtSeitenLaden();
  }catch(e){
    if(APP_ANSICHT&&APP_ANSICHT.d===d){APP_ANSICHT.fehler=appFehler(e);ansichtZeichnen();}
  }
}
function dateiNameFuer(d,pdf){
  var n=String(d.filename||docTitel(d)||"dokument").replace(/[\\/:*?"<>|]+/g,"_");
  if(pdf&&!/\.pdf$/i.test(n))n+=".pdf";
  if(!pdf&&!/\.(jpe?g|png|webp|heic)$/i.test(n))n+=".jpg";
  return n;
}

/* Seiten nacheinander holen – 2× Bildschirmbreite, damit Zoomen scharf bleibt */
async function ansichtSeitenLaden(){
  var v=APP_ANSICHT,A=appP("AllHome");if(!v||!v.pdf)return;
  var breite=Math.min(2400,Math.round(Math.min(window.innerWidth,900)*(window.devicePixelRatio||1)*2));

/* Zwei Finger: Seitenbreite 100–400 %, die Fläche scrollt in beide Richtungen */
function zoomAn(f){
  if(!f)return;
  var start=null;
  function abstand(ev){var a=ev.touches[0],b=ev.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
  f.addEventListener("touchstart",function(ev){if(ev.touches.length===2&&APP_ANSICHT)start={d:abstand(ev),z:APP_ANSICHT.zoom||1};},{passive:true});
  f.addEventListener("touchmove",function(ev){
    if(!start||ev.touches.length!==2||!APP_ANSICHT)return;
    ev.preventDefault();
    var z=Math.max(1,Math.min(4,start.z*abstand(ev)/start.d)),s=$("#aaSeiten");
    APP_ANSICHT.zoom=z;if(s)s.style.width=(z*100)+"%";
  },{passive:false});
  f.addEventListener("touchend",function(ev){if(ev.touches.length<2)start=null;},{passive:true});
  f.addEventListener("dblclick",function(){if(!APP_ANSICHT)return;var s=$("#aaSeiten");APP_ANSICHT.zoom=(APP_ANSICHT.zoom||1)>1?1:2;if(s)s.style.width=(APP_ANSICHT.zoom*100)+"%";});
}

/* ================= Google-Dokumentenscanner =================
   Liefert fertig zugeschnittene Seiten; sie laufen danach durch denselben
   Ablauf wie Fotos aus dem eigenen Scanner (Abgleich, KI, Anfügen). */
function appScannerNutzen(){return istApp()&&!APP_SCAN_FEHLT&&SCAN&&!SCAN.eigeneKamera;}
async function appScannen(){
  if(!SCAN)return;
  var A=appP("AllHome"),platz=SCAN_MAX_SEITEN-SCAN.seiten.length;
  if(platz<=0&&!SCAN.ersetzen){toast(tf("Höchstens {0} Seiten je Dokument.",SCAN_MAX_SEITEN),true);scanModus("seiten");return;}
  arbeitZeigen(t("Scanner wird geöffnet …"));
  try{
    var r=await A.scannen({seiten:SCAN.ersetzen?1:Math.min(platz,40)});
    if(!SCAN)return;
    var n=(r&&r.seiten)||0;
    if(!n){SCAN.ersetzen=null;if(SCAN.seiten.length)scanModus("seiten");else scanZurueck();return;}
    var bloecke=[];
    for(var i=0;i<n;i++){
      arbeitZeigen(n>1?tf("Seite {0} von {1} wird übernommen …",i+1,n):t("Seite wird übernommen …"));
      var s=await A.scanSeite({i:i});
      bloecke.push(base64Blob(s.daten,"image/jpeg"));
    }
    A.scanFertig().catch(function(){});
    await fertigeSeitenDazu(bloecke);
  }catch(e){
    if(!SCAN)return;
    if(e&&e.code==="NICHT_VERFUEGBAR"){APP_SCAN_FEHLT=true;toast(t("Google-Scanner nicht verfügbar – es geht mit dem eigenen weiter."),true);scanModus("kamera");return;}
    toast(appFehler(e),true);
    if(SCAN.seiten.length)scanModus("seiten");else scanZurueck();
  }
}
async function fertigeSeitenDazu(bloecke){
  if(!SCAN)return;
  var fehler=0;
  for(var i=0;i<bloecke.length;i++){
    if(!SCAN)return;
    if(SCAN.seiten.length>=SCAN_MAX_SEITEN&&!SCAN.ersetzen)break;
    try{var img=await bildLaden(bloecke[i]);await seiteAusBild(img,img.naturalWidth,img.naturalHeight,null,true);}
    catch(e){fehler++;}
  }
  if(!SCAN)return;
  if(fehler)toast(tn(fehler,"{0} Seite ließ sich nicht übernehmen.","{0} Seiten ließen sich nicht übernehmen."),true);
  entwurfMerken();
  if(SCAN.seiten.length){if(SCAN.ersetzt)SCAN.ersetzt=false;else SCAN.akt=SCAN.seiten.length-1;scanModus("seiten");}
  else scanZurueck();
}

/* Daten eines anderen Haushalts – gleiche Abfragen wie ladeDaten/ladeSetup */
async function haushaltDaten(id){

    sb.from("documents").select(DOK_SPALTEN).eq("household_id",id).eq("doc_type","preisaenderung"),

/* Rechnet mit den Daten eines anderen Haushalts, ohne die Anzeige anzufassen (alles synchron) */
function mitHaushalt(h,daten,fn){
  if(!daten)return fn(h);

  HH=h;CONTRACTS=daten.contracts;DOCS=daten.docs;PERSONS=daten.persons;NK=daten.nk;SETUP=daten.setup;
  try{return fn(h);}
  finally{HH=alt[0];CONTRACTS=alt[1];DOCS=alt[2];PERSONS=alt[3];NK=alt[4];SETUP=alt[5];}
}
/* Name in der Benachrichtigung: Kennzeichen vor dem Versicherer, bei Ausweisen der Inhaber */
function erinnerungName(c){var a=artInfo(c.art||"sonstiges"),d=c.details||{};return terminTitel(c,a)+(a.kein_anbieter&&d.inhaber?" · "+d.inhaber:"");}
function plusTage(iso,n){var d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
/* Fristen eines Haushalts: {key, datum, art, name, text, href} */
function fristenDesHaushalts(h){
  var aus=[],heute=todayISO();
  if(smartAn("fristen"))CONTRACTS.forEach(function(c){
    if(c.status!=="aktiv")return;
    var f=fristInfo(c);
    if(f.kind!=="fest"||!f.lastDay||f.lastDay<heute)return;
    aus.push({key:"frist:"+c.id+":"+f.lastDay,datum:f.lastDay,art:"frist",name:erinnerungName(c),href:"#/vertrag?id="+c.id});
  });
  /* Preiserhöhung: wirksam frühestens rund einen Monat nach dem Schreiben – bis dahin gilt meist das Sonderkündigungsrecht */
  if(smartAn("preis"))DOCS.forEach(function(d){
    if(d.doc_type!=="preisaenderung")return;
    var dt=d.doc_date||String(d.created_at||"").slice(0,10);if(!dt)return;
    var bis=plusTage(dt,28);if(bis<heute)return;
    var c=d.contract_id?vertragById(d.contract_id):null;
    aus.push({key:"preis:"+d.id,datum:bis,art:"preis",name:(c&&c.anbieter)||t("Preiserhöhung"),vom:dt,href:c?"#/vertrag?id="+c.id:"#/dokumente"});
  });
  if(smartAn("termine"))CONTRACTS.forEach(function(c){
    var a=artInfo(c.art||"sonstiges");
    if(imArchiv(c)||!a.termin||!c.details||!c.details[a.termin.k])return;
    var dt=String(c.details[a.termin.k]).slice(0,10);if(!/^\d{4}-\d\d-\d\d$/.test(dt)||dt<heute)return;
    aus.push({key:"termin:"+c.id+":"+c.details[a.termin.k],datum:dt,art:"termin",name:erinnerungName(c),was:t(a.termin.l),href:"#/vertrag?id="+c.id});
  });
  if(smartAn("nebenkosten")){
    var neu=nkNeueste();
    if(neu){var e=nkFristEinwand(neu);
      if(e&&e>=heute&&nkAuffaellig(neu).length)aus.push({key:"nkeinwand:"+neu.id,datum:e,art:"nk",name:tf("Nebenkosten {0}",nkLabel(neu)),href:"#/nebenkosten?id="+neu.id});}
  }
  return aus.filter(function(x){return !istWeg(x.key);}).map(function(x){x.hh=h.id;x.haus=h.name||"";return x;});
}
function erinnerungText(f,vorher){
  var wann=vorher===0?t("heute"):tn(vorher,"in {0} Tag","in {0} Tagen");
  if(f.art==="frist")return {titel:vorher===0?tf("{0}: heute letzter Kündigungstag",f.name):tf("{0}: Kündigungsfrist {1}",f.name,wann),
    text:tf("Letzter Kündigungstag: {0}",fmtDate(f.datum))};
  if(f.art==="termin")return {titel:f.name+": "+f.was+" "+wann,text:fmtDate(f.datum)};
  if(f.art==="preis")return {titel:tf("{0}: Sonderkündigung prüfen",f.name),
    text:tf("Preiserhöhung vom {0} – kündigen meist nur bis zum Wirksamwerden.",fmtDate(f.vom))};
  return {titel:tf("{0}: Einwände bis {1}",f.name,fmtDate(f.datum)),text:t("Danach gilt die Abrechnung als anerkannt.")};

async function erinnerungenPlanen(){
  if(!istApp()||!erinnerungenAn()||!me||!HH)return;

  APP_PLAN_AM=Date.now();

/* ================= Bedienung =================

/* Knopf mit Hintergrund-Arbeit: sofort gedimmt mit Kreisel, weitere Klicks zählen nicht, bis sie fertig ist */
function laeuft(el,p){
  if(!el||!el.setAttribute||!p||typeof p.then!=="function")return;
  var knoepfe=el.tagName==="FORM"?Array.prototype.slice.call(el.querySelectorAll('button[type="submit"]')):[el];
  el.setAttribute("aria-busy","true");
  knoepfe.forEach(function(k){k.classList.add("laeuft");});
  var fertig=function(){el.removeAttribute("aria-busy");knoepfe.forEach(function(k){k.classList.remove("laeuft");});};
  p.then(fertig,fertig);
}

  if(a==="nka-del"){laeuft(b,nkaLoeschen("nk_berichte",id,t("Diesen Bericht samt Rückfragen löschen?")));return;}
  if(a==="nka-fdel"){laeuft(b,nkaLoeschen("nk_fragen",id,t("Diese Rückfrage löschen?")));return;}
  if(a==="nka-gdel"){laeuft(b,nkaLoeschen("nk_gedaechtnis",id,t("Diesen Eintrag aus dem Gedächtnis löschen?")));return;}
  if(a==="nka-uebersetzen"){laeuft(b,nkaUebersetzen(id));return;}
  if(a==="zt-tab"){ZT_ANSICHT.tab=b.dataset.k||"uebersicht";if(route().params.tab)location.replace("#/zentrale");else render();return;}

/* ---- Bestätigungs-Aktionen ---- */
async function reviewZuordnen(cid){
  if(!REVIEW)return;
  var docId=REVIEW.id;
  try{
    var r=await sb.from("documents").update({contract_id:cid}).eq("id",docId);
    if(r.error)throw r.error;
    await ladeDaten();
    var ergR=await vertragErgaenzen(cid,[docId]);if(ergR.length)await ladeDaten();
    /* Danach der Abgleich: was soll vom Dokument in den Vertrag? */
    REVIEW=DOCS.filter(function(d){return d.id===docId;})[0]||null;REVIEW_WAHL=null;REVIEW_TROTZDEM=false;
    render();window.scrollTo(0,0);
    toast(ergaenztText(ergR,t("Dokument zugeordnet")));
  }catch(e){toast(t("Zuordnen fehlgeschlagen")+": "+errMsg(e),true);}
}
/* gruppe: {docs,ext} – mehrere Dokumente, die zusammen einen neuen Vertrag ergeben */
function reviewNeuerVertrag(art,gruppe){
  if(!gruppe&&!REVIEW)return;
  var ext=gruppe?gruppe.ext:(REVIEW.extracted||{});
  var ids=gruppe?gruppe.docs.map(function(d){return d.id;}):[REVIEW.id];
  art=art||artAusExtrakt(ext);
  oeffneForm(art,null,{
    details:detailsAusExtrakt(ext,art),
    anbieter:ext.anbieter||"",produkt:ext.produkt||"",
    kundennummer:ext.kundennummer||"",vertragsnummer:ext.vertragsnummer||"",
    vertragsstart:ext.vertragsstart||"",
    mindestlaufzeitMonate:ext.mindestlaufzeitMonate,
    kuendigungsfristMonate:ext.kuendigungsfristMonate,
    verlaengerungMonate:ext.verlaengerungMonate,
    kosten:ext.kosten,kostenIntervall:ext.kostenIntervall||"monatlich",
    _docId:ids[0],_docIds:ids
  });
  REVIEW=null;
}

function sucheLaufen(){
  var q=(val("sq")||"").toLowerCase(),box=$("#sErg");
  if(!box)return;
  if(q.length<2){box.innerHTML='<p class="hint">'+t("Tippe, um zu suchen.")+'</p>';return;}
  var vt=CONTRACTS.filter(function(c){
    var d=c.details||{};
    return ((c.anbieter||"")+" "+(c.produkt||"")+" "+(c.kundennummer||"")+" "+(c.vertragsnummer||"")+" "+artInfo(c.art).label+" "+
      [d.kennzeichen,d.marke,d.modell,d.fin,d.versnummer].filter(Boolean).join(" ")).toLowerCase().indexOf(q)>=0;
  }).slice(0,6);
  var dk=DOCS.filter(function(d){
    return ((d.titel||"")+" "+(d.filename||"")+" "+(d.zusammenfassung||"")+" "+(d.arzt||"")).toLowerCase().indexOf(q)>=0;
  }).slice(0,6);
  var html="";
  if(vt.length)html+='<div class="mgrp">'+t("Verträge")+'</div><div class="dlist">'+vt.map(function(c){
    var a=artInfo(c.art||"sonstiges");
    return '<a class="drow3" href="#/vertrag?id='+c.id+'" data-a="modal-close">'+
      anbieterKachel(c.anbieter,a.icon,"di",18)+'<span class="db"><span class="dn">'+esc(c.anbieter||a.label)+'</span>'+
      '<span class="dm"><span>'+esc(a.label)+'</span></span></span></a>';
  }).join("")+'</div>';
  if(dk.length)html+='<div class="mgrp">'+t("Dokumente")+'</div><div class="dlist">'+dk.map(sucheDokZeile).join("")+'</div>';
  box.innerHTML=html||('<p class="hint">'+tf("Nichts gefunden für „{0}“.",esc(q))+'</p>');
  /* Volltext: was die Namen nicht finden, steht vielleicht im Text eines Scans */
  clearTimeout(SUCHE_UHR);
  if(q.length<3)return;
  var schon={};dk.forEach(function(d){schon[d.id]=1;});
  SUCHE_UHR=setTimeout(function(){
    volltextSuche(q).then(function(ids){
      if((val("sq")||"").toLowerCase()!==q)return;
      var mehr=DOCS.filter(function(d){return ids.indexOf(d.id)>=0&&!schon[d.id];}).slice(0,8);
      var b2=$("#sErg");if(!mehr.length||!b2)return;
      b2.innerHTML=html+'<div class="mgrp">'+t("Im Text gefunden")+'</div><div class="dlist">'+mehr.map(sucheDokZeile).join("")+'</div>';
    });
  },300);
}
var SUCHE_UHR=null;
function sucheDokZeile(d){
  var ty=istMed(d)?medTypInfo(d.med_typ):dtInfo(d.doc_type);
  return '<button class="drow3" data-a="d-open" data-id="'+d.id+'">'+
    '<span class="di">'+ty.icon+'</span><span class="db"><span class="dn">'+esc(docTitel(d))+'</span>'+
    '<span class="dm"><span>'+ty.label+'</span><span>'+fmtDate(docDatum(d))+'</span></span></span></button>';
}

var setupBusy=false;
async function setupSpeichern(){
  if(setupBusy)return;
  if(!setupWahl||!setupWahl.length){toast(t("Hake mindestens eine Art an."),true);return;}
  /* Sichtbar arbeiten: der Aufruf dauert einen Moment, und ein Knopf, bei dem
     nichts passiert, sieht aus wie ein Fehler. */
  setupBusy=true;
  var knopf=document.querySelector('[data-a="setup-save"]');
  if(knopf){knopf.disabled=true;knopf.textContent=t("Wird gespeichert …");}
  try{
    await speichereSetup(setupWahl.slice(),true);
    setupWahl=null;
    toast(t("Gespeichert")+" ✅");
    go("#/vertraege");
  }catch(e){
    /* Der Grund bleibt stehen, bis er gelesen wurde – nicht nur als Kurzmeldung. */
    SETUP_FEHLER=errMsg(e);
    toast(t("Speichern fehlgeschlagen")+": "+errMsg(e),true);
    render();
  }finally{setupBusy=false;}
}
/* ================= Start der App ================= */
async function boot(){
  if(/type=recovery/i.test(location.hash)||/[?&]type=recovery/i.test(location.search))AUTH_MODE="reset";
  sb.auth.onAuthStateChange(function(ereignis,sitzung){
    if(ereignis==="PASSWORD_RECOVERY"){AUTH_MODE="reset";me=null;booting=false;render();return;}
    var neuerUser=(sitzung&&sitzung.user)||null;
    var wechsel=(neuerUser&&neuerUser.id)!==(me&&me.id);
    me=neuerUser;
    if(!me){booting=false;render();return;}
    if(wechsel)starteSitzung();
  });
  try{
    var s=await sb.auth.getSession();
    me=(s&&s.data&&s.data.session&&s.data.session.user)||null;
  }catch(e){me=null;}
  if(AUTH_MODE==="reset"){booting=false;render();return;}
  if(me)await starteSitzung();
  else{booting=false;render();}
}
async function starteSitzung(){
  booting=true;render();
  await ladeFreigabe();
  if(freigabeFehlt()){booting=false;render();return;}
  try{await ladeAlles();}
  catch(e){LADEFEHLER=errMsg(e);}
  booting=false;
  if(!location.hash)location.hash="#/start";
  render();
  appNachLaden();
}
/* Service Worker = Offline-Rückfall; nur über https, lokal würden zwischengespeicherte Stände das Testen stören */
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
if(window.top!==window.self)throw new Error("All-Home startet nicht in einem fremden Rahmen.");
appStart();
boot();
})();
</script>
