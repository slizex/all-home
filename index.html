}

/* ================= Auslesen ================= */
/* Grenzen der KI je Durchgang (wie butler-extract: 20 Dateien bzw. Seiten, 20 Mio. Base64-Zeichen ≈ 14 MB) */
var NK_MAX_TEILE=20,NK_MAX_B64=19000000;
var NK_WAHL=null;      /* gewählte Dateien, bis feststeht: eine Abrechnung oder mehrere Jahre */
var NK_BERICHT=null;   /* Ergebnis „mehrere Jahre“: {zeilen:[{icon,name,text,nk?,doc?,vorschlag?}]} */
var NK_LAEUFT=false;
function nkB64(n){return Math.ceil((Number(n)||0)/3)*4;}
function nkIstPdf(f){return !!f&&(f.type==="application/pdf"||/\.pdf$/i.test(f.name||""));}
/* So viele Teile schickt ein abgelegtes Dokument an die KI (Scan-Seiten einzeln, PDF als Ganzes) */
function nkTeile(d){return 1+((d&&d.weitere_seiten)||[]).length;}
/* Was sich ohne Lesen prüfen lässt – vor dem ersten Hochladen. gesamt: alles geht in EINEN KI-Durchgang */
function nkVorpruefung(dateien,alt,gesamt){
  alt=alt||[];
  for(var i=0;i<dateien.length;i++){var f=dateien[i];
    if(!nkIstPdf(f)&&!/^image\//.test(f.type||""))return tf("„{0}“: nur PDF oder Foto.",f.name||t("Datei"));
    if(nkIstPdf(f)&&f.size>12*1024*1024)return tf("„{0}“ ist größer als 12 MB.",f.name||t("Datei"));
  }
  var teile=dateien.length+alt.reduce(function(s,d){return s+nkTeile(d);},0);
  if(teile>NK_MAX_TEILE)return tf(gesamt?"Höchstens {0} Dateien je Abrechnung.":"Höchstens {0} Dateien auf einmal.",NK_MAX_TEILE);
  if(gesamt){
    var b64=dateien.filter(nkIstPdf).reduce(function(s,f){return s+nkB64(f.size);},0)+alt.reduce(function(s,d){return s+nkB64(d.size_bytes);},0);
    if(b64>NK_MAX_B64)return t("Zusammen zu groß für einen Durchgang (höchstens etwa 14 MB) – bitte aufteilen.");
  }
  return null;
}
/* Datei vorbereiten: Fotos verkleinern, Prüfsumme über den Inhalt */
async function nkVorbereiten(f){
  var pdf=nkIstPdf(f),blob=pdf?f:await bildKlein(f);
  var bytes=new Uint8Array(await blob.arrayBuffer());
  return {name:(f.name||"nebenkosten").replace(/\.[^.]+$/,"")+(pdf?".pdf":".jpg"),mime:pdf?"application/pdf":"image/jpeg",bytes:bytes,hash:await inhaltHash(bytes)};
}
/* Dubletten über die Prüfsumme: doppelt in der Auswahl oder schon in einer Abrechnung → überspringen;
   schon abgelegt, aber noch ohne Abrechnung → dieses Dokument verwenden statt neu hochladen */
function nkDublettenPruefung(hash,gesehen,nkId){
  if(!hash)return null;
  if(gesehen[hash])return {weg:t("doppelt ausgewählt")};
  gesehen[hash]=1;
  var d=DOCS.filter(function(x){return x.content_hash===hash;})[0];if(!d)return null;
  if(d.nk_id){var n=nkById(d.nk_id);
    return {weg:d.nk_id===nkId?t("schon in dieser Abrechnung"):(n?tf("schon in Abrechnung {0}",nkLabel(n)):t("schon vorhanden")),nk:n?n.id:null};}
  return {doc:d};
}
async function nkAblegen(v,nkId,c){
  var pfad=HH.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,7)+"_"+pfadName(v.name);
  var up=await hochladenMitWiederholung(pfad,v.bytes,v.mime);if(up.error)throw new Error(netzFehler(up.error));
  var ins=await sb.from("documents").insert({household_id:HH.id,filename:v.name,storage_path:pfad,mime_type:v.mime,size_bytes:v.bytes.length,
    doc_type:"nebenkosten",content_hash:v.hash,contract_id:c?c.id:null,nk_id:nkId||null}).select("id").single();
  if(ins.error){await dateienWeg([pfad]);throw new Error(netzFehler(ins.error));}
  nkaTextImHintergrund(ins.data.id,v);   /* für die Nebenkosten-Analyse */
  return ins.data.id;
}
/* Dateien gewählt: an eine bestehende Abrechnung oder nur eine Datei → direkt; mehrere für eine neue → fragen */
function nkDateienHochladen(dateien,nkId){
  dateien=Array.prototype.slice.call(dateien||[]);if(!dateien.length||!HH)return;
  if(NK_LAEUFT){toast(t("Es läuft bereits ein Import."),true);return;}
  if(nkId||dateien.length===1){nkEineAbrechnung(dateien,nkId);return;}
  var fehler=nkVorpruefung(dateien,[],false);
  if(fehler){toast(fehler,true);return;}
  NK_WAHL=dateien;
  function wahl(k,icon,titel,unter){
    return '<button class="setupcat" data-a="nk-modus" data-k="'+k+'"><span>'+icon+'</span><span>'+titel+'<br><span class="mut" style="font-size:.82rem">'+unter+'</span></span></button>';
  }
  openModal('<h2 class="mhead">'+tn(dateien.length,"{0} Datei","{0} Dateien")+'</h2><div class="mlist">'+
    wahl("eine","🧾",t("Eine Abrechnung"),t("Teile derselben Abrechnung, z. B. Heizkosten und Anlagen"))+
    wahl("jahre","📚",t("Mehrere Jahre"),t("Jede Datei einzeln lesen und dem Zeitraum zuordnen"))+'</div>'+
    '<div class="factions"><button class="btn ghost full" data-a="modal-close">'+t("Abbrechen")+'</button></div>');
}
function nkModus(k){
  var d=NK_WAHL;NK_WAHL=null;if(!d)return;
  closeModal(true);
  if(k==="jahre")nkMehrereJahre(d);else nkEineAbrechnung(d,null);
}
/* Alle Dateien gehören zu EINER Abrechnung: Grenzen prüfen, Dubletten auslassen, ablegen, gemeinsam lesen */
async function nkEineAbrechnung(dateien,nkId){
  var c=nkMieteVertrag(nkId?nkById(nkId):null),alt=nkId?DOCS.filter(function(d){return d.nk_id===nkId;}):[];
  var fehler=nkVorpruefung(dateien,alt,true);
  if(fehler){toast(fehler,true);return;}
  NK_LAEUFT=true;
  var ids=[],weg=[],bereit=[],gesehen={},neu=0;
  try{
    nkArbeit(t("Dateien werden vorbereitet …"));
    for(var i=0;i<dateien.length;i++){
      var v=await nkVorbereiten(dateien[i]),dup=nkDublettenPruefung(v.hash,gesehen,nkId);
      if(dup&&dup.weg){weg.push("„"+v.name+"“ "+dup.weg);continue;}
      if(dup&&dup.doc){ids.push(dup.doc.id);continue;}
      bereit.push(v);
    }
    /* Fotos sind erst nach dem Verkleinern genau bekannt – deshalb jetzt noch einmal, aber vor dem Hochladen */
    var schon=DOCS.filter(function(d){return ids.indexOf(d.id)>=0;}).concat(alt);
    var b64=bereit.reduce(function(s,v){return s+nkB64(v.bytes.length);},0)+schon.reduce(function(s,d){return s+nkB64(d.size_bytes);},0);
    if(b64>NK_MAX_B64)throw new Error(t("Zusammen zu groß für einen Durchgang (höchstens etwa 14 MB) – bitte aufteilen."));
    if(bereit.length)nkArbeitText(t("Dateien werden abgelegt …"));
    for(var j=0;j<bereit.length;j++){ids.push(await nkAblegen(bereit[j],nkId,c));neu++;}
    if(neu)await ladeDaten();
  }catch(x){closeModal(true);toast(errMsg(x),true);if(neu)await ladeDaten();NK_LAEUFT=false;return;}
  NK_LAEUFT=false;
  if(!ids.length){closeModal(true);toast(weg.join(" · "));return;}
  if(weg.length)toast(tf("Übersprungen: {0}",weg.join(" · ")));
  await nkAuslesen(ids,nkId||null,null);
}
function nkArbeit(txt){openModal('<div class="nkarbeit"><span class="spin"></span><p id="nkArbeitTxt">'+esc(txt)+'</p></div>');}
function nkArbeitText(txt){var e=$("#nkArbeitTxt");if(e)e.textContent=txt;else nkArbeit(txt);}
/* Dokumente als KI-Nutzlast (Scan-Seiten als Bilder, PDFs als Ganzes) */
async function nkNutzlast(ids){
  var dateien=[];
  for(var i=0;i<ids.length;i++){
    var d=DOCS.filter(function(x){return x.id===ids[i];})[0];if(!d)continue;
    if((d.weitere_seiten||[]).length||/^image\//.test(d.mime_type||"")){
      (await bilderDesDokuments(d)).forEach(function(b){dateien.push({data:bytesBase64(b),mime:"image/jpeg"});});
    }else{
      var dl=await sb.storage.from(BUCKET).download(d.storage_path);
      if(dl.error)throw new Error(t("Datei konnte nicht geladen werden."));
      dateien.push({data:bytesBase64(new Uint8Array(await dl.data.arrayBuffer())),mime:"application/pdf"});
    }
  }
  return dateien;
}
async function nkKiLesen(dateien){
  var summe=0;dateien.forEach(function(x){summe+=x.data.length;});
  if(!dateien.length)throw new Error(t("Kein Dokument zum Auslesen gefunden."));
  if(dateien.length>NK_MAX_TEILE||summe>NK_MAX_B64)throw new Error(t("Zu viele oder zu große Dateien für einen Durchgang – bitte einzeln ablegen."));
  var b=await edgeRuf(EDGE_EXTRACT,{modus:"nk",dateien:dateien,model:kiStufe(),lang:curLang});
  if(!b.abrechnung)throw new Error(t("Nichts erkannt."));
  return b;
}
/* Ein oder mehrere Dokumente (bei einer bestehenden Abrechnung: alle ihre Dokumente) gemeinsam lesen */
async function nkAuslesen(docIds,nkId,bilderVorab){
  var ids=docIds.slice();
  if(nkId)DOCS.forEach(function(d){if(d.nk_id===nkId&&ids.indexOf(d.id)<0)ids.push(d.id);});
  nkArbeit(t("All-Home liest die Abrechnung … (20–60 Sek.)"));
  try{
    var dateien=(bilderVorab&&bilderVorab.length&&ids.length===1)?bilderVorab.map(function(b){return {data:bytesBase64(b),mime:"image/jpeg"};}):await nkNutzlast(ids);
    var b=await nkKiLesen(dateien);
    closeModal(true);
    nkFormular(nkId,nkAusKi(b.abrechnung,b.modell),ids);
  }catch(x){
    closeModal(true);
    nkLeseFehler(x,ids,nkId);
  }
}
/* KI gesperrt (Guthaben, Tageslimit, Tagesbudget) – nochmal versuchen bringt heute nichts */
function nkKiGesperrt(x){return !!x&&(x.code==="ki_guthaben"||x.code==="limit"||x.code==="budget"||x.code==="gesperrt");}
/* Auslesen ging nicht: Grund nennen. Die Dokumente sind abgelegt – später lesen oder gleich von Hand eintragen */
var NK_FEHLER=null;
function nkLeseFehler(x,ids,nkId){
  var gesperrt=nkKiGesperrt(x);
  NK_FEHLER={ids:ids,nkId:nkId};
  openModal('<h2 class="mhead">'+(gesperrt?t("KI gerade nicht verfügbar"):t("Auslesen fehlgeschlagen"))+'</h2>'+
    '<p>'+esc(x&&x.code==="ki_guthaben"?t("Das KI-Guthaben ist aufgebraucht."):errMsg(x))+'</p>'+
    '<p class="mut">'+(nkId&&!nkOhneWerte(nkById(nkId)||{})?t("Die Dokumente hängen an der Abrechnung."):t("Das Dokument ist abgelegt und wartet unter „Noch nicht erfasst“."))+'</p>'+
    '<div class="factions">'+(gesperrt?"":'<button class="btn" data-a="nk-fehler" data-k="nochmal">'+ic("sparkles")+' '+t("Erneut versuchen")+'</button>')+
      '<button class="btn'+(gesperrt?"":" ghost")+'" data-a="nk-fehler" data-k="spaeter">'+t("Später auslesen")+'</button>'+
      '<button class="btn ghost" data-a="nk-fehler" data-k="hand">'+ic("pencil")+' '+t("Von Hand eintragen")+'</button></div>');
}
function nkFehlerWahl(k){
  var F=NK_FEHLER;NK_FEHLER=null;closeModal(true);if(!F)return;
  if(k==="nochmal")nkAuslesen(F.ids,F.nkId,null);
  else if(k==="hand")nkFormular(F.nkId,null,F.ids);
  else render();
}

/* ---------- Mehrere Jahre auf einmal ----------
   Jede Datei einzeln lesen, nach Zeitraum bündeln, je Zeitraum eine Abrechnung. Mehrere Dateien desselben
   Zeitraums (Abrechnung + Heizkostenblatt) liest die KI danach gemeinsam, damit nichts doppelt zählt.
   Gibt es den Zeitraum schon, kommen die Dateien dazu – die erfassten Werte bleiben, wie sie sind. */
function nkGruppieren(posten){
  var nach={},gruppen=[],offen=[];
  posten.forEach(function(p){
    var v=p.vorschlag;
    if(!v||!v.von||!v.bis||v.bis<v.von||!nkPos(v).length){offen.push(p);return;}   /* ohne Positionen ist es keine Abrechnung */
    var k=v.von+"|"+v.bis;
    if(!nach[k]){nach[k]={von:v.von,bis:v.bis,posten:[]};gruppen.push(nach[k]);}
    nach[k].posten.push(p);
  });
  gruppen.sort(function(a,b){return a.von<b.von?-1:(a.von>b.von?1:0);});
  return {gruppen:gruppen,offen:offen};
}
/* Aus mehreren Einzel-Lesungen die vollständigste (meiste Positionen) */
function nkBesterVorschlag(posten){
  return posten.map(function(p){return p.vorschlag;}).filter(Boolean)
    .reduce(function(a,b){return !a||nkPos(b).length>nkPos(a).length?b:a;},null);
}
/* Datenbankzeile einer Abrechnung aus Formular- oder KI-Werten */
function nkZeile(w,positionen,heizung,ki){
  function z(v){return v==null||v===""?null:v;}
  var reihe={household_id:HH.id,contract_id:z(w.contract_id),von:w.von,bis:w.bis,erstellt_am:z(w.erstellt_am),zugang_am:z(w.zugang_am),
    wohnflaeche:z(w.wohnflaeche),personen:z(w.personen),vorauszahlungen:z(w.vorauszahlungen),vorauszahlung_neu:z(w.vorauszahlung_neu),ergebnis:z(w.ergebnis),
    positionen:(positionen||[]).filter(function(p){return p.bez||p.betrag!=null;}),heizung:heizung||{},notiz:z(w.notiz)};
  if(ki)reihe.ki=ki;
  return reihe;
}
function nkErgebnisText(erg){return erg==null?"":(erg<0?t("Guthaben")+" "+eur(-erg):t("Nachzahlung")+" "+eur(erg));}
async function nkMehrereJahre(dateien){
  if(!HH||NK_LAEUFT)return;
  NK_LAEUFT=true;
  var c=nkMieteVertrag(null),gesehen={},posten=[],kopf=[],fuss=[],kiAus=null,n=dateien.length;
  try{
    nkArbeit(tf("Datei {0} von {1} wird gelesen …",1,n));
    for(var i=0;i<n;i++){
      nkArbeitText(tf("Datei {0} von {1} wird gelesen …",i+1,n));
      var f=dateien[i],name=f.name||t("Datei");
      try{
        var v=await nkVorbereiten(f);name=v.name;
        var dup=nkDublettenPruefung(v.hash,gesehen,null);
        if(dup&&dup.weg){fuss.push({icon:"⏭️",name:name,text:dup.weg,nk:dup.nk||null});continue;}
        var p={id:dup&&dup.doc?dup.doc.id:await nkAblegen(v,null,c),name:name};
        if(kiAus)p.fehler=kiAus;
        else try{var b=await nkKiLesen([{data:bytesBase64(v.bytes),mime:v.mime}]);p.vorschlag=nkAusKi(b.abrechnung,b.modell);}
        catch(x){
          p.fehler=x&&x.code==="ki_guthaben"?t("KI-Guthaben aufgebraucht"):errMsg(x);
          if(x&&(x.code==="ki_guthaben"||x.code==="limit"||x.code==="budget"))kiAus=p.fehler;
        }
        posten.push(p);
      }catch(x){fuss.push({icon:"⚠️",name:name,text:errMsg(x)});}
    }
    kopf=(await nkBuendeln(posten,kiAus,nkArbeitText)).zeilen;
  }catch(x){fuss.push({icon:"⚠️",name:t("Datei"),text:errMsg(x)});}
  finally{NK_LAEUFT=false;}
  NK_BERICHT={zeilen:kopf.concat(fuss)};
  closeModal(true);
  nkNach("#/nebenkosten",nkBerichtZeigen);
}
/* Gelesene Dokumente ({id,name,vorschlag|fehler}) nach Zeitraum bündeln und speichern: vorhandener Zeitraum → Dokumente dazu,
   neuer → Abrechnung anlegen (mehrere Dateien eines Zeitraums vorher gemeinsam lesen). melde(text): Fortschritt */
async function nkBuendeln(posten,kiAus,melde){
  var c=nkMieteVertrag(null),kopf=[];
  await ladeDaten();
  var g=nkGruppieren(posten);
  for(var k=0;k<g.gruppen.length;k++){
    var gr=g.gruppen[k],ids=gr.posten.map(function(p){return p.id;}),label=nkLabel(gr),notiz="";
    var vorschlag=nkBesterVorschlag(gr.posten),da=NK.filter(function(x){return x.von===gr.von&&x.bis===gr.bis;})[0];
    if(!da&&ids.length>1&&!kiAus){
      melde(tf("{0}: {1} Dateien werden gemeinsam gelesen …",label,ids.length));
      try{var gb=await nkKiLesen(await nkNutzlast(ids));vorschlag=Object.assign(nkAusKi(gb.abrechnung,gb.modell),{von:gr.von,bis:gr.bis});}
      catch(x){notiz=t("gemeinsam nicht lesbar – bitte prüfen");}
    }
    melde(t("Abrechnungen werden angelegt …"));
    try{
      var ziel=da?da.id:null;
      if(!da){
        var w=Object.assign({},nkLeer(),vorschlag,{von:gr.von,bis:gr.bis,zugang_am:null});
        var r=await sb.from("nk_abrechnungen").insert(nkZeile(w,nkPos(w),w.heizung,vorschlag.ki)).select("id");
        if(r.error)throw r.error;
        if(!r.data||!r.data.length)throw new Error(t("Es wurde nichts gespeichert – fehlende Berechtigung?"));
        ziel=r.data[0].id;
      }
      var dr=await sb.from("documents").update({nk_id:ziel,contract_id:da?da.contract_id:(c?c.id:null),doc_type:"nebenkosten"}).in("id",ids).select("id");
      if(dr.error)throw dr.error;
      kopf.push({icon:da?"📎":"✅",name:tf("Nebenkosten {0}",label),nk:ziel,
        text:da?t("an die vorhandene Abrechnung angehängt – Werte unverändert")
          :[eur(nkSumme(vorschlag)),nkErgebnisText(numOrNull(vorschlag.ergebnis)),ids.length>1?tn(ids.length,"{0} Datei","{0} Dateien"):"",notiz].filter(Boolean).join(" · ")});
    }catch(x){kopf.push({icon:"⚠️",name:tf("Nebenkosten {0}",label),text:t("Speichern fehlgeschlagen")+": "+errMsg(x)});}
  }
  g.offen.forEach(function(p){kopf.push({icon:"⚠️",name:p.name,text:p.fehler||(p.vorschlag&&p.vorschlag.von?t("keine Positionen erkannt"):t("Zeitraum nicht erkannt")),doc:p.id,vorschlag:p.vorschlag||null});});
  await ladeDaten();
  return {zeilen:kopf};
}
/* Schon abgelegte Dokumente als Nebenkosten erfassen: je Dokument lesen, dann bündeln */
async function nkDokumenteErfassen(ids,melde,kiAusVorher){
  var posten=[],kiAus=kiAusVorher||null;
  for(var i=0;i<ids.length;i++){
    var d=DOCS.filter(function(x){return x.id===ids[i];})[0];if(!d)continue;
    melde(ids.length>1?tf("Datei {0} von {1} wird gelesen …",i+1,ids.length):t("All-Home liest die Abrechnung … (20–60 Sek.)"));
    var p={id:d.id,name:docTitel(d)};
    if(kiAus)p.fehler=kiAus;
    else try{var b=await nkKiLesen(await nkNutzlast([d.id]));p.vorschlag=nkAusKi(b.abrechnung,b.modell);}
    catch(x){
      p.fehler=x&&x.code==="ki_guthaben"?t("KI-Guthaben aufgebraucht"):errMsg(x);
      if(x&&(x.code==="ki_guthaben"||x.code==="limit"||x.code==="budget"))kiAus=p.fehler;
    }
    posten.push(p);
  }
  return nkBuendeln(posten,kiAus,melde);
}
/* Nach dem normalen Hochladen oder Scannen: eindeutige Nebenkostenabrechnungen gleich dem Zeitraum zuordnen */
async function nkNachUpload(ids,melde){
  var liste=(ids||[]).filter(function(id){var d=DOCS.filter(function(x){return x.id===id;})[0];return d&&nkSicher(d);});
  if(!liste.length)return;
  try{await nkDokumenteErfassen(liste,melde);}catch(e){try{await ladeDaten();}catch(_e){}}
}
function nkZugeordnetMelden(nkId){var n=nkById(nkId);toast(tf("Zugeordnet: Nebenkosten {0}",n?nkLabel(n):"")+" ✅");}
/* „Noch nicht erfasst“ in einem Rutsch */
async function nkAlleErfassen(){
  var ids=nkOhneAbrechnung().map(function(d){return d.id;}),leer=nkLeerMitDok();
  if((!ids.length&&!leer.length)||NK_LAEUFT)return;
  NK_LAEUFT=true;nkArbeit(t("Dateien werden vorbereitet …"));
  var r={zeilen:[]};
  try{
    var a=leer.length?await nkLeereFuellen(leer,nkArbeitText):{zeilen:[],kiAus:null};
    r.zeilen=a.zeilen;
    if(ids.length)r.zeilen=r.zeilen.concat((await nkDokumenteErfassen(ids,nkArbeitText,a.kiAus)).zeilen);
  }catch(x){r.zeilen.push({icon:"⚠️",name:t("Datei"),text:errMsg(x)});}
  finally{NK_LAEUFT=false;}
  NK_BERICHT={zeilen:r.zeilen};closeModal(true);
  nkNach("#/nebenkosten",nkBerichtZeigen);
}
/* Abrechnungen ohne Positionen: ihre Dokumente lesen und die Werte eintragen (überschreibt nichts – es ist ja nichts da).
   Den Zeitraum nimmt All-Home aus dem Dokument, außer es gibt ihn schon (dann bleibt er und es kommt ein Hinweis). */
function nkUebernehmen(n,v){
  var w=Object.assign({},n);
  ["erstellt_am","wohnflaeche","personen","vorauszahlungen","vorauszahlung_neu","ergebnis"].forEach(function(k){if(w[k]==null&&v[k]!=null)w[k]=v[k];});
  var notiz="";
  if(v.von&&v.bis&&v.bis>=v.von&&(v.von!==n.von||v.bis!==n.bis)){
    var neu={von:v.von,bis:v.bis};
    if(NK.some(function(x){return x.id!==n.id&&x.von===v.von&&x.bis===v.bis;}))notiz=tf("laut Dokument {0} – gibt es schon, bitte prüfen",nkLabel(neu));

      verbrauchsabhaengig:jn(h.verbrauchsabhaengig),co2_ausgewiesen:jn(h.co2Ausgewiesen),co2_kg_m2:z(h.co2KgProM2),co2_stufe:z(h.co2Stufe),
      co2_mieteranteil_pct:z(h.co2MieteranteilProzent),co2_kosten:z(h.co2KostenMieter),uvi:jn(h.verbrauchsinfoErhalten),fernablesbar:jn(h.fernablesbar),
      messdienst:h.messdienst?String(h.messdienst).slice(0,60):null},

  if(d(a.zeitraumVon))v.von=d(a.zeitraumVon);

/* Sieht das Dokument nach einer Nebenkostenabrechnung aus? Titel dürfen das Wort einfach nennen,
   die Zusammenfassung nur mit „Abrechnung“ – sonst wäre jeder Mietvertrag mit „Nebenkostenvorauszahlung“ verdächtig.
   Die Art „Miete“ schließt nichts aus – die KI ordnet auch Nebenkostenabrechnungen der Miete zu. */
var NK_ABRECHNUNG=/nebenkostenabrechnung|betriebskostenabrechnung|heizkostenabrechnung|(neben|betriebs|heiz)kosten (jahres)?abrechnung|abrechnung (der |ueber die )?(neben|betriebs|heiz)kosten/;
/* Eindeutig: Titel oder Produkt nennen die Abrechnung (oder schon als Nebenkosten abgelegt) – nur dann ordnet All-Home selbst zu */
function nkSicher(d){
  if(!d||d.nk_id||istMed(d))return false;
  var ext=d.extracted||{};
  if(ext.docType==="vertrag")return false;
  if(d.doc_type==="nebenkosten")return true;
  var titel=artText([d.titel,ext.titel,ext.produkt].filter(Boolean).join(" "));
  return NK_ABRECHNUNG.test(titel)||(/nebenkost|betriebskost|heizkost/.test(titel)&&!/mietvertrag|vorauszahlung|mieterhoehung/.test(titel));
}
function nkVerdacht(d){
  if(!d||d.nk_id||istMed(d))return false;
  var ext=d.extracted||{};
  if(ext.docType==="vertrag")return false;
  return nkSicher(d)||NK_ABRECHNUNG.test(artText(ext.zusammenfassung));
}

function nkCsvZelle(v){var s=String(v==null?"":v);if(/^[=+\-@\t\r]/.test(s)&&!/^-?\d+([.,]\d+)?$/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function nkCsv(){

/* ================= Nebenkosten-Heatmap: Kategorien × Jahre, aufklappbare Positionen, Zellen-Detail =================
   Abgestimmt mit dem User (18.10.2026): ersetzt „Kosten je Kategorie“; neueste 3/4/5 Zeiträume; Farbe = Veränderung

   zusammengeführt (Schreibweise egal, gleiche Bezeichnung im Jahr addiert) und von Hand zusammenfassbar
   (household_setup.nk_gruppen), dazu Vorschläge für Positionen, die nie im selben Jahr vorkommen. */
var NKM={anzahl:5,farbe:"delta",wert:"jahr",sort:"betrag",offen:{},wahl:null,vorschlaege:[],matrix:null};
(function(){try{var s=JSON.parse(localStorage.getItem("ah_nkm")||"{}");

/* ---------- Zusammenfassungen ---------- */
function nkGruppenDaten(){var g=SETUP&&SETUP.nk_gruppen;return (g&&typeof g==="object")?{g:Object.assign({},g.g||{}),nein:(g.nein||[]).slice()}:{g:{},nein:[]};}
function nkPosSchluessel(k,bez){return k+"|"+artText(bez).trim();}
function nkZeilenSchluessel(k,bez,gr){var s=nkPosSchluessel(k,bez),n=gr.g[s];return n?k+"|g:"+artText(n).trim():s;}
/* Angezeigter Name: Gruppenname bzw. die neueste gedruckte Bezeichnung */
function nkmName(P,gr){
  if(P.gruppe){var q=Object.keys(P.quellen)[0];return gr.g[q]||P.letzter||"";}
  return P.letzter||"";

/* ---------- Die Matrix (rein rechnerisch, prüfbar) ----------
   alle: Abrechnungen aufsteigend; liefert sichtbare Spalten + den Zeitraum davor (für Δ der ersten Spalte) */
function nkMatrix(alle,gr,anzahl){
  var sp=alle.slice(-anzahl),vor=alle.length>sp.length?alle[alle.length-sp.length-1]:null;
  var spX=(vor?[vor]:[]).concat(sp),o=vor?1:0,kats={};
  function leer(){return spX.map(function(){return null;});}
  spX.forEach(function(n,i){
    nkPos(n).forEach(function(p){
      var k=nkKatVon(p),b=nkBetrag(p),bez=p.bez||t(NK_KAT[k].l),key=nkZeilenSchluessel(k,bez,gr);
      var K=kats[k]||(kats[k]={key:"k:"+k,k:k,ebene:"kat",roh:leer(),pos:{}});
      K.roh[i]=(K.roh[i]||0)+b;
      var P=K.pos[key]||(K.pos[key]={key:key,k:k,ebene:"pos",gruppe:key.indexOf("|g:")>0,roh:leer(),teile:spX.map(function(){return [];}),quellen:{},letzter:null});
      P.roh[i]=(P.roh[i]||0)+b;P.teile[i].push(p);P.quellen[nkPosSchluessel(k,bez)]=bez;if(i>=o)P.letzter=bez;
    });
  });
  var liste=Object.keys(NK_KAT).filter(function(k){return kats[k]&&kats[k].roh.slice(o).some(function(v){return v!=null;});}).map(function(k){
    var K=kats[k];
    K.positionen=Object.keys(K.pos).map(function(x){return K.pos[x];}).filter(function(P){return P.roh.slice(o).some(function(v){return v!=null;});});
    K.positionen.forEach(function(P){if(!P.letzter)P.letzter=Object.keys(P.quellen).map(function(q){return P.quellen[q];})[0];P.name=nkmName(P,gr);});
    K.name=t(NK_KAT[k].l);
    return K;
  });
  return {spalten:spX,o:o,kats:liste};
}
/* Auf 12 Monate gerechnet (Vergleichsgröße) bzw. Anzeige-Wert je Modus */
function nkmJahr(roh,n){return roh==null?null:roh*nkFaktor(n);}
function nkmAnzeige(roh,n,wert){if(roh==null)return null;return wert==="m2"?nkJeM2(roh,n):roh*nkFaktor(n);}
/* Veränderung einer Zeile in Spalte i gegenüber i-1 (nur vergleichbare Zeiträume, Heizung beide fast ein Jahr) */
function nkmDelta(Z,M,i){
  if(i<1)return {d:null};
  var a=Z.roh[i-1],b=Z.roh[i],na=M.spalten[i-1],nb=M.spalten[i];
  if(b!=null&&a==null)return {d:null,neu:true};
  if(a==null||b==null)return {d:null};
  if(!nkVergleichbarKat(Z.k,na,nb))return {d:null,teil:true};
  return {d:nkDelta(nkmJahr(b,nb),nkmJahr(a,na)),diff:nkmJahr(b,nb)-nkmJahr(a,na)};
}
/* Δ über den sichtbaren Zeitraum: erste sichtbare Spalte mit Wert → letzte */
function nkmDeltaZeitraum(Z,M){
  var l=M.spalten.length-1,i0=-1;
  for(var i=M.o;i<l;i++){if(Z.roh[i]!=null){i0=i;break;}}
  if(i0<0||Z.roh[l]==null)return {d:null};
  if(!nkVergleichbarKat(Z.k,M.spalten[i0],M.spalten[l]))return {d:null};
  return {d:nkDelta(nkmJahr(Z.roh[l],M.spalten[l]),nkmJahr(Z.roh[i0],M.spalten[i0])),seit:nkLabel(M.spalten[i0])};
}
function nkmGesamtJahr(M,i){var n=M.spalten[i];return nkSumme(n)*nkFaktor(n);}
function nkmAnteil(Z,M){var l=M.spalten.length-1,g=nkmGesamtJahr(M,l),v=nkmJahr(Z.roh[l],M.spalten[l]);return (g>0&&v!=null)?v/g:null;}
function nkmSortieren(zeilen,M){
  var l=M.spalten.length-1;
  return zeilen.slice().sort(function(a,b){
    if(NKM.sort==="anstieg"){var da=nkmDeltaZeitraum(a,M).d,db=nkmDeltaZeitraum(b,M).d;
      if(da==null&&db==null)return 0;if(da==null)return 1;if(db==null)return -1;return db-da;}
    return (nkmJahr(b.roh[l],M.spalten[l])||0)-(nkmJahr(a.roh[l],M.spalten[l])||0);
  });
}
/* ---------- Vorschläge: Positionen einer Kategorie, die nie im selben Jahr vorkommen ---------- */
function nkmVorschlaegeFuer(K,M,gr){
  var zeilen=K.positionen,jahre={},aus=[];
  zeilen.forEach(function(P){jahre[P.key]=[];for(var i=M.o;i<M.spalten.length;i++)if(P.roh[i]!=null)jahre[P.key].push(i);});
  function getrennt(a,b){return !jahre[a].some(function(i){return jahre[b].indexOf(i)>=0;});}
  var kandidaten=zeilen.map(function(A){
    var mit=zeilen.filter(function(B){return B.key!==A.key&&getrennt(A.key,B.key);});
    return mit.length?[A].concat(mit):null;
  }).filter(Boolean).sort(function(x,y){return y.length-x.length;});
  kandidaten.forEach(function(s){
    var keys=s.map(function(P){return P.key;}).sort(),sig=K.k+":"+keys.join("+");
    /* abgelehnt: dieser Vorschlag und jede Teilmenge davon */
    if(gr.nein.some(function(nsig){var i=nsig.indexOf(":");if(nsig.slice(0,i)!==K.k)return false;var nk=nsig.slice(i+1).split("+");return keys.every(function(x){return nk.indexOf(x)>=0;});}))return;
    if(aus.some(function(v){return keys.every(function(x){return v.keys.indexOf(x)>=0;});}))return;
    aus.push({k:K.k,keys:keys,sig:sig,zeilen:s});
  });
  return aus.slice(0,2);
}
/* ---------- Darstellung ---------- */
function nkmFarbe(Z,M,i,max){
  if(NKM.farbe==="hoehe"){
    var v=nkmJahr(Z.roh[i],M.spalten[i]);if(v==null||!(max>0))return "";
    return "background:color-mix(in srgb,var(--nk7) "+Math.round(6+34*Math.min(1,v/max))+"%,transparent)";
  }
  var r=nkmDelta(Z,M,i);if(r.d==null||Math.abs(r.d)<0.02)return "";
  var st=Math.round(10+32*Math.min(1,Math.abs(r.d)/0.5));
  return "background:color-mix(in srgb,var("+(r.d>0?"--neg":"--pos")+") "+st+"%,transparent)";
}
function nkmZahl(v){if(v==null)return "–";return NKM.wert==="m2"?num(v,2):eur0(v);}
function nkmSpark(Z,M){
  var pkt=[];for(var i=M.o;i<M.spalten.length;i++){var v=nkmJahr(Z.roh[i],M.spalten[i]);pkt.push(v);}
  var da=pkt.filter(function(v){return v!=null;});if(da.length<2)return "";
  var mn=Math.min.apply(null,da),mx=Math.max.apply(null,da),W=56,H=18,sp=mx-mn||1;
  var linien=[],akt=[];
  pkt.forEach(function(v,j){
    if(v==null){if(akt.length>1)linien.push(akt);akt=[];return;}
    akt.push((pkt.length===1?W/2:j*W/(pkt.length-1)).toFixed(1)+","+(H-2-(v-mn)/sp*(H-4)).toFixed(1));
  });
  if(akt.length>1)linien.push(akt);
  return '<svg class="nkmspark" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+linien.map(function(l){return '<polyline points="'+l.join(" ")+'"/>';}).join("")+'</svg>';
}
function nkmProzent(d){return d==null?"–":prozent(d);}
function nkmDeltaZelle(r){return '<td class="nkm-d nkd '+(r.d==null?"":(r.d>0.02?"hoch":(r.d<-0.02?"runter":"")))+'">'+(r.d==null?(r.neu?t("neu"):"–"):prozent(r.d))+'</td>';}
function nkmZeile(Z,M,max,zus){
  var l=M.spalten.length-1,anteil=nkmAnteil(Z,M),ist=Z.ebene==="kat",K=ist?Z:null,offen=ist&&NKM.offen[Z.k];
  var wahl=!ist&&NKM.wahl&&NKM.wahl.k===Z.k,an=wahl&&NKM.wahl.keys[Z.key];

    ?'<button class="nkm-auf" data-a="nkm-kat" data-k="'+Z.k+'" aria-expanded="'+(offen?"true":"false")+'"><span class="nkm-pf">'+(offen?"▾":"▸")+'</span>'+NK_KAT[Z.k].icon+' '+esc(Z.name)+'</button>'
    :(wahl?(Z.gruppe?'<button class="nkm-tr" data-a="nkm-trennen" data-r="'+esc(Z.key)+'">'+ic("x",14)+' '+t("Trennen")+'</button>':'<button class="nkm-cb'+(an?" an":"")+'" data-a="nkm-wahl" data-r="'+esc(Z.key)+'" role="checkbox" aria-checked="'+(an?"true":"false")+'" aria-label="'+esc(Z.name)+'"><span class="nkm-box">'+(an?ic("check",14):"")+'</span></button>'):"")+
      '<span class="nkm-pn">'+(Z.gruppe?"🔗 ":"")+esc(Z.name)+'</span>';
  var zellen="";

      '<button data-a="nkm-zelle" data-r="'+esc(Z.key)+'" data-i="'+i+'">'+nkmZahl(v)+'</button>')+'</td>';

  return '<tr class="'+(ist?"nkm-k":"nkm-p")+'"><th scope="row">'+kopf+'</th>'+zellen+
    '<td class="nkm-s">'+nkmSpark(Z,M)+'</td>'+nkmDeltaZelle(nkmDelta(Z,M,l))+nkmDeltaZelle(nkmDeltaZeitraum(Z,M))+
    '<td class="nkm-a">'+(anteil==null?"–":'<span class="nkm-bar"><i style="width:'+Math.round(Math.min(1,anteil)*100)+'%"></i></span>'+num(anteil*100,0)+' %')+'</td></tr>'+(zus||"");
}

/* ---------- Zellen-Detail ---------- */
function nkmZeileFinden(key){
  var M=NKM.matrix;if(!M)return null;
  for(var a=0;a<M.kats.length;a++){var K=M.kats[a];if(K.key===key)return K;
    for(var b=0;b<K.positionen.length;b++)if(K.positionen[b].key===key)return K.positionen[b];}

}
function nkmHinweise(n,Z,M,i){

  else Z.positionen.forEach(function(P){P.teile[i].forEach(function(p){if(p.bez)namen.push(p.bez);});});

async function nkmGruppenSpeichern(gr,meldung){

    var r=await sb.from("household_setup").update({nk_gruppen:wert}).eq("household_id",HH.id).select("household_id");
    if(r.error)throw r.error;
    if(!r.data||!r.data.length){

      if(r2.error)throw r2.error;

}
/* Alle Quell-Schlüssel der gewählten Zeilen bekommen den Gruppennamen */
function nkmGruppeSetzen(gr,zeilen,name){
  zeilen.forEach(function(P){Object.keys(P.quellen).forEach(function(q){gr.g[q]=name;});});
  return gr;
}
function nkmStandardName(zeilen){
  var M=NKM.matrix,best=null,bi=-1;
  zeilen.forEach(function(P){for(var i=M.spalten.length-1;i>=0;i--){if(P.teile[i]&&P.teile[i].length){if(i>bi){bi=i;best=P.teile[i][0].bez;}break;}}});
  return String(best||zeilen[0].name||"").replace(/\s*\([^)]*\)\s*$/,"").trim().slice(0,80);
}

    '<p class="hint" style="margin:0 4px 12px">'+esc(zeilen.map(function(P){return "„"+P.name+"“";}).join(" · "))+'</p>'+
    fld(t("Name"),inp("nkm_name",nkmStandardName(zeilen),"text",' maxlength="80"'))+
    '<div class="factions"><button class="btn" data-a="nkm-zus-ok">'+ic("check")+' '+t("Zusammenfassen")+'</button>'+
    '<button class="btn ghost" data-a="modal-close">'+t("Abbrechen")+'</button></div>');

async function nkmZusammenfassen(){
  var w=NKM.wahl,name=String(val("nkm_name")||"").trim().slice(0,80);
  if(!w||!name){toast(t("Bitte einen Namen eingeben."),true);return;}

async function nkmTrennen(key){

async function ladeFreigabe(){

/* ================= Umzug: Verträge, Dokumente, Arztdokumente, Nebenkosten in einen anderen Haushalt =================
   Regeln (mit dem User abgestimmt, 18.10.2026):
   - Ein Vertrag nimmt alle seine Dokumente mit, ein Vertrag mit Nebenkostenabrechnungen (Miete) auch diese samt Dokumenten.
   - Ein einzelnes Dokument eines bleibenden Vertrags: im Ziel dem Vertrag mit gleicher Vertrags- bzw. Kundennummer
     (+ gleiche Art) zuordnen, sonst „ohne Vertrag“. Eine einzelne Abrechnung hängt sich an den Mietvertrag des Ziels.
   - Personen: gleichnamige im Ziel verwenden, sonst dort anlegen.
   - Dubletten im Ziel: gleiche Datei → zusammenführen (Zielkopie bleibt), gleiche Vertragsnummer bzw. Kundennummer + Art →
     Verträge zusammenführen (leere Felder des Ziels füllen), gleicher Abrechnungszeitraum → Dokumente an die Ziel-Abrechnung.
   - Nur Admins des Quell-Haushalts (Datenbank-Trigger butler.umzug_nur_admin), Ziel: Mitglied (RLS).
   - Dateien ziehen mit: kopieren → umtragen (Pfad + Haushalt in einem Schritt, Prüfregel pfade_im_haus) → alte löschen. */
var UMZUG={hh:null,ziel:null,wahl:{v:{},d:{},n:{}},ansicht:"vertraege",q:"",bericht:null,laeuft:false,plan:null,zielDaten:null};
function umzugZiele(){return HOUSEHOLDS.filter(function(h){return !HH||h.id!==HH.id;});}
function umzugBereit(){
  if(!HH)return;
  if(UMZUG.hh!==HH.id){UMZUG.hh=HH.id;UMZUG.wahl={v:{},d:{},n:{}};UMZUG.ziel=null;UMZUG.q="";}
  var z=umzugZiele();
  if(UMZUG.ziel&&!z.some(function(h){return h.id===UMZUG.ziel;}))UMZUG.ziel=null;
  if(!UMZUG.ziel&&z.length===1)UMZUG.ziel=z[0].id;
}
function umzugMit(wahl){umzugBereit();UMZUG.wahl={v:{},d:{},n:{}};Object.keys(wahl).forEach(function(k){(wahl[k]||[]).forEach(function(id){UMZUG.wahl[k][id]=1;});});}
/* Auswahl samt allem, was automatisch mitkommt */
function umzugErweitern(wahl,quelle){
  var v={},n={},d={},grund={};
  Object.keys(wahl.v||{}).forEach(function(id){if(quelle.contracts.some(function(c){return c.id===id;}))v[id]=1;});
  quelle.nk.forEach(function(x){if(x.contract_id&&v[x.contract_id]){n[x.id]=1;grund["n"+x.id]="vertrag";}});
  Object.keys(wahl.n||{}).forEach(function(id){if(quelle.nk.some(function(x){return x.id===id;}))n[id]=1;});
  quelle.docs.forEach(function(x){
    if(x.contract_id&&v[x.contract_id]){d[x.id]=1;grund["d"+x.id]="vertrag";}
    else if(x.nk_id&&n[x.nk_id]){d[x.id]=1;grund["d"+x.id]="nk";}
  });
  Object.keys(wahl.d||{}).forEach(function(id){if(quelle.docs.some(function(x){return x.id===id;}))d[id]=1;});
  return {v:Object.keys(v),n:Object.keys(n),d:Object.keys(d),grund:grund};
}
function umzugQuelle(){return {contracts:CONTRACTS,docs:DOCS,nk:NK,persons:PERSONS};}
/* Ist dieser Vertrag im Ziel eindeutig derselbe? Vertragsnummer gleich, oder Kundennummer gleich bei gleicher Art
   (eine Kundennummer gilt bei manchen Anbietern für mehrere Verträge, z. B. Mobilfunk und Internet) */
function umzugGleicherVertrag(c,liste){
  var tr=liste.filter(function(z){
    return nummerGleich(c.vertragsnummer,z.vertragsnummer)||(nummerGleich(c.kundennummer,z.kundennummer)&&(c.art||"sonstiges")===(z.art||"sonstiges"));
  });

}
function umzugMieteImZiel(liste){

  return m.filter(function(c){return c.status==="aktiv";})[0]||m[0]||null;
}
/* Der Plan: was passiert mit jedem Eintrag? Rein rechnerisch, ohne Datenbank (prüfbar) */
function umzugPlan(wahl,quelle,ziel){
  var e=umzugErweitern(wahl,quelle),plan={ziel:ziel.id,vertraege:[],nk:[],dokumente:[],personen:{},arten:[],hinweise:[]};
  function byId(l,id){return l.filter(function(x){return x.id===id;})[0]||null;}
  var cZiel={},nZiel={};
  e.v.forEach(function(id){
    var c=byId(quelle.contracts,id),gl=umzugGleicherVertrag(c,ziel.contracts);
    plan.vertraege.push({c:c,aktion:gl?"zusammen":"verschieben",ziel:gl});
    cZiel[id]=gl?gl.id:id;
    if(!gl){
      if(plan.arten.indexOf(c.art||"sonstiges")<0)plan.arten.push(c.art||"sonstiges");
      if(ziel.contracts.some(function(z){return (z.art||"sonstiges")===(c.art||"sonstiges")&&anbieterGleich(z.anbieter,c.anbieter)===true;}))
        plan.hinweise.push(tf("„{0}“ gibt es im Ziel schon als eigenen Vertrag – bitte prüfen.",c.anbieter||artInfo(c.art).label));
    }
  });
  var mieteZiel=umzugMieteImZiel(ziel.contracts);
  e.n.forEach(function(id){
    var x=byId(quelle.nk,id),gl=ziel.nk.filter(function(z){return z.von===x.von&&z.bis===x.bis;})[0]||null;
    var vertrag=x.contract_id&&cZiel[x.contract_id]?cZiel[x.contract_id]:(mieteZiel?mieteZiel.id:null);
    plan.nk.push({n:x,aktion:gl?"zusammen":"verschieben",ziel:gl,vertrag:vertrag});
    nZiel[id]=gl?gl.id:id;
    if(gl&&Math.abs(nkSumme(gl)-nkSumme(x))>1)plan.hinweise.push(tf("Nebenkosten {0}: Summen weichen ab ({1} hier, {2} im Ziel) – die Werte im Ziel bleiben.",nkLabel(x),eur(nkSumme(x)),eur(nkSumme(gl))));
  });
  e.d.forEach(function(id){
    var x=byId(quelle.docs,id),dub=x.content_hash?ziel.docs.filter(function(z){return z.content_hash===x.content_hash;})[0]||null:null;
    var vertrag=null,nk=null;
    if(x.contract_id&&cZiel[x.contract_id])vertrag=cZiel[x.contract_id];
    else if(x.contract_id){var qc=byId(quelle.contracts,x.contract_id),zc=qc?umzugGleicherVertrag(qc,ziel.contracts):null;vertrag=zc?zc.id:null;}
    if(x.nk_id&&nZiel[x.nk_id])nk=nZiel[x.nk_id];
    plan.dokumente.push({d:x,aktion:dub?"zusammen":"verschieben",ziel:dub,vertrag:vertrag,nk:nk,mit:e.grund["d"+id]||null});
  });
  /* Personen der Einträge, die wirklich umziehen */
  plan.vertraege.concat(plan.dokumente).forEach(function(p){
    var o=p.c||p.d;if(p.aktion!=="verschieben"||!o.person_id)return;
    var pq=byId(quelle.persons,o.person_id);if(!pq)return;
    var pz=(ziel.persons||[]).filter(function(z){return personSchluessel(z.name)===personSchluessel(pq.name);})[0]||null;
    plan.personen[o.person_id]={name:pq.name,ziel:pz?pz.id:null};
  });
  return plan;
}
function umzugZahlen(plan){
  function z(l,a,f){return l.filter(function(p){return (!a||p.aktion===a)&&(!f||f(p));}).length;}
  return {v:plan.vertraege.length,vZus:z(plan.vertraege,"zusammen"),n:plan.nk.length,nZus:z(plan.nk,"zusammen"),
    d:z(plan.dokumente,null,function(p){return !istMed(p.d);}),med:z(plan.dokumente,null,function(p){return istMed(p.d);}),
    dZus:z(plan.dokumente,"zusammen"),pNeu:Object.keys(plan.personen).filter(function(k){return !plan.personen[k].ziel;}).length};
}

/* ---------- Ausführen ---------- */
async function umzugAusfuehren(plan,zd,melde){
  var Q=HH.id,Z=zd.id,log=[],zeilen=[],pmap={},schritt=0,gesamt=plan.vertraege.length+plan.nk.length+plan.dokumente.length;
  function weiter(){schritt++;melde(tf("{0} von {1} wird verschoben …",Math.min(schritt,gesamt),gesamt));}
  /* 1. Personen im Ziel finden oder anlegen */
  var pids=Object.keys(plan.personen);
  for(var i=0;i<pids.length;i++){
    var pp=plan.personen[pids[i]];
    if(pp.ziel){pmap[pids[i]]=pp.ziel;continue;}
    var pr=await sb.from("persons").insert({household_id:Z,name:pp.name}).select("id").single();
    if(!pr.error&&pr.data){pmap[pids[i]]=pr.data.id;zeilen.push({icon:"👤",name:pp.name,text:t("im Ziel angelegt")});}
  }
  /* 2. Verträge */
  var cOk={};
  for(var a=0;a<plan.vertraege.length;a++){
    var pv=plan.vertraege[a],c=pv.c;weiter();
    try{
      if(pv.aktion==="verschieben"){
        var r1=await sb.from("contracts").update({household_id:Z,person_id:c.person_id?(pmap[c.person_id]||null):null}).eq("id",c.id).select("id");
        if(r1.error)throw r1.error;if(!r1.data||!r1.data.length)throw new Error(t("Es wurde nichts geändert – fehlende Berechtigung?"));
        log.push({typ:"v",id:c.id,person:c.person_id||null});cOk[c.id]=c.id;
        zeilen.push({icon:"✅",name:c.anbieter||artInfo(c.art).label,text:artInfo(c.art).label+" · "+t("verschoben")});
      }else{
        var upd=umzugVertragFuellen(c,pv.ziel);
        if(Object.keys(upd).length){var r2=await sb.from("contracts").update(upd).eq("id",pv.ziel.id).select("id");if(r2.error)throw r2.error;}
        cOk[c.id]=pv.ziel.id;
        zeilen.push({icon:"🔗",name:c.anbieter||artInfo(c.art).label,text:t("mit dem gleichen Vertrag im Ziel zusammengeführt")});
      }
    }catch(x){zeilen.push({icon:"⚠️",name:c.anbieter||artInfo(c.art).label,text:umzugFehler(x)});}
  }
  /* 3. Nebenkostenabrechnungen */
  var nOk={};
  for(var b=0;b<plan.nk.length;b++){
    var pn=plan.nk[b],n=pn.n;weiter();
    var vz=n.contract_id&&cOk[n.contract_id]?cOk[n.contract_id]:(n.contract_id&&plan.vertraege.some(function(p){return p.c.id===n.contract_id;})?null:pn.vertrag);
    try{
      if(pn.aktion==="verschieben"){
        var r3=await sb.from("nk_abrechnungen").update({household_id:Z,contract_id:vz}).eq("id",n.id).select("id");
        if(r3.error)throw r3.error;if(!r3.data||!r3.data.length)throw new Error(t("Es wurde nichts geändert – fehlende Berechtigung?"));
        log.push({typ:"n",id:n.id,contract:n.contract_id||null});nOk[n.id]=n.id;
        zeilen.push({icon:"✅",name:tf("Nebenkosten {0}",nkLabel(n)),text:t("verschoben")});
      }else{
        nOk[n.id]=pn.ziel.id;
        zeilen.push({icon:"🔗",name:tf("Nebenkosten {0}",nkLabel(n)),text:t("an die vorhandene Abrechnung im Ziel angehängt – Werte unverändert")});
      }

  }
  /* 4. Dokumente: Datei kopieren → umtragen → alte Datei löschen; Zusammenführen: Quell-Kopie entfernen */
  var mitDok=0;
  for(var k=0;k<plan.dokumente.length;k++){

    var vertrag=d.contract_id&&cOk.hasOwnProperty(d.contract_id)?cOk[d.contract_id]:(plan.vertraege.some(function(p){return p.c.id===d.contract_id;})?null:pd.vertrag);

    var pfade=[d.storage_path].concat(d.weitere_seiten||[]).filter(Boolean);
    try{
      if(pd.aktion==="zusammen"){
        var adopt={};
        if(!pd.ziel.contract_id&&vertrag)adopt.contract_id=vertrag;

        var r5=await sb.from("documents").delete().eq("id",d.id).select("id");if(r5.error)throw r5.error;

      }else{
        var neu=await umzugDateienKopieren(pfade,Z);
        var r6=await sb.from("documents").update({household_id:Z,storage_path:neu[0],weitere_seiten:neu.slice(1),contract_id:vertrag,nk_id:nk,
          person_id:d.person_id?(pmap[d.person_id]||null):null}).eq("id",d.id).select("id");
        if(r6.error||!r6.data||!r6.data.length){await dateienWeg(neu);throw r6.error||new Error(t("Es wurde nichts geändert – fehlende Berechtigung?"));}
        await dateienWeg(pfade);
        log.push({typ:"d",id:d.id,alt:{storage_path:d.storage_path,weitere_seiten:d.weitere_seiten||[],contract_id:d.contract_id||null,nk_id:d.nk_id||null,person_id:d.person_id||null},neu:neu});
        if(pd.mit)mitDok++;
        if(!pd.mit)zeilen.push({icon:"✅",name:docTitel(d),text:vertrag?tf("verschoben → {0}",umzugVertragName(vertrag,plan,zd)):t("verschoben · ohne Vertrag")});
      }
    }catch(x){
      zeilen.push({icon:"⚠️",name:docTitel(d),text:umzugFehler(x)});
      /* Bleibt das Dokument zurück, darf es nicht an einem Vertrag/einer Abrechnung im anderen Haushalt hängen */
      var los={};if(d.contract_id&&cOk[d.contract_id])los.contract_id=null;if(d.nk_id&&nOk[d.nk_id])los.nk_id=null;
      if(Object.keys(los).length){try{await sb.from("documents").update(los).eq("id",d.id);}catch(_e){}}
    }
  }
  if(mitDok)zeilen.push({icon:"📄",name:tn(mitDok,"{0} Dokument","{0} Dokumente"),text:t("mit den Verträgen bzw. Abrechnungen umgezogen")});
  /* 5. Zusammengeführte Quell-Verträge/-Abrechnungen entfernen */
  var weg=plan.vertraege.filter(function(p){return p.aktion==="zusammen"&&cOk[p.c.id];}).map(function(p){return p.c.id;});
  if(weg.length){try{await sb.from("contracts").delete().in("id",weg);}catch(e){}}
  var wegN=plan.nk.filter(function(p){return p.aktion==="zusammen"&&nOk[p.n.id];}).map(function(p){return p.n.id;});
  if(wegN.length){try{await sb.from("nk_abrechnungen").delete().in("id",wegN);}catch(e){}}
  /* 6. Vertragsarten im Ziel anhaken, sonst wären die Verträge dort unsichtbar */
  var arten=(zd.setup&&Array.isArray(zd.setup.arten))?zd.setup.arten.slice():[],fehlt=plan.arten.filter(function(a){return a!=="sonstiges"&&arten.indexOf(a)<0;});
  if(fehlt.length){
    try{await sb.from("household_setup").upsert({household_id:Z,arten:arten.concat(fehlt),eingerichtet:zd.setup?!!zd.setup.eingerichtet:false,updated_at:new Date().toISOString()});
      zeilen.push({icon:"🧩",name:t("Vertragsarten im Ziel angehakt"),text:fehlt.map(function(a){return artInfo(a).label;}).join(", ")});}catch(e){}
  }
  plan.hinweise.forEach(function(h){zeilen.push({icon:"ℹ️",name:t("Hinweis"),text:h});});
  return {zeilen:zeilen,log:log,ziel:Z,quelle:Q};
}

async function umzugZurueck(b,melde){
  var Q=b.quelle,Z=b.ziel,fehler=0,n=0,gesamt=b.log.length;
  function weiter(){n++;melde(tf("{0} von {1} wird zurückgeschoben …",Math.min(n,gesamt),gesamt));}
  var v=b.log.filter(function(l){return l.typ==="v";}),nk=b.log.filter(function(l){return l.typ==="n";}),dk=b.log.filter(function(l){return l.typ==="d";});
  for(var i=0;i<v.length;i++){weiter();try{var r=await sb.from("contracts").update({household_id:Q,person_id:v[i].person}).eq("id",v[i].id).select("id");if(r.error||!r.data||!r.data.length)fehler++;}catch(e){fehler++;}}
  for(var j=0;j<nk.length;j++){weiter();try{var r2=await sb.from("nk_abrechnungen").update({household_id:Q,contract_id:nk[j].contract}).eq("id",nk[j].id).select("id");if(r2.error||!r2.data||!r2.data.length)fehler++;}catch(e){fehler++;}}
  for(var k=0;k<dk.length;k++){
    weiter();var l=dk[k];
    try{
      var alt=[l.alt.storage_path].concat(l.alt.weitere_seiten||[]),kopiert=[];
      for(var p=0;p<l.neu.length;p++){var c=await sb.storage.from(BUCKET).copy(l.neu[p],alt[p]);if(c.error)throw c.error;kopiert.push(alt[p]);}
      var r3=await sb.from("documents").update({household_id:Q,storage_path:alt[0],weitere_seiten:alt.slice(1),contract_id:l.alt.contract_id,nk_id:l.alt.nk_id,person_id:l.alt.person_id}).eq("id",l.id).select("id");
      if(r3.error||!r3.data||!r3.data.length){await dateienWeg(kopiert);throw r3.error||new Error("–");}
      await dateienWeg(l.neu);
    }catch(e){fehler++;}
  }
  return fehler;
}

var ZT_FILTER=[["alle","Alle"],["konten","Konten"],["ki","KI"],["fehler","Fehler"],["umzug","Umzüge"]];
var ZT_ZEITRAUM=[["heute","Heute"],["7","7 Tage"],["monat","Monat"],["vormonat","Vormonat"]];
var ZT_PLUS=5;                                     /* „Nur heute +5 $“ */
var SPEICHER_FREI=1024*1024*1024;                  /* Supabase Free: 1 GB Speicher */

function usd(n){if(n==null||isNaN(n))return "–";return Number(n).toLocaleString("de-DE",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2});}
function ztBytes(b){b=Number(b)||0;return b>=1073741824?num(b/1073741824,2)+" GB":(b>=1048576?num(b/1048576,1)+" MB":num(b/1024,0)+" kB");}
function ztGesehen(){try{return Number(localStorage.getItem(ZT_GESEHEN))||0;}catch(e){return 0;}}
function ztGesehenSetzen(){try{localStorage.setItem(ZT_GESEHEN,String(Date.now()));}catch(e){}}

async function ladeZentrale(){
  if(!IST_SUPERADMIN)return;
  ZT=ZT||{daten:null,fehler:null};ZT.laedt=true;
  try{var r=await sbPub.rpc("zentrale_daten");if(r.error)throw r.error;ZT.daten=r.data||null;ZT.fehler=null;}
  catch(e){ZT.fehler=errMsg(e);}
  ZT.am=Date.now();ZT.laedt=false;
  if(["zentrale","registrierungen","mehr","start","vorschlaege"].indexOf(route().name)>=0)render();
}
window.addEventListener("hashchange",function(){if(ZT)ZT.am=0;});

/* ---------- Kennzahlen aus den Rohdaten ---------- */
/* Der KI-Tag und -Monat laufen in UTC wie in der Datenbank (ai_cost_today) */
function ztTagBeginn(){var d=new Date();return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());}
function ztMonatBeginn(vor){var d=new Date();return Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-(vor?1:0),1);}
function ztNeuerTag(){var d=new Date(ztTagBeginn()+864e5);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function ztSumme(l){return l.reduce(function(s,r){return s+(Number(r.usd)||0);},0);}
function ztKiSeit(ab,bis){return ((ZT&&ZT.daten&&ZT.daten.ki)||[]).filter(function(r){var z=Date.parse(r.t);return z>=ab&&(bis==null||z<bis);});}
function ztBudget(){
  var D=ZT&&ZT.daten;if(!D||!D.einstellungen)return null;
  var e=D.einstellungen,heute=ztSumme(ztKiSeit(ztTagBeginn())),monat=ztSumme(ztKiSeit(ztMonatBeginn()));
  return {heute:heute,tag:Number(e.tag_wirksam)||0,tagBasis:Number(e.tag)||0,extra:Number(e.extra)||0,monat:monat,monatBudget:Number(e.monat)||0,limit:Number(e.limit)||0};
}
function ztAnteil(a,b){return b>0?a/b:(a>0?1:0);}
function ztStufe(q){return q>=1?"bad":(q>=0.8?"warn":"");}
function ztBalken(a,b){var q=ztAnteil(a,b);
  return '<div class="ztbar '+ztStufe(q)+'" role="img" aria-label="'+esc(Math.round(q*100)+" %")+'"><i style="width:'+Math.min(100,Math.round(q*100))+'%"></i></div>';}
function ztEreignisse(){return (ZT&&ZT.daten&&ZT.daten.ereignisse)||[];}
function ztNeu(){var g=ztGesehen();return ztEreignisse().filter(function(e){return (e.stufe==="warn"||e.stufe==="fehler")&&Date.parse(e.t)>g;});}
function ztKonten(){return (ZT&&ZT.daten&&ZT.daten.konten)||[];}
function ztHaushalte(){return (ZT&&ZT.daten&&ZT.daten.haushalte)||[];}
function ztHhName(id){var h=ztHaushalte().filter(function(x){return x.id===id;})[0];return h?(h.name||"Haushalt"):null;}
function ztName(k){return [k.vorname,k.nachname].filter(Boolean).join(" ")||k.email||"?";}
function ztOffen(){return ztKonten().filter(function(k){return k.status==="offen";});}
/* Zahl am Eintrag „Zentrale“: wartende Registrierungen + neue Warnungen/Fehler */
function ztZahl(){return ztOffen().filter(function(k){return k.email_bestaetigt;}).length+ztNeu().length;}

/* ---------- Hinweis auf der Startseite (nur Superadmin) ---------- */
function ztVorschlaege(){
  if(!IST_SUPERADMIN)return [];
  var b=ztBudget();if(!b)return [];
  var v=[],qt=ztAnteil(b.heute,b.tag),qm=ztAnteil(b.monat,b.monatBudget),tag=new Date(ztTagBeginn()).toISOString().slice(0,10);
  if(qm>=0.8)v.push({key:"ztmonat:"+tag.slice(0,7)+":"+(qm>=1?"voll":"80"),art:qm>=1?"bad":"warn",icon:"euro",
    titel:qm>=1?t("KI-Monatsbudget ausgeschöpft"):tf("KI-Monatsbudget zu {0} % verbraucht",Math.round(qm*100)),
    text:tf("{0} von {1} in diesem Monat",usd(b.monat),usd(b.monatBudget)),knopf:t("Ändern"),href:"#/zentrale?tab=ki"});
  if(qt>=0.8)v.push({key:"zttag:"+tag+":"+(qt>=1?"voll":"80")+":"+b.tag,art:qt>=1?"bad":"warn",icon:"euro",
    titel:qt>=1?t("KI-Tagesbudget ausgeschöpft"):tf("KI-Tagesbudget zu {0} % verbraucht",Math.round(qt*100)),
    text:tf("{0} von {1} heute · neuer Tag ab {2} Uhr",usd(b.heute),usd(b.tag),ztNeuerTag()),knopf:tf("Nur heute +{0} $",ZT_PLUS),aktion:"zt-plus"});
  return v;
}

/* ---------- Ansicht ---------- */
function viewZentrale(){
  var kopf=zurueck("#/mehr","Mehr")+seitenTitel("Zentrale");
  if(!IST_SUPERADMIN)return kopf+'<section class="card"><p class="hint">Nur für den Superadmin.</p></section>';
  var p=route().params;
  if(p.tab&&ZT_TABS.some(function(x){return x[0]===p.tab;}))ZT_ANSICHT.tab=p.tab;
  if(!ZT||(!ZT.laedt&&Date.now()-(ZT.am||0)>10000))ladeZentrale();
  if(!ZT||!ZT.daten)return kopf+(ZT&&ZT.fehler?fehlerKarte(ZT.fehler):'<section class="card"><div class="abrbusy"><span class="spin"></span></div></section>');
  var neu=ztNeu().length,offen=ztOffen().length;
  var tabs='<div class="langrow zttabs" role="tablist">'+ZT_TABS.map(function(x){
    var z=x[0]==="konten"?offen:(x[0]==="ereignisse"?neu:0);
    return '<button class="lb'+(ZT_ANSICHT.tab===x[0]?" on":"")+'" role="tab" aria-selected="'+(ZT_ANSICHT.tab===x[0])+'" data-a="zt-tab" data-k="'+x[0]+'">'+x[1]+(z?' <span class="pill">'+z+'</span>':"")+'</button>';
  }).join("")+'</div>';
  var inhalt={uebersicht:ztUebersicht,ki:ztKi,konten:ztKontenAnsicht,haushalte:ztHaushalteAnsicht,ereignisse:ztEreignisAnsicht}[ZT_ANSICHT.tab]();
  if(ZT_ANSICHT.tab==="ereignisse")setTimeout(ztGesehenSetzen,0);
  return kopf+(ZT.fehler?fehlerKarte(ZT.fehler):"")+tabs+inhalt;
}
function ztKpi(label,wert,unter,href,extra){
  return (href?'<a class="kpi" href="'+href+'">':'<div class="kpi">')+'<div class="kl">'+label+'</div><div class="kv">'+wert+'</div>'+(extra||"")+
    (unter?'<div class="ks">'+unter+'</div>':"")+(href?'</a>':'</div>');
}
function ztUebersicht(){
  var b=ztBudget(),K=ztKonten(),H=ztHaushalte(),E=ztEreignisse(),tag=Date.now()-864e5;
  var fehler24=E.filter(function(e){return e.typ==="fehler"&&Date.parse(e.t)>tag;}).length;
  var abgew24=E.filter(function(e){return e.typ==="ki_abgewiesen"&&Date.parse(e.t)>tag;}).length;
  var aktiv=K.filter(function(k){return k.zuletzt_angemeldet&&Date.parse(k.zuletzt_angemeldet)>Date.now()-7*864e5;}).length;
  var offen=ztOffen();
  return '<div class="kpis ztkpis">'+
      ztKpi("KI heute",usd(b.heute),"von "+usd(b.tag)+(b.extra?" (inkl. +"+usd(b.extra)+")":""),"#/zentrale?tab=ki",ztBalken(b.heute,b.tag))+
      ztKpi("KI im Monat",usd(b.monat),"von "+usd(b.monatBudget),"#/zentrale?tab=ki",ztBalken(b.monat,b.monatBudget))+
      ztKpi("Registrierungen",String(offen.length),offen.length?"warten auf Freigabe":"niemand wartet","#/zentrale?tab=konten")+
      ztKpi("Letzte 24 Stunden",String(fehler24+abgew24),[tn(fehler24,"{0} Fehler","{0} Fehler"),tn(abgew24,"{0} KI-Abweisung","{0} KI-Abweisungen")].join(" · "),"#/zentrale?tab=ereignisse")+
      ztKpi("Aktiv (7 Tage)",String(aktiv),"von "+tn(K.length,"{0} Konto","{0} Konten"),"#/zentrale?tab=konten")+
      ztKpi("Haushalte",String(H.length),ztBytes(H.reduce(function(s,h){return s+(Number(h.speicher)||0);},0))+" Speicher","#/zentrale?tab=haushalte")+
    '</div>'+
    '<div class="sect">Letzte Ereignisse</div>'+
    (E.length?'<section class="card"><div class="dlist">'+E.slice(0,6).map(ztEreignisZeile).join("")+'</div>'+
      '<div class="factions" style="margin-top:10px"><a class="btn ghost sm" href="#/zentrale?tab=ereignisse">Alle Ereignisse</a></div></section>'
     :'<section class="card"><p class="hint" style="margin:0">Noch keine Ereignisse.</p></section>');
}

/* ---------- KI ---------- */
function ztZeitraum(){
  var z=ZT_ANSICHT.zr,jetzt=Date.now();
  if(z==="heute")return [ztTagBeginn(),null];
  if(z==="7")return [jetzt-7*864e5,null];
  if(z==="vormonat")return [ztMonatBeginn(true),ztMonatBeginn()];
  return [ztMonatBeginn(),null];
}
function ztApp(mode){return /^allhome-/.test(String(mode||""))?"All-Home":"AllTrack";}
function ztGruppe(titel,rows,schluessel){
  var g={};rows.forEach(function(r){var k=schluessel(r);(g[k]=g[k]||{n:0,usd:0});g[k].n++;g[k].usd+=Number(r.usd)||0;});
  var l=Object.keys(g).map(function(k){return {k:k,n:g[k].n,usd:g[k].usd};}).sort(function(a,b){return b.usd-a.usd;});
  if(!l.length)return "";
  var max=l[0].usd||1;
  return '<div class="sect">'+titel+'</div><section class="card"><div class="ztliste">'+l.map(function(x){
    return '<div class="ztz"><div class="ztzk"><span class="ztzn">'+esc(x.k)+'</span><span class="ztzw">'+usd(x.usd)+'</span></div>'+
      '<div class="ztbar fein"><i style="width:'+Math.max(2,Math.round(x.usd/max*100))+'%"></i></div>'+
      '<div class="ztzm">'+tn(x.n,"{0} Aufruf","{0} Aufrufe")+'</div></div>';
  }).join("")+'</div></section>';
}
function ztKi(){
  var b=ztBudget(),e=ZT.daten.einstellungen||{},zr=ztZeitraum(),rows=ztKiSeit(zr[0],zr[1]);
  var abgew=ztEreignisse().filter(function(x){var z=Date.parse(x.t);return x.typ==="ki_abgewiesen"&&z>=zr[0]&&(zr[1]==null||z<zr[1]);});
  var fehl=rows.filter(function(r){return r.ok===false;}).length;
  return '<section class="card ztbudget">'+
      '<div class="ztbk"><span>Heute</span><b>'+usd(b.heute)+' <span class="mut">von '+usd(b.tag)+'</span></b></div>'+ztBalken(b.heute,b.tag)+
      '<div class="ztbm">'+(b.extra?"davon nur heute +"+usd(b.extra)+" · ":"")+'neuer Tag ab '+ztNeuerTag()+' Uhr</div>'+
      '<div class="ztbk" style="margin-top:14px"><span>Dieser Monat</span><b>'+usd(b.monat)+' <span class="mut">von '+usd(b.monatBudget)+'</span></b></div>'+ztBalken(b.monat,b.monatBudget)+
      '<div class="factions" style="margin-top:14px"><button class="btn" data-a="zt-plus">'+ic("plus")+' Nur heute +'+ZT_PLUS+' $</button></div>'+
    '</section>'+
    '<div class="sect">Grenzen</div><section class="card"><form id="ztGrenzen" novalidate>'+
      '<div class="two">'+fld("Tagesbudget ($)",inp("zt_tag",e.tag,"number",' min="0" max="500" step="0.5" inputmode="decimal"'))+
        fld("Monatsbudget ($)",inp("zt_monat",e.monat,"number",' min="0" max="5000" step="1" inputmode="decimal"'))+'</div>'+
      fld("Aufrufe je Person und Tag",inp("zt_limit",e.limit,"number",' min="1" max="1000" step="1" inputmode="numeric"'))+
      '<p class="hint" style="margin:0 0 12px">Gilt für All-Home und AllTrack zusammen.'+(e.geaendert_am?' Zuletzt geändert '+datumZeit(e.geaendert_am)+'.':"")+'</p>'+
      '<div class="factions"><button class="btn" type="submit">'+ic("check")+' Speichern</button></div>'+
    '</form></section>'+
    '<div class="langrow zttabs ztzr">'+ZT_ZEITRAUM.map(function(x){return '<button class="lb'+(ZT_ANSICHT.zr===x[0]?" on":"")+'" data-a="zt-zr" data-k="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div>'+
    '<div class="kpis">'+
      ztKpi("Verbrauch",usd(ztSumme(rows)),tn(rows.length,"{0} Aufruf","{0} Aufrufe")+(fehl?" · "+tn(fehl,"{0} ohne Ergebnis","{0} ohne Ergebnis"):""))+
      ztKpi("Abgewiesen",String(abgew.length),abgew.length?"Budget, Limit oder Guthaben":"keine")+
    '</div>'+
    (rows.length?ztGruppe("Nach App",rows,function(r){return ztApp(r.mode);})+
      ztGruppe("Nach Funktion",rows,function(r){return KI_ZWECK[r.mode]||r.mode||"KI";})+
      ztGruppe("Nach Haushalt",rows,function(r){return ztHhName(r.hh)||"ohne Haushalt";})+
      ztGruppe("Nach Person",rows,function(r){return r.email||"ehemaliges Konto";})+
      ztGruppe("Nach Modell",rows,function(r){return kiModell(r.model);})
     :'<section class="card"><p class="hint" style="margin:0">Keine KI-Aufrufe in diesem Zeitraum.</p></section>')+
    (abgew.length?'<div class="sect">Abgewiesene Aufrufe</div><section class="card"><div class="dlist">'+abgew.slice(0,30).map(ztEreignisZeile).join("")+'</div></section>':"");
}
async function ztPlus(){
  if(!confirm(tf("KI-Budget nur für heute um {0} $ erhöhen?",ZT_PLUS)))return;
  try{var r=await sbPub.rpc("ki_heute_erhoehen",{p_usd:ZT_PLUS});if(r.error)throw r.error;
    await ladeZentrale();toast(tf("Heute jetzt {0}",usd(r.data))+" ✅");}
  catch(e){toast(t("Erhöhen fehlgeschlagen")+": "+errMsg(e),true);}
}
async function ztGrenzenSpeichern(){
  if(zahlFehlt(["zt_tag","zt_monat","zt_limit"])){toast("Bitte eine Zahl eingeben, z. B. 9,90.",true);return;}
  var tag=valNum("zt_tag"),monat=valNum("zt_monat"),lim=valNum("zt_limit");
  if(tag==null||tag<0||tag>500){toast("Tagesbudget: 0 bis 500 $.",true);return;}
  if(monat==null||monat<0||monat>5000){toast("Monatsbudget: 0 bis 5.000 $.",true);return;}
  if(lim==null||lim<1||lim>1000||lim%1){toast("Aufrufe je Person: ganze Zahl von 1 bis 1.000.",true);return;}
  if(monat<tag&&!confirm("Das Monatsbudget ist kleiner als das Tagesbudget. Trotzdem speichern?"))return;
  try{var r=await sbPub.rpc("ki_einstellungen_setzen",{p_tag:tag,p_monat:monat,p_limit:lim});if(r.error)throw r.error;
    await ladeZentrale();toast("Gespeichert ✅");}
  catch(e){toast("Speichern fehlgeschlagen: "+errMsg(e),true);}
}

/* ---------- Konten ---------- */
var ZT_STATUS={offen:["warnp","wartet"],gesperrt:["","gesperrt"],freigegeben:["pos","aktiv"]};
function ztKontenAnsicht(){
  var K=ztKonten(),gruppen=[["offen","Wartet auf Freigabe"],["gesperrt","Gesperrt"],["freigegeben","Freigegeben"]];
  return gruppen.map(function(g){
    var l=K.filter(function(k){return k.status===g[0];});if(!l.length&&g[0]!=="offen")return "";
    return '<div class="sect">'+g[1]+'</div><section class="card">'+(l.length?'<div class="dlist">'+l.map(function(k){
      return '<button class="drow3" data-a="zt-konto" data-id="'+esc(k.user_id)+'"><span class="di">'+ic(k.status==="gesperrt"?"shield":"user",18)+'</span>'+
        '<span class="db"><span class="dn">'+esc(ztName(k))+(k.superadmin?' <span class="pill">Superadmin</span>':"")+(k.logo_rolle?' <span class="pill mut">Logos</span>':"")+'</span>'+
        '<span class="dm">'+(ztName(k)!==k.email?'<span>'+esc(k.email)+'</span>':"")+
          '<span>'+(k.status==="offen"?"seit "+fmtDate(String(k.angelegt_am||"").slice(0,10))+(k.email_bestaetigt?"":" · E-Mail nicht bestätigt")
            :(k.zuletzt_angemeldet?"zuletzt "+fmtDate(String(k.zuletzt_angemeldet).slice(0,10)):"nie angemeldet"))+'</span>'+
          '<span>'+tn(Number(k.haushalte)||0,"{0} Haushalt","{0} Haushalte")+'</span></span></span>'+
        '<span class="go">'+ic("right",16)+'</span></button>';
    }).join("")+'</div>':'<p class="hint" style="margin:0">Niemand wartet auf Freigabe.</p>')+'</section>';
  }).join("");
}
function ztKonto(id){return ztKonten().filter(function(k){return k.user_id===id;})[0]||null;}
function ztKontoBlatt(id){
  var k=ztKonto(id);if(!k)return;
  var app=k.app==="alltrack"?"AllTrack":(k.app==="all-home"?"All-Home":"–");
  var knopf=[];
  if(k.status==="offen"){
    knopf.push('<button class="btn" data-a="reg-ja" data-id="'+esc(k.user_id)+'">'+ic("check")+' Freigeben</button>');
    if(!k.superadmin)knopf.push('<button class="btn ghost danger" data-a="reg-nein" data-id="'+esc(k.user_id)+'">Ablehnen und löschen</button>');
  }else{
    if(k.status==="freigegeben"&&!k.superadmin)knopf.push('<button class="btn ghost danger" data-a="zt-sperren" data-id="'+esc(k.user_id)+'" data-k="an">'+ic("shield")+' Sperren</button>');
    if(k.status==="gesperrt")knopf.push('<button class="btn" data-a="zt-sperren" data-id="'+esc(k.user_id)+'" data-k="aus">'+ic("check")+' Entsperren</button>');
    knopf.push('<button class="btn ghost" data-a="zt-logo" data-id="'+esc(k.user_id)+'" data-k="'+(k.logo_rolle?"aus":"an")+'">'+ic("folder")+' '+(k.logo_rolle?"Logo-Pflege entziehen":"Logo-Pflege erlauben")+'</button>');
    knopf.push('<button class="btn ghost" data-a="reg-pw" data-mail="'+esc(k.email)+'">'+ic("link")+' Passwort-Link senden</button>');
  }
  openModal('<h2 class="mhead">'+esc(ztName(k))+'</h2>'+
    '<div class="kvl">'+kv("E-Mail",esc(k.email||"–"))+kv("Status",'<span class="pill '+(ZT_STATUS[k.status]||["",""])[0]+'">'+esc((ZT_STATUS[k.status]||["",k.status])[1])+'</span>')+
      kv("Rollen",esc([k.superadmin?"Superadmin":"",k.logo_rolle?"Logo-Pflege":""].filter(Boolean).join(", ")||"–"))+
      kv("Registriert",fmtDate(String(k.angelegt_am||"").slice(0,10))+(k.app?" · über "+app:""))+
      kv("E-Mail bestätigt",k.email_bestaetigt?"ja":"nein")+
      kv("Zuletzt angemeldet",k.zuletzt_angemeldet?datumZeit(k.zuletzt_angemeldet):"nie")+
      kv("Haushalte",String(Number(k.haushalte)||0))+'</div>'+
    '<div class="factions ztknoepfe">'+knopf.join("")+'<button class="btn ghost" data-a="modal-close">Schließen</button></div>');
}
async function ztSperren(id,an){
  var k=ztKonto(id);if(!k)return;
  if(an&&!confirm(ztName(k)+" sperren? Das Konto sieht danach keine Daten mehr und kann keine KI nutzen – in All-Home und AllTrack."))return;
  try{var r=await sbPub.rpc("konto_sperren",{p_user:id,p_sperren:an});if(r.error)throw r.error;
    closeModal(true);await ladeZentrale();toast(an?"Gesperrt":"Entsperrt ✅");}
  catch(e){toast((an?"Sperren":"Entsperren")+" fehlgeschlagen: "+errMsg(e),true);}
}
async function ztLogoRolle(id,an){
  try{var r=await sbPub.rpc("logo_rolle_setzen",{p_user:id,p_an:an});if(r.error)throw r.error;
    closeModal(true);await ladeZentrale();toast(an?"Logo-Pflege erlaubt ✅":"Logo-Pflege entzogen");}
  catch(e){toast("Ändern fehlgeschlagen: "+errMsg(e),true);}
}

/* ---------- Haushalte ---------- */
function ztWarnungen(h){
  var w=[],m=h.mitglieder||[];
  if(!m.length)w.push("ohne Mitglieder");else if(!m.some(function(x){return x.admin;}))w.push("ohne Admin");
  if(!(Number(h.dokumente)||Number(h.vertraege)||Number(h.abrechnungen)||Number(h.personen)))w.push("leer");
  if((Number(h.speicher)||0)>200*1048576)w.push("viel Speicher");
  return w;
}
function ztHaushalteAnsicht(){
  var H=ztHaushalte(),ges=H.reduce(function(s,h){return s+(Number(h.speicher)||0);},0);
  return '<section class="card ztbudget"><div class="ztbk"><span>Speicher gesamt</span><b>'+ztBytes(ges)+' <span class="mut">von '+ztBytes(SPEICHER_FREI)+'</span></b></div>'+ztBalken(ges,SPEICHER_FREI)+'</section>'+
    '<div class="sect">'+tn(H.length,"{0} Haushalt","{0} Haushalte")+'</div>'+
    H.map(function(h){
      var w=ztWarnungen(h);
      return '<section class="card ztkarte"><div class="ztkopf"><b>'+esc(h.name||"Haushalt")+'</b>'+w.map(function(x){return '<span class="pill warnp">'+esc(x)+'</span>';}).join("")+'</div>'+

/* ================= Nebenkosten-Analyse (KI-Bot) =================
   Bericht über alle Jahre eines Haushalts plus Rückfragen. Die App rechnet alle Zahlen selbst (nkaFakten),
   schickt den abgeschriebenen Text der Abrechnungen und das Gedächtnis mit; die KI deutet, belegt und empfiehlt.
   Was die KI behauptet, prüft die App nach (nkaGeprueft): Zitate müssen im Dokumenttext stehen, Beträge plausibel sein.
   Gespeichert in butler.nk_berichte / nk_fragen / nk_gedaechtnis (alle Mitglieder lesen, Admins oder Urheber löschen). */
var EDGE_NKA="butler-nk-analyse";
var NKA=null;   /* {hh, berichte, fragen, gedaechtnis, texte, fehlend, laedt, fehler, am, laeuft, recherche, uebersetzt} */
/* ausTok: gemessen mit fiktiven Testdaten (Opus mittlere Denktiefe ≈ 8.200, Sonnet ≈ 6.800 inkl. Denken); recherche: Zuschlag je Rückfrage */
var NKA_PREIS={gruendlich:{name:"Gründlich",modell:"Opus 5.5",ein:4,aus:20,ausTok:8500,recherche:0.15},
               schnell:{name:"Schnell",modell:"Sonnet 5.5",ein:2,aus:10,ausTok:7000,recherche:0.05}};
var NKA_ABSCHREIBEN_USD=0.045;   /* je Dokument (Haiku, Erfahrungswert aus ai_calls) */
var NKA_PROMPT_ZEICHEN=9500;     /* fester Teil der Anfrage (Rechtsstand, Aufgabe) */
var NKA_START=null;              /* offenes Startblatt: {schaetzung, rest} */

function nkaR(x,d){var f=Math.pow(10,d==null?2:d);return x==null||isNaN(x)?null:Math.round(x*f)/f;}

/* ---------- Laden ---------- */
async function ladeNkAnalyse(neu){
  if(!HH)return;
  var hh=HH.id;
  if(!NKA||NKA.hh!==hh||neu)NKA={hh:hh,berichte:null,fragen:[],gedaechtnis:[],texte:null,fehlend:[],recherche:false,uebersetzt:{}};
  var A=NKA;A.laedt=true;
  try{
    var r=await Promise.all([
      sb.from("nk_berichte").select("id,created_at,user_id,user_email,modell,qualitaet,kosten_usd,lang,stand,bericht").eq("household_id",hh).order("created_at",{ascending:false}).limit(20),
      sb.from("nk_fragen").select("*").eq("household_id",hh).order("created_at",{ascending:true}).limit(400),
      sb.from("nk_gedaechtnis").select("*").eq("household_id",hh).order("created_at",{ascending:true}).limit(200)
    ]);
    r.forEach(function(x){if(x.error)throw x.error;});
    function zeit(x){return Date.parse(x.created_at)||0;}
    A.berichte=(r[0].data||[]).sort(function(a,b){return zeit(b)-zeit(a);});
    A.fragen=(r[1].data||[]).sort(function(a,b){return zeit(a)-zeit(b);});A.gedaechtnis=(r[2].data||[]).sort(function(a,b){return zeit(a)-zeit(b);});A.fehler=null;
  }catch(e){A.fehler=errMsg(e);if(!A.berichte)A.berichte=[];}
  A.am=Date.now();A.laedt=false;
  if(["nebenkosten","nkanalyse"].indexOf(route().name)>=0)render();
}
/* Abgeschriebener Text der Abrechnungsdokumente (nicht in DOCS geladen – zu groß) */
function nkaDokumente(){
  var ids={};nkMitWerten(nkSortiert()).forEach(function(n){ids[n.id]=n;});
  return DOCS.filter(function(d){return d.nk_id&&ids[d.nk_id];});
}
async function nkaTexteLaden(){
  var A=NKA;if(!A)return;
  var doks=nkaDokumente(),ids=doks.map(function(d){return d.id;});
  if(!ids.length){A.texte=[];A.fehlend=[];return;}
  var r=await sb.from("documents").select("id,nk_id,volltext").in("id",ids);
  if(r.error)throw r.error;
  var vt={};(r.data||[]).forEach(function(x){if(x.volltext&&String(x.volltext).trim())vt[x.id]=x.volltext;});
  A.texte=doks.filter(function(d){return vt[d.id];}).map(function(d){return {id:d.id,titel:nkaDokTitel(d),text:vt[d.id]};});
  A.fehlend=doks.filter(function(d){return !vt[d.id];});
}
function nkaDokTitel(d){var n=nkById(d.nk_id);return tf("Abrechnung {0}",n?nkLabel(n):"?")+" – "+docTitel(d);}

/* ---------- Fakten: alles, was die App selbst exakt rechnen kann ---------- */
function nkaArt(alle){
  var c=nkMieteVertrag(null);
  var mieter=!!c||alle.some(function(n){return numOrNull(n.vorauszahlungen)!=null||numOrNull(n.vorauszahlung_neu)!=null||(n.ki&&n.ki.vermieter);});
  return mieter?"mieter":"eigentuemer";
}
function nkaPrognoseBasis(alle){
  if(!alle.length)return null;
  var w=alle.map(function(n){return nkSumme(n)*nkFaktor(n);}),d=[];
  for(var i=Math.max(1,w.length-3);i<w.length;i++)if(w[i-1]>0)d.push((w[i]-w[i-1])/w[i-1]);
  d.sort(function(a,b){return a-b;});
  var trend=d.length?d[Math.floor(d.length/2)]:0;trend=Math.max(-0.1,Math.min(0.25,trend));
  var letzte=w[w.length-1],basis=letzte*(1+trend);
  return {letzter_zeitraum:nkLabel(alle[alle.length-1]),kosten_letzte_12_monate:nkaR(letzte,0),trend_pct:nkaR(trend*100,1),
    erwartete_kosten:nkaR(basis,0),vorauszahlung_monat_vorschlag:Math.ceil(basis/12/5)*5,
    hinweis:"Median der letzten Veränderungen, begrenzt auf -10 bis +25 Prozent"};
}
function nkaFakten(){
  var alle=nkMitWerten(nkSortiert()),c=nkMieteVertrag(null),gr=nkGruppenDaten();
  var jahre=alle.map(function(n){
    var kat=nkKat(n),vor=nkVorgaenger(n,true),ka=vor?nkKat(vor):{},kats={};
    Object.keys(kat).forEach(function(k){
      var d=vor&&ka[k]>0&&nkVergleichbarKat(k,n,vor)?nkDelta(kat[k]*nkFaktor(n),ka[k]*nkFaktor(vor)):null;
      kats[k]={betrag:nkaR(kat[k]),je_m2_monat:nkaR(nkJeM2(kat[k],n),3),spiegel_je_m2:nkSpiegel(k,n),veraenderung_vorjahr_pct:d==null?null:nkaR(d*100,1)};
    });
    var st=nkSteuer(n),sum=nkSumme(n);
    return {label:nkLabel(n),von:n.von,bis:n.bis,monate:nkaR(nkMonate(n),1),vollstaendig:nkVoll(n),
      wohnflaeche:numOrNull(n.wohnflaeche),personen:numOrNull(n.personen),kosten:nkaR(sum),kosten_auf_12_monate:nkaR(sum*nkFaktor(n)),
      je_m2_monat:nkaR(nkJeM2(sum,n),3),vorauszahlungen:numOrNull(n.vorauszahlungen),ergebnis:nkErgebnis(n),
      ergebnis_text:nkErgebnis(n)==null?null:(nkErgebnis(n)>0?"Nachzahlung":"Guthaben"),vorauszahlung_neu_monat:numOrNull(n.vorauszahlung_neu),
      abrechnung_vom:n.erstellt_am||null,erhalten_am:n.zugang_am||null,abrechnungsfrist:nkFristAbrechnung(n),einwaende_bis:nkFristEinwand(n),
      erledigt:!!n.erledigt,vermieter:(n.ki&&n.ki.vermieter)||null,kategorien:kats,
      positionen:nkPos(n).map(function(p){var b=nkBetrag(p),h=numOrNull(p.haus);
        return {bezeichnung:p.bez||"",kategorie:nkKatVon(p),betrag:nkaR(b),hauskosten:h,anteil_pct:h>0?nkaR(b/h*100,2):null,
          schluessel:p.schluessel||null,anteil_text:p.anteil||null,p35a:p.p35a||null,p35a_betrag:numOrNull(p.p35a_betrag)};}),
      heizung:nkHeiz(n),
      app_hinweise:nkPruefen(n).filter(function(x){return x.art!=="gut";}).map(function(x){return {art:x.art,titel:x.titel,text:x.text,betrag:x.betrag||null};}),
      steuer_35a:{dienstleistungen:nkaR(st.dienst),handwerk:nkaR(st.handwerk),ermaessigung:nkaR(st.ermaessigung),geschaetzt:!!st.geschaetzt}};
  });
  /* Positionen über alle Jahre (gleiche Posten, auch in anderer Schreibweise, in einer Zeile wie in der Heatmap) */
  var verlauf=[];
  if(alle.length){
    var M=nkMatrix(alle,gr,alle.length);
    M.kats.forEach(function(K){K.positionen.forEach(function(P){
      var w={};M.spalten.forEach(function(n,i){if(P.roh[i]!=null)w[nkLabel(n)]=nkaR(P.roh[i]);});
      verlauf.push({kategorie:K.k,position:P.name,werte:w});
    });});
  }
  var sp={};Object.keys(NK_KAT).forEach(function(k){if(NK_KAT[k].sp!=null)sp[k]=NK_KAT[k].sp;});
  return {heute:todayISO(),
    haushalt:{name:HH?HH.name:null,art:nkaArt(alle),mietvertrag:c?{anbieter:c.anbieter||null,vorauszahlung_monat:numOrNull((c.details||{}).nebenkosten)}:null},
    kategorien:Object.keys(NK_KAT).map(function(k){return {code:k,name:NK_KAT[k].l};}),
    jahre:jahre,positionsverlauf:verlauf,prognose_basis:nkaPrognoseBasis(alle),
    betriebskostenspiegel:{abrechnungsjahr:NK_SPIEGEL.jahr,gesamt_je_m2_monat:NK_SPIEGEL.gesamt,maximal:NK_SPIEGEL.max,kategorien:sp}};
}
/* Stand der Daten: ändert sich, sobald eine Abrechnung dazukommt oder bearbeitet wird („Neue Daten seit dem letzten Bericht“) */
function nkStand(liste){return liste.map(function(n){return n.id+":"+(n.updated_at||"");}).join("|");}
function nkaStandJetzt(){return nkStand(nkMitWerten(nkSortiert()));}
function nkaGedaechtnisTexte(){return ((NKA&&NKA.gedaechtnis)||[]).map(function(g){return g.text;});}

/* ---------- Kosten vorab ---------- */
function nkaZeichen(){
  var A=NKA||{},s=JSON.stringify(nkaFakten()).length+NKA_PROMPT_ZEICHEN;
  (A.texte||[]).forEach(function(x){s+=Math.min(60000,x.text.length);});
  nkaGedaechtnisTexte().forEach(function(g){s+=g.length+3;});
  return s;
}
/* Tokens grob aus Zeichen (deutsch + JSON ≈ 3,2 Zeichen je Token); Spanne für Ungenauigkeit und Denkaufwand */
function nkaSchaetzung(q,zeichen,fehlend){
  var P=NKA_PREIS[q],ein=zeichen/3.2+(fehlend||0)*2500,usd=(ein*P.ein+P.ausTok*P.aus)/1e6;
  return {usd:usd,von:usd*0.75,bis:usd*1.4,abschreiben:(fehlend||0)*NKA_ABSCHREIBEN_USD};
}
function nkaFrageSchaetzung(q,zeichen,frisch,recherche){
  var P=NKA_PREIS[q],ein=zeichen/3.2,usd=(ein*(frisch?0.1:1.25)*P.ein+1800*P.aus)/1e6+(recherche?P.recherche:0);
  return {usd:usd,von:usd*0.7,bis:usd*1.5};
}
function nkaEur(usd){return kiEur(usd).replace("≈ ","");}
function nkaSpanne(s){return "≈ "+nkaEur(s.von)+" – "+nkaEur(s.bis);}

async function nkaStartBlatt(){
