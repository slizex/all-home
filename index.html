async function doSignup(){
  var email=($("#auth_email").value||"").trim(),pass=$("#auth_pass").value||"";
  if(!email||!pass){authMsg("Bitte E-Mail und Passwort eingeben.","err");return;}
  if(pass.length<6){authMsg("Das Passwort muss mindestens 6 Zeichen haben.","err");return;}
  authMsg("Konto wird erstellt …","");
  try{
    var r=await sb.auth.signUp({email:email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}});
    if(r.error){authMsg(loginErrorText(r.error),"err");return;}
    if(r.data&&r.data.session)authMsg("Konto erstellt – du wirst angemeldet …","ok");
    else authMsg("Fast fertig! Wir haben dir eine Bestätigungs-E-Mail geschickt. Bitte klicke den Link darin an (auch im Spam-Ordner schauen) und melde dich danach hier mit E-Mail und Passwort an.","ok");

async function doSetPassword(){
  var p=$("#auth_newpass").value||"";
  if(p.length<6){authMsg("Das Passwort muss mindestens 6 Zeichen haben.","err");return;}
  authMsg("Passwort wird gespeichert …","");

    var r=await sb.auth.updateUser({password:p});

    pendingRecovery=false;showResetMode(false);
    try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}

/* ---------- Native App (Capacitor) – nur aktiv in der Android-App ---------- */
var CAP=window.Capacitor;
function isNative(){try{return !!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());}catch(e){return false;}}
function capPlugin(n){return (CAP&&CAP.Plugins&&CAP.Plugins[n])?CAP.Plugins[n]:null;}
function hashId(str,off){var h=5381;str=String(str||"");for(var i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))|0;}return (Math.abs(h)%1000000)+(off||0)*1000000+100000;}
function daysBeforeDate(iso,n){var d=new Date(String(iso).slice(0,10)+"T09:00:00");d.setDate(d.getDate()-n);return d;}
/* Kamera-Scan über die native Kamera (bessere Qualität als Browser-Upload) */
async function nativeCameraScan(){
  var Camera=capPlugin("Camera");
  if(!Camera){var fc=$("#fileCam");if(fc)fc.click();return;}
  try{
    var photo=await Camera.getPhoto({quality:82,allowEditing:false,resultType:"base64",source:"CAMERA",saveToGallery:false,correctOrientation:true});
    if(!photo||!photo.base64String)return;
    var fmt=(photo.format||"jpeg").toLowerCase();var mime="image/"+(fmt==="jpg"?"jpeg":fmt);
    var blob=new Blob([base64ToBytes(photo.base64String)],{type:mime});
    var file=new File([blob],"scan-"+Date.now()+"."+(fmt==="jpeg"?"jpg":fmt),{type:mime});
    onAddFile(file);

/* "An Butler teilen": aus anderer App geteilte Datei empfangen und einlesen */
var pendingSharedFile=null;
function shareExt(type){type=(type||"").toLowerCase();if(type.indexOf("pdf")>=0)return ".pdf";if(type.indexOf("png")>=0)return ".png";if(type.indexOf("jpeg")>=0||type.indexOf("jpg")>=0)return ".jpg";if(type.indexOf("rfc822")>=0||type.indexOf("eml")>=0)return ".eml";if(type.indexOf("image")>=0)return ".jpg";return "";}
async function handleSharedIntent(){
  var SI=capPlugin("SendIntent");if(!SI||!SI.checkSendIntentReceived)return;
  var res;try{res=await SI.checkSendIntentReceived();}catch(e){return;}
  if(!res||!res.url)return;
  try{
    var rawUrl=decodeURIComponent(res.url);
    var fetchUrl=(CAP&&CAP.convertFileSrc)?CAP.convertFileSrc(rawUrl):rawUrl;
    var resp=await fetch(fetchUrl);
    var blob=await resp.blob();
    var type=res.type||blob.type||"application/octet-stream";
    var base=(res.title||"geteilt").replace(/[^\wäöüÄÖÜß.\-]+/g,"_").slice(0,40)||"geteilt";
    var name=/\.[a-z0-9]{2,4}$/i.test(base)?base:base+shareExt(type);
    var file=new File([blob],name,{type:type});
    try{SI.finish&&SI.finish();}catch(e){}
    if(currentUser&&activeHousehold){go("add");onAddFile(file);}
    else{pendingSharedFile=file;}
  }catch(e){toast(t("Geteilte Datei konnte nicht gelesen werden")+": "+errMsg(e),true);}
}
/* Lokale Erinnerungen 30 und 7 Tage vor dem letzten Kündigungstag planen */
async function scheduleFristNotifications(){
  if(!isNative())return;
  var LN=capPlugin("LocalNotifications");if(!LN)return;
  try{
    var perm=await LN.checkPermissions();
    if(perm.display!=="granted"){perm=await LN.requestPermissions();}
    if(perm.display!=="granted")return;
    try{var pend=await LN.getPending();if(pend&&pend.notifications&&pend.notifications.length){await LN.cancel({notifications:pend.notifications.map(function(n){return {id:n.id};})});}}catch(e){}
    var now=Date.now(),list=[];
    CONTRACTS.forEach(function(c){
      if(c.status!=="aktiv")return;
      var f=fristInfo(c);if(!f.lastDay)return;
      var name=(c.anbieter||"Vertrag")+(c.produkt?" – "+c.produkt:"");
      [[30,0],[7,1]].forEach(function(p){
        var when=daysBeforeDate(f.lastDay,p[0]);
        if(when.getTime()>now+60000){
          list.push({id:hashId(c.id,p[1]),title:"⏰ "+t("Kündigungsfrist"),body:tf("{0}: letzter Kündigungstag am {1} (in {2} Tagen).",name,fmtDate(f.lastDay),p[0]),schedule:{at:when},smallIcon:"ic_stat_icon"});
        }
      });
    });
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){}
}

/* ---------- App-Sperre (PIN + Biometrie) – nur native App ---------- */
var PIN_LEN=4;
var lockMode="verify",lockBuf="",lockFirst="";
function pinStored(){try{return JSON.parse(localStorage.getItem("db_pin")||"null");}catch(e){return null;}}
function pinSet(){return !!pinStored();}
function bioEnabled(){try{return localStorage.getItem("db_bio")==="1";}catch(e){return false;}}
async function sha256hex(s){
  try{var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,"0");}).join("");}
  catch(e){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return "f"+h.toString(16);}
}
async function savePin(pin){var salt=Math.random().toString(36).slice(2)+Date.now();localStorage.setItem("db_pin",JSON.stringify({salt:salt,hash:await sha256hex(salt+"|"+pin)}));}
async function checkPinVal(pin){var st=pinStored();if(!st)return false;return (await sha256hex(st.salt+"|"+pin))===st.hash;}
function removePin(){try{localStorage.removeItem("db_pin");localStorage.removeItem("db_bio");}catch(e){}}
function lockRenderDots(){var el=$("#lockDots");if(!el)return;var h="";for(var i=0;i<PIN_LEN;i++)h+='<span class="lockdot'+(i<lockBuf.length?" on":"")+'"></span>';el.innerHTML=h;el.classList.remove("err");}
function lockBuildKeypad(){
  var el=$("#lockKeypad");if(!el)return;
  var h=["1","2","3","4","5","6","7","8","9"].map(function(k){return '<button class="keybtn" data-key="'+k+'">'+k+'</button>';}).join("");
  h+='<button class="keybtn wide" data-key="C">'+(lockMode==="verify"?"":"Abbr.")+'</button>';
  h+='<button class="keybtn" data-key="0">0</button>';
  h+='<button class="keybtn wide" data-key="B">⌫</button>';
  el.innerHTML=h;
}
function showLock(mode){
  lockMode=mode||"verify";lockBuf="";lockFirst="";
  var ls=$("#lockscreen");if(ls)ls.hidden=false;
  $("#lockTitle").textContent=lockMode==="verify"?t("App entsperren"):(lockMode==="set"?t("Neue PIN festlegen"):t("PIN bestätigen"));
  $("#lockSub").textContent=lockMode==="verify"?t("Bitte gib deine PIN ein."):(lockMode==="set"?t("Wähle eine 4-stellige PIN."):t("Gib die PIN erneut ein."));
  lockBuildKeypad();lockRenderDots();
  var bio=$("#lockBioBtn");if(bio)bio.hidden=!(lockMode==="verify"&&bioEnabled());
  if(lockMode==="verify"&&bioEnabled())tryBiometric();
}
function hideLock(){var ls=$("#lockscreen");if(ls)ls.hidden=true;}
function lockError(msg){var d=$("#lockDots");if(d)d.classList.add("err");var s=$("#lockSub");if(s)s.textContent=msg;lockBuf="";setTimeout(lockRenderDots,340);}
async function lockKey(k){
  if(k==="B"){lockBuf=lockBuf.slice(0,-1);lockRenderDots();return;}
  if(k==="C"){if(lockMode!=="verify")hideLock();return;}
  if(lockBuf.length>=PIN_LEN)return;
  lockBuf+=k;lockRenderDots();
  if(lockBuf.length<PIN_LEN)return;
  var entered=lockBuf;
  if(lockMode==="verify"){
    if(await checkPinVal(entered))hideLock();else lockError(t("Falsche PIN. Bitte erneut."));
  }else if(lockMode==="set"){
    lockFirst=entered;lockBuf="";lockMode="confirm";$("#lockTitle").textContent=t("PIN bestätigen");$("#lockSub").textContent=t("Gib die PIN erneut ein.");lockRenderDots();
  }else{
    if(entered===lockFirst){await savePin(entered);hideLock();toast(t("PIN gespeichert 🔒"));if(activeView==="settings")renderApp();maybeOfferBiometric();}
    else{lockMode="set";lockFirst="";lockError(t("PINs stimmen nicht überein."));}
  }
}
function bioPlugin(){return capPlugin("BiometricAuth")||capPlugin("NativeBiometric");}
async function bioAvailable(){
  var B=bioPlugin();if(!B)return false;
  try{
    if(B.checkBiometry){var r=await B.checkBiometry();return !!(r&&(r.isAvailable||r.biometryType));}
    if(B.isAvailable){var r2=await B.isAvailable();return !!(r2&&r2.isAvailable);}
  }catch(e){}

}
async function tryBiometric(){

    if(B.authenticate){await B.authenticate({reason:"Dokumenten-Butler entsperren",cancelTitle:"PIN verwenden",androidTitle:"Entsperren",androidSubtitle:"Fingerabdruck oder Gesicht"});hideLock();return;}

/* Dokument teilen: nativ per Web Share API (mit Datei), sonst signierte Ansehen-URL */
async function shareDoc(docId){
  var d=DOCS.find(function(x){return x.id===docId;});if(!d)return;
  toast(t("Wird zum Teilen vorbereitet …"));
  try{
    var canFiles=false;
    try{
      var dl=await sb.storage.from(BUCKET).download(d.storage_path);
      if(!dl.error&&dl.data){
        var file=new File([dl.data],d.filename||"dokument",{type:d.mime_type||dl.data.type||"application/octet-stream"});
        if(navigator.canShare&&navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:d.filename||"Dokument"});
          canFiles=true;
        }
      }
    }catch(e){if(e&&e.name==="AbortError")return;}
    if(canFiles)return;
    /* Fallback: signierte Ansehen-URL (7 Tage) teilen/kopieren */
    var su=await sb.storage.from(BUCKET).createSignedUrl(d.storage_path,604800);
    if(su.error)throw su.error;
    var url=su.data.signedUrl;
    if(navigator.share){try{await navigator.share({title:d.filename||"Dokument",url:url});return;}catch(e){if(e&&e.name==="AbortError")return;}}
    try{await navigator.clipboard.writeText(url);toast(t("Link kopiert (7 Tage gültig) ✅"));}
    catch(e){window.open(url,"_blank");}
  }catch(e){toast(t("Teilen fehlgeschlagen")+": "+errMsg(e),true);}
}

function gsHide(){var b=$("#gResults");if(b){b.hidden=true;b.innerHTML="";}}
function gsRun(){
  var inp=$("#gSearch"),box=$("#gResults");if(!inp||!box)return;
  var q=(inp.value||"").trim().toLowerCase();
  if(!currentUser||q.length<2){gsHide();return;}
  function hit(s){return String(s||"").toLowerCase().indexOf(q)>=0;}
  var vc=[],vd=[],vm=[],vp=[];
  CONTRACTS.forEach(function(c){
    var k=katInfo(c.kategorie);
    if(hit(c.anbieter)||hit(c.produkt)||hit(c.kundennummer)||hit(c.vertragsnummer)||hit(c.notizen)||hit(k.label))
      vc.push({icon:k.icon,t:(c.anbieter||"?")+(c.produkt?" · "+c.produkt:""),s:k.label+(c.kosten!=null?" · "+fmtEur(c.kosten)+" / "+ivLabel(c.kosten_intervall):"")+(c.status!=="aktiv"?" · "+c.status:""),type:"contract",id:c.id});
  });
  DOCS.forEach(function(d){
    var e=d.extracted||{};
    if(hit(d.titel)||hit(d.filename)||hit(d.zusammenfassung)||hit(d.arzt)||hit(d.note)||hit(e.anbieter)||hit(e.kundennummer)||hit(e.vertragsnummer)||hit(e.behandlung)){
      if(isMed(d))vm.push({icon:fachInfo(d.fachrichtung||"sonstiges").icon,t:d.titel||d.arzt||fachInfo(d.fachrichtung||"sonstiges").label,s:medTypInfo(d.med_typ).label+" · "+fmtDate(d.behandlungsdatum||d.doc_date||String(d.created_at).slice(0,10))+(d.betrag!=null?" · "+fmtEur(d.betrag):""),type:"med",id:d.id});
      else vd.push({icon:dtInfo(d.doc_type).icon,t:docTitle(d),s:dtInfo(d.doc_type).label+" · "+fmtDate(d.doc_date||String(d.created_at).slice(0,10)),type:"doc",id:d.id});
    }
  });
  PERSONS.forEach(function(p){if(hit(p.name))vp.push({icon:"👤",t:p.name,s:t("Person – tippen zum Filtern"),type:"person",id:p.id});});
  function grp(label,arr){
    if(!arr.length)return "";
    return '<div class="grhead">'+label+'</div>'+arr.slice(0,5).map(function(r){
      return '<button class="grow" data-gres="'+r.type+'" data-id="'+r.id+'"><span class="gric">'+r.icon+'</span><div><div class="grt">'+escapeHtml(r.t)+'</div><div class="grs">'+escapeHtml(r.s)+'</div></div></button>';
    }).join("");
  }
  var html=grp("📑 Verträge",vc)+grp("📁 Dokumente",vd)+grp("🩺 Gesundheit",vm)+grp("👥 Personen",vp);
  box.innerHTML=html||'<div class="grempty">'+tf("Nichts gefunden für „{0}“.",escapeHtml(q))+'</div>';
  box.hidden=false;
}

/* ---------- Events ---------- */
function onAppClick(e){
  var nav=e.target.closest("[data-nav]");
  if(nav){if(nav.dataset.nav==="add"){reviewDoc=null;importResults=[];uploadTarget=null;}go(nav.dataset.nav);return;}
  /* Kategorie auf-/zugeklappt: Zustand merken, damit ein Re-Render ihn nicht verwirft */
  var sm=e.target.closest(".katsum");
  if(sm&&sm.parentNode&&sm.parentNode.dataset){var kk=sm.parentNode.dataset.kat;if(kk)katOpen[kk]=!sm.parentNode.open;}
  var b=e.target.closest("[data-action]");if(!b)return;
  var act=b.dataset.action,id=b.dataset.id;
  if(act==="open-contract"){closeModal();detailId=id;activeView="contract-detail";renderApp();window.scrollTo({top:0,behavior:"smooth"});ensureContractLang(id).then(function(ok){if(ok&&activeView==="contract-detail")renderApp();});}
  else if(act==="new-contract"){editId=null;formPrefill=null;pendingDoc=null;formPerson=activePerson||"";activeView="contract-form";renderApp();}
  else if(act==="edit-contract"){editId=id;formPrefill=null;activeView="contract-form";renderApp();}
  else if(act==="save-contract")onSaveContract();
  else if(act==="del-contract")deleteContract(id);
  else if(act==="mark-cancelled")setContractStatus(id,"gekuendigt");
  else if(act==="mark-active")setContractStatus(id,"aktiv");
  else if(act==="ics"){var c=contractById(id);if(c)icsDownload(c);}
  else if(act==="doc-view")viewDoc(id);
  else if(act==="doc-share")shareDoc(id);
  else if(act==="reanalyze-doc")reanalyzeDoc(id);
  else if(act==="reanalyze-all")reanalyzeAllPending();
  else if(act==="doc-del"){closeModal();deleteDoc(id);}
  else if(act==="doc-link")openLinkPicker(id);
  else if(act==="doc-open")openDocDetail(id);
  else if(act==="doc-edit")openDocEdit(id);
  else if(act==="doc-edit-save")saveDocEdit(id);

function onAppChange(e){
  if(e.target.classList&&e.target.classList.contains("todopers")){assignDocPerson(e.target.dataset.id,e.target.value);return;}
  if(e.target.id==="cf_kategorie"){
    /* Kategorie gewechselt → passende Zusatzfelder zeigen (eingegebene Werte mitnehmen) */
    var box=$("#cfDetails");
    if(box){var kept=collectDetailInputs();box.innerHTML=detailFormHtml(e.target.value||"sonstiges",kept);}
    updateFormPreview();return;
  }
  if(e.target.id&&e.target.id.indexOf("cf_")===0){updateFormPreview();return;}
  if(e.target.id==="fileCam"||e.target.id==="filePick"){
    var files=Array.prototype.slice.call(e.target.files||[]);e.target.value="";
    if(files.length)processFiles(files);
  }
  else if(e.target.id==="df_kat"){docFilter.kat=e.target.value;renderApp();}
  else if(e.target.id==="df_typ"){docFilter.typ=e.target.value;renderApp();}
  else if(e.target.id==="df_jahr"){docFilter.jahr=e.target.value;renderApp();}
  else if(e.target.id==="df_sort"){docFilter.sort=e.target.value;renderApp();}
  else if(e.target.id==="mf_fach"){medFilter.fach=e.target.value;renderApp();}
  else if(e.target.id==="mf_typ"){medFilter.typ=e.target.value;renderApp();}
  else if(e.target.id==="mf_arzt"){medFilter.arzt=e.target.value;renderApp();}
  else if(e.target.id==="mf_jahr"){medFilter.jahr=e.target.value;renderApp();}
  else if(e.target.id==="mf_sort"){medFilter.sort=e.target.value;renderApp();}
  else if(e.target.id==="bioToggle"){toggleBiometric(e.target.checked);}
  else if(e.target.id==="ai_fuser"){aiFilter.user=e.target.value;renderApp();}
  else if(e.target.id==="ai_fmonth"){aiFilter.month=e.target.value;renderApp();}
  else if(e.target.id==="personSel"){activePerson=e.target.value||"";renderApp();}
}
function onAppInput(e){
  if(e.target.id&&e.target.id.indexOf("cf_")===0){updateFormPreview();return;}
  if(e.target.id==="df_q"){docFilter.q=e.target.value;
    clearTimeout(onAppInput._t);onAppInput._t=setTimeout(function(){var el=$("#df_q");var pos=el?el.selectionStart:0;renderApp();var el2=$("#df_q");if(el2){el2.focus();el2.setSelectionRange(pos,pos);}},350);return;}
  if(e.target.id==="ai_q"){aiFilter.q=e.target.value;
    clearTimeout(onAppInput._a);onAppInput._a=setTimeout(function(){var el=$("#ai_q");var pos=el?el.selectionStart:0;renderApp();var el2=$("#ai_q");if(el2){el2.focus();try{el2.setSelectionRange(pos,pos);}catch(_e){}}},350);}
}

/* Wisch-Gesten auf Dokumentzeilen (delegiert, nur Touch). Wischen deckt die
   Aktions-Buttons auf – ausgelöst wird ausschließlich per Tippen. Vertikales
   Scrollen wird nie blockiert (passive Listener, horizontale Dominanz-Schwelle). */
function initSwipe(app){
  var st=null;
  app.addEventListener("touchstart",function(e){
    var row=e.target.closest(".swrow");
    var open=app.querySelector(".swrow.swiped");
    if(open&&open!==row)open.classList.remove("swiped");
    if(!row){st=null;return;}
    var tc=e.touches[0];
    st={row:row,front:row.querySelector(".swipefront"),x0:tc.clientX,y0:tc.clientY,dx:0,decided:false,horiz:false,wasOpen:row.classList.contains("swiped")};
    if(!st.front){st=null;return;}
  },{passive:true});
  app.addEventListener("touchmove",function(e){
    if(!st)return;
    var tc=e.touches[0],dx=tc.clientX-st.x0,dy=tc.clientY-st.y0;
    if(!st.decided){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      st.decided=true;st.horiz=Math.abs(dx)>Math.abs(dy)+4;
      if(st.horiz)st.front.style.transition="none";else{st=null;return;}
    }
    if(!st.horiz)return;
    st.dx=dx;
    var x=Math.max(-136,Math.min(0,(st.wasOpen?-136:0)+dx));
    st.front.style.transform="translateX("+x+"px)";
  },{passive:true});
  function endSwipe(){
    if(!st)return;var s=st;st=null;
    if(!s.horiz)return;
    s.front.style.transition="";s.front.style.transform="";
    s.row.classList.toggle("swiped",((s.wasOpen?-136:0)+s.dx)<-50);
  }
  app.addEventListener("touchend",endSwipe,{passive:true});
  app.addEventListener("touchcancel",endSwipe,{passive:true});
}
/* ---------- Init ---------- */
function init(){
  var saved="";try{saved=localStorage.getItem("dbTheme")||"";}catch(e){}
  if(!saved)saved=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  applyTheme(saved==="dark");
  var kb=$("#kontoBtn");if(kb)kb.addEventListener("click",function(){go("settings");});
  var app=$("#app");
  app.addEventListener("click",onAppClick);
  app.addEventListener("change",onAppChange);
  app.addEventListener("input",onAppInput);
  initSwipe(app);
  /* Modal-Dialoge */
  var mbx=$("#modalBox");
  if(mbx){
    mbx.addEventListener("click",onAppClick);
    mbx.addEventListener("change",onAppChange);
    mbx.addEventListener("input",onAppInput);
    mbx.addEventListener("keydown",function(e){
      if(e.key!=="Enter"||!e.target)return;
      if(e.target.id==="mq_input"){var ok=mbx.querySelector('[data-action="mq-ok"]');if(ok)ok.click();}
      else if(e.target.id==="pp_new"){var pn=mbx.querySelector('[data-action="pick-person-new"]');if(pn)pn.click();}
    });
  }
  var mwrap=$("#modal");if(mwrap)mwrap.addEventListener("click",function(e){if(e.target===mwrap)closeModal();});
  /* Globale Suche */
  var gs=$("#gSearch");
  if(gs){
    gs.addEventListener("input",function(){clearTimeout(gsRun._t);gsRun._t=setTimeout(gsRun,180);});
    gs.addEventListener("focus",gsRun);
    gs.addEventListener("keydown",function(e){if(e.key==="Escape"){gs.value="";gsHide();gs.blur();}});
  }
  var gr=$("#gResults");if(gr)gr.addEventListener("click",function(e){var b=e.target.closest("[data-gres]");if(b)gsOpen(b.dataset.gres,b.dataset.id);});
  document.addEventListener("click",function(e){if(!e.target.closest(".gsearch"))gsHide();});
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")refreshIfStale();});
  /* Zurück-Geste / Browser-Zurück: erst Dialog/Suche schließen, sonst zur vorherigen Ansicht */
  window.addEventListener("popstate",function(){
    if(document.body.classList.contains("app-hidden"))return; /* nicht eingeloggt */
    var mw=$("#modal");if(mw&&!mw.hidden){closeModal();try{history.pushState({b:1},"");}catch(e){}return;}
    var gr=$("#gResults");if(gr&&!gr.hidden){gsHide();try{history.pushState({b:1},"");}catch(e){}return;}
    if(navHistory.length){navRestore(navHistory.pop());return;}
    /* nichts mehr im Verlauf: im Web verlässt der nächste Zurück-Schritt die Seite */
  });
  document.addEventListener("keydown",function(e){
    if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();var g=$("#gSearch");if(g)g.focus();}
    else if(e.key==="Escape"){var mw=$("#modal");if(mw&&!mw.hidden)closeModal();}
  });
  function onNav(e){var b=e.target.closest("[data-nav]");if(b){if(b.dataset.nav==="add"){reviewDoc=null;importResults=[];uploadTarget=null;}go(b.dataset.nav);}}
  var tbs=$("#tabs");if(tbs)tbs.addEventListener("click",onNav);
  var tf=$("#tabsFoot");if(tf)tf.addEventListener("click",onNav);
  var tm=$("#tabsMobile");if(tm)tm.addEventListener("click",onNav);
  $("#auth_login").addEventListener("click",doLogin);
  $("#auth_signup").addEventListener("click",doSignup);
  $("#auth_forgot").addEventListener("click",doForgot);
  $("#auth_setpass").addEventListener("click",doSetPassword);
  $("#auth_pass").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
  sb.auth.onAuthStateChange(function(event,session){
    if(event==="PASSWORD_RECOVERY"){enterRecovery(session);return;}
    if(pendingRecovery&&session){enterRecovery(session);return;}
    handleSession(session);
  });
  sb.auth.getSession().then(function(r){
    var session=r&&r.data?r.data.session:null;
    if(pendingRecovery&&session){enterRecovery(session);return;}
    handleSession(session);
  });
  var kp=$("#lockKeypad");if(kp)kp.addEventListener("click",function(e){var b=e.target.closest("[data-key]");if(b)lockKey(b.dataset.key);});
  var bb=$("#lockBioBtn");if(bb)bb.addEventListener("click",tryBiometric);
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
  try{nativeInit();}catch(e){}
}
window.addEventListener("error",function(e){logError("js",(e&&e.message?e.message:"Skriptfehler")+(e&&e.lineno?" @Zeile "+e.lineno:""));});
window.addEventListener("unhandledrejection",function(e){var rr=e&&e.reason;logError("js-promise",(rr&&(rr.message||String(rr)))||"unbekannt");});
document.addEventListener("DOMContentLoaded",init);
})();
</script>
