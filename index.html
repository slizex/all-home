<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#6366f1">
<title>Dokumenten-Butler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Butler">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== Dokumenten-Butler — Clean / Minimal (Tracker-Designsprache: Zink-Palette, ein Indigo-Akzent) ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
 --bg:#fafafa;--panel:#ffffff;--panel2:#f4f4f5;
 --fg:#09090b;--muted:#71717a;--muted2:#a1a1aa;
 --border:#e7e7ea;--border2:#d4d4d8;
 --accent:#6366f1;--accent-fg:#ffffff;--gold:#b45309;
 --grad:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#000));
 --pos:#16a34a;--warn:#d97706;--neg:#dc2626;
 --radius:12px;--radius-sm:8px;
 --shadow-sm:0 1px 2px rgba(9,9,11,.05);
 --shadow:0 1px 3px rgba(9,9,11,.09),0 1px 2px rgba(9,9,11,.04);
 --shadow-lg:0 12px 34px -14px rgba(9,9,11,.30);
 --sidebar-w:248px;
}
body.dark{
 --bg:#09090b;--panel:#131316;--panel2:#1d1d20;
 --fg:#fafafa;--muted:#a1a1aa;--muted2:#71717a;
 --border:#27272a;--border2:#3f3f46;
 --accent:#818cf8;--gold:#fbbf24;
 --shadow-sm:0 1px 2px rgba(0,0,0,.4);
 --shadow:0 1px 3px rgba(0,0,0,.5);
 --shadow-lg:0 14px 36px -14px rgba(0,0,0,.7);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.012em}
a{color:var(--accent);text-decoration:none}
::selection{background:color-mix(in srgb,var(--accent) 26%,transparent)}
.muted{color:var(--muted)}.pos{color:var(--pos)}.neg{color:var(--neg)}

/* ---- Shell ---- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;font-weight:700;font-size:1.05rem;letter-spacing:-.02em}
.blogo{width:32px;height:32px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;font-size:1.05rem}
.nav{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;border:none;background:none;color:var(--muted);font:inherit;font-weight:500;font-size:.92rem;cursor:pointer;text-align:left;width:100%;transition:background .12s,color .12s}
.tab .tcon{width:18px;height:18px;flex:none;display:grid;place-items:center;font-size:1rem}
.tab:hover{background:var(--panel2);color:var(--fg)}
.tab.active{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--border)}
.content{min-width:0;display:flex;flex-direction:column}
.topbar2{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:20}
.pagetitle{font-size:1.02rem;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;flex:none;white-space:nowrap}
.topactions{display:flex;align-items:center;gap:10px;flex:none}
/* globale Suche */
.gsearch{position:relative;flex:1;min-width:0;max-width:460px;margin-left:auto}
.gsearch input[type=text]{width:100%;padding:9px 14px 9px 40px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--fg);font:inherit;font-size:.9rem}
.gsearch input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.gsico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.9rem;pointer-events:none;opacity:.7}
.gresults{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);max-height:min(480px,65vh);overflow-y:auto;z-index:60;padding:6px}
.grhead{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);padding:8px 10px 3px}
.grow{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:none;border-radius:10px;background:none;color:var(--fg);font:inherit;cursor:pointer;text-align:left}
.grow:hover,.grow.sel{background:var(--panel2)}
.grow .gric{width:32px;height:32px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-size:1rem;flex:none}
.grow .grt{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .grs{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow>div{min-width:0;flex:1}
.grempty{padding:14px 12px;color:var(--muted);font-size:.88rem}
main{padding:26px 24px 90px;width:100%;max-width:1060px;margin:0 auto}
.iconchip{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;min-width:36px;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--fg);cursor:pointer;font:inherit;font-weight:500;font-size:.85rem}
.iconchip:hover{background:var(--panel2)}
.bottomnav{display:none}

/* ---- Cards ---- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:0 0 16px;box-shadow:var(--shadow-sm)}
.sect{font-size:1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}

/* ---- Buttons / Forms ---- */
button.primary{background:var(--accent);color:var(--accent-fg);border:none;border-radius:var(--radius-sm);padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;transition:filter .12s,transform .06s}
button.primary:hover{filter:brightness(1.07)}
button.primary:active{transform:translateY(1px)}
button.ghost{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 16px;font:inherit;font-weight:500;color:var(--fg);cursor:pointer}
button.ghost:hover{background:var(--panel2)}
button.danger{background:none;border:1px solid color-mix(in srgb,var(--neg) 40%,transparent);color:var(--neg);border-radius:var(--radius-sm);padding:9px 14px;font:inherit;font-weight:500;cursor:pointer}
.linkbtn{background:none;border:none;color:var(--accent);font:inherit;font-weight:500;cursor:pointer;padding:0;display:block}
label.f{display:block;font-size:.83rem;font-weight:600;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel);color:var(--fg);font:inherit;font-size:.95rem;transition:border-color .12s,box-shadow .12s}
input::placeholder,textarea::placeholder{color:var(--muted2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
textarea{min-height:74px;resize:vertical}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:560px){.formrow{grid-template-columns:1fr}}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* ---- Dashboard ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
@media(max-width:680px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm)}
.kpi .klabel{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .kval{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .ksub{font-size:.8rem;color:var(--muted2)}
.kpiclick{cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .08s}
.kpiclick:hover{border-color:var(--border2);box-shadow:var(--shadow);transform:translateY(-1px)}
.kpiclick:active{transform:translateY(0)}
.bigadd{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border:2px dashed var(--border2);border-radius:var(--radius);background:none;color:var(--muted);font:inherit;font-weight:600;font-size:1rem;cursor:pointer;margin-bottom:16px}
.bigadd:hover{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.nextact{display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--accent) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--radius);padding:14px 16px;margin:0 0 16px;box-shadow:var(--shadow-sm)}
.nextact .naicon{font-size:1.6rem;flex:none}
.nextact .natxt{flex:1;min-width:0;font-size:.95rem}
.nextact .nalabel{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:2px}
.nextact button{flex:none}
@media(max-width:560px){.nextact{flex-wrap:wrap}.nextact button{width:100%}}

/* ---- Fristen / Ampel ---- */
.frow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border)}
.frow:last-child{border-bottom:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.red{background:var(--neg);box-shadow:0 0 0 4px color-mix(in srgb,var(--neg) 18%,transparent)}
.dot.amber{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 18%,transparent)}
.dot.green{background:var(--pos)}
.dot.gray{background:var(--muted2)}
.fmain{flex:1;min-width:0;cursor:pointer}
.ftitle{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsub{font-size:.83rem;color:var(--muted)}
.fsub b{color:var(--fg)}
.fact{display:flex;gap:6px;flex:none}

/* ---- Verträge ---- */
.clist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.clist{grid-template-columns:1fr}}
.ccard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s,transform .08s}
.ccard:hover{border-color:var(--border2);box-shadow:var(--shadow);transform:translateY(-1px)}
.chead{display:flex;align-items:center;gap:10px}
.cicon{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:1.15rem;flex:none}
.cname{font-weight:650;font-size:.97rem;line-height:1.25}
.csub{font-size:.8rem;color:var(--muted)}
.cmeta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.85rem}
.ccost{font-weight:650}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600}
.badge.red{background:color-mix(in srgb,var(--neg) 13%,transparent);color:var(--neg)}
.badge.amber{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.badge.green{background:color-mix(in srgb,var(--pos) 12%,transparent);color:var(--pos)}
.badge.gray{background:var(--panel2);color:var(--muted)}
.badge.law{background:color-mix(in srgb,var(--accent) 11%,transparent);color:var(--accent)}
.dgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:.92rem;margin:10px 0}
.dgrid .dk{color:var(--muted);white-space:nowrap}
.dgrid .dv{font-weight:550;overflow-wrap:anywhere}

/* ---- Dokumente ---- */
.docrow{display:flex;gap:12px;padding:13px 8px;border-bottom:1px solid var(--border);align-items:flex-start;border-radius:10px;transition:background .1s}
.docrow:hover{background:var(--panel2)}
.docrow:last-child{border-bottom:none}
.dbody{cursor:pointer}
.dicon{width:36px;height:36px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-size:1.05rem;flex:none;margin-top:2px}
.dbody{flex:1;min-width:0}
.dname{font-weight:600;font-size:.92rem;overflow-wrap:anywhere}
.dsum{font-size:.85rem;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dmeta{font-size:.78rem;color:var(--muted2);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dact{display:flex;flex-direction:column;gap:6px;flex:none}
.dact button{font-size:.8rem;padding:6px 10px}
.rowgo{align-self:center;color:var(--muted2);font-size:1.35rem;padding:0 6px;flex:none}
/* Wisch-Aktionen: Wischen deckt Buttons auf, Aktion erst per Tippen */
.swrow{position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
.swrow:last-child{border-bottom:none}
.swrow .swipefront{display:flex;gap:12px;align-items:flex-start;padding:13px 8px;background:var(--panel);position:relative;z-index:1;transition:transform .18s ease}
.swrow:hover .swipefront{background:var(--panel2)}
.swrow.swiped .swipefront{transform:translateX(-136px)}
.swipeactions{position:absolute;top:0;right:0;bottom:0;display:flex;z-index:0}
.swipeactions button{border:none;width:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:.7rem;font-weight:600;color:#fff;cursor:pointer}
.swipeactions button span{font-size:.66rem}
.swipeactions .sa-share{background:var(--accent)}
.swipeactions .sa-assign{background:#0e7490}
.filterbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filterbar select,.filterbar input{width:auto;flex:1;min-width:130px}

/* ---- Upload / KI ---- */
.upzone{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.upzone{grid-template-columns:1fr}}
.upbtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 14px;border:2px dashed var(--border2);border-radius:var(--radius);background:none;color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.upbtn:hover{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.upbtn .uic{font-size:1.9rem}
.upbtn .usub{font-size:.8rem;font-weight:400;color:var(--muted)}
.aiwork{display:flex;align-items:center;gap:12px;padding:14px}
.spin{width:22px;height:22px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.ainote{background:color-mix(in srgb,var(--accent) 7%,transparent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:var(--radius-sm);padding:12px 14px;font-size:.9rem;margin:12px 0}
.wichtig{margin:8px 0 0;padding-left:20px;font-size:.9rem}
.wichtig li{margin:3px 0}

/* ---- Personen / Mandanten ---- */
.personbar{display:flex;align-items:center;gap:8px;padding:2px 0 12px;margin:0 0 4px}
.pseldot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 6%,transparent)}
.personsel{width:auto;max-width:280px;font-weight:600;padding:9px 12px}
/* To-Do: kompakte Schnellzuweisung je Zeile */
.todopers{width:auto;min-width:120px;font-size:.82rem;padding:6px 8px}
.pchip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--border);border-radius:99px;background:var(--panel);color:var(--fg);font:inherit;font-size:.85rem;font-weight:500;cursor:pointer;white-space:nowrap}
.pchip:hover{background:var(--panel2)}
.pchip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
.pdot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--muted2)}
.pbadge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--panel2);color:var(--fg)}
.pbadge .pdot{width:8px;height:8px}
.personmgr{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:9px}
.prow .pname{flex:1;font-weight:600;display:flex;align-items:center;gap:8px}
.prow button{flex:none;font-size:.8rem;padding:5px 10px}

/* ---- Rechnungs-Verlauf ---- */
.invrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);font-size:.9rem}
.invrow:last-child{border-bottom:none}
.invp{flex:1;min-width:0}
.invper{font-weight:600}
.invd{font-size:.8rem;color:var(--muted)}
.invb{flex:none;font-weight:650;text-align:right}
.invdelta{font-size:.78rem;font-weight:600;margin-left:8px}
.invdelta.up{color:var(--neg)}.invdelta.down{color:var(--pos)}.invdelta.same{color:var(--muted2)}
.invmini{display:flex;align-items:flex-end;gap:3px;height:34px;margin:6px 0 2px}
.yearcmp{margin:4px 0 10px;padding:4px 0;border-bottom:1px solid var(--border)}
.yrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.9rem;flex-wrap:wrap}
.yrow:last-child{border-bottom:none}
.yrow b{flex:none;min-width:3.4em}
.yrow>span:not(.invdelta){color:var(--muted)}
.yrow .invdelta{margin-left:auto}
.invmini .imb{flex:1;background:color-mix(in srgb,var(--accent) 40%,transparent);border-radius:2px 2px 0 0;min-height:3px}

/* ---- Gesundheit ---- */
.medgroup{margin:0 0 18px}
.medghead{display:flex;align-items:center;gap:9px;font-weight:650;font-size:.98rem;margin:0 0 8px;padding:0 2px}
.medghead .fcount{color:var(--muted);font-weight:500;font-size:.82rem}
.badge.fach{background:color-mix(in srgb,#0891b2 14%,transparent);color:#0e7490}
body.dark .badge.fach{color:#67e8f9}
.medfilter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.medfilter select{width:auto;flex:1;min-width:150px}
.behnote{font-size:.85rem;color:var(--muted);margin-top:2px;font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---- Butler-Tipps / Kosten-Aufschlüsselung ---- */
.tiprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);font-size:.9rem}
.tipacts{display:flex;align-items:center;gap:6px;flex:none}
.tipx{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:6px;border-radius:8px}
.tipx:hover{background:var(--panel2);color:var(--fg)}
.tiprow:last-child{border-bottom:none}
.tiprow button{flex:none;font-size:.8rem;padding:6px 10px}
.kcat{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:.88rem}
.kcat .kcl{width:170px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.kcat .kcl{width:120px}}
.kbarw{flex:1;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.kbar{display:block;height:100%;background:var(--accent);border-radius:99px}
.kcv{flex:none;min-width:82px;text-align:right;font-weight:600}

/* ---- Einstellungen / Haushalt ---- */
/* Hauptkategorien-Übersicht: aufklappbare Kategoriezeile mit Anbietern darin */
.katgrp{border:1px solid var(--border);border-radius:12px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.katgrp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 14px}
.katgrp>summary::-webkit-details-marker{display:none}
.katgrp>summary:hover{background:var(--panel2)}
.katic{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:1.15rem;flex:none}
.katname{display:block;font-weight:650;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  }
  if(!c.vertragsstart||ml==null){
    return {kind:"unbekannt",level:"gray",label:"Fristen unbekannt",sub:"Vertragsbeginn/Laufzeit ergänzen, dann rechnet der Butler.",neuesRecht:false};
  }
  if(kf==null)kf=1;
  var initialEnd=addMonthsISO(c.vertragsstart,ml);
  var lastDay=addMonthsISO(initialEnd,-kf);
  var today=todayISO();
  if(today<=lastDay){
    var days=daysUntil(lastDay);
    return {kind:"fest",level:ampel(days),end:initialEnd,lastDay:lastDay,days:days,
      label:"Kündbar zum "+fmtDate(initialEnd),
      sub:"Letzter Kündigungstag: "+fmtDate(lastDay)+" (in "+days+" Tagen)",neuesRecht:false};
  }
  /* Erstlaufzeit(-Fenster) vorbei → Verlängerungsphase */
  var effVl=neu?1:(vl==null?12:vl);
  var effKf=neu?Math.min(kf,1):kf;
  if(effVl<=1){
    return {kind:"flex",level:"green",label:"Jederzeit kündbar",sub:"Kündigungsfrist "+fristTxt(effKf)+(neu?" · nach neuem Recht (ab 3/2022) monatlich kündbar":""),neuesRecht:neu};
  }
  var end=initialEnd,guard=0;
  while(addMonthsISO(end,-effKf)<today&&guard<600){end=addMonthsISO(end,effVl);guard++;}
  var ld=addMonthsISO(end,-effKf),dy=daysUntil(ld);
  return {kind:"fest",level:ampel(dy),end:end,lastDay:ld,days:dy,
    label:"Kündbar zum "+fmtDate(end),
    sub:"Letzter Kündigungstag: "+fmtDate(ld)+" (in "+dy+" Tagen) · Altvertrag: verlängert sich um "+effVl+" Monate",neuesRecht:false};
}
function ampel(days){return days<=30?"red":(days<=90?"amber":"green");}
function fristTxt(m){if(m==null)return "unbekannt";if(m===0.5)return "2 Wochen";if(m===1)return "1 Monat";if(m<1)return Math.round(m*30)+" Tage";return m+" Monate";}
function monatskosten(c){
  if(c.kosten==null||c.status!=="aktiv")return 0;
  var m=INTERVALL[c.kosten_intervall];
  if(!m)return 0; /* einmalig/unbekannt zählt nicht laufend */
  return Number(c.kosten)/m;
}

async function loadFromDB(light){
  if(!activeHousehold){CONTRACTS=[];DOCS=[];PERSONS=[];AIUSAGE=[];return;}
  /* alle Tabellen parallel laden (eine Runde statt vier). light=true überspringt das
     Verbrauchsprotokoll – im Batch-Import (autoFileDoc) wird es nicht gebraucht. */
  var q=[
    sb.from("persons").select("*").eq("household_id",activeHousehold).order("created_at",{ascending:true}),
    sb.from("contracts").select("*").eq("household_id",activeHousehold).order("created_at",{ascending:false}),
    sb.from("documents").select("*").eq("household_id",activeHousehold).order("created_at",{ascending:false})
  ];
  if(!light)q.push(sb.from("ai_usage").select("*").eq("household_id",activeHousehold).order("created_at",{ascending:false}).limit(300));
  var res=await Promise.all(q);
  PERSONS=(res[0]&&!res[0].error&&res[0].data)?res[0].data:[];

}

var ALLOWED_IMG={"image/jpeg":1,"image/png":1,"image/webp":1,"image/gif":1};
function compressImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=1800,w=img.naturalWidth,h=img.naturalHeight;
      var sc=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement("canvas");cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){if(b)res(b);else rej(new Error("Bild konnte nicht verarbeitet werden."));},"image/jpeg",0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("Bildformat wird nicht unterstützt. Bitte JPG/PNG oder PDF verwenden."));};
    img.src=url;
  });
}
function isEmlFile(file){return file.type==="message/rfc822"||/\.eml$/i.test(file.name||"");}
var importResults=[],importBusy=false,importCancel=false,importTotal=0,importDone=0,kiGuthabenHit=false;
/* Edge-Funktion aufrufen und Guthaben-/Fehlercode sauber herausziehen (auch bei 402/429) */
async function edgeExtract(reqBody){
  var r=await sb.functions.invoke(EDGE_FN,{body:reqBody});
  if(r.error){
    var code=null,msg=null;
    try{if(r.error.context&&typeof r.error.context.json==="function"){var jb=await r.error.context.json();if(jb){code=jb.code||null;msg=jb.error||null;}}}catch(e){}
    var err=new Error(msg||errMsg(r.error));err.code=code;throw err;
  }
  var body=r.data||{};
  if(body.error){var e2=new Error(body.error);e2.code=body.code||null;throw e2;}
  return body;
}
/* KI-Analyse für ein gespeichertes Dokument nachholen (z. B. nachdem Guthaben wieder da ist) */
async function applyExtractToDoc(docId,ext,body){
  var d=DOCS.find(function(x){return x.id===docId;});
  var pm=(ext&&ext.vertragspartner)?matchPerson(ext.vertragspartner):null;
  var upd={extracted:ext,doc_type:(ext&&DOCTYPE[ext.docType])?ext.docType:"sonstiges",doc_date:(ext&&ext.datum)||null,zusammenfassung:(ext&&ext.zusammenfassung)||null,titel:extTitle(ext,d),ki_pending:false};
  if(pm)upd.person_id=pm.id;
  if(ext&&ext.istMedizin){
    upd.bereich="medizin";
    upd.fachrichtung=(ext.fachrichtung&&FACH[ext.fachrichtung])?ext.fachrichtung:"sonstiges";
    upd.arzt=ext.arzt||null;
    upd.med_typ=(ext.medTyp&&MEDTYP[ext.medTyp])?ext.medTyp:(ext.docType==="rechnung"?"rechnung":"sonstiges");
    upd.betrag=(ext.betrag!=null?Number(ext.betrag):null);
    upd.behandlungsdatum=ext.datum||null;
  }
  await sb.from("documents").update(upd).eq("id",docId);
  if(body){try{await sb.from("ai_usage").insert({household_id:activeHousehold,user_email:(currentUser&&currentUser.email)||null,model:body.modell||null,input_tokens:(body.usage&&typeof body.usage.input==="number")?body.usage.input:null,output_tokens:(body.usage&&typeof body.usage.output==="number")?body.usage.output:null,filename:(d&&d.filename)||"Nachanalyse"});}catch(e){}}
  await autoFileDoc(docId,ext);
}

/* Mehrere Dateien nacheinander automatisch einlesen + einsortieren */
async function processFiles(files){
  files=Array.prototype.slice.call(files||[]).filter(Boolean);
  if(!files.length)return;
  if(!currentUser){pendingSharedFile=files[0];return;}
  if(!activeHousehold){toast("Kein Haushalt aktiv.",true);return;}

  importResults=[];importBusy=true;importCancel=false;kiGuthabenHit=false;reviewDoc=null;activeView="add";renderApp();
  var n=files.length;importTotal=n;importDone=0;
  for(var i=0;i<n;i++){
    if(importCancel)break;
    importDone=i;
    showAiWork(n>1?("🎩 Dokument "+(i+1)+" von "+n+" wird gelesen …"):"🎩 Der Butler liest das Dokument … (ca. 10–30 Sek.)");
    try{await prepareAndIngest(files[i]);}
    catch(e){importResults.push({name:(files[i].name||"Datei"),icon:"⚠️",text:errMsg(e),view:null});}
  }

  else if(importResults.length)toast(importResults.length+(importResults.length===1?" Dokument":" Dokumente")+" eingelesen ✅");

async function prepareAndIngest(file){
  if(isEmlFile(file))return prepareEmail(file);
  var isPdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name||"");
  if(!isPdf&&!ALLOWED_IMG[file.type]&&!/^image\//.test(file.type))throw new Error("Format nicht unterstützt (nur PDF, Foto oder .eml)");
  if(isPdf&&file.size>12*1024*1024)throw new Error("PDF größer als 12 MB");
  var blob=file,mime=file.type||"application/pdf",fname=file.name||("scan-"+Date.now()+".jpg");
  if(!isPdf){blob=await compressImage(file);mime="image/jpeg";fname=fname.replace(/\.[^.]+$/,"")+".jpg";}
  return ingest({blob:blob,mime:mime,fname:fname});
}
/* E-Mail: .eml parsen, PDF-/Bild-Anhang bevorzugt analysieren, sonst den Text-Body */
async function prepareEmail(file){
  if(file.size>20*1024*1024)throw new Error("E-Mail größer als 20 MB");
  var raw=await file.text();
  var mail;try{mail=parseEml(raw);}catch(e){mail={text:raw,attachments:[],subject:""};}
  var att=(mail.attachments||[]).filter(function(a){return a.mime==="application/pdf"||/^image\//.test(a.mime);});
  var emlName=(file.name||"email.eml");
  if(att.length){
    var a=att[0];
    var blob=new Blob([a.bytes],{type:a.mime}),fname=a.filename||("anhang"+(a.mime==="application/pdf"?".pdf":".bin"));
    return ingest({blob:blob,mime:a.mime,fname:fname,emailFrom:emlName,emailSubject:mail.subject});
  }
  var body=(mail.text||raw||"").trim();
  if(!body)throw new Error("Kein lesbarer Inhalt in der E-Mail");
  return ingest({blob:new Blob([raw],{type:"message/rfc822"}),mime:"message/rfc822",fname:emlName,textContent:body,emailSubject:mail.subject});
}

   ("Failed to fetch"); wir lesen die Datei in einen festen Puffer und wiederholen bei Netzfehlern. */
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function isNetErr(e){var m=errMsg(e).toLowerCase();return m.indexOf("failed to fetch")>=0||m.indexOf("load failed")>=0||m.indexOf("network")>=0||m.indexOf("err_")>=0||m.indexOf("timeout")>=0;}
function netErrText(e){return isNetErr(e)?"Netzwerkfehler beim Hochladen – bitte Internetverbindung prüfen und noch einmal versuchen.":errMsg(e);}
async function uploadWithRetry(path,body,mime){
  var last=null;
  for(var a=0;a<3;a++){
    if(a)await sleep(700*a);
    try{
      var up=await sb.storage.from(BUCKET).upload(path,body,{contentType:mime,upsert:false});
      if(!up.error)return up;
      if(a>0&&/exist|dupli|409/i.test(errMsg(up.error)))return {data:{path:path},error:null}; /* vorheriger Versuch war doch erfolgreich */
      last=up.error;
      if(!isNetErr(up.error))return up; /* echte Fehler (kein Netz) nicht wiederholen */
    }catch(e){last=e;if(!isNetErr(e))return {error:e};}
  }
  return {error:last};
}
/* Uint8Array → base64 (chunked, verträgt große Dateien ohne Stack-Überlauf) */
function bytesToBase64(bytes){
  var bin="",chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk){bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));}
  return btoa(bin);
}
/* Speicherpfad: Supabase-Storage-Keys vertragen nur ASCII – Umlaute/ß transliterieren,
   sonst schlägt der Upload mit "Invalid key" fehl (z. B. "Begrüßungsschreiben.pdf") */
function storageSafeName(name){
  var s=String(name||"dokument");
  try{s=s.normalize("NFC");}catch(e){}
  s=s.replace(/[äöüÄÖÜß]/g,function(c){return ({"ä":"ae","ö":"oe","ü":"ue","Ä":"Ae","Ö":"Oe","Ü":"Ue","ß":"ss"})[c];});
  try{s=s.normalize("NFKD").replace(/[\u0300-\u036f]/g,"");}catch(e){}
  return s.replace(/[^A-Za-z0-9._\-]+/g,"_").slice(-80);
}
/* Kern: ablegen, KI, speichern, dann automatisch einsortieren. Gibt ein Ergebnis zurück. */
async function ingest(opts){
  var safe=storageSafeName(opts.fname);
  var path=activeHousehold+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,7)+"_"+safe;
  /* Datei EINMAL in einen festen Puffer lesen – stabiler in der Android-WebView als das Streamen des File-Objekts */
  var bytes;
  try{bytes=new Uint8Array(await opts.blob.arrayBuffer());}
  catch(e){throw new Error("Datei konnte nicht gelesen werden. Bitte erneut versuchen.");}
  /* Dubletten-Erkennung: Inhalt hashen und gegen das Archiv prüfen – identische Dateien werden übersprungen (kein Upload, keine KI-Kosten) */
  var hashHex=null;
  try{
    var hb=await crypto.subtle.digest("SHA-256",bytes);
    hashHex=Array.prototype.map.call(new Uint8Array(hb),function(x){return x.toString(16).padStart(2,"0");}).join("");
  }catch(e){}
  if(hashHex){
    var dupDoc=DOCS.find(function(d){return d.content_hash===hashHex;});
    if(dupDoc){
      var resDup={name:opts.fname||"Dokument",icon:"⏭️",text:"übersprungen – identisch mit „"+(dupDoc.filename||"?")+"“ vom "+fmtDate(dupDoc.doc_date||String(dupDoc.created_at).slice(0,10)),view:"docs",id:dupDoc.id};
      importResults.push(resDup);return resDup;
    }
  }
  var up=await uploadWithRetry(path,bytes,opts.mime);
  if(up.error)throw new Error(netErrText(up.error));
  var note=opts.emailSubject?("Aus E-Mail: "+opts.emailSubject):(opts.emailFrom?"Aus E-Mail-Anhang":null);
  var ins=await sb.from("documents").insert({household_id:activeHousehold,filename:opts.fname,storage_path:path,mime_type:opts.mime,size_bytes:bytes.length,doc_type:"sonstiges",note:note,content_hash:hashHex}).select("*").single();
  if(ins.error){
    /* kein DB-Eintrag → hochgeladene Datei nicht verwaisen lassen */
    try{await sb.storage.from(BUCKET).remove([path]);}catch(e){}
    throw new Error(netErrText(ins.error));
  }
  var docRow=ins.data,ext=null;
  try{
    var reqBody=opts.textContent?{textContent:opts.textContent,model:modelPref()}:{fileBase64:bytesToBase64(bytes),mimeType:opts.mime,model:modelPref()};
    var body=await edgeExtract(reqBody);
    ext=body.dokument||null;
    /* Verbrauchsprotokoll (best effort): wer hat wann wie viele Tokens genutzt */
    if(ext){try{await sb.from("ai_usage").insert({household_id:activeHousehold,user_email:(currentUser&&currentUser.email)||null,model:body.modell||null,input_tokens:(body.usage&&typeof body.usage.input==="number")?body.usage.input:null,output_tokens:(body.usage&&typeof body.usage.output==="number")?body.usage.output:null,filename:opts.fname||null});}catch(e){}}
  }catch(e){
    if(e&&e.code==="ki_guthaben"){
      /* Guthaben leer: Dokument bleibt gespeichert, wird als „wartet auf KI" markiert */
      kiGuthabenHit=true;
      try{await sb.from("documents").update({ki_pending:true}).eq("id",docRow.id);}catch(_e){}
      var resG={name:opts.fname||"Dokument",icon:"⏳",text:"gespeichert – KI-Guthaben ist aufgebraucht, die Analyse wird später nachgeholt",view:"docs",id:docRow.id,docId:docRow.id};
      importResults.push(resG);return resG;
    }
    var res0={name:opts.fname||"Dokument",icon:"⚠️",text:"abgelegt, aber KI-Analyse fehlgeschlagen",view:"docs",id:docRow.id,docId:docRow.id};
    importResults.push(res0);return res0;
  }
  try{
    var pm=(ext&&ext.vertragspartner)?matchPerson(ext.vertragspartner):null;
    var upd={extracted:ext,doc_type:(ext&&DOCTYPE[ext.docType])?ext.docType:"sonstiges",doc_date:(ext&&ext.datum)||null,zusammenfassung:(ext&&ext.zusammenfassung)||null,titel:extTitle(ext,docRow)};
    if(pm)upd.person_id=pm.id;else if(activePerson)upd.person_id=activePerson;
    if(ext&&ext.istMedizin){
      upd.bereich="medizin";
      upd.fachrichtung=(ext.fachrichtung&&FACH[ext.fachrichtung])?ext.fachrichtung:"sonstiges";
      upd.arzt=ext.arzt||null;
      upd.med_typ=(ext.medTyp&&MEDTYP[ext.medTyp])?ext.medTyp:(ext.docType==="rechnung"?"rechnung":"sonstiges");
      upd.betrag=(ext.betrag!=null?Number(ext.betrag):null);
      upd.behandlungsdatum=ext.datum||null;
    }
    await sb.from("documents").update(upd).eq("id",docRow.id);
  }catch(e){}
  var result=await autoFileDoc(docRow.id,ext);
  /* Ältere Dokumente haben noch keinen Hash: inhaltliche Ähnlichkeit als Warnung */
  try{
    if(ext&&ext.vertragsnummer&&ext.datum){
      var sim=DOCS.find(function(d){var dx=d.extracted;return d.id!==docRow.id&&dx&&dx.vertragsnummer===ext.vertragsnummer&&dx.datum===ext.datum&&dx.docType===ext.docType;});
      if(sim)result.text+=" · ⚠️ sehr ähnlich zu „"+(sim.filename||"?")+"“ – evtl. doppelt";
    }
  }catch(e){}
  importResults.push(result);
  return result;
}

  Object.keys(src).forEach(function(k){

/* ---------- Minimaler MIME-/E-Mail-Parser (clientseitig) ---------- */
function parseEml(raw){
  var top=splitHeaderBody(raw);
  var headers=parseHeaders(top.head);
  var subject=decodeMimeWords(headers["subject"]||"");
  var out={subject:subject,text:"",html:"",attachments:[]};
  walkMimePart(headers,top.body,out);
  if(!out.text&&out.html)out.text=htmlToText(out.html);
  return out;
}
function splitHeaderBody(s){
  var i=s.indexOf("\r\n\r\n");var sep=4;
  if(i<0){i=s.indexOf("\n\n");sep=2;}
  if(i<0)return {head:s,body:""};
  return {head:s.slice(0,i),body:s.slice(i+sep)};
}
function parseHeaders(head){
  var lines=head.split(/\r?\n/),h={},cur=null;
  lines.forEach(function(l){
    if(/^[ \t]/.test(l)&&cur){h[cur]+=" "+l.trim();return;}
    var m=l.match(/^([!-9;-~]+):\s?(.*)$/);
    if(m){cur=m[1].toLowerCase();h[cur]=(h[cur]?h[cur]+" ":"")+m[2];}
  });
  return h;
}
function headerParam(val,name){
  if(!val)return "";
  var m=val.match(new RegExp(name+'\\s*=\\s*"([^"]*)"','i'))||val.match(new RegExp(name+'\\s*=\\s*([^;\\s]+)','i'));
  return m?m[1]:"";
}
function walkMimePart(headers,body,out){
  var ct=(headers["content-type"]||"text/plain").toLowerCase();
  var cte=(headers["content-transfer-encoding"]||"").toLowerCase().trim();
  var disp=(headers["content-disposition"]||"").toLowerCase();
  var fname=decodeMimeWords(headerParam(headers["content-disposition"],"filename")||headerParam(headers["content-type"],"name"));
  if(ct.indexOf("multipart/")===0){
    var boundary=headerParam(headers["content-type"],"boundary");
    if(!boundary)return;
    var parts=splitMultipart(body,boundary);
    parts.forEach(function(p){
      var sub=splitHeaderBody(p);
      walkMimePart(parseHeaders(sub.head),sub.body,out);
    });
    return;
  }
  var isAttachment=disp.indexOf("attachment")>=0||!!fname||(ct.indexOf("application/")===0&&ct.indexOf("application/pkcs7")<0);
  if(ct.indexOf("text/plain")===0&&!isAttachment){out.text+=(out.text?"\n":"")+decodeText(body,cte,ct);return;}
  if(ct.indexOf("text/html")===0&&!isAttachment){out.html+=decodeText(body,cte,ct);return;}
  /* Anhang */
  var mime=ct.split(";")[0].trim()||"application/octet-stream";
  if(mime==="application/pdf"||/^image\//.test(mime)||isAttachment){
    var bytes=(cte==="base64")?base64ToBytes(body):new TextEncoder().encode(body);
    out.attachments.push({filename:fname||("anhang."+(mime==="application/pdf"?"pdf":(mime.split("/")[1]||"bin"))),mime:mime,bytes:bytes});
  }
}
function splitMultipart(body,boundary){
  var b="--"+boundary;
  var chunks=body.split(b);
  var parts=[];
  chunks.forEach(function(c){
    if(c===""||/^--\s*$/.test(c.trim().slice(0,4)))return;
    if(c.slice(0,2)==="--")return; /* Abschluss */
    var t=c.replace(/^\r?\n/,"").replace(/\r?\n$/,"");
    if(t.trim())parts.push(t);
  });
  return parts;
}
function decodeText(body,cte,ct){
  var charset=(headerParam(ct,"charset")||"utf-8").toLowerCase();
  var bytes;
  if(cte==="base64")bytes=base64ToBytes(body);
  else if(cte==="quoted-printable")bytes=qpToBytes(body);
  else return body;
  try{return new TextDecoder(charset).decode(bytes);}catch(e){try{return new TextDecoder("utf-8").decode(bytes);}catch(e2){return body;}}
}
function base64ToBytes(s){
  var clean=(s||"").replace(/[^A-Za-z0-9+/=]/g,"");
  try{var bin=atob(clean);var arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr;}
  catch(e){return new Uint8Array(0);}
}
function qpToBytes(s){
  s=(s||"").replace(/=\r?\n/g,""); /* Soft-Line-Breaks */
  var out=[];
  for(var i=0;i<s.length;i++){
    var ch=s[i];
    if(ch==="="&&i+2<s.length){var hex=s.substr(i+1,2);if(/^[0-9A-Fa-f]{2}$/.test(hex)){out.push(parseInt(hex,16));i+=2;continue;}}
    out.push(ch.charCodeAt(0)&0xff);
  }
  return new Uint8Array(out);
}
function decodeMimeWords(s){
  if(!s)return "";
  return s.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g,function(_,cs,enc,txt){
    try{
      var bytes;
      if(/b/i.test(enc))bytes=base64ToBytes(txt);
      else bytes=qpToBytes(txt.replace(/_/g," "));
      return new TextDecoder(cs).decode(bytes);
    }catch(e){return txt;}
  }).replace(/\s+/g," ").trim();
}
function htmlToText(html){
  var s=String(html||"");
  s=s.replace(/<style[\s\S]*?<\/style>/gi,"").replace(/<script[\s\S]*?<\/script>/gi,"");
  s=s.replace(/<\/(p|div|tr|h[1-6]|li)>/gi,"\n").replace(/<br\s*\/?>/gi,"\n");
  s=s.replace(/<[^>]+>/g," ");
  var ta=document.createElement("textarea");ta.innerHTML=s;s=ta.value;
  return s.replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
}

function findMatch(ext){
  if(!ext)return null;
  var kd=(ext.kundennummer||"").replace(/\s+/g,"").toLowerCase();
  var vn=(ext.vertragsnummer||"").replace(/\s+/g,"").toLowerCase();
  var ab=(ext.anbieter||"").toLowerCase();
  var best=null;
  var exact=null,fuzzy=null;
  CONTRACTS.forEach(function(c){
    var ckd=(c.kundennummer||"").replace(/\s+/g,"").toLowerCase();
    var cvn=(c.vertragsnummer||"").replace(/\s+/g,"").toLowerCase();
    /* Kunden-/Vertragsnummer eindeutig – auch über Kreuz (viele Anbieter fuehren beide gleich) */
    if(!exact&&kd&&(kd===ckd||kd===cvn)){exact=c;return;}
    if(!exact&&vn&&(vn===cvn||vn===ckd)){exact=c;return;}
    /* sonst Anbietername + gleiche Kategorie */
    if(!fuzzy&&ab&&c.anbieter&&(ab.indexOf(c.anbieter.toLowerCase())>=0||c.anbieter.toLowerCase().indexOf(ab)>=0)&&(ext.kategorie===c.kategorie))fuzzy=c;
  });
  return exact||fuzzy;
}

/* Nach einem Mehrfach-Upload: unverknüpft gebliebene Dokumente gegen die Verträge
   aus DIESEM Upload prüfen. Bewusst lockerer als findMatch: die Kategorie darf
   abweichen (ein SEPA-Mandat ist "sonstiges", gehört aber trotzdem zum Gasvertrag),
   und Kunden-/Vertragsnummern zählen auch, wenn der Vertrag noch gar keine hat. */
async function batchReconcile(){
  var cids=[];
  importResults.forEach(function(r){if(r.cid&&cids.indexOf(r.cid)<0)cids.push(r.cid);});
  if(!cids.length)return;
  var changed=false;
  for(var i=0;i<importResults.length;i++){
    var r=importResults[i];
    if(!r.docId)continue;
    var d=DOCS.find(function(x){return x.id===r.docId;});
    if(!d||d.contract_id||isMed(d)||!d.extracted)continue;
    var ext=d.extracted;
    var kd=(ext.kundennummer||"").replace(/\s+/g,"").toLowerCase();
    var vn=(ext.vertragsnummer||"").replace(/\s+/g,"").toLowerCase();
    var ab=(ext.anbieter||"").trim().toLowerCase();
    var sum=((d.zusammenfassung||"")+" "+((ext.wichtig||[]).join(" "))).toLowerCase();
    var hit=null;
    for(var j=0;j<cids.length&&!hit;j++){
      var c=contractById(cids[j]);if(!c)continue;
      var ckd=(c.kundennummer||"").replace(/\s+/g,"").toLowerCase();
      var cvn=(c.vertragsnummer||"").replace(/\s+/g,"").toLowerCase();
      var cab=(c.anbieter||"").trim().toLowerCase();
      if(kd&&(kd===ckd||kd===cvn))hit=c;
      else if(vn&&(vn===cvn||vn===ckd))hit=c;
      else if(ab.length>=3&&cab.length>=3&&(ab.indexOf(cab)>=0||cab.indexOf(ab)>=0))hit=c;
      else if(cids.length===1&&cab.length>=4&&sum.indexOf(cab)>=0)hit=c;
    }
    if(!hit)continue;
    await linkDocSilent(d.id,hit.id);
    try{await inheritFromContract(d.id,hit.id);}catch(e){}
    changed=true;
    /* Person und fehlende Stammdaten übernehmen – wie beim direkten Treffer */
    if(!hit.person_id&&d.person_id){
      try{await saveContractData({person_id:d.person_id},hit.id);hit.person_id=d.person_id;}catch(e){}
    }
    try{
      var fillCols={},nf=0;
      FILL_MAP.forEach(function(f){
        var ev=ext[f.ext];
        if(ev!=null&&ev!==""&&(hit[f.col]==null||hit[f.col]===""))
          {fillCols[f.col]=(ADJ_NUM&&ADJ_NUM[f.col])?Number(ev):ev;nf++;}
      });
      if(nf){await saveContractData(fillCols,hit.id);Object.keys(fillCols).forEach(function(k){hit[k]=fillCols[k];});}
    }catch(e){}
    r.text="gehört zum selben Vertrag → zu „"+(hit.anbieter||"Vertrag")+"“ zugeordnet";
    r.view="contract-detail";r.id=hit.id;r.icon=katInfo(hit.kategorie).icon;
  }
  if(changed){try{await loadFromDB();}catch(e){}}
}
/* Vertrag anhand der zugeordneten Dokumente neu berechnen: neuestes Dokument je Angabe gewinnt */
var adjustSugs=null;
var ADJ_NUM={mindestlaufzeit_monate:1,kuendigungsfrist_monate:1,verlaengerung_monate:1,kosten:1};
function docExtractDate(d){var e=d.extracted||{};return e.zeitraumBis||e.datum||d.doc_date||String(d.created_at).slice(0,10);}
/* Anzeigetitel eines Dokuments: KI-Titel vor Dateiname */
function docTitle(d){return (d&&d.titel)||(d&&d.filename)||"Dokument";}
function monYY(iso){if(!iso)return "";var p=String(iso).slice(0,7).split("-");return p.length===2?(" "+p[1]+"/"+p[0]):"";}
/* Titel aus der KI-Extraktion – mit Fallback aus den erkannten Feldern */
function extTitle(ext,d){
  var t=(ext&&ext.titel)?String(ext.titel).trim():"";
  if(t)return t.slice(0,80);
  if(ext&&ext.istMedizin){
    var mt=medTypInfo((ext.medTyp&&MEDTYP[ext.medTyp])?ext.medTyp:"sonstiges").label;
    var who=ext.arzt||fachInfo((ext.fachrichtung&&FACH[ext.fachrichtung])?ext.fachrichtung:"sonstiges").label;
    return (who+" – "+mt+monYY(ext.datum)).slice(0,80);
  }
  if(!ext||(!ext.anbieter&&!ext.docType))return (d&&d.filename)||"Dokument";
  var dt=dtInfo((ext.docType&&DOCTYPE[ext.docType])?ext.docType:"sonstiges").label;
  return (((ext.anbieter?ext.anbieter+" – ":""))+dt+monYY(ext.datum)).slice(0,80);
}
/* Vererbung: ein Dokument, das an einen Vertrag gehängt wird, erbt dessen
   Person, Kategorie und Anbieter – aber nur, wo dem Dokument selbst die Info fehlt. */
async function inheritFromContract(docId,contractId){
  try{
    var d=DOCS.find(function(x){return x.id===docId;});var c=contractById(contractId);
    if(!d||!c||isMed(d))return;
    var upd={};
    if(!d.person_id&&c.person_id)upd.person_id=c.person_id;
    var ext=d.extracted||null;
    var needKat=c.kategorie&&(!ext||!ext.kategorie||ext.kategorie==="sonstiges")&&c.kategorie!=="sonstiges";
    var needAnb=c.anbieter&&(!ext||!ext.anbieter);
    if(needKat||needAnb){
      var ne=Object.assign({},ext||{});
      if(needKat)ne.kategorie=c.kategorie;
      if(needAnb)ne.anbieter=c.anbieter;
      upd.extracted=ne;
    }
    if(!d.titel&&c.anbieter){
      upd.titel=(c.anbieter+" – "+dtInfo(d.doc_type||"sonstiges").label+monYY(d.doc_date||String(d.created_at).slice(0,10))).slice(0,80);
    }
    if(Object.keys(upd).length)await sb.from("documents").update(upd).eq("id",docId);
  }catch(e){}
}
function contractAdjustSugs(c){
  var docs=DOCS.filter(function(d){return d.contract_id===c.id&&d.extracted;})
    .sort(function(a,b){return String(docExtractDate(b)).localeCompare(String(docExtractDate(a)));});
  if(!docs.length)return [];
  var sugs=[];
  FILL_MAP.forEach(function(f){
    for(var i=0;i<docs.length;i++){
      var e=docs[i].extracted,v=e[f.ext];
      if(v==null||v==="")continue;
      if(ADJ_NUM[f.col]&&isNaN(Number(v)))continue;
      var cur=c[f.col],same;
      if(ADJ_NUM[f.col])same=(cur!=null&&cur!==""&&Math.abs(Number(cur)-Number(v))<0.005);
      else same=(String(cur==null?"":cur).trim().toLowerCase()===String(v).trim().toLowerCase());
      if(!same){
        var s={col:f.col,val:ADJ_NUM[f.col]?Number(v):String(v).trim(),label:f.label,cur:cur,src:docs[i].filename||"Dokument",date:docExtractDate(docs[i])};
        if(f.col==="kosten"&&e.kostenIntervall&&INTERVALL_LABEL[e.kostenIntervall]&&e.kostenIntervall!==c.kosten_intervall)s.iv=e.kostenIntervall;
        sugs.push(s);
      }
      break; /* nur das neueste Dokument mit dieser Angabe zählt */
    }
  });
  return sugs;
}
function adjFmt(col,v){
  if(v==null||v==="")return "–";
  if(col==="kosten")return fmtEur(Number(v));
  if(col==="vertragsstart")return fmtDate(v);
  if(col==="kuendigungsfrist_monate")return fristTxt(Number(v));
  if(col==="mindestlaufzeit_monate"||col==="verlaengerung_monate")return Number(v)+" Mon.";
  return escapeHtml(String(v));
}
function openAdjustModal(cid,note){
  var c=contractById(cid);if(!c)return;
  var sugs=contractAdjustSugs(c);
  if(!sugs.length){toast("Alles aktuell – die Dokumente enthalten keine abweichenden Angaben ✅");return;}
  adjustSugs={cid:cid,items:sugs};
  var rows=sugs.map(function(s,i){
    return '<label class="adjrow"><input type="checkbox" class="adjcb" checked data-i="'+i+'">'+
      '<span class="adjtxt"><b>'+s.label+':</b> '+adjFmt(s.col,s.cur)+' <span class="adjarr">→</span> <b>'+adjFmt(s.col,s.val)+(s.iv?' / '+INTERVALL_LABEL[s.iv]:"")+'</b>'+
      '<span class="adjsrc">aus „'+escapeHtml(s.src)+'“'+(s.date?' · '+fmtDate(s.date):"")+'</span></span></label>';
  }).join("");
  openModal('<h2 class="sect">🔄 Vertrag aus Dokumenten aktualisieren</h2>'+
    (note?'<p class="ainote" style="margin:0 0 10px">'+note+'</p>':"")+
    '<p class="muted" style="font-size:.85rem;margin:0 0 10px">Der Butler hat alle zugeordneten Dokumente ausgewertet (neueste Angabe gewinnt). Abwählen, was nicht übernommen werden soll.</p>'+
    rows+
    '<div class="btnrow"><button class="primary" data-action="adjust-apply">Übernehmen</button><button class="ghost" data-action="modal-close">Abbrechen</button></div>');
}
async function applyAdjust(){
  var a=adjustSugs;if(!a)return;
  var boxes=Array.prototype.slice.call(document.querySelectorAll(".adjcb"));
  var cols={},n=0;
  boxes.forEach(function(b){if(!b.checked)return;var s=a.items[parseInt(b.dataset.i,10)];if(!s)return;cols[s.col]=s.val;if(s.iv)cols.kosten_intervall=s.iv;n++;});
  closeModal();
  if(!n){toast("Nichts ausgewählt – Vertrag unverändert.");return;}
  try{
    await saveContractData(cols,a.cid);
    await loadFromDB();
    detailId=a.cid;activeView="contract-detail";renderApp();
    toast(n+" Angabe"+(n===1?"":"n")+" aktualisiert ✅");

}

async function reviewCompleteContract(id){
  var d=reviewDoc,c=contractById(id);

  var fills=missingFills(c,d.extracted);

  var cols={};fills.forEach(function(f){cols[f.col]=f.val;});
  try{

    await loadFromDB();
    detailId=id;activeView="contract-detail";renderApp();
    toast(fills.length+" Angabe"+(fills.length===1?"":"n")+" ergänzt ✅");
  }catch(e){toast("Ergänzen fehlgeschlagen: "+errMsg(e),true);}
}

/* ---------- Zurück-Navigation (Wisch-Geste / Browser-Zurück / Android-Zurück) ----------
   Eigener Verlauf über die besuchten Ansichten, gespiegelt in die History-API. Browser-Zurück
   und die Android-Wisch-Geste (Capacitor backButton) laufen beide über popstate zur vorherigen
   Ansicht – offene Dialoge/Suchergebnisse werden zuerst geschlossen. */
var navHistory=[],navLast=null,navSuppress=false;
function navSnap(){return {view:activeView,detailId:detailId,editId:editId,medEditId:medEditId,person:activePerson,uploadTarget:uploadTarget};}
function navKey(s){return [s.view,s.detailId||"",s.editId||"",s.medEditId||""].join("|");}
function navTrack(){
  var cur=navSnap();
  if(navLast&&!navSuppress&&navKey(navLast)!==navKey(cur)){
    navHistory.push(navLast);
    if(navHistory.length>60)navHistory.shift();
    try{history.pushState({b:1},"");}catch(e){}
  }
  navLast=cur;
}
function navRestore(s){
  navSuppress=true;
  activePerson=s.person||"";detailId=s.detailId||null;editId=s.editId||null;
  medEditId=s.medEditId||null;uploadTarget=s.uploadTarget||null;reviewDoc=null;

function tipsDismissed(){try{return JSON.parse(localStorage.getItem("db_tips_dismissed")||"[]");}catch(e){return [];}}
function isTipDismissed(key){return tipsDismissed().indexOf(key)>=0;}
function dismissTip(key){try{var s=tipsDismissed();if(s.indexOf(key)<0){s.push(key);localStorage.setItem("db_tips_dismissed",JSON.stringify(s.slice(-200)));}}catch(e){}renderApp();}
function butlerTips(CS,DS){
  var tips=[];
  /* Dokumente, die auf die KI-Analyse warten (Guthaben war aufgebraucht) */
  var pend=DS.filter(function(d){return d.ki_pending;}).length;
  if(pend)tips.push({key:"kipending:"+pend,txt:pend+(pend===1?" Dokument wartet":" Dokumente warten")+" auf die KI-Analyse.",btn:"Nachholen",action:"reanalyze-all"});
  CS.forEach(function(c){
    var f=fristInfo(c);
    if(c.status==="aktiv"&&f.kind==="unbekannt")
      tips.push({key:"frist:"+c.id,txt:'„'+escapeHtml(c.anbieter||"?")+'“: Beginn/Laufzeit fehlen für die Fristen-Überwachung.',btn:"Ergänzen",action:"edit-contract",id:c.id});
    if(c.status==="gekuendigt"&&c.gekuendigt_zum&&c.gekuendigt_zum<todayISO())
      tips.push({key:"ended:"+c.id,txt:'„'+escapeHtml(c.anbieter||"?")+'“ ist seit '+fmtDate(c.gekuendigt_zum)+' abgelaufen.',btn:"Beenden",action:"tip-ended",id:c.id});
  });
  /* Rechnungs-Trend: letzte Rechnung deutlich teurer als die davor */
  var trendIds={};
  CS.forEach(function(c){
    if(c.status!=="aktiv")return;
    var invs=contractInvoices(c.id,DS);
    if(invs.length>=2){
      var last=invs[invs.length-1].b,prev=invs[invs.length-2].b;
      if(last>prev&&(last-prev)>Math.max(1,prev*0.05)){
        trendIds[c.id]=1;
        tips.push({key:"trend:"+c.id,txt:'„'+escapeHtml(c.anbieter||"?")+'“: letzte Rechnung +'+fmtEur(last-prev)+' ('+fmtEur(prev)+' → '+fmtEur(last)+').',btn:"Verlauf",action:"open-contract",id:c.id});
      }
    }
  });
  /* Jahresvergleich: Vertrag ist im Schnitt teurer als im Vorjahr (nur wenn kein Trend-Tipp dazu) */
  CS.forEach(function(c){
    if(c.status!=="aktiv"||trendIds[c.id])return;
    var ys=invoiceYears(contractInvoices(c.id,DS));
    var yk=Object.keys(ys).sort();
    if(yk.length<2)return;
    var cur=ys[yk[yk.length-1]],prev=ys[yk[yk.length-2]];
    var aC=cur.sum/cur.n,aP=prev.sum/prev.n;
    if(aC>aP&&(aC-aP)>Math.max(1,aP*0.05))
      tips.push({key:"year:"+c.id,txt:'„'+escapeHtml(c.anbieter||"?")+'“: '+yk[yk.length-1]+' ⌀ +'+fmtEur(aC-aP)+' je Rechnung vs. '+yk[yk.length-2]+'.',btn:"Vergleich",action:"open-contract",id:c.id});
  });
  /* Tarif-Abweichung: eine Rechnung liegt spürbar über den vertraglich hinterlegten Kosten
     (gleiche Größenordnung – kein Jahres-vs-Monats-Fehlalarm) */
  CS.forEach(function(c){
    if(c.status!=="aktiv"||c.kosten==null)return;
    var invs=contractInvoices(c.id,DS);if(!invs.length)return;
    var last=invs[invs.length-1].b,k=Number(c.kosten);
    if(last!=null&&k>0&&last>k*1.1&&last<k*3)
      tips.push({key:"tarifab:"+c.id+":"+Math.round(last),txt:'„'+escapeHtml(c.anbieter||"?")+'“ rechnet '+fmtEur(last)+' ab – im Tarif stehen '+fmtEur(k)+'.',btn:"Prüfen",action:"open-contract",id:c.id});
  });
  var unlinked=DS.filter(function(d){return docNeedsContract(d)&&!d.contract_id;}).length;
  if(unlinked)tips.push({key:"unlinked:"+unlinked,txt:unlinked+(unlinked===1?" Dokument":" Dokumente")+" ohne Vertrag – siehe 📌 To-Do in der Dokumentenliste.",btn:"Ansehen",nav:"docs"});
  /* Dokumente ohne Person (nur wenn es überhaupt Personen gibt) */
  if(PERSONS.length){
    var noperson=DS.filter(function(d){return docNeedsPerson(d)&&!d.person_id;}).length;
    if(noperson&&!activePerson)tips.push({key:"noperson:"+noperson,txt:noperson+(noperson===1?" Dokument":" Dokumente")+" ohne Person – siehe 📌 To-Do in der Dokumentenliste.",btn:"Ansehen",nav:"docs"});
  }
  /* bereits weggeklickte Tipps ausblenden (Tipps verschwinden ohnehin automatisch, wenn erledigt) */
  tips=tips.filter(function(t){return !isTipDismissed(t.key);});
  if(!tips.length)return "";
  /* schlank: max. 2 Tipps zeigen, Rest auf Klick */
  var shown=tipsExpanded?tips:tips.slice(0,2);
  var more=(!tipsExpanded&&tips.length>2)?'<button class="linkbtn" data-action="tips-more" style="margin-top:10px">'+(tips.length-2)+' weitere Tipps anzeigen ›</button>':"";
  return '<section class="card"><h2 class="sect">🎩 Butler-Tipps</h2>'+shown.map(function(t){
    var b=t.nav?'<button class="ghost" data-nav="'+t.nav+'">'+t.btn+'</button>':'<button class="ghost" data-action="'+t.action+'"'+(t.id?' data-id="'+t.id+'"':"")+'>'+t.btn+'</button>';
    return '<div class="tiprow"><span>'+t.txt+'</span><span class="tipacts">'+b+'<button class="tipx" data-action="tip-dismiss" data-key="'+escapeHtml(t.key)+'" title="Tipp ausblenden">✕</button></span></div>';
  }).join("")+more+'</section>';
}

/* Jahresvergleich über alle Verträge (nur im Kosten-Drilldown): Summe je Jahr + größte Preistreiber */
function jahresvergleichCard(){
  var DS=filterPerson(DOCS);
  var perYear={},perContract={};
  DS.forEach(function(d){
    if(isMed(d)||d.doc_type!=="rechnung")return;
    var e=d.extracted||{};if(e.betrag==null)return;
    var j=String(invoiceDate(d)).slice(0,4);if(!/^\d{4}$/.test(j))return;
    if(!perYear[j])perYear[j]={sum:0,n:0};
    perYear[j].sum+=Number(e.betrag);perYear[j].n++;
    if(d.contract_id){
      if(!perContract[d.contract_id])perContract[d.contract_id]={};
      if(!perContract[d.contract_id][j])perContract[d.contract_id][j]={sum:0,n:0};
      perContract[d.contract_id][j].sum+=Number(e.betrag);perContract[d.contract_id][j].n++;
    }
  });
  var years=Object.keys(perYear).sort().reverse();
  if(years.length<2)return "";
  var heuteJahr=todayISO().slice(0,4);
  var rows=years.map(function(j,idx){
    var s=perYear[j],prev=perYear[years[idx+1]],delta="";
    if(prev)delta=deltaBadge(s.sum-prev.sum,fmtEur(Math.abs(s.sum-prev.sum))+" vs. "+years[idx+1]);
    return '<div class="yrow"><b>'+j+(j===heuteJahr?'<span class="muted" style="font-weight:400"> (läuft)</span>':"")+'</b><span>'+fmtEur(s.sum)+' · '+s.n+' Rechnung'+(s.n===1?"":"en")+'</span>'+delta+'</div>';
  }).join("");
  /* größte Veränderungen je Vertrag (⌀ je Rechnung, aktuelles vs. vorheriges Jahr) */
  var cur=years[0],prev=years[1],movers=[];
  Object.keys(perContract).forEach(function(cid){
    var y=perContract[cid];if(!y[cur]||!y[prev])return;
    var aC=y[cur].sum/y[cur].n,aP=y[prev].sum/y[prev].n;
    if(Math.abs(aC-aP)<0.01)return;
    var c=contractById(cid);if(!c)return;
    movers.push({name:(c.anbieter||"?")+(c.produkt?" · "+c.produkt:""),id:cid,d:aC-aP,aC:aC,aP:aP});
  });
  movers.sort(function(a,b){return Math.abs(b.d)-Math.abs(a.d);});
  var mv="";
  if(movers.length){
    mv='<p class="muted" style="font-size:.82rem;margin:12px 0 4px;font-weight:600">Größte Veränderungen ('+cur+' vs. '+prev+', ⌀ je Rechnung)</p>'+
      movers.slice(0,3).map(function(m){
        return '<div class="yrow" data-action="open-contract" data-id="'+m.id+'" style="cursor:pointer"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(m.name)+'</span>'+deltaBadge(m.d,fmtEur(Math.abs(m.d))+" ("+fmtPct(m.aP?m.d/m.aP*100:0)+")")+'</div>';
      }).join("");
  }
  return '<section class="card"><h2 class="sect">📊 Rechnungen im Jahresvergleich</h2>'+rows+mv+'</section>';
}

/* Sparcheck: größte Kostentreiber + Sparpotenzial aus der Internet-Recherche */
function sparCard(CS){
  var aktive=CS.filter(function(c){return c.status==="aktiv"&&c.kosten!=null;});
  if(!aktive.length)return "";
  function monthlyOf(val,iv){var m=INTERVALL[iv]||1;return Number(val)/m;}
  function yearly(c){var m=monatskosten(c);return m>0?m*12:Number(c.kosten||0);}
  var spar=0,sparN=0;
  aktive.forEach(function(c){
    var td=c.recherche&&c.recherche.tarifdetails;if(!td||td.kosten==null)return;
    var cm=monthlyOf(c.kosten,c.kosten_intervall),mm=monthlyOf(td.kosten,td.kostenIntervall||c.kosten_intervall);
    if(mm>0&&cm>0&&mm<cm&&mm>cm*0.3){spar+=(cm-mm)*12;sparN++;}
  });
  var top=aktive.slice().sort(function(a,b){return yearly(b)-yearly(a);}).slice(0,4);
  var rows=top.map(function(c){
    var td=c.recherche&&c.recherche.tarifdetails,md=td&&td.kosten;
    var note=(md!=null&&Number(md)<Number(c.kosten))?'<span class="badge amber">Markt ~'+fmtEur(Number(md))+'</span>'
      :(c.recherche?'<span class="badge green">recherchiert</span>':'<button class="ghost" data-action="research-contract" data-id="'+c.id+'" style="font-size:.78rem;padding:5px 10px">🌐 Vergleichen</button>');
    return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;font-size:.88rem;border-bottom:1px solid var(--border)"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+katInfo(c.kategorie).icon+' '+escapeHtml(c.anbieter||"?")+'</span><span style="font-weight:650;flex:none">'+fmtEur(yearly(c))+'<span class="muted" style="font-weight:400">/J</span></span>'+note+'</div>';
  }).join("");
  var head=sparN?('<p style="font-size:.95rem;margin:0 0 8px">💡 Mögliches Sparpotenzial: <b>'+fmtEur(spar)+' / Jahr</b> <span class="muted">(laut Recherche bei '+sparN+' Vertrag'+(sparN===1?"":"en")+')</span></p>')
    :('<p class="muted" style="font-size:.9rem;margin:0 0 8px">Deine größten Kostenpunkte – lohnt ein Vergleich? „🌐 Vergleichen" recherchiert den Markt.</p>');
  return '<section class="card"><h2 class="sect">💡 Sparcheck</h2>'+head+rows+'</section>';
}
/* ---- Hauptkategorien ----
   Ordnet ALLES (Verträge + Dokumente, auch Arzt-Dokumente) einer Hauptkategorie zu
   und listet darin die Anbieter. Ein Dokument am Vertrag erbt dessen Kategorie/Anbieter. */
function docKat(d){
  if(isMed(d))return "gesundheit";
  var c=d.contract_id?contractById(d.contract_id):null;
  if(c&&c.kategorie&&KAT[c.kategorie])return c.kategorie;
  var k=d.extracted&&d.extracted.kategorie;
  return (k&&KAT[k])?k:"sonstiges";
}
function docAnbieter(d){
  if(isMed(d)){
    /* Der Praxisname aus der KI-Extraktion ist einheitlicher als das lange arzt-Feld
       ("Dr. X, Zahnzentrum Y, Standort Z") – sonst zersplittert eine Praxis in mehrere Einträge */
    var a=(d.extracted&&d.extracted.anbieter)||d.arzt||"";
    return String(a).split(",")[0].trim();
  }
  var c=d.contract_id?contractById(d.contract_id):null;
  if(c&&c.anbieter)return c.anbieter;
  return (d.extracted&&d.extracted.anbieter)||"";
}
function katGroups(){
  var g={};
  function slot(k){
    if(!KAT[k])k="sonstiges";
    if(!g[k])g[k]={kat:k,cn:0,dn:0,kosten:0,anb:{}};
    return g[k];
  }
  function anb(s,name,cid){
    var n=String(name||"").trim();
    var key=n?n.toLowerCase():"__ohne__";
    if(!s.anb[key])s.anb[key]={name:n,cid:null,cn:0,dn:0,kosten:0};
    if(cid&&!s.anb[key].cid)s.anb[key].cid=cid;
    return s.anb[key];
  }
  filterPerson(CONTRACTS).forEach(function(c){
    var s=slot(c.kategorie),mk=monatskosten(c);
    s.cn++;s.kosten+=mk;
    var a=anb(s,c.anbieter,c.id);a.cn++;a.kosten+=mk;
  });
  filterPerson(DOCS).forEach(function(d){
    var s=slot(docKat(d));s.dn++;
    var a=anb(s,docAnbieter(d),d.contract_id||null);a.dn++;
  });
  return g;
}
function viewKategorien(){
  var g=katGroups(),keys=Object.keys(g);
  if(!keys.length)return '<section class="card"><p class="muted">Noch nichts abgelegt. Lade ein Dokument hoch – der Butler sortiert es automatisch ein.</p><div class="btnrow"><button class="primary" data-nav="add">➕ Dokument hochladen</button></div></section>';
  keys.sort(function(a,b){
    if(Math.abs(g[b].kosten-g[a].kosten)>0.005)return g[b].kosten-g[a].kosten;
    if(g[b].cn!==g[a].cn)return g[b].cn-g[a].cn;
    if(g[b].dn!==g[a].dn)return g[b].dn-g[a].dn;
    return katInfo(a).label.localeCompare(katInfo(b).label);
  });
  var gesamt=0;keys.forEach(function(k){gesamt+=g[k].kosten;});
  var rows=keys.map(function(k){
    var s=g[k],ki=katInfo(k);
    var list=Object.keys(s.anb).map(function(x){return s.anb[x];}).sort(function(a,b){
      if(Math.abs(b.kosten-a.kosten)>0.005)return b.kosten-a.kosten;
      if(!a.name)return 1;if(!b.name)return -1;
      return a.name.localeCompare(b.name);
    });
    var nAnb=list.filter(function(a){return !!a.name;}).length;
    var inner=list.map(function(a){
      var meta=[];
      if(a.cn)meta.push(a.cn===1?"1 Vertrag":a.cn+" Verträge");
      if(a.dn)meta.push(a.dn===1?"1 Dokument":a.dn+" Dokumente");
      var cost=a.kosten>0?'<span class="katcost">'+fmtEur(a.kosten)+'<span class="muted" style="font-weight:400">/M</span></span>':"";
      var act=a.cid?('data-action="open-contract" data-id="'+a.cid+'"'):('data-action="kat-docs" data-kat="'+k+'"');
      return '<button class="anbrow" '+act+'>'+
        '<span style="flex:1;min-width:0"><span class="anbname">'+escapeHtml(a.name||"Ohne Anbieter")+'</span>'+
        '<span class="anbmeta">'+meta.join(" · ")+'</span></span>'+
        cost+'<span class="katchev">›</span></button>';
    }).join("");
    var sub=[];
    if(nAnb)sub.push(nAnb===1?"1 Anbieter":nAnb+" Anbieter");
    if(s.dn)sub.push(s.dn+" Dok.");
    if(!sub.length)sub.push(s.cn+" Vertrag");
    return '<details class="katgrp" data-kat="'+k+'"'+(katOpen[k]?" open":"")+'>'+
      '<summary class="katsum">'+
        '<span class="katic">'+ki.icon+'</span>'+
        '<span style="flex:1;min-width:0"><span class="katname">'+ki.label+'</span>'+
        '<span class="katsub">'+sub.join(" · ")+'</span></span>'+
        '<span class="katright">'+(s.kosten>0?'<span class="katcost">'+fmtEur(s.kosten)+'<span class="muted" style="font-weight:400">/M</span></span>':"")+'<span class="katchev">›</span></span>'+
      '</summary>'+
      '<div class="katbody">'+inner+'</div>'+
    '</details>';
  }).join("");
  var summe=gesamt>0?('<p class="muted" style="font-size:.82rem;margin:0 0 10px">'+keys.length+' Kategorien · '+fmtEur(gesamt)+' laufende Kosten je Monat</p>'):"";
  return summe+rows;
}
function viewContracts(){
  if(!CONTRACTS.length&&!DOCS.length)return '<section class="card"><h2 class="sect">📑 Verträge</h2><p class="muted">Noch keine Verträge angelegt. Am schnellsten geht es, wenn du ein Vertrags-PDF oder einen Brief hochlädst – der Butler füllt alles aus.</p><div class="btnrow"><button class="primary" data-nav="add">➕ Dokument hochladen</button><button class="ghost" data-action="new-contract">Von Hand anlegen</button></div></section>';
  var base=filterPerson(CONTRACTS).slice();
  var sorted;
  if(contractsCostSort){
    /* Kosten-Drilldown: teuerste laufende Verträge zuerst */
    sorted=base.sort(function(a,b){return monatskosten(b)-monatskosten(a);});
  }else{
    /* intelligente Sortierung: dringendste Fristen zuerst, gekündigte/beendete ans Ende */
    sorted=base.sort(function(a,b){
      var rank={aktiv:0,gekuendigt:1,beendet:2};
      var ra=rank[a.status]!=null?rank[a.status]:0,rb=rank[b.status]!=null?rank[b.status]:0;
      if(ra!==rb)return ra-rb;
      var fa=fristInfo(a),fb=fristInfo(b);
      var oa=fa.days!=null?fa.days:(fa.kind==="flex"?99990:99999);

function dRow(k,v){return '<span class="dk">'+k+'</span><span class="dv">'+v+'</span>';}
/* Kategorie-spezifische Zusatzangaben im Vertragsdetail */
function detailRows(c){
  var det=c.details;
  if(!det||typeof det!=="object")return "";
  var fs=detailFields(c.kategorie),done={},out="";
  fs.forEach(function(f){
    var v=det[f.k];done[f.k]=1;
    if(v==null||v==="")return;
    out+=dRow(f.l.replace(/\s*\([^)]*\)$/,""),fmtDetail(f,v));
  });
  /* unbekannte Zusatz-Schlüssel trotzdem zeigen (z. B. nach Kategorie-Wechsel) */
  Object.keys(det).forEach(function(k){
    if(done[k]||det[k]==null||det[k]==="")return;
    var label=k.replace(/([a-z])([A-Z])/g,"$1 $2");label=label.charAt(0).toUpperCase()+label.slice(1);
    out+=dRow(escapeHtml(label),escapeHtml(String(det[k])));
  });
  return out;
}
/* Monatsrechnungen: aus zugeordneten Rechnungs-Dokumenten Verlauf + Trend bauen */
function invoiceDate(d){
  var e=d.extracted||{};
  return e.zeitraumBis||e.zeitraumVon||d.doc_date||e.datum||String(d.created_at).slice(0,10);
}
/* Rechnungen eines Vertrags mit Betrag, zeitlich sortiert */
function contractInvoices(cid,DS){
  return DS.filter(function(d){return d.contract_id===cid&&d.doc_type==="rechnung"&&d.extracted&&d.extracted.betrag!=null;})
    .map(function(d){return {b:Number(d.extracted.betrag),date:invoiceDate(d)};})
    .sort(function(a,b){return String(a.date).localeCompare(String(b.date));});
}
/* Beträge nach Jahr aufsummieren: {jahr:{sum,n}} */
function invoiceYears(invs){
  var y={};
  invs.forEach(function(i){
    if(i.b==null)return;
    var j=String(i.date).slice(0,4);if(!/^\d{4}$/.test(j))return;
    if(!y[j])y[j]={sum:0,n:0};
    y[j].sum+=i.b;y[j].n++;
  });
  return y;
}
function fmtPct(v){return (v>0?"+":"")+v.toLocaleString("de-DE",{maximumFractionDigits:1})+" %";}
function deltaBadge(d,txt){
  var cls=d>0.005?"up":(d<-0.005?"down":"same");
  var arrow=d>0.005?"▲":(d<-0.005?"▼":"■");
  return '<span class="invdelta '+cls+'">'+arrow+' '+txt+'</span>';
}
function invoiceHistory(c){
  var invs=DOCS.filter(function(d){return d.contract_id===c.id&&d.doc_type==="rechnung";})
    .map(function(d){var e=d.extracted||{};return {doc:d,betrag:(e.betrag!=null?Number(e.betrag):null),von:e.zeitraumVon||null,bis:e.zeitraumBis||null,date:invoiceDate(d)};})
    .sort(function(a,b){return String(a.date).localeCompare(String(b.date));});
  if(!invs.length)return "";
  var withBetrag=invs.filter(function(i){return i.betrag!=null;});
  var mini="";
  if(withBetrag.length>=2){
    var max=Math.max.apply(null,withBetrag.map(function(i){return i.betrag;}))||1;
    mini='<div class="invmini">'+withBetrag.map(function(i){return '<span class="imb" style="height:'+Math.max(6,Math.round(i.betrag/max*100))+'%" title="'+fmtEur(i.betrag)+'"></span>';}).join("")+'</div>';
  }
  var sum=withBetrag.reduce(function(s,i){return s+i.betrag;},0);
  var avg=withBetrag.length?sum/withBetrag.length:null;
  /* Jahresvergleich: Summe/Anzahl/Durchschnitt je Jahr, Delta auf den Schnitt (fair bei laufendem Jahr) */
  var ys=invoiceYears(withBetrag.map(function(i){return {b:i.betrag,date:i.date};}));
  var yKeys=Object.keys(ys).sort().reverse();
  var yBlock="";
  if(yKeys.length>=2){
    var heuteJahr=todayISO().slice(0,4);
    yBlock='<div class="yearcmp">'+yKeys.map(function(j,idx){
      var s=ys[j],prev=ys[yKeys[idx+1]],delta="";
      if(prev){
        var aC=s.sum/s.n,aP=prev.sum/prev.n,d=aC-aP;
        delta=deltaBadge(d,fmtEur(Math.abs(d))+" je Rechnung ("+fmtPct(aP?d/aP*100:0)+")");
      }
      return '<div class="yrow"><b>'+j+(j===heuteJahr?'<span class="muted" style="font-weight:400"> (läuft)</span>':"")+'</b><span>'+fmtEur(s.sum)+' · '+s.n+' Rechnung'+(s.n===1?"":"en")+' · ⌀ '+fmtEur(s.sum/s.n)+'</span>'+delta+'</div>';
    }).join("")+'</div>';
  }
  var rows=invs.slice().reverse().map(function(i,idx,arr){
    var e=i.doc.extracted||{};
    var per=(i.von&&i.bis)?(fmtDate(i.von)+" – "+fmtDate(i.bis)):(i.bis?("bis "+fmtDate(i.bis)):fmtDate(i.date));
    /* Delta gegenüber der zeitlich vorherigen Rechnung */
    var prev=null;var pos=invs.indexOf(i);if(pos>0)prev=invs[pos-1];
    var delta="";
    if(i.betrag!=null&&prev&&prev.betrag!=null){
      var d=i.betrag-prev.betrag;
      var cls=d>0.005?"up":(d<-0.005?"down":"same");
      var arrow=d>0.005?"▲":(d<-0.005?"▼":"■");
      delta='<span class="invdelta '+cls+'">'+arrow+" "+fmtEur(Math.abs(d))+'</span>';
    }
    return '<div class="invrow"><div class="invp"><div class="invper">'+escapeHtml(per)+'</div><div class="invd">'+escapeHtml(docTitle(i.doc))+'</div></div>'+
      '<div class="invb">'+(i.betrag!=null?fmtEur(i.betrag):"–")+delta+'</div>'+
      '<button class="ghost" data-action="doc-view" data-id="'+i.doc.id+'" style="flex:none;font-size:.8rem;padding:6px 10px">👁️</button></div>';
  }).join("");
  var head=withBetrag.length?('<p class="muted" style="font-size:.85rem;margin:0 0 6px">'+withBetrag.length+' Rechnungen'+(avg!=null?' · ⌀ '+fmtEur(avg):"")+' · gesamt '+fmtEur(sum)+'</p>'):"";
  return '<section class="card"><h2 class="sect">🧾 Monatsrechnungen</h2>'+head+yBlock+mini+rows+'</section>';
}

  if(cols.kosten!=null&&cols.kosten>3000&&cols.kosten_intervall==="monatlich")
    warns.push("Monatliche Kosten von "+fmtEur(cols.kosten)+" sind ungewöhnlich hoch – Tippfehler?");
  if(!editId){
    var dup=CONTRACTS.find(function(x){return x.status==="aktiv"&&x.kategorie===cols.kategorie&&(x.anbieter||"").trim().toLowerCase()===anbieter.toLowerCase();});
    if(dup)warns.push("Es gibt bereits einen aktiven "+katInfo(cols.kategorie).label+"-Vertrag von „"+(dup.anbieter||"?")+"“"+(dup.produkt?" ("+dup.produkt+")":"")+".");
  }
  if(warns.length&&!confirm("🎩 Der Butler ist stutzig:\n\n• "+warns.join("\n• ")+"\n\nTrotzdem speichern?"))return;
  saveBusy=true;
  try{
    var id=await saveContractData(cols,editId);
    if(pendingDoc&&!editId){try{var du={contract_id:id};if(cols.person_id)du.person_id=cols.person_id;await sb.from("documents").update(du).eq("id",pendingDoc);}catch(e){}}
    pendingDoc=null;formPrefill=null;formPerson="";var wasEdit=!!editId;editId=null;
    await loadFromDB();
    detailId=id;activeView="contract-detail";renderApp();
    toast(wasEdit?"Vertrag aktualisiert ✅":"Vertrag angelegt ✅");
  }catch(e){toast("Speichern fehlgeschlagen: "+errMsg(e),true);}
  finally{saveBusy=false;}
}

/* ---- Filter-/Sortier-Helfer (für alle Bereiche) ---- */
function docSortDate(d){return String((isMed(d)?d.behandlungsdatum:d.doc_date)||d.doc_date||d.behandlungsdatum||d.created_at||"").slice(0,10);}
function docYear(d){var s=docSortDate(d);return s?s.slice(0,4):"";}
function yearsOf(list){var y={};list.forEach(function(d){var j=docYear(d);if(j)y[j]=1;});return Object.keys(y).sort().reverse();}
function sortDocs(list,sort){
  var l=list.slice();
  if(sort==="name_asc")l.sort(function(a,b){return String(a.filename||"").localeCompare(String(b.filename||""));});
  else if(sort==="date_asc")l.sort(function(a,b){return docSortDate(a).localeCompare(docSortDate(b));});
  else l.sort(function(a,b){return docSortDate(b).localeCompare(docSortDate(a));}); /* date_desc default */
  return l;
}
function sortOptions(cur){
  var opts=[["date_desc","Neueste zuerst"],["date_asc","Älteste zuerst"],["name_asc","Name A–Z"]];
  return opts.map(function(o){return '<option value="'+o[0]+'"'+(cur===o[0]?" selected":"")+'>↕ '+o[1]+'</option>';}).join("");
}
function yearOptions(list,cur){
  return '<option value="">Alle Jahre</option>'+yearsOf(list).map(function(j){return '<option value="'+j+'"'+(cur===j?" selected":"")+'>'+j+'</option>';}).join("");
}
/* ---- Dokumente ---- */
/* Welche Angaben fehlen dem Dokument noch? (als sichtbare Badges) */
/* Welche Dokumente SOLLTEN einem Vertrag / einer Person zugeordnet sein?
   Gemeinsame Definition für To-Do-Badges (docGaps) UND Butler-Tipps – sonst
   zeigt das To-Do dauerhaft Dokumente, die dort gar nicht hingehören. */
function docNeedsContract(d){return !isMed(d)&&["vertrag","rechnung","police","preisaenderung","kuendigung"].indexOf(d.doc_type)>=0;}
function docNeedsPerson(d){return isMed(d)||["vertrag","rechnung","police"].indexOf(d.doc_type)>=0;}
function docGaps(d){
  var g=[];
  if(d.ki_pending)g.push('<span class="badge red">⏳ KI ausstehend</span>');
  if(docNeedsContract(d)&&!d.contract_id)g.push('<span class="badge amber">🔗 ohne Vertrag</span>');
  if(PERSONS.length&&docNeedsPerson(d)&&!d.person_id)g.push('<span class="badge amber">👤 ohne Person</span>');
  return g;
}

function viewGesundheit(){
  var meds=filterPerson(DOCS).filter(isMed);

      '<div class="btnrow"><button class="primary" data-nav="add">➕ Arzt-Dokument hochladen</button></div></section>';
  }
  /* KPI: Arztkosten laufendes Jahr (gefiltert) */
  var jahr=todayISO().slice(0,4);
  var kostenJahr=meds.reduce(function(s,d){var dt=(d.behandlungsdatum||d.doc_date||"");return (d.betrag!=null&&String(dt).slice(0,4)===jahr)?s+Number(d.betrag):s;},0);
  var kostenGesamt=meds.reduce(function(s,d){return d.betrag!=null?s+Number(d.betrag):s;},0);
  /* Filter-Optionen aus vorhandenen Fachrichtungen/Typen/Ärzten */
  var fachSet={},typSet={},arztSet={};meds.forEach(function(d){if(d.fachrichtung)fachSet[d.fachrichtung]=1;if(d.med_typ)typSet[d.med_typ]=1;if(d.arzt)arztSet[d.arzt]=1;});
  var fachOpts='<option value="">Alle Fachrichtungen</option>'+Object.keys(fachSet).map(function(f){return '<option value="'+f+'"'+(medFilter.fach===f?" selected":"")+'>'+fachInfo(f).icon+' '+fachInfo(f).label+'</option>';}).join("");
  var typOpts='<option value="">Alle Arten</option>'+Object.keys(typSet).map(function(tk){return '<option value="'+tk+'"'+(medFilter.typ===tk?" selected":"")+'>'+medTypInfo(tk).label+'</option>';}).join("");
  var arztOpts='<option value="">Alle Ärzte/Praxen</option>'+Object.keys(arztSet).sort().map(function(a){return '<option value="'+escapeHtml(a)+'"'+(medFilter.arzt===a?" selected":"")+'>'+escapeHtml(a)+'</option>';}).join("");
  var filtered=meds.filter(function(d){
    if(medFilter.fach&&d.fachrichtung!==medFilter.fach)return false;
    if(medFilter.typ&&d.med_typ!==medFilter.typ)return false;
    if(medFilter.arzt&&(d.arzt||"")!==medFilter.arzt)return false;
    if(medFilter.jahr&&docYear(d)!==medFilter.jahr)return false;
    return true;
  });
  /* nach Fachrichtung gruppieren, je Gruppe nach gewählter Sortierung */
  var groups={};
  filtered.forEach(function(d){var f=d.fachrichtung||"sonstiges";(groups[f]=groups[f]||[]).push(d);});
  var order=Object.keys(groups).sort(function(a,b){return fachInfo(a).label.localeCompare(fachInfo(b).label);});
  var body=order.map(function(f){
    var fa=fachInfo(f),rows=sortDocs(groups[f],medFilter.sort);
    var sum=rows.reduce(function(s,d){return d.betrag!=null?s+Number(d.betrag):s;},0);
    return '<div class="medgroup"><div class="medghead">'+fa.icon+' '+escapeHtml(fa.label)+' <span class="fcount">· '+rows.length+' Dok.'+(sum>0?' · '+fmtEur(sum):"")+'</span></div>'+
      '<section class="card" style="padding:8px 16px">'+rows.map(medRow).join("")+'</section></div>';
  }).join("");
  var kpi='<div class="kpis"><div class="kpi"><div class="klabel">Arztkosten '+jahr+'</div><div class="kval">'+fmtEur(kostenJahr)+'</div><div class="ksub">'+meds.length+' Dokumente</div></div>'+
    '<div class="kpi"><div class="klabel">Kosten gesamt</div><div class="kval">'+fmtEur(kostenGesamt)+'</div><div class="ksub">erfasst</div></div></div>';
  var aktiv=(medFilter.fach||medFilter.typ||medFilter.arzt||medFilter.jahr);
  var hasBetrag=meds.some(function(d){return d.betrag!=null;});
  return personBar()+kpi+
    (hasBetrag?'<div class="btnrow" style="margin:-4px 0 14px"><button class="ghost" data-action="tax-export">📄 Steuer-Übersicht (CSV)</button></div>':"")+
    '<div class="medfilter"><select id="mf_fach">'+fachOpts+'</select><select id="mf_arzt">'+arztOpts+'</select><select id="mf_typ">'+typOpts+'</select><select id="mf_jahr">'+yearOptions(meds,medFilter.jahr)+'</select><select id="mf_sort">'+sortOptions(medFilter.sort)+'</select>'+(aktiv?'<button class="ghost" data-action="mf-reset">Filter zurücksetzen</button>':"")+'</div>'+
    (filtered.length?body:'<section class="card"><p class="muted">Keine Dokumente für diesen Filter.</p></section>')+
    '<button class="bigadd" data-nav="add">➕ &nbsp;Arzt-Dokument hinzufügen</button>';
}
/* Steuer-Übersicht: Arztkosten je Person/Jahr als CSV (außergewöhnliche Belastungen) */
function healthTaxExport(){
  var meds=DOCS.filter(function(d){return isMed(d)&&d.betrag!=null;});
  if(!meds.length){toast("Keine Arztkosten mit Betrag erfasst.",true);return;}
  meds=meds.slice().sort(function(a,b){return String(docSortDate(a)).localeCompare(String(docSortDate(b)));});
  function pn(id){var p=personById(id);return p?p.name:"—";}
  function esc(s){s=String(s==null?"":s);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
  function eur(n){return Number(n).toFixed(2).replace(".",",");}
  var rows=[["Jahr","Datum","Person","Arzt/Praxis","Fachrichtung","Art","Betrag (EUR)"]];
  meds.forEach(function(d){var dt=docSortDate(d);rows.push([dt.slice(0,4),fmtDate(dt),pn(d.person_id),d.arzt||"",fachInfo(d.fachrichtung||"sonstiges").label,medTypInfo(d.med_typ||"sonstiges").label,eur(d.betrag)]);});
  var agg={};meds.forEach(function(d){var y=docSortDate(d).slice(0,4),k=y+"|"+(d.person_id||"");if(!agg[k])agg[k]={y:y,p:d.person_id,sum:0,n:0};agg[k].sum+=Number(d.betrag);agg[k].n++;});
  rows.push([]);rows.push(["Summen je Jahr und Person"]);rows.push(["Jahr","Person","Anzahl","Summe (EUR)"]);
  Object.keys(agg).sort().forEach(function(k){var a=agg[k];rows.push([a.y,pn(a.p),a.n,eur(a.sum)]);});
  var csv="﻿"+rows.map(function(r){return r.map(esc).join(";");}).join("\r\n");
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="arztkosten-steuer.csv";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
  toast("Steuer-Übersicht als CSV erstellt 📄");
}
