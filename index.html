function vertragFormular(){
  if(!FORM)return "";
  var a=artInfo(FORM.art||"sonstiges"),c=FORM.id?vertragById(FORM.id):null;
  var p=FORM.prefill||{},en=FORM.entwurf||null;
  function v(spalte,extK){
    if(en&&en[spalte]!=null)return en[spalte];
    if(c&&c[spalte]!=null)return c[spalte];
    var pk=extK||spalte;
    return p[pk]!=null?p[pk]:"";
  }
  var det=(en&&en.details)||(c&&c.details)||p.details||{};
  var ivOpts=Object.keys(INTERVALL_LABEL).map(function(k){return [k,ivLabel(k)];});
  var felder=FORM.art?artFelder(a.key):[],genutzt={};
  var pr=artProfil(FORM.art?a.key:"sonstiges"),g=function(f){return pr.felder.indexOf(f)>=0;};
  var KONV={ml:"0 = keine",kf:"0,5 = 2 Wochen",vl:"1 = monatlich"};
  function ph(f){return ' placeholder="'+esc(pr.typ&&pr.typ[f]!=null?t("üblich")+" "+String(pr.typ[f]).replace(".",","):t(KONV[f]))+'"';}
  function feldHtml(fd){
    var typ=fd.t==="date"?"date":((fd.t==="eur"||fd.t==="num")?"number":"text");
    var extra=(FELD_GROSS[fd.k]?' class="inp gross" autocapitalize="characters" spellcheck="false"':"")+
              (FELD_PLATZ[fd.k]?' placeholder="'+esc(FELD_PLATZ[fd.k])+'"':"")+(fd.k==="fin"?' maxlength="17"':"")+
              (fd.k==="malo"?' inputmode="numeric" autocomplete="off" spellcheck="false"':"");
    var html=inp("f_d_"+fd.k,det[fd.k]==null?"":det[fd.k],typ,extra);
    if(FELD_GROSS[fd.k])html=html.replace('<input class="inp" ','<input ');
    return fld(fd.l,html,pr.pf.indexOf(fd.k)>=0);
  }
  var zusatz=felder.map(function(fd,i){
    if(genutzt[fd.k])return "";
    var pf=null;[].concat(FELD_PAARE[fd.k]||[]).some(function(p){pf=felder.filter(function(x){return x.k===p&&!genutzt[x.k];})[0]||null;return !!pf;});
    if(pf){genutzt[pf.k]=1;return '<div class="two">'+feldHtml(fd)+feldHtml(pf)+'</div>';}
    return feldHtml(fd);
  }).join("");
  var titel=c?t("Vertrag bearbeiten"):(FORM.art?a.label:t("Vertrag eintragen"));
  return '<h2 class="mhead">'+(FORM.art?a.icon+' ':"")+esc(titel)+'</h2>'+
    '<form id="vForm" novalidate>'+
    fld(t("Vertragsart"),artAuswahl(FORM.art||""),true)+
    (a.kein_anbieter?"":fld(t(pr.al),inp("f_anbieter",v("anbieter"),"text",' list="anbListe"'),true)+
      '<datalist id="anbListe">'+anbieterListe()+'</datalist>')+
    /* Dinge und Ausweise: die Zusatzfelder SIND der Inhalt – gleich oben */
    (!pr.felder.length&&zusatz?zusatz:"")+
    (g("produkt")?fld(t("Tarif / Produkt"),inp("f_produkt",v("produkt"))):"")+
    (g("kundennummer")||g("vertragsnummer")?'<div class="two">'+
      (g("kundennummer")?fld(t("Kundennummer"),inp("f_kundennummer",v("kundennummer"))):"")+
      (g("vertragsnummer")?fld(t(pr.vn),inp("f_vertragsnummer",v("vertragsnummer"))):"")+
    '</div>':"")+
    (g("kosten")?'<div class="two">'+
      fld(t(pr.kl),inp("f_kosten",v("kosten"),"number"))+
      fld(t("Zahlungsintervall"),sel("f_iv",ivOpts,(en&&en.kosten_intervall)||(c&&c.kosten_intervall)||p.kostenIntervall||pr.iv))+
    '</div>':"")+
    (g("beginn")||g("ml")?'<div class="mgrp">'+t(g("ml")?"Laufzeit & Kündigung":"Laufzeit")+'</div>':"")+
    (g("beginn")?fld(t("Vertragsbeginn"),inp("f_start",v("vertragsstart","vertragsstart"),"date")):"")+
    (g("ml")||g("kf")?'<div class="two">'+
      (g("ml")?fld(t("Mindestlaufzeit (Monate)"),inp("f_ml",v("mindestlaufzeit_monate","mindestlaufzeitMonate"),"number",ph("ml"))):"")+
      (g("kf")?fld(t("Kündigungsfrist (Monate)"),inp("f_kf",v("kuendigungsfrist_monate","kuendigungsfristMonate"),"number",ph("kf"))):"")+
    '</div>':"")+
    (g("vl")?fld(t("Verlängerung (Monate)"),inp("f_vl",v("verlaengerung_monate","verlaengerungMonate"),"number",ph("vl"))):"")+
    (pr.felder.length&&zusatz?'<div class="mgrp">'+t("Zusätzliche Angaben")+'</div>'+zusatz:"")+
    fld(t("Notizen"),'<textarea class="inp" id="f_notizen" rows="2">'+esc(v("notizen"))+'</textarea>')+
    '<div id="fVorschau" class="sug info" hidden><span class="si">'+ic("clock")+'</span><div class="sb2"><div class="sx" id="fVorschauTxt"></div></div></div>'+
    '<p class="pfl-leg"><b class="pfl">*</b> '+t("Pflichtangabe")+'</p>'+
    '<div class="factions">'+
      '<button class="btn lg" type="submit">'+ic("check")+' '+t("Speichern")+'</button>'+
      '<button class="btn ghost" type="button" data-a="modal-close">'+t("Abbrechen")+'</button>'+
    '</div></form>';
}

/* Live-Vorschau: rechnet Frist und Kosten schon beim Tippen */
function formVorschau(){

    mindestlaufzeit_monate:valNum("f_ml"),kuendigungsfrist_monate:valNum("f_kf"),

  box.hidden=!teile.length;
  var txt=$("#fVorschauTxt");if(txt)txt.innerHTML=teile.join("<br>");
}
async function speichereVertrag(){
  if(!FORM)return;
  var gewaehlt=val("f_art");
  if(!gewaehlt){toast(t("Bitte die Vertragsart wählen."),true);var fa=$("#f_art");if(fa){fa.focus();fa.classList.add("bad");}return;}
  if(gewaehlt!==FORM.art){artWechseln(gewaehlt);return;}   /* Felder der neuen Art erst zeigen */
  var a=artInfo(FORM.art),pr=artProfil(a.key);
  var anbieter=a.kein_anbieter?"":val("f_anbieter");
  /* Pflichtfelder: Anbieter (wo es einen gibt) + die Pflicht-Zusatzfelder der Art */
  var pflicht=(a.kein_anbieter?[]:["f_anbieter"]).concat(pr.pf.map(function(f){return "f_d_"+f;}));
  var leer=pflicht.filter(function(id){return $("#"+id)&&!val(id);});
  if(leer.length){
    leer.forEach(function(id){$("#"+id).classList.add("bad");});
    $("#"+leer[0]).focus();
    toast(t("Bitte die mit * markierten Felder ausfüllen."),true);return;
  }
  var zahlFelder=["f_kosten","f_ml","f_kf","f_vl"].concat(artFelder(a.key)
    .filter(function(fd){return fd.t==="eur"||fd.t==="num";}).map(function(fd){return "f_d_"+fd.k;}));
  if(zahlFehlt(zahlFelder)){toast(t("Bitte eine Zahl eingeben, z. B. 9,90."),true);return;}
  /* MaLo-ID: Tippfehler fallen über die Prüfziffer auf */
  var maloEl=$("#f_d_malo");
  if(maloEl&&val("f_d_malo")&&!maloNorm(val("f_d_malo"))){maloEl.classList.add("bad");maloEl.focus();toast(t("Die MaLo-ID hat 11 Ziffern, die letzte ist eine Prüfziffer – bitte prüfen."),true);return;}
  /* Details: Felder der Art aus dem Formular; Angaben, die die Art nicht kennt
     (z. B. nach einem Art-Wechsel), bleiben erhalten statt still zu verschwinden. */
  var altDet=(FORM.id&&vertragById(FORM.id)&&vertragById(FORM.id).details)||{};
  var det=Object.assign({},altDet);
  artFelder(a.key).forEach(function(fd){
    var raw=val("f_d_"+fd.k);
    delete det[fd.k];
    if(!raw)return;
    if(fd.k==="kennzeichen")raw=kzNorm(raw);
    else if(fd.k==="malo")raw=maloNorm(raw)||raw;
    else if(FELD_GROSS[fd.k])raw=raw.toUpperCase().replace(/\s+/g,"");
    det[fd.k]=(fd.t==="eur"||fd.t==="num")?numOrNull(raw):raw;
  });
  /* Ohne Anbieter (Ausweis, Fahrzeug): der Name kommt aus den Angaben */
  var name=[det.marke,det.modell].filter(Boolean).join(" ");
  var spalten={
    art:a.key,
    anbieter:anbieter||(a.kein_anbieter?(det.inhaber||name||det.kennzeichen||a.label):null),
    notizen:val("f_notizen")||null,
    details:Object.keys(det).length?det:null
  };
  /* Grundfelder nur, wenn das Profil sie zeigt – sonst bleiben vorhandene Werte unberührt */
  var g=function(f){return pr.felder.indexOf(f)>=0;};
  if(g("produkt"))spalten.produkt=val("f_produkt")||null;
  if(g("kundennummer"))spalten.kundennummer=val("f_kundennummer")||null;
  if(g("vertragsnummer"))spalten.vertragsnummer=val("f_vertragsnummer")||null;
  if(g("kosten")){spalten.kosten=valNum("f_kosten");spalten.kosten_intervall=val("f_iv")||"monatlich";}
  if(g("beginn"))spalten.vertragsstart=val("f_start")||null;
  if(g("ml"))spalten.mindestlaufzeit_monate=valNum("f_ml");
  if(g("kf"))spalten.kuendigungsfrist_monate=valNum("f_kf");
  if(g("vl"))spalten.verlaengerung_monate=valNum("f_vl");
  /* Ganzzahl-Spalten runden, egal woher der Wert kommt */
  ["mindestlaufzeit_monate","verlaengerung_monate"].forEach(function(k){
    if(spalten[k]!=null)spalten[k]=Math.round(spalten[k]);
  });
  /* Plausibilität: warnen, nie blockieren */
  var warn=[];
  if(spalten.kuendigungsfrist_monate!=null&&spalten.mindestlaufzeit_monate>0&&spalten.kuendigungsfrist_monate>spalten.mindestlaufzeit_monate)
    warn.push(tf("Die Kündigungsfrist ({0}) ist länger als die Mindestlaufzeit.",fristTxt(spalten.kuendigungsfrist_monate)));
  if(spalten.vertragsstart&&spalten.vertragsstart>addMonthsISO(todayISO(),18))
    warn.push(tf("Der Vertragsbeginn liegt weit in der Zukunft ({0}).",fmtDate(spalten.vertragsstart)));
  if(spalten.kosten!=null&&spalten.kosten>3000&&spalten.kosten_intervall==="monatlich")
    warn.push(tf("Monatliche Kosten von {0} sind ungewöhnlich hoch – Tippfehler?",eur(spalten.kosten)));
  if(!FORM.id&&a.einzig&&vertraegeDerArt(a.key).some(function(c){return vertragPhase(c)==="laufend";}))
    warn.push(tf("Für „{0}“ gibt es schon einen aktiven Vertrag. Doppelt versichert?",a.label));
  warn=warn.concat(fahrzeugWarnungen(det));
  if(warn.length&&!confirm("🏠 "+t("All-Home ist stutzig:")+"\n\n• "+warn.join("\n• ")+"\n\n"+t("Trotzdem speichern?")))return;
  try{
    if(FORM.id){
      var r=await sb.from("contracts").update(spalten).eq("id",FORM.id).select("id");
      if(r.error)throw r.error;
      if(!r.data||!r.data.length)throw new Error(t("Nichts gespeichert – fehlende Berechtigung oder der Vertrag ist weg."));
    }else{
      spalten.household_id=HH.id;spalten.status="aktiv";
      var r2=await sb.from("contracts").insert(spalten).select("id").single();
      if(r2.error)throw r2.error;
      FORM.id=r2.data.id;
    }
    /* Ein mitgebrachtes Dokument gleich verknüpfen */
    if(FORM.prefill&&(FORM.prefill._docIds||FORM.prefill._docId)){
      var dids=FORM.prefill._docIds||[FORM.prefill._docId];
      for(var di=0;di<dids.length;di++){try{await sb.from("documents").update({contract_id:FORM.id}).eq("id",dids[di]);}catch(e){}}
    }
    /* Die Art muss angehakt sein, sonst wäre der Vertrag unsichtbar */
    if(!artAktiv(a.key)){
      try{await speichereSetup(aktiveArten().concat([a.key]),true);}catch(e){}
    }
    var zielId=FORM.id;
    FORM=null;closeModal(true);
    await ladeDaten();
    toast(t("Gespeichert")+" ✅");
    go("#/vertrag?id="+zielId);
  }catch(e){toast(t("Speichern fehlgeschlagen")+": "+errMsg(e),true);}
}

async function loescheVertrag(id){
  var c=vertragById(id);if(!c)return;
  if(!confirm(tf("Vertrag „{0}“ wirklich löschen? Zugeordnete Dokumente bleiben im Archiv.",c.anbieter||artInfo(c.art).label)))return;
  try{
    var r=await sb.from("contracts").delete().eq("id",id).select("id");
    if(r.error)throw r.error;
    if(!r.data||!r.data.length)throw new Error(t("Es wurde nichts gelöscht – fehlende Berechtigung oder der Vertrag ist schon weg."));
    await ladeDaten();
    toast(t("Vertrag gelöscht ✅"));
    go("#/vertraege");
  }catch(e){toast(t("Löschen fehlgeschlagen")+": "+errMsg(e),true);}
}

/* ================= Kalender-Export (.ics) ================= */
function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function icsExport(id){
  var c=vertragById(id);if(!c)return;
  var f=fristInfo(c);
  if(!f.lastDay){toast(t("Für diesen Vertrag ist keine Frist berechenbar."),true);return;}
  var a=artInfo(c.art||"sonstiges");
  var name=(c.anbieter||a.label)+(c.produkt?" – "+c.produkt:"");
  var dt=f.lastDay.replace(/-/g,"");
  var stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  var zeilen=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//All-Home//DE","BEGIN:VEVENT",
    "UID:allhome-"+c.id+"-"+dt+"@all-home","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+dt,
    "SUMMARY:"+icsEsc("⏰ "+tf("Kündigungsfrist: {0}",name)),
    "DESCRIPTION:"+icsEsc(tf("Letzter Kündigungstag für {0}. Kündbar zum {1} – ohne Kündigung verlängert sich der Vertrag.",name,fmtDate(f.end))),
    "BEGIN:VALARM","TRIGGER:-P14D","ACTION:DISPLAY",
    "DESCRIPTION:"+icsEsc(tf("In 14 Tagen: Kündigungsfrist {0}",name)),"END:VALARM",
    "END:VEVENT","END:VCALENDAR"];
  var blob=new Blob([zeilen.join("\r\n")],{type:"text/calendar;charset=utf-8"});
  lade(blob,"kuendigungsfrist-"+(c.anbieter||"vertrag").toLowerCase().replace(/[^a-z0-9]+/g,"-")+".ics");
  toast(t("Kalender-Datei erstellt 📅"));
}
function lade(blob,name){
  if(istApp()){appSpeichern(blob,name);return;}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
}

/* ================= Dokumente =================
   Dokumente hängen am Vertrag. Die KI liest sie aus, All-Home schlägt die
   Zuordnung vor – gespeichert wird erst, wenn du bestätigst. */
function dtInfo(k){var o=DOCTYPE[k]||DOCTYPE.sonstiges;return {icon:o.icon,label:t(o.label)};}
function docTitel(d){return (d&&aiVal(d,"titel"))||(d&&d.filename)||t("Dokument");}
function docDatum(d){return d.doc_date||String(d.created_at||"").slice(0,10);}
function istMed(d){return d.bereich==="medizin";}

/* ---- Zweisprachige KI-Texte (ai_lang + i18n) ---- */
function aiLangOf(r){return (r&&r.ai_lang)||"de";}
function aiVal(r,key){
  if(!r)return null;
  if(curLang===aiLangOf(r))return r[key];
  var box=r.i18n&&r.i18n[curLang];
  var v=box?box[key]:null;
  return (v==null||v==="")?r[key]:v;
}
function aiExt(d,key){
  var ext=(d&&d.extracted)||{};
  if(!d||curLang===aiLangOf(d))return ext[key];
  var box=d.i18n&&d.i18n[curLang];
  var v=box?box[key]:null;
  return (v==null||v===""||(Array.isArray(v)&&!v.length))?ext[key]:v;
}

      '<span class="go">'+ic("right",16)+'</span></button>';
  }).join("");
  /* Dokumenten-Lücken: welche Unterlage fehlt? */
  var vorhanden={};doks.forEach(function(d){vorhanden[d.doc_type]=1;});
  var soll=(c.art==="fahrzeug")?{fahrzeugschein:"Fahrzeugschein"}:(hatFristen(c.art)?SOLL_DOKS:{});
  var luecken=Object.keys(soll).filter(function(k){

      '<span class="db"><span class="dn">'+t(soll[k])+' '+t("fehlt")+'</span>'+

  if(!zeilen&&!luecken)return '<p class="hint">'+t("Noch keine Dokumente zugeordnet.")+'</p>';
  return '<div class="dlist">'+zeilen+luecken+'</div>';

/* Bild verkleinern (1-GB-Grenze im Speicher) */
function bildKlein(file){
  return new Promise(function(ok,fehler){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=1800,w=img.naturalWidth,h=img.naturalHeight;
      var s=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement("canvas");cv.width=Math.round(w*s);cv.height=Math.round(h*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){b?ok(b):fehler(new Error(t("Bild konnte nicht verarbeitet werden.")));},"image/jpeg",0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);fehler(new Error(t("Bildformat wird nicht unterstützt. Bitte JPG, PNG oder PDF.")));};
    img.src=url;
  });
}
function bytesBase64(bytes){
  var bin="",chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(bin);
}
/* Supabase-Storage verträgt nur ASCII im Pfad */
function pfadName(name){
  var s=String(name||"dokument");
  try{s=s.normalize("NFC");}catch(e){}
  s=s.replace(/[äöüÄÖÜß]/g,function(c){return {"ä":"ae","ö":"oe","ü":"ue","Ä":"Ae","Ö":"Oe","Ü":"Ue","ß":"ss"}[c];});
  try{s=s.normalize("NFKD").replace(/[̀-ͯ]/g,"");}catch(e){}
  return s.replace(/[^A-Za-z0-9._\-]+/g,"_").slice(-80);
}
function netzFehler(e){
  var m=errMsg(e).toLowerCase();
  if(m.indexOf("failed to fetch")>=0||m.indexOf("load failed")>=0||m.indexOf("network")>=0||m.indexOf("timeout")>=0)
    return t("Netzwerkfehler beim Hochladen – bitte Verbindung prüfen und erneut versuchen.");
  return errMsg(e);
}
async function hochladenMitWiederholung(pfad,bytes,mime){
  var letzter=null;
  for(var i=0;i<3;i++){
    if(i)await new Promise(function(r){setTimeout(r,700*i);});
    try{
      var up=await sb.storage.from(BUCKET).upload(pfad,bytes,{contentType:mime,upsert:false});
      if(!up.error)return up;
      if(i>0&&/exist|dupli|409/i.test(errMsg(up.error)))return {data:{path:pfad},error:null};
      letzter=up.error;
      if(netzFehler(up.error)===errMsg(up.error))return up;  /* echter Fehler: nicht wiederholen */
    }catch(e){letzter=e;}
  }
  return {error:letzter};
}

async function dateienVerarbeiten(files,ziel){
  files=Array.prototype.slice.call(files||[]).filter(Boolean);
  if(!files.length)return;
  if(!HH){toast(t("Kein Haushalt aktiv."),true);return;}
  if(IMPORT.laeuft){toast(t("Es läuft bereits ein Import."),true);return;}
  IMPORT={laeuft:true,abbruch:false,gesamt:files.length,fertig:0,ergebnisse:[],guthabenLeer:false};
  REVIEW=null;
  for(var i=0;i<files.length;i++){
    IMPORT.fertig=i;
    zeigeArbeit(files.length>1?tf("Dokument {0} von {1} wird gelesen …",i+1,files.length)
                              :t("All-Home liest das Dokument … (10–30 Sek.)"));
    try{await einesVerarbeiten(files[i],ziel);}
    catch(e){IMPORT.ergebnisse.push({name:files[i].name||t("Datei"),icon:"⚠️",text:errMsg(e)});}
  }
  await ladeDaten();
  /* Nebenkostenabrechnungen gleich dem passenden Zeitraum zuordnen (oder ihn anlegen) */
  await nkNachUpload(IMPORT.ergebnisse.map(function(r){return r.docId;}).filter(Boolean),zeigeArbeit);
  /* Am Vertrag hochgeladen: leere Vertragsfelder gleich aus dem Dokument füllen */
  if(ziel&&ziel.vertrag){
    var ergU=await vertragErgaenzen(ziel.vertrag,IMPORT.ergebnisse.map(function(r){return r.docId;}).filter(Boolean));
    if(ergU.length){await ladeDaten();toast(tf("Ergänzt: {0}",ergU.join(", "))+" ✅");}
  }
  IMPORT.laeuft=false;versteckeArbeit();
  /* Genau ein Dokument → direkt zur Bestätigung (Nebenkosten: zur Abrechnung), sonst Sammelbericht */
  var einz=IMPORT.ergebnisse.length===1&&IMPORT.ergebnisse[0].docId?DOCS.filter(function(d){return d.id===IMPORT.ergebnisse[0].docId;})[0]||null:null;
  if(einz&&einz.nk_id){IMPORT.ergebnisse=[];nkZugeordnetMelden(einz.nk_id);go("#/nebenkosten?id="+einz.nk_id);return;}
  if(einz){REVIEW=einz;IMPORT.ergebnisse=[];}
  render();
}
async function einesVerarbeiten(file,ziel){
  var istPdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name||"");
  if(!istPdf&&!ALLOWED_IMG[file.type]&&!/^image\//.test(file.type))
    throw new Error(t("Format nicht unterstützt (nur PDF oder Foto)."));
  if(istPdf&&file.size>12*1024*1024)throw new Error(t("PDF größer als 12 MB"));
  var blob=file,mime=file.type||"application/pdf",name=file.name||("scan-"+Date.now()+".jpg");
  if(!istPdf){blob=await bildKlein(file);mime="image/jpeg";name=name.replace(/\.[^.]+$/,"")+".jpg";}

  var bytes=new Uint8Array(await blob.arrayBuffer());
  /* Dubletten über den Inhalt erkennen: kein Upload, keine KI-Kosten */
  var hash=null;
  try{
    var hb=await crypto.subtle.digest("SHA-256",bytes);
    hash=Array.prototype.map.call(new Uint8Array(hb),function(x){return x.toString(16).padStart(2,"0");}).join("");
  }catch(e){}
  if(hash){
    var dup=DOCS.filter(function(d){return d.content_hash===hash;})[0];
    if(dup){
      IMPORT.ergebnisse.push({name:name,icon:"⏭️",
        text:tf("übersprungen – gleich wie „{0}“",dup.filename||"?"),docId:null});
      return;
    }
  }
  var pfad=HH.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,7)+"_"+pfadName(name);
  var up=await hochladenMitWiederholung(pfad,bytes,mime);
  if(up.error)throw new Error(netzFehler(up.error));
  var ins=await sb.from("documents").insert({
    household_id:HH.id,filename:name,storage_path:pfad,mime_type:mime,
    size_bytes:bytes.length,doc_type:"sonstiges",content_hash:hash,
    contract_id:(ziel&&ziel.vertrag)||null
  }).select("*").single();
  if(ins.error){
    try{await sb.storage.from(BUCKET).remove([pfad]);}catch(e){}
    throw new Error(netzFehler(ins.error));
  }
  var reihe=ins.data,ext=null;
  if(ziel&&ziel.art&&ARTEN[ziel.art])ZIEL_ART_DOK[reihe.id]=ziel.art;
  /* KI-Auslesung */
  try{
    var antwort=await edgeRuf(EDGE_EXTRACT,{fileBase64:bytesBase64(bytes),mimeType:mime,model:kiStufe(),lang:curLang});
    ext=antwort.dokument||null;
  }catch(e){
    if(e&&e.code==="ki_guthaben"){
      IMPORT.guthabenLeer=true;
      try{await sb.from("documents").update({ki_pending:true}).eq("id",reihe.id);}catch(_e){}
      IMPORT.ergebnisse.push({name:name,icon:"⏳",text:t("gespeichert – KI-Guthaben leer, Analyse später"),docId:reihe.id});
      return;
    }
    if(nkKiGesperrt(e)){
      try{await sb.from("documents").update({ki_pending:true}).eq("id",reihe.id);}catch(_e){}
      IMPORT.ergebnisse.push({name:name,icon:"⏳",text:t("gespeichert – Analyse später")+": "+errMsg(e),docId:reihe.id});
      return;
    }
    IMPORT.ergebnisse.push({name:name,icon:"⚠️",text:t("abgelegt, aber KI-Analyse fehlgeschlagen"),docId:reihe.id});
    return;
  }
  if(!ext){
    IMPORT.ergebnisse.push({name:name,icon:"⚠️",text:t("abgelegt, nichts erkannt"),docId:reihe.id});
    return;
  }
  try{await sb.from("documents").update(kiFelder(ext,name,false)).eq("id",reihe.id);}catch(e){}
  /* Arztdokument: Volltext für die Suche im Hintergrund (günstigstes Modell) */
  if(ext.istMedizin){if(istPdf)volltextAusPdf(reihe.id,bytes);else volltextHolen(reihe.id,[bytes],"");}
  IMPORT.ergebnisse.push({name:name,icon:"✅",text:t("eingelesen"),docId:reihe.id});
}
/* Was die KI gelesen hat → Spalten des Dokuments. med: im Gesundheitsbereich gescannt */
function kiFelder(ext,name,med){
  var upd={extracted:ext,ai_lang:curLang,
    doc_type:(ext.docType&&DOCTYPE[ext.docType])?ext.docType:"sonstiges",
    doc_date:ext.datum||null,zusammenfassung:ext.zusammenfassung||null,
    titel:(ext.titel||name||"").slice(0,80)};
  if(ext.istMedizin||med){
    upd.bereich="medizin";
    upd.fachrichtung=(ext.fachrichtung&&FACH[ext.fachrichtung])?ext.fachrichtung:"sonstiges";
    upd.arzt=ext.arzt||null;
    upd.med_typ=(ext.medTyp&&MEDTYP[ext.medTyp])?ext.medTyp:(ext.docType==="rechnung"?"rechnung":"sonstiges");
    upd.betrag=ext.betrag!=null?numOrNull(ext.betrag):null;
    upd.behandlungsdatum=ext.datum||null;
  }
  return upd;
}
/* Edge-Function aufrufen und Guthaben-/Fehlercode herausziehen */
async function edgeRuf(fn,body){
  body=Object.assign({household_id:HH?HH.id:null},body);
  var r=await sb.functions.invoke(fn,{body:body});
  if(r.error){
    var code=null,msg=null;
    try{
      if(r.error.context&&typeof r.error.context.json==="function"){
        var jb=await r.error.context.json();
        if(jb){code=jb.code||null;msg=jb.error||null;}
      }
    }catch(e){}
    var err=new Error(msg||errMsg(r.error));err.code=code;throw err;
  }
  var b=r.data||{};
  if(b.error){var e2=new Error(b.error);e2.code=b.code||null;throw e2;}
  return b;
}

/* ================= Bestätigung nach dem Einlesen ================= */
/* Welche Art passt zu dem, was die KI gelesen hat?
   Reihenfolge der Belege (der erste eindeutige gewinnt):
   1. die feine Art, die die KI selbst aus dem Katalog gewählt hat (ext.art, ab butler-extract v21)
   2. Stichwörter in Produkt und Titel   3. Stichwörter im Anbieternamen
   4. die grobe KI-Kategorie – die Zusammenfassung zählt nur, wenn diese nichts Genaues sagt.
   Stichwörter stehen zentral in ART_REGELN: „teil“ = irgendwo im Wort (lange, eindeutige Stämme,
   auch in Zusammensetzungen wie Privathaftpflicht), „wort“ = nur am Wortanfang, „ganz“ = nur als ganzes Wort,
   „nicht“ = schließt die Regel aus. So steckt „gez“ nicht mehr in „eingezogen“, „auto“ nicht in „automatisch“,
   „verein“ nicht in „Vereinbarung“. Texte werden vorher vereinheitlicht (ä→ae, Satzzeichen→Leerzeichen). */
var ART_REGELN=[
  /* Ausweise zuerst: das Dokument IST der Eintrag */
  ["fuehrerschein",{teil:["fuehrerschein","fahrerlaubnis"]}],
  ["personalausweis",{teil:["personalausweis"]}],
  ["reisepass",{teil:["reisepass"]}],
  ["fahrzeug",{teil:["zulassungsbescheinigung","fahrzeugbrief","fahrzeugschein"]}],
  /* Versicherungen: die engen vor den weiten */
  ["tierhalter",{teil:["tierhalter","hundehaftpflicht","pferdehaftpflicht"]}],
  ["tierkranken",{teil:["tierkranken","hundekranken","katzenkranken","tier op versicherung"]}],
  ["kfz_steuer",{teil:["kraftfahrzeugsteuer","kfz steuer","kfzsteuer"]}],
  ["kfz_vers",{teil:["kfz versicherung","kfzversicherung","kfz haftpflicht","autoversicherung","kraftfahrtversicherung","kraftfahrzeugversicherung","teilkasko","vollkasko"],ganz:["kfz"]}],
  ["haftpflicht",{teil:["privathaftpflicht","haftpflichtversicherung","privat haftpflicht"],ganz:["phv","haftpflicht"],
    nicht:["kfz","kraftfahr","tierhalter","hundehaft","pferdehaft","bauherr","gewaesserschaden","oeltank","berufshaft","betriebshaft","vermoegensschaden"]}],
  ["hausrat",{teil:["hausrat"]}],
  ["wohngebaeude",{teil:["wohngebaeude","gebaeudeversicherung"]}],
  ["rechtsschutz",{teil:["rechtsschutz"],nicht:["schadenersatz rechtsschutz","schadensersatz rechtsschutz"]}],
  ["bu",{teil:["berufsunfaehig","erwerbsunfaehig"]}],
  ["unfall",{teil:["unfallversicherung","unfallvers","unfallschutz","unfallpolice"]}],
  ["zahnzusatz",{teil:["zahnzusatz","zahnersatzvers","zahnversicherung","zahnschutz"]}],

function artText(s){
  s=String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
  return " "+s.replace(/[^a-z0-9]+/g," ").trim()+" ";
}
/* Erste passende Regel für einen (vereinheitlichten) Text, sonst null */
function stichwortArt(s){
  if(!s||s.length<3)return null;
  for(var i=0;i<ART_REGELN.length;i++){
    var r=ART_REGELN[i][1];
    if(r.nicht&&r.nicht.some(function(w){return s.indexOf(w)>=0;}))continue;
    if((r.teil&&r.teil.some(function(w){return s.indexOf(w)>=0;}))||
       (r.wort&&r.wort.some(function(w){return s.indexOf(" "+w)>=0;}))||
       (r.ganz&&r.ganz.some(function(w){return s.indexOf(" "+w+" ")>=0;})))
      return ARTEN[ART_REGELN[i][0]]?ART_REGELN[i][0]:null;
  }
  return null;
}

function artUngenau(a){return !a||a==="sonstiges"||a==="vers_sonst"||a==="verein";}
function artAusExtrakt(ext){
  if(!ext)return "sonstiges";
  if(ext.istMedizin)return "sonstiges";
  if(ext.docType==="fahrzeugschein")return "fahrzeug";
  /* Die groben KI-Kategorien auf den feinen Katalog abbilden */
  var karte={strom:"strom",gas:"gas",wasser:"wasser",internet:"internet",mobilfunk:"mobilfunk",
    streaming:"streaming_video",bank:"girokonto",kfz:"kfz_vers",wohnen:"miete",
    mitgliedschaft:"verein",versicherung:"vers_sonst",gesundheit:"kranken"};
  var grob=karte[ext.kategorie]||"sonstiges";
  var ki=(ext.art&&ext.art!=="sonstiges"&&ARTEN[ext.art])?ext.art:null;
  if(ki&&!artUngenau(ki))return ki;
  var fein=stichwortArt(artText((ext.produkt||"")+" "+(ext.titel||"")))||stichwortArt(artText(ext.anbieter));
  if(fein)return fein;
  var basis=ki||grob;
  if(artUngenau(basis)){
    var ausText=stichwortArt(artText(ext.zusammenfassung));
    if(ausText)return ausText;

}

  if(!ext)return null;

  if(nr)return {c:nr,grund:"nummer"};

    var ca=(c.anbieter||"").trim().toLowerCase();
    if(!ca)return false;

    return passt&&(c.art===art||artInfo(c.art).g===artInfo(art).g);

function findeVertrag(ext){var f=findeVertragMitGrund(ext);return f?f.c:null;}

      e.details=e.details||{};Object.keys(x[k]).forEach(function(j){if(leerWert(e.details[j])&&!leerWert(x[k][j]))e.details[j]=x[k][j];});return;

function dokTaugtFuerVertrag(d,art){

  if(dt==="vertrag"||dt==="police"||dt==="fahrzeugschein")return true;

function anbieterPasst(c,ext){
  if(!c||!ext||artInfo(c.art||"sonstiges").kein_anbieter)return true;
  if(nummerGleich(c.kundennummer,ext.kundennummer)||nummerGleich(c.vertragsnummer,ext.vertragsnummer))return true;
  return anbieterGleich(c.anbieter,ext.anbieter)!==false;
}
/* ---- Abgleich: was die KI gelesen hat ↔ was im Vertrag steht ----
   Leere Felder sind vorab angehakt, Abweichungen nicht – ein Lesefehler soll
   nie unbemerkt einen richtigen Wert überschreiben. */
function leerWert(v){return v==null||v==="";}
/* Nummern und Kennzeichen: Schreibweise egal („9430 8559“ = „94308559“, „FB SK 1990“ = „FB-SK 1990“) */
var ABGLEICH_KOMPAKT={kundennummer:1,vertragsnummer:1,kennzeichen:1,fin:1,hsn:1,tsn:1,iban:1,zaehlernummer:1,rufnummer:1,mitgliedsnummer:1};
function kompakt(v){return String(v==null?"":v).toUpperCase().replace(/[\s\-\/.]/g,"");}
function wertGleich(a,b,feld){
  if(leerWert(a)&&leerWert(b))return true;
  if(feld&&ABGLEICH_KOMPAKT[feld])return kompakt(a)===kompakt(b);
  var na=numOrNull(a),nb=numOrNull(b);
  if((typeof a==="number"||typeof b==="number")&&na!=null&&nb!=null)return Math.abs(na-nb)<0.005;
  return String(a==null?"":a).replace(/\s+/g," ").trim().toLowerCase()===String(b==null?"":b).replace(/\s+/g," ").trim().toLowerCase();
}
function feldText(f,v){
  if(leerWert(v))return "";
  if(f.t==="date")return fmtDate(v);
  if(f.t==="eur")return eur(numOrNull(v));
  if(f.t==="num"&&numOrNull(v)!=null)return num(numOrNull(v),3);
  return String(v);
}
function abgleichZeilen(c,ext){
  var art=c.art||"sonstiges",ap=artProfil(art),z=[];
  function zeile(k,label,alt,neu,altTxt,neuTxt,spalten,details){
    if(leerWert(neu)||wertGleich(alt,neu,k.replace(/^d_/,"")))return;
    z.push({k:k,label:label,alt:altTxt!=null?altTxt:(leerWert(alt)?"":String(alt)),neu:neuTxt!=null?neuTxt:String(neu),
            an:leerWert(alt),spalten:spalten||null,details:details||null});
  }
  function monate(v){var n=numOrNull(v);return n==null?null:n;}
  function monTxt(v){return v==null?"":(v===0?t("keine"):tn(v,"{0} Monat","{0} Monate"));}
  /* Anbieter nur, wenn der Vertrag noch keinen hat – „Telekom“ gegen „Telekom Deutschland GmbH“ wäre nur Rauschen,
     und ein wirklich anderer Anbieter löst vorher die Warnung aus */
  if(!artInfo(art).kein_anbieter&&ext.anbieter&&leerWert(c.anbieter))zeile("anbieter",t(ap.al),c.anbieter,ext.anbieter,null,null,{anbieter:String(ext.anbieter).trim()});
  if(grundfeld(art,"produkt"))zeile("produkt",t("Tarif / Produkt"),c.produkt,ext.produkt,null,null,{produkt:ext.produkt});
  if(grundfeld(art,"kundennummer"))zeile("kundennummer",t("Kundennummer"),c.kundennummer,ext.kundennummer,null,null,{kundennummer:ext.kundennummer});
  if(grundfeld(art,"vertragsnummer")){
    zeile("vertragsnummer",t(ap.vn),c.vertragsnummer,ext.vertragsnummer,null,null,{vertragsnummer:ext.vertragsnummer});
    /* Vor butler-extract v22 stand bei Rechnungen oft die Rechnungsnummer hier – dann nicht vorab anhaken */
    var lz=z[z.length-1];if(lz&&lz.k==="vertragsnummer"&&ext.docType==="rechnung"&&!("rechnungsnummer" in ext))lz.an=false;
  }
  if(grundfeld(art,"beginn")&&/^\d{4}-\d{2}-\d{2}$/.test(String(ext.vertragsstart||"")))
    zeile("beginn",t("Vertragsbeginn"),c.vertragsstart,ext.vertragsstart,leerWert(c.vertragsstart)?"":fmtDate(c.vertragsstart),fmtDate(ext.vertragsstart),{vertragsstart:ext.vertragsstart});
  var ml=monate(ext.mindestlaufzeitMonate),kf=monate(ext.kuendigungsfristMonate),vl=monate(ext.verlaengerungMonate);
  if(grundfeld(art,"ml")&&ml!=null)zeile("ml",t("Mindestlaufzeit"),c.mindestlaufzeit_monate,ml,monTxt(c.mindestlaufzeit_monate),monTxt(ml),{mindestlaufzeit_monate:Math.round(ml)});
  if(grundfeld(art,"kf")&&kf!=null)zeile("kf",t("Kündigungsfrist"),c.kuendigungsfrist_monate,kf,monTxt(c.kuendigungsfrist_monate),monTxt(kf),{kuendigungsfrist_monate:kf});
  if(grundfeld(art,"vl")&&vl!=null)zeile("vl",t("Verlängerung"),c.verlaengerung_monate,vl,monTxt(c.verlaengerung_monate),monTxt(vl),{verlaengerung_monate:Math.round(vl)});
  var k=numOrNull(ext.kosten);
  if(grundfeld(art,"kosten")&&k!=null){
    var iv=(ext.kostenIntervall&&INTERVALL_LABEL[ext.kostenIntervall])?ext.kostenIntervall:(c.kosten_intervall||ap.iv||"monatlich");
    var altIv=c.kosten_intervall||"monatlich";
    if(!(wertGleich(c.kosten,k)&&altIv===iv)){
      var teurer=c.kosten!=null&&INTERVALL[iv]&&INTERVALL[altIv]&&(k/INTERVALL[iv])>(Number(c.kosten)/INTERVALL[altIv])+0.004;
      z.push({k:"kosten",label:t(ap.kl).replace(/\s*\(€\)$/,""),alt:c.kosten==null?"":eur(Number(c.kosten))+" "+t(INTERVALL_LABEL[altIv]),
        neu:eur(k)+" "+t(INTERVALL_LABEL[iv]),an:c.kosten==null,spalten:{kosten:k,kosten_intervall:iv},teurer:teurer});
    }
  }
  var det=detailsAusExtrakt(ext,art),vorher=c.details||{};
  artFelder(art).forEach(function(f){
    if(det[f.k]==null)return;
    var d1={};d1[f.k]=det[f.k];
    zeile("d_"+f.k,f.l,vorher[f.k],det[f.k],feldText(f,vorher[f.k]),feldText(f,det[f.k]),null,d1);
  });
  return z;
}
function abgleichAktuell(d,c,ext){
  if(!d||!c||!/^(preisaenderung|vertrag|police)$/.test((ext&&ext.docType)||""))return false;
  var dd=docDatum(d)||"";
  /* nur Dokumente, die Konditionen festlegen – eine spätere Rechnung ändert keinen Preis */
  return !DOCS.some(function(x){return x.id!==d.id&&x.contract_id===c.id&&/^(preisaenderung|vertrag|police)$/.test((x.extracted&&x.extracted.docType)||"")&&(docDatum(x)||"")>dd;});
}
function abgleichKarte(c,ext){
  var zeilen=abgleichZeilen(c,ext),name=esc(c.anbieter||artInfo(c.art).label);
  /* Ist das Dokument die neueste Preisänderung/Police/Vertragsfassung, gilt sie: Abweichungen vorab anhaken (bestätigt wird trotzdem) */
  if(REVIEW_WAHL==null){var akt=abgleichAktuell(REVIEW,c,ext);REVIEW_WAHL={};zeilen.forEach(function(z){REVIEW_WAHL[z.k]=z.an||(akt&&z.k!=="anbieter");});}
  if(!zeilen.length)return '<div class="sect">'+tf("Abgleich mit „{0}“",name)+'</div><section class="card">'+
    '<div class="sug good"><span class="si">'+ic("check")+'</span><div class="sb2"><div class="st">'+t("Alles stimmt mit dem Vertrag überein.")+'</div></div></div>'+
    '<div class="factions"><button class="btn" data-a="rv-fertig">'+t("Zum Vertrag")+'</button></div></section>';
  var n=zeilen.filter(function(z){return REVIEW_WAHL[z.k];}).length,teurer=zeilen.some(function(z){return z.teurer;});
  return '<div class="sect">'+tf("Abgleich mit „{0}“",name)+'</div><section class="card">'+
    '<p class="hint" style="margin:0 0 10px">'+t("Angehakt wird übernommen. Abweichende Werte bitte prüfen.")+'</p>'+
    '<div class="abgl">'+zeilen.map(function(z){
      var an=!!REVIEW_WAHL[z.k];
      return '<button class="abz'+(an?" an":"")+'" data-a="ab-zeile" data-k="'+esc(z.k)+'" role="checkbox" aria-checked="'+an+'">'+
        '<span class="wbox">'+(an?ic("check",16):"")+'</span>'+
        '<span class="abt"><span class="abl">'+esc(z.label)+'</span>'+
        '<span class="abw">'+(z.alt?'<s>'+esc(z.alt)+'</s> → ':'')+'<b>'+esc(z.neu)+'</b></span></span></button>';
    }).join("")+'</div>'+
    (teurer?'<div class="sug warn" style="margin-top:12px"><span class="si">'+ic("alert")+'</span><div class="sb2"><div class="st">'+t("Der Preis steigt")+'</div>'+
      '<div class="sx">'+t("Bei einer Preiserhöhung besteht oft ein Sonderkündigungsrecht – meist 4 Wochen ab Zugang des Schreibens.")+'</div></div></div>':"")+
    '<div class="factions">'+
      '<button class="btn" data-a="rv-uebernehmen"'+(n?"":" disabled")+'>'+ic("check")+' '+(n?tn(n,"{0} Angabe übernehmen","{0} Angaben übernehmen"):t("Nichts angehakt"))+'</button>'+
      '<button class="btn ghost" data-a="rv-fertig">'+t("Nichts übernehmen")+'</button>'+
    '</div></section>';
}
async function abgleichUebernehmen(){
  var d=REVIEW;if(!d)return;
  var c=hatVertrag(d)?vertragById(d.contract_id):null;if(!c)return;
  var upd={},det=null;
  abgleichZeilen(c,d.extracted||{}).forEach(function(z){
    if(!REVIEW_WAHL||!REVIEW_WAHL[z.k])return;
    if(z.spalten)Object.keys(z.spalten).forEach(function(k){upd[k]=z.spalten[k];});
    if(z.details){det=det||Object.assign({},c.details||{});Object.keys(z.details).forEach(function(k){det[k]=z.details[k];});}
  });
  if(det)upd.details=det;
  if(!Object.keys(upd).length){abgleichFertig();return;}
  try{
    var r=await sb.from("contracts").update(upd).eq("id",c.id).select("id");
    if(r.error)throw r.error;
    if(!r.data||!r.data.length)throw new Error(t("Es wurde nichts geändert – fehlende Berechtigung?"));
    await ladeDaten();toast(t("Übernommen")+" ✅");abgleichFertig();
  }catch(e){toast(t("Speichern fehlgeschlagen")+": "+errMsg(e),true);}
}
/* Was die zugeordneten Dokumente zu LEEREN Feldern des Vertrags beitragen – neueste Angabe zuerst, nie überschreiben.
   Abweichende Werte bleiben dem Abgleich (zum Abhaken); Dokumente eines anderen Anbieters zählen nicht. */
function ergaenzungPlan(c,ids){
  var stand=Object.assign({},c,{details:Object.assign({},c.details||{})}),upd={},zeilen=[];
  DOCS.filter(function(d){return ids.indexOf(d.id)>=0&&d.contract_id===c.id&&d.extracted&&!istMed(d)&&!d.extracted.istMedizin;})
    .sort(function(a,b){var x=docDatum(a)||"",y=docDatum(b)||"";return x===y?0:(x<y?1:-1);})
    .forEach(function(d){
      if(!anbieterPasst(c,d.extracted))return;
      abgleichZeilen(stand,d.extracted).forEach(function(z){
        if(!z.an)return;
        if(z.spalten)Object.keys(z.spalten).forEach(function(k){upd[k]=z.spalten[k];stand[k]=z.spalten[k];});
        if(z.details){Object.keys(z.details).forEach(function(k){stand.details[k]=z.details[k];});upd.details=stand.details;}
        zeilen.push({label:z.label,neu:z.neu});
      });
    });
  return {upd:upd,zeilen:zeilen};
}
/* Beim Zuordnen: leere Felder gleich füllen. Liefert die Namen der ergänzten Felder. */
async function vertragErgaenzen(cid,ids){
  var c=cid&&vertragById(cid);if(!c||!ids||!ids.length)return [];
  var p=ergaenzungPlan(c,ids);if(!p.zeilen.length)return [];
  try{
    var r=await sb.from("contracts").update(p.upd).eq("id",c.id).select("id");
    if(r.error||!r.data||!r.data.length)return [];
  }catch(e){return [];}
  return p.zeilen.map(function(z){return z.label;});
}
function ergaenztText(namen,grund){return namen.length?tf("{0} · ergänzt: {1}",grund,namen.join(", ")):grund+" ✅";}
/* Knopf am Vertrag: Angaben aus allen zugeordneten Dokumenten übernehmen */
async function vertragAusDokumenten(id){
  var namen=await vertragErgaenzen(id,DOCS.filter(function(d){return d.contract_id===id;}).map(function(d){return d.id;}));
  await ladeDaten();render();
  toast(namen.length?tf("Ergänzt: {0}",namen.join(", "))+" ✅":t("Nichts zu ergänzen"));
}
function abgleichFertig(){
  var d=REVIEW,cid=d&&d.contract_id;

}

  /* Fehlt die Fassung in der aktiven Sprache, im Hintergrund nachholen */
  uebersetzeDok(id).then(function(ok){if(ok)render();});
  var ext=d.extracted||{},ty=dtInfo(d.doc_type);

      '<div class="st">'+t("Ohne KI abgelegt")+'</div><div class="sx">'+t("Auslesen lässt sich jederzeit nachholen.")+'</div>'+
      '<div class="sa"><button class="btn" data-a="d-reanalyze" data-id="'+d.id+'">'+ic("sparkles")+' '+t("Jetzt auslesen")+'</button></div>'+
    '</div></div>':"")+
    (aiVal(d,"zusammenfassung")?'<p>'+esc(aiVal(d,"zusammenfassung"))+'</p>':"")+
    (Array.isArray(wichtig)&&wichtig.length?'<ul class="hint" style="padding-left:20px">'+wichtig.map(function(w){return '<li>'+esc(w)+'</li>';}).join("")+'</ul>':"")+

async function dokumentAnzeigen(id){
  var d=DOCS.filter(function(x){return x.id===id;})[0];if(!d)return;
  var pfade=[d.storage_path].concat(d.weitere_seiten||[]).filter(Boolean);
  if(pfade.length>1){bildBetrachter(d,pfade);return;}
  if(istApp()){appDokAnsicht(d);return;}
  try{
    var r=await sb.storage.from(BUCKET).createSignedUrl(d.storage_path,120);
    if(r.error)throw r.error;
    window.open(r.data.signedUrl,"_blank","noopener");
  }catch(e){toast(t("Konnte Dokument nicht öffnen")+": "+errMsg(e),true);}
}
/* Betrachter für Dokumente aus mehreren Bildern – blättern, einzeln im Tab öffnen */
var BB=null;
async function bildBetrachter(d,pfade){
  try{
    var r=await sb.storage.from(BUCKET).createSignedUrls(pfade,300);
    if(r.error)throw r.error;
    BB={urls:(r.data||[]).map(function(x){return x.signedUrl;}),i:0};

      '<div class="bbnav"><button class="ibtn" data-a="bb" data-r="-1" id="bbZ" disabled aria-label="'+esc(t("Vorherige Seite"))+'">'+ic("left")+'</button>'+
        '<span id="bbN">'+tf("Seite {0} von {1}",1,BB.urls.length)+'</span>'+

      '<div class="factions"><button class="btn ghost" data-a="bb-tab">'+ic(istApp()?"extern":"share")+' '+(istApp()?t("Seite öffnen mit …"):t("Seite in neuem Tab öffnen"))+'</button>'+

function bbBlaettern(r){
  if(!BB)return;var n=BB.urls.length,i=Math.max(0,Math.min(n-1,BB.i+r));if(i===BB.i)return;BB.i=i;
  var b=$("#bbBild");if(b){b.src=BB.urls[i];b.alt=tf("Seite {0}",i+1);}
  var nn=$("#bbN");if(nn)nn.textContent=tf("Seite {0} von {1}",i+1,n);
  var z=$("#bbZ"),v=$("#bbV");if(z)z.disabled=!i;if(v)v.disabled=i>=n-1;
}
async function dokumentLoeschen(id){
  var d=DOCS.filter(function(x){return x.id===id;})[0];if(!d)return;
  if(!confirm(tf("Dokument „{0}“ endgültig löschen?",d.filename||"?")))return;
  try{
    /* erst die Datei, nur bei Erfolg der Eintrag – sonst bliebe die Datei unbemerkt liegen */
    if(d.storage_path){
      var rm=await sb.storage.from(BUCKET).remove([d.storage_path].concat(d.weitere_seiten||[]));
      if(rm&&rm.error)throw rm.error;
    }
    /* gelöschte Zeilen zurückgeben lassen: ohne Berechtigung meldet die Schnittstelle
       sonst „Erfolg“ mit 0 Zeilen, und es sähe gelöscht aus, obwohl nichts passiert ist */
    var r=await sb.from("documents").delete().eq("id",id).select("id");
    if(r.error)throw r.error;
    if(!r.data||!r.data.length)throw new Error(t("Es wurde nichts gelöscht – fehlende Berechtigung oder das Dokument ist schon weg."));
    closeModal(true);await ladeDaten();render();
    toast(t("Dokument gelöscht ✅"));
  }catch(e){toast(t("Löschen fehlgeschlagen")+": "+errMsg(e),true);}
}

/* Zugeordnet ist nur, was an einem Vertrag DIESES Hauses hängt – ein Verweis auf

/* Noch nicht ausgelesen: ausdrücklich markiert oder die KI lief nie durch (z. B. Tagesbudget aufgebraucht, Netzfehler) */

/* Schreibweisen eines Suchworts: Umlaute und ß auch umschrieben (Straße ↔ Strasse, Kündigung ↔ Kuendigung) */
function suchVarianten(w){
  var v=[w];
  [w.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss"),
   w.replace(/ae/g,"ä").replace(/oe/g,"ö").replace(/ue/g,"ü"),
   w.replace(/ss/g,"ß")].forEach(function(x){if(v.indexOf(x)<0)v.push(x);});
  return v;
}
/* Volltext in der Datenbank: jedes Wort muss vorkommen, die Reihenfolge ist egal
   („Telekom Rechnung“ findet auch „Rechnung … Telekom“). Zeichen, die die Filtersprache
   von PostgREST stören, fallen weg. */
async function volltextSuche(q){
  if(!HH||String(q).trim().length<3)return [];
  var woerter=String(q).toLowerCase().replace(/[,()"*%_\\:]/g," ").split(/\s+/).filter(function(w){return w.length>=2;}).slice(0,6);
  if(!woerter.length)return [];
  try{
    var abfrage=sb.from("documents").select("id").eq("household_id",HH.id);
    woerter.forEach(function(w){abfrage=abfrage.or(suchVarianten(w).map(function(x){return "volltext.ilike.*"+x+"*";}).join(","));});
    var r=await abfrage.limit(50);
    return r&&!r.error?(r.data||[]).map(function(x){return x.id;}):[];
  }catch(e){return [];}
}

/* Live-Suche ohne neu zu zeichnen – der Begriff bleibt für die nächste Zeichnung stehen */
function dokFilter(q){
  DOK_Q=String(q||"");var nq=DOK_Q.trim().toLowerCase(),treffer=0;
  document.querySelectorAll("#dliste>[data-such]").forEach(function(z){
    var ja=!nq||String(z.getAttribute("data-such")).indexOf(nq)>=0;z.hidden=!ja;if(ja)treffer++;
  });
  var leer=$("#dleer");if(leer)leer.hidden=!!treffer;
  clearTimeout(VT_UHR);
  if(nq.length<3)return;
  VT_UHR=setTimeout(function(){
    volltextSuche(nq).then(function(ids){
      if(DOK_Q.trim().toLowerCase()!==nq)return;
      VT_CACHE={q:nq,ids:{}};ids.forEach(function(id){VT_CACHE.ids[id]=1;});
      var mehr=0;
      document.querySelectorAll("#dliste>[data-dok]").forEach(function(z){if(z.hidden&&VT_CACHE.ids[z.getAttribute("data-dok")]){z.hidden=false;mehr++;}});
      if(mehr){var l=$("#dleer");if(l)l.hidden=true;}
    });
  },300);
}

/* Datei eines Dokuments für die KI: Scan-Seiten als Bilder, sonst das PDF */
async function dokQuelle(d){
  if((d.weitere_seiten||[]).length||/^image\//.test(d.mime_type||""))return {bilder:await bilderDesDokuments(d)};
  var dl=await sb.storage.from(BUCKET).download(d.storage_path);
  if(dl.error)throw new Error(t("Datei konnte nicht geladen werden."));
  var pdf=new Uint8Array(await dl.data.arrayBuffer());
  if(pdf.length>14*1024*1024)throw new Error(t("Datei zu groß für die Analyse (max. ca. 14 MB)."));
  return {pdf:pdf};
}
/* Alle noch nicht ausgelesenen Dokumente nacheinander lesen. Danach zeigt „Ohne Vertrag“ die Vorschläge:
   passender Vertrag → zuordnen, sonst neuer Vertrag aus dem Dokument (Dokumente hängen danach automatisch daran). */
async function analyseAlleNachholen(){
  var liste=dokumenteOhneKi();if(!liste.length||NACHHOLEN)return;
  NACHHOLEN=true;var gut=[],stopp=null,fehler=0;
  try{
    for(var i=0;i<liste.length;i++){
      nkArbeit(tf("Dokument {0} von {1} wird gelesen …",i+1,liste.length));
      var erg;
      try{erg=await kiAuslesen(liste[i],await dokQuelle(liste[i]),false,true);}catch(e){erg="fehler";}
      if(erg==="ok")gut.push(liste[i]);else if(erg==="fehler")fehler++;else{stopp=erg;break;}
    }
    closeModal(true);await ladeDaten();
    var ergN=[];
    for(var j=0;j<gut.length;j++)if(gut[j].contract_id&&vertragById(gut[j].contract_id))ergN=ergN.concat(await vertragErgaenzen(gut[j].contract_id,[gut[j].id]));
    if(ergN.length)await ladeDaten();
    go("#/dokumente?f=ohne");render();
    if(stopp)toast((gut.length?tn(gut.length,"{0} Dokument ausgelesen","{0} Dokumente ausgelesen")+" · ":"")+stopp,true);
    else toast(gut.length?ergaenztText(ergN,tn(gut.length,"{0} Dokument ausgelesen","{0} Dokumente ausgelesen"))+(fehler?" · "+tn(fehler,"{0} ging nicht","{0} gingen nicht"):""):t("Nichts ausgelesen"),!gut.length);
  }catch(e){closeModal(true);toast(t("Nachholen fehlgeschlagen")+": "+errMsg(e),true);}
  finally{NACHHOLEN=false;}
}

/* ---- Nachübersetzen beim Öffnen ---- */
var transBusy={};
async function uebersetzeDok(id){
  var d=DOCS.filter(function(x){return x.id===id;})[0];
  if(!d||curLang===aiLangOf(d)||transBusy[id])return false;
  var ext=d.extracted||{},quelle={};
  if(d.titel)quelle.titel=d.titel;
  if(d.zusammenfassung)quelle.zusammenfassung=d.zusammenfassung;
  if(Array.isArray(ext.wichtig)&&ext.wichtig.length)quelle.wichtig=ext.wichtig;
  if(ext.hinweise)quelle.hinweise=ext.hinweise;
  if(ext.behandlung)quelle.behandlung=ext.behandlung;
  if(d.med_recherche)quelle.med_recherche=d.med_recherche;
  var keys=Object.keys(quelle);if(!keys.length)return false;
  var box=(d.i18n&&d.i18n[curLang])||{};
  var fehlt=keys.some(function(k){var v=box[k];return v==null||v===""||(Array.isArray(v)&&!v.length);});
  if(!fehlt)return false;
  transBusy[id]=true;
  try{
    var b=await edgeRuf(EDGE_TRANS,{texte:quelle,ziel:curLang,quelle:aiLangOf(d),model:"basic"});
    if(!b.uebersetzung)return false;
    var neu=Object.assign({},d.i18n||{});
    neu[curLang]=Object.assign({},neu[curLang]||{},b.uebersetzung);
    var r=await sb.from("documents").update({i18n:neu}).eq("id",id);
    if(r.error)throw r.error;
    d.i18n=neu;return true;
  }catch(e){return false;}
  finally{transBusy[id]=false;}
}

function medTypInfo(k){var o=MEDTYP[k]||MEDTYP.sonstiges;return {icon:o.icon,label:t(o.label)};}
function personById(id){return PERSONS.filter(function(p){return p.id===id;})[0]||null;}

var medFilter={fach:"",jahr:"",person:"",ansicht:"zeit",ereignis:"",q:""};

};
function ereignisInfo(k){var o=MED_EREIGNIS[k]||MED_EREIGNIS.sonstiges;return {icon:o.icon,label:t(o.label)};}
/* Ohne ausgelesene Ereignisse ist das Dokument selbst das Ereignis */
var MEDTYP_EREIGNIS={rechnung:"behandlung",befund:"untersuchung",rezept:"rezept",attest:"krankschreibung",laborwerte:"labor",
  ueberweisung:"ueberweisung",impfung:"impfung",roentgen:"bildgebung",arztbrief:"untersuchung",sonstiges:"sonstiges"};
function medDatum(d){return String(d.behandlungsdatum||d.doc_date||String(d.created_at||"").slice(0,10)||"");}
function isoTag(v){v=String(v||"").slice(0,10);return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:null;}
function kurzText(v,n){return v==null?"":String(v).replace(/\s+/g," ").trim().slice(0,n||200);}
/* Strukturierte Angaben eines Arztdokuments – geprüft, damit eine kaputte KI-Antwort nichts sprengt */
function medInfo(d){
  var ext=(d&&d.extracted)||{},m=(ext.medizin&&typeof ext.medizin==="object")?ext.medizin:{};
  function liste(a){return Array.isArray(a)?a.filter(function(x){return x&&typeof x==="object";}).slice(0,80):[];}
  return {
    da:!!ext.medizin,
    diagnosen:liste(m.diagnosen).map(function(x){return {text:kurzText(x.text,200),icd:kurzText(x.icd,12)||null};}).filter(function(x){return x.text;}),
    ereignisse:liste(m.ereignisse).map(function(x){return {datum:isoTag(x.datum),art:MED_EREIGNIS[x.art]?x.art:"sonstiges",text:kurzText(x.text,160)};}).filter(function(x){return x.text;}),
    medikamente:liste(m.medikamente).map(function(x){return {name:kurzText(x.name,80),wirkstoff:kurzText(x.wirkstoff,80)||null,dosierung:kurzText(x.dosierung,80)||null};}).filter(function(x){return x.name;}),
    laborwerte:liste(m.laborwerte).map(function(x){return {name:kurzText(x.name,80),wert:kurzText(x.wert,40),einheit:kurzText(x.einheit,20)||null,referenz:kurzText(x.referenz,40)||null,auffaellig:x.auffaellig===true};}).filter(function(x){return x.name;}),
    leistungen:liste(m.leistungen).map(function(x){return {ziffer:kurzText(x.ziffer,20)||null,text:kurzText(x.text,160),betrag:numOrNull(x.betrag)};}).filter(function(x){return x.text;}),
    folgetermin:isoTag(m.folgetermin)
  };
}
/* Ereignisse eines Dokuments; ohne eigenes Datum gilt das Behandlungsdatum */
function medEreignisse(d){
  var mi=medInfo(d),dat=medDatum(d),aus=[];
  mi.ereignisse.forEach(function(e){aus.push({datum:e.datum||dat,art:e.art,text:e.text,d:d});});
  mi.diagnosen.forEach(function(x){
    var k=artText(x.text).trim();
    if(!aus.some(function(e){return e.art==="diagnose"&&artText(e.text).indexOf(k)>=0;}))aus.push({datum:dat,art:"diagnose",text:x.text+(x.icd?" ("+x.icd+")":""),d:d});
  });
  if(mi.folgetermin)aus.push({datum:mi.folgetermin,art:"termin",text:t("Folgetermin"),d:d});
  if(!aus.length)aus.push({datum:dat,art:MEDTYP_EREIGNIS[d.med_typ]||"sonstiges",text:aiExt(d,"behandlung")||aiVal(d,"titel")||medTypInfo(d.med_typ).label,d:d});
  return aus;
}
/* ---- Suche: Titel, Arzt, Fach, Art, Patient, Behandlung, Zusammenfassung, Stichpunkte, Diagnosen, Medikamente,
   Laborwerte, Leistungen – jedes Wort muss vorkommen, Umlaute egal; dazu der Volltext in der Datenbank ---- */
function medSuchtext(d){
  var mi=medInfo(d),ext=d.extracted||{};
  return artText([aiVal(d,"titel"),d.titel,d.arzt,fachInfo(d.fachrichtung||"sonstiges").label,medTypInfo(d.med_typ).label,personName(d.person_id),
    aiExt(d,"behandlung"),aiVal(d,"zusammenfassung"),Array.isArray(ext.wichtig)?ext.wichtig.join(" "):"",fmtDate(medDatum(d)),
    mi.diagnosen.map(function(x){return x.text+" "+(x.icd||"");}).join(" "),mi.ereignisse.map(function(x){return x.text;}).join(" "),
    mi.medikamente.map(function(x){return [x.name,x.wirkstoff,x.dosierung].join(" ");}).join(" "),
    mi.laborwerte.map(function(x){return x.name;}).join(" "),mi.leistungen.map(function(x){return (x.ziffer||"")+" "+x.text;}).join(" ")
  ].filter(Boolean).join(" "));
}
function medWoerter(q){return artText(q).trim().split(" ").filter(Boolean);}
function medTreffer(d,q){var w=medWoerter(q);if(!w.length)return true;var s=medSuchtext(d);return w.every(function(x){return s.indexOf(x)>=0;});}
/* Wo steht der Begriff? Für die Trefferzeile */
function medFundstelle(d,q){
  var w=medWoerter(q);if(!w.length)return "";
  var mi=medInfo(d),kand=[].concat(
    mi.diagnosen.map(function(x){return [t("Diagnose"),x.text+(x.icd?" ("+x.icd+")":"")];}),
    mi.medikamente.map(function(x){return [t("Medikament"),[x.name,x.dosierung].filter(Boolean).join(" · ")];}),
    mi.laborwerte.map(function(x){return [t("Laborwert"),x.name+" "+x.wert+(x.einheit?" "+x.einheit:"")];}),
    mi.leistungen.map(function(x){return [t("Leistung"),(x.ziffer?x.ziffer+" ":"")+x.text];}),
    mi.ereignisse.map(function(x){return [ereignisInfo(x.art).label,x.text];}));
  var f=kand.filter(function(k){var s=artText(k[1]);return w.some(function(x){return s.indexOf(x)>=0;});})[0];
  return f?f[0]+": "+f[1]:"";
}
/* Volltext: welche Arztdokumente haben schon einen (für „noch nicht durchsuchbar“), und Treffer der letzten Suche */
var MED_VT={geladen:false,versucht:false,ids:{},q:"",treffer:{}},MED_UHR=null;
async function medVolltextLaden(neu){
  if(!HH||(MED_VT.versucht&&!neu))return;
  MED_VT.versucht=true;
  try{
    var r=await sb.from("documents").select("id").eq("household_id",HH.id).eq("bereich","medizin").not("volltext","is",null);
    if(r&&!r.error){MED_VT.ids={};(r.data||[]).forEach(function(x){MED_VT.ids[x.id]=1;});MED_VT.geladen=true;
      if(route().name==="gesundheit"&&!route().params.doc)render();}
  }catch(e){}
}
function medUnvollstaendig(d){
  if(d.ki_pending)return false;
  return !(d.extracted&&d.extracted.medizin)||(MED_VT.geladen&&!MED_VT.ids[d.id]);
}
function medSuche(q){
  medFilter.q=String(q||"");
  var box=$("#medInhalt");if(box)box.innerHTML=medInhalt();
  clearTimeout(MED_UHR);
  var nq=medFilter.q.trim();if(nq.length<3)return;
  MED_UHR=setTimeout(function(){
    volltextSuche(nq).then(function(ids){
      if(medFilter.q.trim()!==nq)return;
      MED_VT.q=nq;MED_VT.treffer={};ids.forEach(function(id){MED_VT.treffer[id]=1;});
      var b2=$("#medInhalt");if(b2)b2.innerHTML=medInhalt();
    });
  },300);
}
/* Filter Fach/Person/Jahr – gelten für jede Ansicht */
function medGefiltert(){
  return DOCS.filter(istMed).filter(function(d){
    if(medFilter.fach&&d.fachrichtung!==medFilter.fach)return false;
    if(medFilter.person&&d.person_id!==medFilter.person)return false;
    if(medFilter.jahr&&medDatum(d).slice(0,4)!==medFilter.jahr)return false;
    return true;
  });
}
function medNeuesteZuerst(a,b){return medDatum(b).localeCompare(medDatum(a));}
function medSumme(liste){return liste.reduce(function(s,d){return d.betrag!=null?s+Number(d.betrag):s;},0);}
function medGruppe(icon,name,info,inhalt){
  return '<div class="grp"><span class="gi">'+icon+'</span>'+esc(name)+'<span class="gn">'+esc(info)+'</span></div><section class="card">'+inhalt+'</section>';
}
function medGruppenInfo(liste){var s=medSumme(liste);return tf("{0} Dok.",liste.length)+(s>0?" · "+eur0(s):"");}
/* Arzt/Praxis als Schlüssel: Titel, Initialen und Satzzeichen egal („Dr. med. A. Meier“ = „Praxis Meier“) */
var ARZT_FUELL={dr:1,med:1,dent:1,prof:1,dipl:1,univ:1,praxis:1,herr:1,frau:1,und:1,kollegen:1};
function arztSchluessel(a){return artText(a).trim().split(" ").filter(function(w){return w.length>1&&!ARZT_FUELL[w];}).join(" ");}
function medInhalt(){
  var liste=medGefiltert(),q=medFilter.q.trim();
  if(q){
    var vt=MED_VT.q===q?MED_VT.treffer:{};
    var tr=liste.filter(function(d){return medTreffer(d,q)||vt[d.id];}).sort(medNeuesteZuerst);
    return tr.length?'<section class="card">'+tr.map(function(d){return medZeile(d,medFundstelle(d,q)||(vt[d.id]&&!medTreffer(d,q)?t("im Text des Dokuments"):""));}).join("")+'</section>'
      :'<section class="card"><p class="hint">'+tf("Nichts gefunden für „{0}“.",esc(q))+'</p></section>';
  }
  if(!liste.length)return '<section class="card"><p class="hint">'+t("Keine Dokumente für diese Auswahl.")+'</p></section>';
  var a=medFilter.ansicht,gr={},keys=[];
  function dazu(k,d){if(!gr[k]){gr[k]=[];keys.push(k);}gr[k].push(d);}
  if(a==="aerzte"){
    liste.slice().sort(medNeuesteZuerst).forEach(function(d){dazu(arztSchluessel(d.arzt)||"~",d);});
    return keys.map(function(k){
      var l=gr[k],d0=l[0],fa=fachInfo(d0.fachrichtung||"sonstiges");
      return medGruppe(fa.icon,d0.arzt||t("Ohne Arztangabe"),medGruppenInfo(l)+" · "+tf("zuletzt {0}",fmtDate(medDatum(d0))),l.map(function(d){return medZeile(d);}).join(""));
    }).join("");
  }
  if(a==="art"){
    liste.forEach(function(d){dazu(MEDTYP[d.med_typ]?d.med_typ:"sonstiges",d);});
    return Object.keys(MEDTYP).filter(function(k){return gr[k];}).map(function(k){
      var mt=medTypInfo(k),l=gr[k].sort(medNeuesteZuerst);
      return medGruppe(mt.icon,mt.label,medGruppenInfo(l),l.map(function(d){return medZeile(d);}).join(""));
    }).join("");
  }
  if(a==="ereignisse")return medEreignisListe(liste);
  /* Zeitleiste: nach Jahren, neueste oben */
  liste.slice().sort(medNeuesteZuerst).forEach(function(d){dazu(medDatum(d).slice(0,4)||"–",d);});
  return keys.map(function(j){var l=gr[j];return medGruppe("📅",j,medGruppenInfo(l),l.map(function(d){return medZeile(d);}).join(""));}).join("");
}
/* Ereignisse, Diagnosen, Medikamente, Laborwerte über alle (gefilterten) Dokumente */
function medEreignisListe(liste){
  var f=medFilter.ereignis,zeilen=[];
  liste.forEach(function(d){
    var mi=medInfo(d),dat=medDatum(d),wer=[d.arzt,personName(d.person_id)].filter(Boolean).join(" · ");
    if(f==="medikamente")mi.medikamente.forEach(function(x){zeilen.push({datum:dat,icon:"💊",text:x.name+(x.dosierung?" · "+x.dosierung:""),info:[x.wirkstoff,wer].filter(Boolean).join(" · "),d:d});});
    else if(f==="laborwerte")mi.laborwerte.forEach(function(x){zeilen.push({datum:dat,icon:x.auffaellig?"⚠️":"🧪",text:x.name+": "+x.wert+(x.einheit?" "+x.einheit:""),
      info:[x.referenz?tf("Referenz {0}",x.referenz):"",x.auffaellig?t("auffällig"):"",wer].filter(Boolean).join(" · "),d:d});});
    else if(f==="diagnosen")mi.diagnosen.forEach(function(x){zeilen.push({datum:dat,icon:"📋",text:x.text,info:[x.icd,wer].filter(Boolean).join(" · "),d:d});});
    else medEreignisse(d).forEach(function(e){if(!f||e.art===f)zeilen.push({datum:e.datum,icon:ereignisInfo(e.art).icon,text:e.text,info:[ereignisInfo(e.art).label,wer].filter(Boolean).join(" · "),d:d});});
  });
  if(!zeilen.length)return '<section class="card"><p class="hint">'+t("Keine Einträge für diese Auswahl.")+'</p></section>';
  zeilen.sort(function(a,b){return String(b.datum).localeCompare(String(a.datum));});
  var gr={},keys=[];
  zeilen.forEach(function(z){var j=String(z.datum).slice(0,4)||"–";if(!gr[j]){gr[j]=[];keys.push(j);}gr[j].push(z);});
  return keys.map(function(j){
    return medGruppe("📅",j,tn(gr[j].length,"{0} Eintrag","{0} Einträge"),gr[j].map(function(z){
      return '<button class="drow3" data-a="med-open" data-id="'+z.d.id+'"><span class="di">'+z.icon+'</span>'+
        '<span class="db"><span class="dn">'+esc(z.text)+'</span><span class="dm"><span>'+fmtDate(z.datum)+'</span>'+(z.info?'<span>'+esc(z.info)+'</span>':"")+'</span></span>'+
        '<span class="go">'+ic("right",16)+'</span></button>';
    }).join(""));
  }).join("");
}

    return '<div class="cause"><b>'+esc(x.text)+'</b>'+(x.icd?' <span class="pill">'+esc(x.icd)+'</span>':"")+'</div>';}).join(""));
  if(mi.ereignisse.length)teile.push('<div class="mgrp">🗓️ '+t("Ereignisse")+'</div>'+mi.ereignisse.map(function(x){

    return '<div class="cause"><b>'+esc(x.name)+'</b>'+((x.wirkstoff||x.dosierung)?'<div class="hint">'+esc([x.wirkstoff,x.dosierung].filter(Boolean).join(" · "))+'</div>':"")+'</div>';}).join(""));
  if(mi.laborwerte.length)teile.push('<div class="mgrp">🧪 '+t("Laborwerte")+'</div>'+mi.laborwerte.map(function(x){
    return '<div class="cause'+(x.auffaellig?" auff":"")+'"><b>'+esc(x.name)+': '+esc(x.wert)+(x.einheit?" "+esc(x.einheit):"")+'</b>'+(x.auffaellig?' <span class="pill warnp">'+t("auffällig")+'</span>':"")+
      (x.referenz?'<div class="hint">'+tf("Referenz {0}",esc(x.referenz))+'</div>':"")+'</div>';}).join(""));
  if(mi.leistungen.length)teile.push('<div class="mgrp">🧾 '+t("Leistungen")+'</div>'+mi.leistungen.map(function(x){

}
/* ---- Nachholen: Diagnosen/Ereignisse (KI) und Volltext für ältere Arztdokumente ----
   Nur extracted.medizin wird ergänzt – von Hand geänderte Felder (Arzt, Datum, Patient …) bleiben. */
var MED_NACH=false;
async function medNachholen(ids){
  if(MED_NACH)return;
  var liste=DOCS.filter(function(d){return istMed(d)&&(ids?ids.indexOf(d.id)>=0:medUnvollstaendig(d));});
  if(!liste.length)return;
  MED_NACH=true;var fertig=0,abbruch=null;
  nkArbeit(t("Dokumente werden vorbereitet …"));
  try{
    for(var i=0;i<liste.length&&!abbruch;i++){
      var d=liste[i];
      nkArbeitText(liste.length>1?tf("Dokument {0} von {1} wird erschlossen …",i+1,liste.length):t("All-Home liest das Dokument … (10–30 Sek.)"));
      try{
        var bild=(d.weitere_seiten||[]).length||/^image\//.test(d.mime_type||""),bilder=null,pdf=null;
        if(bild)bilder=await bilderDesDokuments(d);
        else{var dl=await sb.storage.from(BUCKET).download(d.storage_path);if(dl.error)throw new Error(t("Datei konnte nicht geladen werden."));pdf=new Uint8Array(await dl.data.arrayBuffer());}
        if(!(d.extracted&&d.extracted.medizin)){
          var body={model:kiStufe(),lang:curLang};
          if(pdf){if(pdf.length>14*1024*1024)throw new Error(t("Datei zu groß für die Analyse (max. ca. 14 MB)."));body.fileBase64=bytesBase64(pdf);body.mimeType="application/pdf";}
          else{body.bilder=bilderFuerKi(bilder.slice(0,SCAN_KI_SEITEN));body.mimeType="image/jpeg";}
          var ext=(await edgeRuf(EDGE_EXTRACT,body)).dokument||{};
          var neu=Object.assign({},d.extracted||{},{medizin:(ext.medizin&&typeof ext.medizin==="object")?ext.medizin:{}});
          if(!neu.behandlung&&ext.behandlung)neu.behandlung=ext.behandlung;
          var r=await sb.from("documents").update({extracted:neu}).eq("id",d.id);if(r.error)throw r.error;
        }
        if(!MED_VT.ids[d.id]){if(bilder)await volltextHolen(d.id,bilder,"");else await volltextAusPdf(d.id,pdf);}
        fertig++;
      }catch(x){if(x&&(x.code==="ki_guthaben"||x.code==="limit"||x.code==="budget"))abbruch=errMsg(x);}
    }
    await ladeDaten();MED_VT.versucht=false;await medVolltextLaden(true);
  }finally{MED_NACH=false;closeModal(true);render();}
  if(abbruch)toast(abbruch,true);
  else toast(tn(fertig,"{0} Dokument erschlossen ✅","{0} Dokumente erschlossen ✅"));
}

function medRecherche(d){
  if(!d)return null;
  if(curLang===aiLangOf(d))return d.med_recherche;
  var box=d.i18n&&d.i18n[curLang];
  return (box&&box.med_recherche)||d.med_recherche;
}

      return '<div class="cause"><b>'+esc(String((x&&x[kA])||"?"))+'</b>'+

/* ---- Erklärung anfordern ---- */
var medBusy=false;
async function medErklaeren(id){
  var d=DOCS.filter(function(x){return x.id===id;})[0];if(!d||medBusy)return;
  medBusy=true;
  openModal('<h2 class="mhead">'+ic("search")+' '+t("Verständlich erklären")+'</h2>'+
    '<div class="abrbusy"><span class="spin"></span><span>'+
    t("All-Home liest das Dokument und recherchiert Abrechnungsziffern und Fachbegriffe im Internet … das kann bis zu einer Minute dauern.")+'</span></div>');
  try{
    var dl=await sb.storage.from(BUCKET).download(d.storage_path);
    if(dl.error)throw new Error(t("Datei konnte nicht geladen werden."));
    var bytes=new Uint8Array(await dl.data.arrayBuffer());
    var b=await edgeRuf(EDGE_MED,{fileBase64:bytesBase64(bytes),mimeType:d.mime_type||"application/pdf",
      model:kiStufe(),lang:curLang,
      kontext:{arzt:d.arzt||null,fachrichtung:d.fachrichtung||null,medTyp:d.med_typ||null,betrag:d.betrag!=null?d.betrag:null}});
    if(!b.recherche)throw new Error(t("Keine Erklärung erhalten."));
    /* In die Hauptspalte nur, wenn die Sprache zur übrigen KI-Ausgabe passt */
    var upd={med_recherche_am:new Date().toISOString()};
    if(curLang===aiLangOf(d))upd.med_recherche=b.recherche;
    else{
      var box=Object.assign({},d.i18n||{});
      box[curLang]=Object.assign({},box[curLang]||{},{med_recherche:b.recherche});
      upd.i18n=box;
      if(!d.med_recherche)upd.med_recherche=b.recherche;
    }
    var r=await sb.from("documents").update(upd).eq("id",id);
    if(r.error)throw r.error;
    closeModal(true);await ladeDaten();go("#/gesundheit?doc="+id);
    toast(t("Erklärung erstellt ✅"));
  }catch(e){
    closeModal(true);
    if(e&&e.code==="ki_guthaben")toast(t("Das KI-Guthaben ist aufgebraucht – bitte später erneut."),true);
    else toast(t("Erklären fehlgeschlagen")+": "+errMsg(e),true);
  }finally{medBusy=false;}
}

/* Vergleichsform eines Namens: „Kajs, Stanislav“, „Herr Stanislav Kajs“ und „stanislav kajs“ sind dieselbe Person */
function personSchluessel(name){
  var s=String(name||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
  if(s.normalize)s=s.normalize("NFD").replace(/[̀-ͯ]/g,"");
  return s.replace(/[^a-z0-9а-яё]+/g," ").split(" ").filter(function(w){return w&&!/^(herr|frau|dr|prof|med|dipl)$/.test(w);}).sort().join(" ");
}
function personMitNamen(name){
  var k=personSchluessel(name);if(!k)return null;
  return PERSONS.filter(function(p){return personSchluessel(p.name)===k;})[0]||null;
}
var PERS_BUSY=false;
async function personAnlegen(name,docId){
  name=(name||"").trim();if(!name||PERS_BUSY)return null;
  /* Gleicher Name schon da: beim Dokument zuordnen statt doppelt anlegen */
  var p=personMitNamen(name);
  if(p&&!docId){toast(tf("„{0}“ gibt es schon.",name),true);return null;}
  PERS_BUSY=true;
  try{
    if(!p){
      var r=await sb.from("persons").insert({household_id:HH.id,name:name}).select("*").single();
      if(r.error)throw r.error;
      p=r.data;
      toast(tf("Person „{0}“ angelegt ✅",name));
    }else toast(tf("„{0}“ zugeordnet ✅",p.name));
    if(docId){var u=await sb.from("documents").update({person_id:p.id}).eq("id",docId);if(u.error)throw u.error;}
    await ladeDaten();
    return p;
  }catch(e){toast(t("Anlegen fehlgeschlagen")+": "+errMsg(e),true);return null;}
  finally{PERS_BUSY=false;}
}
async function personLoeschen(id){
  var p=personById(id);if(!p)return;
  var n=DOCS.filter(function(d){return d.person_id===id;}).length;
  if(!confirm(tf("Person „{0}“ löschen?",p.name)+(n?" "+tn(n,"{0} Dokument verliert die Zuordnung.","{0} Dokumente verlieren die Zuordnung."):"")))return;
  try{
    var r=await sb.from("persons").delete().eq("id",id);

}
/* ---- Steuerübersicht als CSV ---- */
function medCsv(){
  var meds=DOCS.filter(function(d){return istMed(d)&&d.betrag!=null;});
  if(!meds.length){toast(t("Keine Arztkosten mit Betrag erfasst."),true);return;}
  meds=meds.slice().sort(function(a,b){
    return String(a.behandlungsdatum||a.doc_date||"").localeCompare(String(b.behandlungsdatum||b.doc_date||""));
  });
  /* Beginnt ein Text mit = + - @, würde Excel ihn als Formel ausführen → mit ' entschärfen */
  function z(s){s=String(s==null?"":s);if(/^[=+\-@\t\r]/.test(s)&&!/^-?\d+(,\d+)?$/.test(s))s="'"+s;
    return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
  function geld(n){return Number(n).toFixed(2).replace(".",",");}
  var reihen=[[t("Jahr"),t("Datum"),t("Patient"),t("Arzt / Praxis"),t("Fachrichtung"),t("Art"),t("Betrag (EUR)")]];
  meds.forEach(function(d){
    var dt=d.behandlungsdatum||d.doc_date||"";
    reihen.push([String(dt).slice(0,4),fmtDate(dt),personName(d.person_id)||"—",
      d.arzt||"",fachInfo(d.fachrichtung||"sonstiges").label,medTypInfo(d.med_typ).label,geld(d.betrag)]);
  });
  /* Summen je Jahr und Person */
  var agg={};
  meds.forEach(function(d){
    var j=String(d.behandlungsdatum||d.doc_date||"").slice(0,4),k=j+"|"+(d.person_id||"");
    if(!agg[k])agg[k]={j:j,p:d.person_id,sum:0,n:0};
    agg[k].sum+=Number(d.betrag);agg[k].n++;
  });
  reihen.push([]);reihen.push([t("Summen je Jahr und Person")]);
  reihen.push([t("Jahr"),t("Patient"),t("Anzahl"),t("Summe (EUR)")]);
  Object.keys(agg).sort().forEach(function(k){
    var a=agg[k];reihen.push([a.j,personName(a.p)||"—",a.n,geld(a.sum)]);
  });
  var csv="﻿"+reihen.map(function(r){return r.map(z).join(";");}).join("\r\n");
  lade(new Blob([csv],{type:"text/csv;charset=utf-8"}),"arztkosten-steuer.csv");
  toast(t("Steuerübersicht erstellt 📄"));
}

/* Weggeklickte Vorschläge und Hinweise: je Person in der Datenbank (auf allen Geräten gleich), lokal gespiegelt.
   "ah_weg" ist der alte, nur gerätelokale Speicher – wird beim Laden übernommen. */
var WEG=null;
function wegLokalKey(){return "ah_weg:"+(me&&me.id?me.id:"");}
function weggeklickt(){
  if(WEG)return WEG;
  var l=Array.isArray(PREFS&&PREFS.ausgeblendet)?PREFS.ausgeblendet.slice():[],da={};
  [wegLokalKey(),"ah_weg"].forEach(function(k){try{var x=JSON.parse(localStorage.getItem(k)||"[]");if(Array.isArray(x))l=l.concat(x);}catch(e){}});
  WEG=l.filter(function(k){if(typeof k!=="string"||!k||da[k])return false;da[k]=1;return true;});
  return WEG;
}
function istWeg(key){return weggeklickt().indexOf(key)>=0;}
async function wegSpeichern(liste,still){
  WEG=liste.slice(-800);PREFS=PREFS||{};PREFS.ausgeblendet=WEG;
  try{localStorage.setItem(wegLokalKey(),JSON.stringify(WEG));localStorage.removeItem("ah_weg");}catch(e){}
  if(!still)render();
  if(!me)return;
  try{var r=await sb.from("user_settings").upsert({user_id:me.id,lang:curLang,ausgeblendet:WEG,updated_at:new Date().toISOString()});if(r&&r.error)throw r.error;}
  catch(e){if(!still)toast(t("Nur auf diesem Gerät ausgeblendet.")+" "+errMsg(e),true);}
}
function wegklicken(key){var s=weggeklickt().slice();if(s.indexOf(key)<0)s.push(key);return wegSpeichern(s);}
function einblenden(passt){return wegSpeichern(weggeklickt().filter(function(k){return !passt(k);}));}
/* Nach dem Laden der Einstellungen: lokal Weggeklicktes (auch von früher) in die Datenbank übernehmen */
function wegAbgleichen(){
  var db=Array.isArray(PREFS&&PREFS.ausgeblendet)?PREFS.ausgeblendet:[];WEG=null;
  if(weggeklickt().length>db.length)wegSpeichern(weggeklickt(),true);
}

/* ---------------- Die Vorschläge sammeln ---------------- */
function vorschlaege(){
  var v=[];

  /* 1 – Kündigungsfristen */
  if(smartAn("fristen")){
    CONTRACTS.forEach(function(c){
      if(c.status!=="aktiv")return;
      var f=fristInfo(c);
      if(f.days==null||f.days>45)return;
      var a=artInfo(c.art||"sonstiges");
      v.push({key:"frist:"+c.id+":"+f.lastDay,art:f.days<=14?"bad":"warn",icon:"clock",
        titel:tn(f.days,"{0} ist nur noch {1} Tag kündbar","{0} ist nur noch {1} Tage kündbar",c.anbieter||a.label,f.days),
        text:tf("Letzter Kündigungstag: {0}",fmtDate(f.lastDay)),
        knopf:t("Ansehen"),href:"#/vertrag?id="+c.id});
    });
    /* Neuer Vertrag steht fest, der alte läuft ungekündigt weiter */
    CONTRACTS.forEach(function(c){
      if(vertragPhase(c)!=="laufend")return;
      var n=nachfolgerVon(c);if(!n)return;
      var a=artInfo(c.art||"sonstiges");
      v.push({key:"abloesen:"+c.id+":"+n.id,art:"warn",icon:"alert",
        titel:tf("{0} läuft noch",c.anbieter||a.label),
        text:tf("{0} beginnt am {1} – alten Vertrag kündigen?",n.anbieter||a.label,fmtDate(n.vertragsstart)),
        knopf:t("Ansehen"),href:"#/vertrag?id="+c.id});
    });
    /* Fristdaten fehlen → kann nicht überwacht werden */
    CONTRACTS.forEach(function(c){
      if(c.status!=="aktiv"||!hatFristen(c.art))return;
      if(fristInfo(c).kind!=="unbekannt")return;
      var a=artInfo(c.art||"sonstiges");
      v.push({key:"fristlos:"+c.id,art:"info",icon:"alert",
        titel:tf("{0}: Fristen unbekannt",c.anbieter||a.label),
        /* genau sagen, was fehlt */
        text:(!c.vertragsstart&&numOrNull(c.mindestlaufzeit_monate)==null)?t("Vertragsbeginn und Mindestlaufzeit fehlen – ohne sie kann All-Home nicht warnen."):
             (!c.vertragsstart?t("Der Vertragsbeginn fehlt – ohne ihn kann All-Home nicht warnen."):t("Die Mindestlaufzeit fehlt (0 = jederzeit kündbar) – ohne sie kann All-Home nicht warnen.")),
        knopf:t("Ergänzen"),aktion:"v-edit",id:c.id});
    });
  }

  /* 2 – Vollständigkeits-Check: angehakte Arten ohne Vertrag + Übliches nicht angehakt */
  if(smartAn("luecken")){
    var leer=aktiveArten().filter(function(k){
      var a=artInfo(k);
      return !spiegelArt(k)&&!vertraegeDerArt(k).length;
    });
    if(leer.length){
      v.push({key:"leer:"+leer.length,art:"info",icon:"folder",
        titel:tn(leer.length,"{0} angehakte Art ist noch leer","{0} angehakte Arten sind noch leer"),
        text:leer.slice(0,4).map(function(k){return artInfo(k).label;}).join(", ")+(leer.length>4?" …":""),
        knopf:t("Verträge"),href:"#/vertraege"});
    }
    var fehltUeblich=standardArten().filter(function(k){return !artAktiv(k);});
    if(fehltUeblich.length){
      v.push({key:"ueblich:"+fehltUeblich.join(","),art:"info",icon:"sparkles",
        titel:t("Fast jeder Haushalt hat das"),
        text:fehltUeblich.map(function(k){return artInfo(k).label;}).join(", ")+" – "+t("bei dir nicht angehakt."),
        knopf:t("Prüfen"),href:"#/einrichten"});
    }
  }

  /* 3 – Preiserhöhung → Sonderkündigungsrecht (14 Tage ab Dokumentdatum sichtbar) */
  if(smartAn("preis")){
    DOCS.forEach(function(d){
      if(d.doc_type!=="preisaenderung")return;
      var c=d.contract_id?vertragById(d.contract_id):null;
      var dt=d.doc_date||String(d.created_at||"").slice(0,10);
      var alter=dt?-daysUntil(dt):999;
      if(alter>90)return;                      /* älter als 3 Monate: nicht mehr aktuell */
      v.push({key:"preis:"+d.id,art:"warn",icon:"alert",
        titel:t("Preiserhöhung erkannt"),
        text:(c?(c.anbieter||"")+" · ":"")+tf("Schreiben vom {0}. Bei einer Erhöhung hast du meist ein Sonderkündigungsrecht – oft nur bis zum Wirksamwerden.",fmtDate(dt)),
        knopf:c?t("Zum Vertrag"):t("Dokument"),
        href:c?("#/vertrag?id="+c.id):null,aktion:c?null:"d-open",id:c?null:d.id});
    });
  }

  /* 4 – Pflichttermine (HU/TÜV, Ausweise, Wartung) */
  if(smartAn("termine")){
    CONTRACTS.forEach(function(c){
      var a=artInfo(c.art||"sonstiges");
      if(imArchiv(c)||!a.termin||!c.details||!c.details[a.termin.k])return;
      var d=daysUntil(c.details[a.termin.k]);
      if(d==null||d>60)return;
      v.push({key:"termin:"+c.id+":"+c.details[a.termin.k],art:d<=14?"bad":"warn",icon:"calendar",
        titel:a.icon+" "+t(a.termin.l)+": "+tageTxt(d),
        text:(c.anbieter||a.label)+" · "+fmtDate(c.details[a.termin.k]),
        knopf:t("Ansehen"),href:"#/vertrag?id="+c.id});
    });
  }

  /* 5 – Kosten & Wechsel: größter Posten ohne Recherche */
  if(smartAn("kosten")){
    var teuerste=null;
    aktiveArten().forEach(function(k){
      var a=artInfo(k);
      if(spiegelArt(k))return;                 /* Energie läuft über AllTrack */
      vertraegeDerArt(k).forEach(function(c){
        if(c.status!=="aktiv")return;
        var m=monatskosten(c);
        if(m<=0)return;
        if(!teuerste||m>teuerste.m)teuerste={m:m,c:c,a:a};
      });
    });
    if(teuerste&&teuerste.m>=15&&!teuerste.c.recherche){
      v.push({key:"wechsel:"+teuerste.c.id,art:"info",icon:"euro",
        titel:tf("{0} kostet {1} im Monat",teuerste.c.anbieter||teuerste.a.label,eur(teuerste.m)),
        text:t("Das ist dein größter Posten. Lohnt ein Vergleich?"),
        knopf:t("Markt prüfen"),aktion:"recherche",id:teuerste.c.id});
    }
  }

  /* 6 – Doppelt versichert */
  if(smartAn("doppelt")){
    Object.keys(ARTEN).forEach(function(k){
      if(!ARTEN[k].einzig)return;
      var aktiv=vertraegeDerArt(k).filter(function(c){return vertragPhase(c)==="laufend";});
      if(aktiv.length<2)return;
      var a=artInfo(k);
      v.push({key:"doppelt:"+k+":"+aktiv.length,art:"bad",icon:"alert",
        titel:tf("Zwei Verträge für {0}",a.label),
        text:aktiv.map(function(c){return c.anbieter||"?";}).join(" · ")+" – "+t("meist zahlt man einen davon umsonst."),
        knopf:t("Ansehen"),href:"#/art?k="+k});
    });
  }

  /* 7 – Dokumenten-Lücken */
  if(smartAn("dokumente")){
    var ohne=CONTRACTS.filter(function(c){
      if(c.status!=="aktiv"||!hatFristen(c.art))return false;
      return !DOCS.some(function(d){return d.contract_id===c.id;});
    });
    if(ohne.length){
      v.push({key:"dok:"+ohne.length,art:"info",icon:"doc",
        titel:tn(ohne.length,"{0} Vertrag ohne Unterlagen","{0} Verträge ohne Unterlagen"),
        text:ohne.slice(0,3).map(function(c){return c.anbieter||artInfo(c.art).label;}).join(", ")+(ohne.length>3?" …":""),
        knopf:t("Verträge"),href:"#/vertraege"});
    }
    /* Dokumente, die keinem Vertrag zugeordnet sind */
    var frei=dokumenteOhneVertrag().filter(function(d){return !kiFehlt(d);});
    if(frei.length){
      v.push({key:"frei:"+frei.length,art:"info",icon:"link",
        titel:tn(frei.length,"{0} Dokument ohne Vertrag","{0} Dokumente ohne Vertrag"),
        text:(function(){var zv=zuordnungsVorschlaege(frei).length;
          return zv?tn(zv,"Ein Vorschlag zum Zuordnen liegt bereit.","{0} Vorschläge zum Zuordnen liegen bereit."):t("Zuordnen hilft dem Archiv und den Fristen.");})(),
        knopf:t("Ansehen"),href:"#/dokumente?f=ohne&von=start"});
    }
    /* Noch nicht ausgelesen (Guthaben/Budget war weg, Netzfehler) */
    var offen=dokumenteOhneKi();
    if(offen.length){
      v.push({key:"kipend:"+offen.length,art:"warn",icon:"refresh",
        titel:tn(offen.length,"{0} Dokument wartet auf die KI","{0} Dokumente warten auf die KI"),
        text:t("Jetzt auslesen und dem passenden Vertrag zuordnen?"),
        knopf:t("Jetzt auslesen"),aktion:"d-alle-nachholen"});
    }
  }

  if(smartAn("nebenkosten"))v=v.concat(nkVorschlaege());
  v=regVorschlaege().concat(ztVorschlaege(),v);   /* Superadmin: wartende Registrierungen ganz vorn – nicht abschaltbar */
  return v.filter(function(x){return !istWeg(x.key)&&!x.weg;});
}

  var c=vertragById(id);if(!c||rechBusy)return;

  rechBusy=true;
  openModal('<h2 class="mhead">'+ic("globe")+' '+t("Markt prüfen")+'</h2>'+

    tf("All-Home recherchiert öffentliche Angaben zu „{0}“ … das kann eine Minute dauern.",esc(c.anbieter))+'</span></div>');
  try{
    var b=await edgeRuf(EDGE_RESEARCH,{anbieter:c.anbieter,produkt:c.produkt||null,
      kategorie:artInfo(c.art||"sonstiges").label,kosten:c.kosten,
      kostenIntervall:c.kosten_intervall||null,vertragsstart:c.vertragsstart||null,
      model:kiStufe(),lang:curLang});
    if(!b.recherche)throw new Error(t("Keine Antwort erhalten."));
    var r=await sb.from("contracts").update({recherche:b.recherche,recherche_am:new Date().toISOString(),ai_lang:curLang}).eq("id",id);

    else toast(t("Recherche fehlgeschlagen")+": "+errMsg(e),true);
  }finally{rechBusy=false;}
}

      ?'<ul class="hint" style="padding-left:20px">'+rc.leistungen.map(function(l){return '<li>'+esc(String(l))+'</li>';}).join("")+'</ul>':"")+
    (rc.hinweise?'<div class="sug info"><span class="si">'+ic("info")+'</span><div class="sb2"><div class="sx">'+esc(String(rc.hinweise))+'</div></div></div>':"")+
    ((Array.isArray(rc.quellen)&&rc.quellen.length)
      ?'<p class="hint" style="margin-top:10px">'+t("Quellen")+': '+rc.quellen.slice(0,5).map(function(q){
         var u=String((q&&q.url)||""),ti=String((q&&q.titel)||u||t("Quelle"));
         return /^https?:\/\//i.test(u)?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(ti)+'</a>':esc(ti);
       }).join(" · ")+'</p>':"")+
    '<div class="factions" style="margin-top:12px"><button class="btn ghost" data-a="recherche" data-id="'+c.id+'">'+ic("refresh")+' '+t("Neu recherchieren")+'</button></div>'+
  '</section>';
}
