<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<meta name="robots" content="noindex">
<title>All-Home</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="All-Home">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Alte Merker des Dokumenten-Butlers aufräumen (die App heißt jetzt All-Home). */
(function(){try{["dbTheme","db_tips_dismissed"].forEach(function(k){localStorage.removeItem(k);});}catch(e){}})();
/* Hell/Dunkel sofort setzen, bevor etwas gezeichnet wird (kein Aufblitzen). */
(function(){try{var t=localStorage.getItem("ahTheme");var d=t?t==="dark":(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.documentElement.classList.add("dark");}catch(e){}})();
</script>
<style>
@font-face{font-family:"Nunito";src:url("fonts/nunito-latin-wght-normal.woff2") format("woff2");font-weight:200 1000;font-style:normal;font-display:swap}
</style>
<style>

/* ================= Farben & Maße ================= */
:root{
  --bg:#f7f4ef;--surface:#ffffff;--surface-2:#f2eee7;--surface-3:#e9e3d9;
  --line:#e7e0d5;--line-2:#d9d0c2;
  --text:#231f1a;--muted:#7a7166;--muted-2:#a39a8d;
  --ink:#231f1a;--ink-fg:#fffaf2;
  --pos:#1f9d62;--pos-bg:#e3f5ec;--neg:#d8453a;--neg-bg:#fde8e5;--warn:#b86e00;--warn-bg:#fff1d6;--info:#3b6fd8;--info-bg:#e6eefc;
  --strom:#e8930c;--strom-bg:#fff2d9;--wasser:#1a9fd8;--wasser-bg:#e0f3fb;--gas:#ec6431;--gas-bg:#fde7dc;
  --r-xl:28px;--r-lg:22px;--r:16px;--r-sm:12px;
  --sh-1:0 1px 2px rgba(35,31,26,.05);
  --sh-2:0 1px 2px rgba(35,31,26,.04),0 10px 28px -14px rgba(35,31,26,.22);
  --sh-3:0 18px 50px -18px rgba(35,31,26,.38);
  --nav-h:74px;--side-w:248px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html.dark{
  --bg:#15130f;--surface:#1f1c17;--surface-2:#28241e;--surface-3:#332e27;
  --line:#353029;--line-2:#453f36;
  --text:#f4efe7;--muted:#a89e90;--muted-2:#7e7569;
  --ink:#f4efe7;--ink-fg:#15130f;
  --pos:#45d28f;--pos-bg:rgba(69,210,143,.13);--neg:#ff7d70;--neg-bg:rgba(255,125,112,.13);--warn:#ffb547;--warn-bg:rgba(255,181,71,.13);--info:#86a8ff;--info-bg:rgba(134,168,255,.13);
  --strom:#ffb23e;--strom-bg:rgba(255,178,62,.14);--wasser:#4cc3f5;--wasser-bg:rgba(76,195,245,.14);--gas:#ff8757;--gas-bg:rgba(255,135,87,.14);
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  --sh-3:0 18px 50px -18px rgba(0,0,0,.75);
}

/* ================= Grundlagen ================= */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{scrollbar-gutter:stable}
body{background:var(--bg);color:var(--text);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.ico{display:inline-block;vertical-align:middle;flex:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--info) 55%,transparent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= App-Rahmen ================= */
.shell{min-height:100vh}
/* width:100% – sonst schrumpft die Rasterzelle (margin:auto) auf Inhaltsbreite und jede Seite sitzt woanders */
.main{padding:18px 16px calc(var(--nav-h) + 52px + env(safe-area-inset-bottom));width:100%;max-width:1180px;margin:0 auto;min-width:0}
.side{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:stretch}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding:0 0 10px;color:var(--muted);font-size:.72rem;font-weight:700;border-radius:14px;transition:color .15s}
.nb[aria-current="page"]{color:var(--text)}
.nb[aria-current="page"] .nbi{background:var(--surface-2)}
.nbi{display:grid;place-items:center;width:44px;height:30px;border-radius:12px;transition:background .15s}
/* Der runde Neu-Knopf schwebt ueber der Leiste und macht sie nicht hoeher. */
.nb-add{position:relative}
/* Farbring als Verlaufsrand: haengt nicht von der Ebenen-Reihenfolge ab (transform erzeugt eine eigene). */
.nb-add .fab{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--ink-fg);border:4px solid transparent;background:linear-gradient(var(--ink),var(--ink)) padding-box,conic-gradient(from 200deg,var(--strom),var(--wasser),var(--gas),var(--strom)) border-box;box-shadow:var(--sh-3)}
.nb-add .lbl{margin-top:0}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:var(--side-w) 1fr}
  .bnav{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.25rem;padding:6px 10px 18px}
  .brand .logo{width:34px;height:34px;border-radius:10px;box-shadow:var(--sh-1)}
  .sb{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-weight:700;color:var(--muted)}
  .sb:hover{background:var(--surface-2);color:var(--text)}
  .sb[aria-current="page"]{background:var(--surface-2);color:var(--text)}
  .sb-add{margin:4px 0 12px;justify-content:center;background:var(--ink);color:var(--ink-fg)!important;box-shadow:var(--sh-2)}
  .sb-add:hover{background:var(--ink);filter:brightness(1.08)}
  .sb-add[aria-current="page"]{background:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 22%,transparent)}
  .main{padding:30px 34px 48px}
}

/* ================= Kopfzeile ================= */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 18px}
.greet{color:var(--muted);font-weight:700;font-size:.92rem}
.hh{display:inline-flex;align-items:center;gap:6px;font-size:1.55rem;font-weight:900;letter-spacing:-.01em;line-height:1.15;border-radius:12px;padding:2px 4px;margin-left:-4px}
.hh.can:hover{background:var(--surface-2)}
.pt{font-size:1.55rem;font-weight:900;letter-spacing:-.01em;margin:4px 2px 16px}

/* ================= Karten ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px}
.grid{display:grid;gap:14px}
/* Rasterzellen duerfen schrumpfen – sonst sprengt breiter Inhalt (Tabellen) die Seitenbreite */
.grid>*{min-width:0}
@media (min-width:900px){.grid-2{grid-template-columns:1.25fr 1fr;align-items:start}}
.sect{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-weight:900;font-size:1.05rem}
.sect .more{font-size:.86rem;font-weight:800;color:var(--muted)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 22px 18px;border:1px solid var(--line);box-shadow:var(--sh-2);background:var(--surface)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,var(--hero-tint) 0%,transparent 60%),radial-gradient(90% 80% at 0% 100%,var(--hero-tint-2) 0%,transparent 55%);opacity:1;pointer-events:none}
.hero.pos{--hero-tint:color-mix(in srgb,var(--pos) 22%,transparent);--hero-tint-2:color-mix(in srgb,var(--wasser) 14%,transparent)}
.hero.neg{--hero-tint:color-mix(in srgb,var(--neg) 20%,transparent);--hero-tint-2:color-mix(in srgb,var(--strom) 14%,transparent)}
.hero>*{position:relative}
.hero .lbl{font-weight:800;color:var(--muted);font-size:.9rem}
.hero .big{font-size:2.9rem;font-weight:900;letter-spacing:-.02em;line-height:1.05;margin:6px 0 2px}
.hero.pos .big{color:var(--pos)}.hero.neg .big{color:var(--neg)}
.hero .state{font-weight:800}
.hero .sub{color:var(--muted);font-size:.88rem;margin-top:4px}
.hero .tog{margin-top:12px;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.88rem;color:var(--muted)}
.hbreak{margin-top:12px;display:grid;gap:8px}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line)}
.hrow .v{margin-left:auto;font-weight:900}

/* Bereichs-Abzeichen */
.cb{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.cb.strom{background:var(--strom-bg);color:var(--strom)}.cb.wasser{background:var(--wasser-bg);color:var(--wasser)}.cb.gas{background:var(--gas-bg);color:var(--gas)}
.cb.sm{width:30px;height:30px;border-radius:10px}

/* Faellig-Karte */
.due{display:flex;align-items:center;gap:14px;border-radius:var(--r-lg);padding:16px;background:var(--ink);color:var(--ink-fg);box-shadow:var(--sh-2)}
.due .dots{display:flex}
.due .dots .cb{border:3px solid var(--ink);margin-left:-8px}
.due .dots .cb:first-child{margin-left:0}
.due .t{font-weight:900}
.due .s{opacity:.72;font-size:.86rem}
.due .go{margin-left:auto}
.done{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-lg);background:var(--pos-bg);color:var(--pos);font-weight:800}
.done small{display:block;color:var(--muted);font-weight:700}

/* Kacheln */
.tiles{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.tiles.t3{grid-template-columns:repeat(3,1fr)}}
.tile{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-1);transition:transform .15s var(--ease),box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.tile .hd{display:flex;align-items:center;gap:10px}
.tile .nm{font-weight:900;font-size:1.05rem}
.tile .mt{color:var(--muted);font-size:.84rem;font-weight:700}
.tile .row{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.tile .cost{font-size:1.45rem;font-weight:900;letter-spacing:-.01em}
.tile .spark{display:block;width:100%;height:38px;margin-top:10px}
.tile .foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;color:var(--muted);font-size:.82rem;font-weight:700}

/* Pillen & Chips */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-weight:900;font-size:.8rem;white-space:nowrap}
.pill.pos{background:var(--pos-bg);color:var(--pos)}.pill.neg{background:var(--neg-bg);color:var(--neg)}.pill.mut{background:var(--surface-2);color:var(--muted)}
.pos-t{color:var(--pos)}.neg-t{color:var(--neg)}.mut-t{color:var(--muted)}

/* Vorschlaege */
.sugs{display:grid;gap:10px}
.sug{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 14px 14px;box-shadow:var(--sh-1)}
.sug .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.sug.info .si{background:var(--info-bg);color:var(--info)}.sug.warn .si{background:var(--warn-bg);color:var(--warn)}.sug.good .si{background:var(--pos-bg);color:var(--pos)}.sug.bad .si{background:var(--neg-bg);color:var(--neg)}
.sug .sb2{flex:1;min-width:0}
.sug .st{font-weight:900}
.sug .sx{color:var(--muted);font-size:.9rem;margin-top:1px}
.sug .sa{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.sug .dis{color:var(--muted-2);padding:4px;border-radius:10px;margin:-4px -4px 0 0}
.sug .dis:hover{color:var(--text);background:var(--surface-2)}

/* Knoepfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--ink-fg);font-weight:900;box-shadow:var(--sh-1);transition:filter .15s,transform .06s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(1px)}
.btn.lg{min-height:54px;font-size:1.05rem;padding:0 26px}
.btn.full{width:100%}
.btn.soft{background:var(--surface-2);color:var(--text);box-shadow:none}
.btn.line{background:transparent;color:var(--text);border:1.5px solid var(--line-2);box-shadow:none}
.btn.onink{background:var(--ink-fg);color:var(--ink)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.lnk{font-weight:900;color:var(--text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:var(--surface-2);color:var(--text)}

/* Bottom-Sheet / Popover */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(21,19,15,.38);opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:81;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--sh-3);transform:translateY(100%);transition:transform .26s var(--ease)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line-2);margin:4px auto 12px}
.sheet h3{margin:4px 0 12px;font-size:1.15rem;font-weight:900}
@media (min-width:900px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:480px;border-radius:24px;transform:translate(-50%,-46%);opacity:0;transition:transform .2s var(--ease),opacity .2s}.sheet.on{transform:translate(-50%,-50%);opacity:1}.sheet .grab{display:none}}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;border-radius:14px;font-weight:800}
.opt:hover{background:var(--surface-2)}
.opt .ck{margin-left:auto;color:var(--pos)}

/* Hinweise, Leerzustaende, Laden */
.note{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-lg);padding:14px 16px;background:var(--warn-bg);color:var(--text)}
.note .ni{color:var(--warn);margin-top:1px}
.note b{display:block}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 12px;color:var(--muted)}
.empty h3{color:var(--text);margin:0 0 6px;font-weight:900}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:90;width:max-content;max-width:calc(100% - 28px);background:var(--ink);color:var(--ink-fg);padding:12px 16px;border-radius:16px;font-weight:800;box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);display:flex;align-items:center;gap:12px}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast.err{background:var(--neg);color:#fff}
/* bei offenem Fenster oben, damit keine Knoepfe verdeckt werden */
#toast.top{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px)}
#toast.top.on{transform:translate(-50%,0)}
#toast button{font-weight:900;text-decoration:underline;text-underline-offset:3px}
.updbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;background:var(--ink);color:var(--ink-fg);padding:8px 8px 8px 16px;border-radius:18px;font-weight:800;font-size:.9rem}
.updbar>span{display:flex;align-items:center;gap:8px}
html.testenv body::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;background:#7c3aed;z-index:100;pointer-events:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:grid;gap:2px}
.kpi span{color:var(--muted);font-weight:800;font-size:.84rem}.kpi b{font-size:1.5rem;font-weight:900}.kpi small{color:var(--muted);font-weight:700}
.kirow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mlist>.kirow:last-child{border-bottom:0}
.kirow .kl{flex:1;min-width:0;display:grid;gap:1px}.kirow small{color:var(--muted);font-weight:700;font-size:.8rem}
.kirow .kc{font-weight:900;white-space:nowrap}
.kirow .kt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.netbar{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:10px 14px;border-radius:16px;background:var(--warn-bg);color:var(--warn);font-weight:800;font-size:.88rem}
@media (min-width:900px){#toast{bottom:28px}}

/* Anmeldung */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.authc{width:100%;max-width:400px}
.authc .logo{display:block;width:64px;height:64px;border-radius:18px;margin-bottom:18px;box-shadow:var(--sh-2)}
.authc h1{font-size:2rem;font-weight:900;margin:0 0 4px;letter-spacing:-.02em}
.authc p{color:var(--muted);margin:0 0 22px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-weight:800;font-size:.88rem;margin:0 0 6px 4px}
.inp{width:100%;min-height:52px;padding:0 16px;border-radius:16px;border:1.5px solid var(--line-2);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 10%,transparent)}
.amsg{min-height:22px;margin:10px 4px;font-weight:800;font-size:.9rem}
.amsg.err{color:var(--neg)}.amsg.ok{color:var(--pos)}
.arow{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ================= Formular-Fluss ================= */
.flow{max-width:560px;margin:0 auto}
.fhead{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.fhead .prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--muted);font-size:.9rem}
.dots2{display:flex;gap:5px;align-items:center}.dots2 i{width:8px;height:8px;border-radius:9px;background:var(--line-2);transition:width .2s}.dots2 i.on{background:var(--ink);width:22px}.dots2 i.ok{background:var(--pos)}
.mhead{display:flex;align-items:center;gap:14px}
.mhead .cb{width:54px;height:54px;border-radius:17px}
.mhead h2{margin:0;font-size:1.7rem;font-weight:900;letter-spacing:-.01em}
.mmeta{color:var(--muted);font-weight:700;font-size:.88rem}
.mrow{display:flex;gap:10px;align-items:stretch;margin-top:18px}
.minp{flex:1;position:relative;display:block;min-width:0}
.minp input{width:100%;height:78px;border-radius:22px;border:2px solid var(--line-2);background:var(--surface);font-size:2.2rem;font-weight:900;padding:0 64px 0 20px;font-variant-numeric:tabular-nums;outline:none;transition:border-color .15s,box-shadow .15s}

.amp.green{background:var(--pos)}.amp.yellow{background:var(--warn)}.amp.red{background:var(--neg)}
.hint.red{color:var(--neg)}.hint.yellow{color:var(--warn)}.hint.green{color:var(--pos)}
.fsec{margin-top:14px}
.linkbtn{font-weight:800;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.linkbtn:hover{color:var(--text)}
.dateline{display:flex;align-items:center;gap:10px;margin-top:18px;padding:12px 14px;border-radius:16px;background:var(--surface-2);font-weight:800;color:var(--muted)}
.dateline input{margin-left:auto;border:0;background:transparent;font-weight:900;color:var(--text);outline:none;min-width:0}
.factions{display:grid;gap:12px;margin-top:22px}
.frow2{display:flex;justify-content:space-between;gap:10px;padding:0 4px}
.mchange{margin-top:14px;padding:16px;border-radius:18px;border:1.5px dashed var(--line-2)}
.allrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.allrow .minp input{height:60px;font-size:1.5rem;border-radius:16px;padding-right:54px}
.allrow .camb{width:60px;border-radius:16px}
.allrow .mrow{margin-top:10px}
.allrow .hint{grid-column:1/-1;margin-top:6px}
.donehero{text-align:center;padding:22px 10px 12px}
.donehero .ok{width:78px;height:78px;border-radius:50%;background:var(--pos-bg);color:var(--pos);display:grid;place-items:center;margin:0 auto 14px}
.donehero h2{margin:0 0 4px;font-size:1.8rem;font-weight:900}
.sumrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.sumrow .v{margin-left:auto;text-align:right;display:grid;justify-items:end;gap:4px}

/* ================= Verlauf ================= */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;padding:2px 0 4px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;white-space:nowrap;color:var(--muted)}
.chip .ico{color:var(--c)}
.chip.on{border-color:var(--c);color:var(--text);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.chartcard{padding:16px 14px 14px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:800;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-1)}
.seg.wide{display:flex}.seg.wide button{flex:1}
.sel{min-height:38px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);padding:0 12px;font-weight:800}
.chart{display:block;width:100%;height:auto;margin-top:6px;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;font-weight:700;color:var(--muted);margin:4px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:14px;height:10px;border-radius:3px}
.lg.dash{height:0;border-top:2px dashed var(--muted);border-radius:0}
.lg.dot{height:0;border-top:2.5px dotted var(--text);border-radius:0}
.lg.fc{border:1.5px dashed;background:transparent}
.cinfo{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-weight:800}
.vlist2{display:grid;gap:6px}
.vsep{display:flex;align-items:center;gap:8px;padding:12px 6px 4px;color:var(--muted);font-weight:800;font-size:.84rem}
.vsep b{margin-left:auto}
.vrow2{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.vrow2:hover{border-color:var(--line-2)}
.vrow2 .vm{display:grid;min-width:0}.vrow2 .vm small{color:var(--muted);font-weight:700;font-size:.8rem}
.vrow2 .vv{display:grid;justify-items:end;font-weight:800;font-size:.9rem}
.vrow2.syn{background:transparent;border-style:dashed}
.tag{display:inline-block;padding:0 7px;border-radius:7px;background:var(--surface-2);color:var(--muted);font-weight:800;font-size:.74rem}
.dl{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.dl span{color:var(--muted);font-weight:700}
.ytab{width:100%;border-collapse:separate;border-spacing:0;font-size:.88rem}
.ytab th,.ytab td{padding:8px;text-align:right;white-space:nowrap}
.ytab thead th{color:var(--muted);font-weight:800}
.ytab tbody th{text-align:left;color:var(--muted);font-weight:800}
.ytab td{font-weight:800;border-radius:8px}
.ytab td.na{color:var(--muted-2)}.ytab td.avg{color:var(--muted)}
.ytab tr.sum th,.ytab tr.sum td{border-top:1px solid var(--line);font-weight:900}
.chk{display:flex;align-items:center;gap:10px;font-weight:800;margin:4px 4px 12px}
.chk input{width:20px;height:20px}
.ferr{margin-top:6px;padding:12px 14px;border-radius:14px;background:var(--neg-bg);color:var(--neg);font-weight:800}

/* ================= Vertraege ================= */
@media (min-width:900px){.vgrid2{grid-template-columns:1fr 1fr;align-items:start}}
.vcard{padding:18px}
.vcard.focus{border-color:var(--line-2);box-shadow:var(--sh-2)}
.vch{display:flex;align-items:center;gap:12px}
.vch .nm{font-weight:900;font-size:1.1rem}.vch .mt{color:var(--muted);font-weight:700;font-size:.86rem}
.vch .ibtn{margin-left:auto}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kv>div{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.kv span{color:var(--muted);font-weight:700;font-size:.8rem}.kv b{font-weight:900}
.vlines{display:grid;gap:6px;margin-top:12px}
.vline{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;font-weight:800;font-size:.88rem;text-align:left;width:100%}
.vline.info{background:var(--info-bg);color:var(--info)}.vline.good{background:var(--pos-bg);color:var(--pos)}.vline.warn{background:var(--warn-bg);color:var(--warn)}
.vline span{flex:1;color:var(--text)}
.vline b{margin-left:auto;text-decoration:underline;text-underline-offset:3px}
.drow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dchip{display:flex;align-items:center;gap:8px;max-width:100%;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;color:var(--muted)}
.dchip span{display:grid;min-width:0}.dchip b{font-size:.84rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}.dchip small{font-weight:700;font-size:.74rem}
.dchip.more{font-weight:800}
.vact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.vpast{display:flex;align-items:center;gap:6px;margin-top:14px;font-weight:800;color:var(--muted)}
.vplist{display:grid;gap:6px;margin-top:8px}
.vprow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.vprow span{display:grid;min-width:0}.vprow small{color:var(--muted);font-weight:700;font-size:.8rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fld{min-width:0}
details.more{margin:4px 0 8px}
details.more summary{cursor:pointer;font-weight:800;color:var(--muted);padding:8px 2px}
.drow2{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.dopen{display:flex;align-items:center;gap:10px;flex:1;text-align:left;padding:6px 2px;min-width:0}
.dopen span{display:grid;min-width:0}.dopen b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dopen small{color:var(--muted);font-weight:700;font-size:.8rem}
.ytab.abr th{text-align:left}
select.inp{padding-right:10px}

/* ================= Mehr ================= */
.mgrp{margin:22px 6px 8px;font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.mrow2{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);min-height:58px}
.mlist>.mrow2:last-child{border-bottom:0}
button.mrow2:hover,a.mrow2:hover{background:var(--surface-2)}
.mrow2 .mi{width:34px;height:34px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.mrow2 .mt2{flex:1;display:grid;min-width:0}.mrow2 .mt2 small{color:var(--muted);font-weight:700;font-size:.8rem}
.mrow2 .mr{display:flex;align-items:center;gap:4px;color:var(--muted);font-weight:800;font-size:.86rem;white-space:nowrap}
.mrow2.off{opacity:.5}
.nssw{width:50px;height:30px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.nssw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);transition:transform .2s var(--ease)}
.nssw.on{background:var(--pos)}.nssw.on::after{transform:translateX(20px)}
.nssw:disabled{opacity:.45;cursor:default}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--muted);margin:2px 0}
.memcard{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.memcard .mi{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.memcard small{display:block;color:var(--muted);font-weight:700}
.macts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.invcode{font-size:1.8rem;font-weight:900;letter-spacing:.12em;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.rowin{display:flex;gap:8px}.rowin .inp{flex:1;min-width:0}
.catpick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.cpk{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:14px;background:var(--surface-2);font-weight:800}
.calc{margin:0;padding-left:18px;display:grid;gap:6px}
.setupcat{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:var(--r-lg);border:2px solid var(--line);background:var(--surface);font-size:1.1rem;text-align:left}
.setupcat .ck{margin-left:auto;color:var(--muted-2)}
.setupcat.on{border-color:var(--ink)}.setupcat.on .ck{color:var(--pos)}

/* ================= Mehrschritt-Ansichten ================= */
.hlast{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line);font-weight:800;font-size:.86rem;color:var(--muted)}
.hlast b{color:var(--text)}
.vsep.open{color:var(--text)}
a.vsep.abr{color:var(--pos);border-radius:12px;background:var(--pos-bg);padding:10px 12px;margin:6px 0 2px}
a.vsep.abr span{color:var(--text)}
.abrsteps{display:flex;gap:6px;margin:0 0 var(--gap)}
.abrsteps span{flex:1;text-align:center;padding:7px 4px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:800;font-size:.8rem}
.abrsteps span.on{background:var(--ink);color:var(--ink-fg)}.abrsteps span.ok{background:var(--pos-bg);color:var(--pos)}
.abrdoc{display:flex;align-items:center;gap:12px}.abrdoc>div{flex:1;min-width:0;display:grid}.abrdoc small{color:var(--muted);font-weight:700}
.abrlvl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:var(--r-lg);border:2px solid var(--line);background:var(--surface)}
.abrlvl.on{border-color:var(--ink)}
.abrlvl>span:nth-child(2){flex:1;display:grid;gap:2px}.abrlvl small{color:var(--muted);font-weight:700}
.abrlvl .rd{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;color:var(--ink-fg)}
.abrlvl.on .rd{background:var(--ink);border-color:var(--ink)}
.abrlvl .pr{font-weight:900;white-space:nowrap}
.abrbusy{display:grid;justify-items:center;gap:10px;padding:48px 20px;text-align:center}.abrbusy small{color:var(--muted);font-weight:700}
.abrhead .vch{margin-bottom:6px}
.abrres{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.abrres>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:grid;gap:2px}
.abrres span{color:var(--muted);font-weight:800;font-size:.84rem}.abrres b{font-size:1.6rem;font-weight:900}.abrres small{color:var(--muted);font-weight:700}
.abrexpl{margin:-4px 4px 0;font-weight:800;color:var(--muted);font-size:.9rem}
.cause{border-radius:var(--r-lg);padding:14px 16px;border:1px solid var(--line);background:var(--surface);display:grid;gap:8px;justify-items:start}
.cause .ct{display:flex;align-items:center;gap:8px}.cause p{margin:0;color:var(--text);font-size:.92rem}
.cause.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}.cause.warn .ct{color:var(--warn)}
.cause.info .ct{color:var(--info)}
.cause .vline{width:auto}
.abrki{margin:0 4px;color:var(--muted);font-weight:700;font-size:.86rem}
.abrmon{margin:0}
.ytab.abr th small{display:block;font-weight:700;color:var(--muted-2);font-size:.74rem}
.ytab.abr .pill{font-size:.76rem;padding:2px 8px}
@media (min-width:1100px){.abrgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
@media (min-width:900px){.abrgrid>.grid>.sect:first-child{margin-top:4px}}

/* ================= Ein Abstandsraster für alle Seiten ================= */
/* --gap zwischen Karten, --sect vor Abschnittstiteln; auf dem Desktop größer */
:root{--gap:14px;--sect:22px}
.grid,.tiles,.sugs,.kpis{gap:var(--gap)}
.sect{margin:var(--sect) 4px 12px}
.mgrp{margin:var(--sect) 6px 10px}
.mcols{display:grid;column-gap:var(--gap)}
.mcols>div{display:contents}
.mg-hh{order:1}.mg-pers{order:2}.mg-daten{order:3}.mg-info{order:4}
.ycard{padding:10px;overflow-x:auto}
.ytab{border-spacing:3px;font-size:.84rem}
.ytab th,.ytab td{padding:8px 6px}
@media (min-width:560px){.ytab{border-spacing:4px;font-size:.9rem}.ytab th,.ytab td{padding:9px 10px}}
/* schmaler Desktop: Jahresvergleich unter das Diagramm, sonst wird die Tabelle gequetscht */

.ytab tr.sum th,.ytab tr.sum td{border-top:0;background:var(--surface-2)}

  .hh,.pt{font-size:2.05rem}

  .card{padding:24px}
  .hero{padding:30px 32px 26px}
  .hero .big{font-size:3.5rem}
  .due{padding:20px 22px}
  .done{padding:18px 20px}

  .tile .spark{height:52px}

  .vlgrid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .vlgrid>div:first-child{position:sticky;top:24px}
  .vrow2{padding:14px 18px}

  .kv{gap:12px}.kv>div{padding:12px 14px}
  .mcols{grid-template-columns:1fr 1fr;align-items:start}
  .mcols>div{display:block}

  .mrow2{padding:14px 18px;min-height:64px}

}

  .main{max-width:1560px}
  .vgrid2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
}

/* ================= All-Home: Vertragsarten ================= */
/* Gruppenkopf in der Arten-Liste und in der Einrichtung */
.grp{display:flex;align-items:center;gap:9px;margin:var(--sect) 4px 10px;font-weight:900;font-size:1.02rem}
.grp .gi{width:30px;height:30px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:.95rem;flex:none}
.grp .gn{color:var(--muted);font-weight:800;font-size:.84rem;margin-left:auto}

/* Platz einer Vertragsart: gefüllt oder sichtbar leer */
.slots{display:grid;gap:12px;grid-template-columns:1fr}
.slot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh-1);transition:transform .15s var(--ease),box-shadow .15s,border-color .15s}
.slot:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.slot .ai{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:1.15rem;flex:none}
.slot .sb3{flex:1;min-width:0}
.slot .sn{font-weight:900;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .ss{color:var(--muted);font-size:.84rem;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sr{flex:none;display:flex;align-items:center;gap:8px}
.slot .scost{font-weight:900;font-size:.95rem;white-space:nowrap}
.slot .go{color:var(--muted-2);flex:none}
/* Leerer Platz: gestrichelt, zurückgenommen – lädt zum Füllen ein */
.slot.leer{border-style:dashed;border-color:var(--line-2);background:transparent;box-shadow:none}
.slot.leer .ai{background:transparent;border:1.5px dashed var(--line-2);color:var(--muted-2)}
.slot.leer .sn{color:var(--muted);font-weight:800}
.slot.leer:hover{border-color:var(--ink);background:var(--surface)}
/* Mehrere Verträge in einer Art */
.slot .cnt{background:var(--surface-2);color:var(--muted);font-weight:800;font-size:.76rem;border-radius:999px;padding:2px 8px;flex:none}
/* Aus AllTrack gespiegelt */
.slot.mirror .ai{background:var(--info-bg);color:var(--info)}
.mlink{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.8rem;color:var(--info);background:var(--info-bg);border-radius:999px;padding:3px 10px}

/* ================= All-Home: Einrichtung (Arten anhaken) ================= */
.setupgrid{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:620px){.setupgrid{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.setupgrid{grid-template-columns:1fr 1fr 1fr}}
/* schlanker als .setupcat: es sind über 50 Zeilen, die müssen ruhig wirken */
.artpick{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:800;transition:border-color .12s,background .12s}
.artpick .pi{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:1rem;flex:none}
.artpick .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artpick .ck{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent}
.artpick:hover{border-color:var(--line-2);background:var(--surface-2)}
.artpick.on{border-color:var(--ink);background:var(--surface)}
.artpick.on .ck{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.artpick.on .pi{background:var(--surface-3)}
/* Hinweis auf Arten, die der Haushalt vermutlich braucht */
.artpick .rec{flex:none;font-size:.7rem;font-weight:900;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:2px 7px}

/* ================= All-Home: Fristen & Termine ================= */
/* Ampel als farbiger Punkt vor der Zeile */
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.red{background:var(--neg)}.dot.amber{background:var(--warn)}.dot.green{background:var(--pos)}.dot.gray{background:var(--muted-2)}
.trow{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow .tb{flex:1;min-width:0}
.trow .tn{font-weight:800;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tx{color:var(--muted);font-size:.82rem;font-weight:700;margin-top:1px}
.trow .tw{flex:none;font-weight:900;font-size:.85rem;white-space:nowrap}
.trow .tw.red{color:var(--neg)}.trow .tw.amber{color:var(--warn)}

/* ================= All-Home: Dokumente am Vertrag ================= */
.dlist{display:flex;flex-direction:column}
.drow3{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.drow3:last-child{border-bottom:none}
.drow3:hover{background:var(--surface-2);border-radius:10px}
.drow3 .di{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:.95rem;flex:none}
.drow3 .db{flex:1;min-width:0}
.drow3 .dn{font-weight:800;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow3 .dm{color:var(--muted);font-size:.79rem;font-weight:700;margin-top:1px;display:flex;gap:8px;flex-wrap:wrap}
/* fehlendes Dokument: gestrichelter Platzhalter wie beim Vertrags-Platz */
.drow3.fehlt{border:1.5px dashed var(--line-2);border-radius:var(--r-sm);margin:4px 0;padding:11px 10px}
.drow3.fehlt .di{background:transparent;border:1.5px dashed var(--line-2);color:var(--muted-2)}
.drow3.fehlt .dn{color:var(--muted);font-weight:800}

/* ================= All-Home: Kostenaufschlüsselung ================= */
.krow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:.88rem}
.krow .kl{width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
@media (max-width:560px){.krow .kl{width:108px}}
.kbarw{flex:1;height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.kbar{display:block;height:100%;border-radius:999px;background:var(--ink)}
.krow .kv{flex:none;font-weight:900;white-space:nowrap}

/* ================= All-Home: Sprache ================= */
.langrow{display:flex;gap:8px}
.langrow .lb{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);font-weight:800}
.langrow .lb.on{border-color:var(--ink);background:var(--surface-2)}

/* ================= Kleine Helfer ================= */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function ic(n,s){return '<svg class="ico" width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||"")+'</svg>';}
function errMsg(e){if(!e)return t("Unbekannter Fehler");if(typeof e==="string")return e;return e.message||e.error_description||e.msg||JSON.stringify(e);}
function numOr(v,d){var n=Number(String(v==null?"":v).replace(",","."));return isNaN(n)?d:n;}
function numOrNull(v){if(v==null||v==="")return null;var n=Number(String(v).replace(",","."));return isNaN(n)?null:n;}

/* ---- Geld & Zahlen ---- */
function eur(n){if(n==null||isNaN(n))return "–";return Number(n).toLocaleString(locale(),{style:"currency",currency:"EUR",maximumFractionDigits:2});}
function eur0(n){if(n==null||isNaN(n))return "–";return Number(n).toLocaleString(locale(),{style:"currency",currency:"EUR",maximumFractionDigits:0});}
function num(n,d){if(n==null||isNaN(n))return "–";return Number(n).toLocaleString(locale(),{maximumFractionDigits:(d==null?2:d)});}

/* ---- Datum ---- */
function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(iso){if(!iso)return "–";var p=String(iso).slice(0,10).split("-");if(p.length<3)return String(iso);return p[2]+"."+p[1]+"."+p[0];}
function monJahr(iso){if(!iso)return "";var p=String(iso).slice(0,7).split("-");return p.length===2?(p[1]+"/"+p[0]):"";}
/* Monate addieren; Bruchteile als 30-Tage-Schritte. Monatsende wird geklemmt. */
function addMonthsISO(iso,months){
  var p=String(iso).slice(0,10).split("-").map(Number);
  var whole=Math.trunc(months),days=Math.round((months-whole)*30);
  var d=new Date(Date.UTC(p[0],p[1]-1+whole,p[2]));
  if(d.getUTCDate()!==p[2])d=new Date(Date.UTC(p[0],p[1]+whole,0)); /* Monatsende geklemmt */
  if(days)d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}
function daysUntil(iso){
  var heute=new Date(todayISO()+"T00:00:00Z"),ziel=new Date(String(iso).slice(0,10)+"T00:00:00Z");
  return Math.round((ziel-heute)/86400000);
}
function tageTxt(n){
  if(n==null)return "–";
  if(n<0)return tf("vor {0} Tagen",Math.abs(n));
  if(n===0)return t("heute");
  if(n===1)return t("morgen");
  return tf("in {0} Tagen",n);
}

/* ---- Ampel ---- */
function ampel(days){return days==null?"gray":(days<=30?"red":(days<=90?"amber":"green"));}

/* ================= Fristenlogik =================
   Kündbar zum = Vertragsbeginn + Mindestlaufzeit.
   Letzter Kündigungstag = dieses Datum minus Kündigungsfrist (0,5 = 2 Wochen).
   Fenster verpasst → in Verlängerungsschritten weiterrechnen.
   Gesetz für faire Verbraucherverträge: Verträge ab 1.3.2022 sind nach der
   Mindestlaufzeit jederzeit mit höchstens 1 Monat Frist kündbar.
   Liefert {kind, level, end, lastDay, days, label, sub}. */
function fristInfo(c){
  if(c.status==="beendet")  return {kind:"beendet",  level:"gray",label:t("Beendet"),sub:""};
  if(c.status==="gekuendigt")return {kind:"gekuendigt",level:"gray",
    label:c.gekuendigt_zum?tf("Gekündigt zum {0}",fmtDate(c.gekuendigt_zum)):t("Gekündigt"),sub:""};
  var ml=c.mindestlaufzeit_monate,kf=c.kuendigungsfrist_monate,vl=c.verlaengerung_monate;
  var neu=!!(c.vertragsstart&&c.vertragsstart>=NEUES_RECHT_AB);
  if(ml===0||(ml==null&&vl===1)){
    var f=(kf==null?1:kf);
    return {kind:"flex",level:"green",label:t("Jederzeit kündbar"),sub:tf("Kündigungsfrist {0}",fristTxt(f))};
  }
  if(!c.vertragsstart||ml==null){
    return {kind:"unbekannt",level:"gray",label:t("Fristen unbekannt"),
            sub:t("Vertragsbeginn und Laufzeit ergänzen, dann rechnet All-Home.")};
  }
  if(kf==null)kf=1;
  var ersteEnde=addMonthsISO(c.vertragsstart,ml);
  var letzter=addMonthsISO(ersteEnde,-kf);
  var heute=todayISO();
  if(heute<=letzter){
    var d1=daysUntil(letzter);
    return {kind:"fest",level:ampel(d1),end:ersteEnde,lastDay:letzter,days:d1,
            label:tf("Kündbar zum {0}",fmtDate(ersteEnde)),
            sub:tf("Letzter Kündigungstag: {0} ({1})",fmtDate(letzter),tageTxt(d1))};
  }
  /* Erstlaufzeit vorbei → Verlängerungsphase */
  var effVl=neu?1:(vl==null?12:vl);
  var effKf=neu?Math.min(kf,1):kf;
  if(effVl<=1){
    return {kind:"flex",level:"green",label:t("Jederzeit kündbar"),
            sub:tf("Kündigungsfrist {0}",fristTxt(effKf))+(neu?" · "+t("nach neuem Recht monatlich kündbar"):"")};
  }
  var ende=ersteEnde,schutz=0;
  while(addMonthsISO(ende,-effKf)<heute&&schutz<600){ende=addMonthsISO(ende,effVl);schutz++;}
  var ld=addMonthsISO(ende,-effKf),d2=daysUntil(ld);
  return {kind:"fest",level:ampel(d2),end:ende,lastDay:ld,days:d2,
          label:tf("Kündbar zum {0}",fmtDate(ende)),
          sub:tf("Letzter Kündigungstag: {0} ({1})",fmtDate(ld),tageTxt(d2))+" · "+tf("verlängert sich um {0} Monate",effVl)};
}
function fristTxt(m){
  if(m==null)return t("unbekannt");
  if(m===0.5)return t("2 Wochen");
  if(m===1)return t("1 Monat");
  if(m<1)return tf("{0} Tage",Math.round(m*30));
  return tf("{0} Monate",m);
}
function ivLabel(k){return INTERVALL_LABEL[k]?t(INTERVALL_LABEL[k]):"?";}
/* Monatskosten eines Vertrags (einmalige Zahlungen zählen nicht als laufend) */
function monatskosten(c){
  if(c.kosten==null||c.status!=="aktiv")return 0;
  var m=INTERVALL[c.kosten_intervall];
  if(!m)return 0;
  return Number(c.kosten)/m;
}

/* ---- Meldungen ---- */
var toastTimer;
function toast(msg,err){
  var el=$("#toast");if(!el)return;
  el.textContent=msg;el.className=err?"show err":"show";
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.className="";},3600);
}

/* ================= Routing ================= */
var ROUTES=["start","vertraege","neu","gesundheit","mehr","art","vertrag","einrichten","termine","kosten","vorschlaege"];
function route(){
  var h=location.hash||"";
  if(h.indexOf("#/")!==0)return {name:"start",params:{}};
  var q=h.slice(2).split("?"),name=q[0]||"start",params={};
  (q[1]||"").split("&").forEach(function(kv){
    if(!kv)return;var p=kv.split("=");
    params[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||"");
  });
  if(ROUTES.indexOf(name)<0)name="start";
  return {name:name,params:params};
}

function render(){
  var r=$("#root");if(!r)return;
  if(booting){r.innerHTML=ladeHtml();return;}
  if(!me){r.innerHTML=authHtml();return;}
  var rt=route();
  /* Daten kamen nicht an? Das muss man sehen, nicht erraten. */
  if(LADEFEHLER){r.innerHTML=shell(ladefehlerHtml(),"start");return;}
  /* Noch nicht eingerichtet? Dann führt alles zuerst in die Arten-Auswahl. */
  if(SETUP&&!SETUP.eingerichtet&&rt.name!=="einrichten"&&rt.name!=="mehr"){
    r.innerHTML=shell(viewEinrichten(true),"start");
    return;
  }
  var inhalt="",cur=rt.name;
  if(rt.name==="start")           inhalt=viewStart();
  else if(rt.name==="vertraege")  inhalt=viewVertraege();
  else if(rt.name==="neu")        inhalt=viewNeu();
  else if(rt.name==="gesundheit") inhalt=viewGesundheit();
  else if(rt.name==="mehr")       inhalt=viewMehr();
  else if(rt.name==="einrichten"){inhalt=viewEinrichten(false);cur="mehr";}
  else if(rt.name==="art")       {inhalt=viewArt(rt.params.k);cur="vertraege";}
  else if(rt.name==="vertrag")   {inhalt=viewVertrag(rt.params.id);cur="vertraege";}
  else if(rt.name==="termine")   {inhalt=viewTermine();cur="start";}
  else if(rt.name==="kosten")    {inhalt=viewKosten();cur="start";}
  else if(rt.name==="vorschlaege"){inhalt=viewVorschlaege();cur="start";}
  else                            inhalt=viewStart();
  r.innerHTML=shell(inhalt,cur);
}

/* ---- Energie aus AllTrack spiegeln ----
   AllTrack führt Strom, Gas und Wasser mit Tarifen und Ablesungen im
   public-Schema. All-Home zeigt den aktuellen Tarif nur an und verlinkt dorthin;
   geschrieben wird hier nichts. */
var ALLTRACK_URL="../verbrauchs-tracker/";
/* Spalten von public.tariffs (AllTrack): category, anbieter, abschlag (€/Monat),
   arbeitspreis (€ je Einheit), grundpreis_jahr (€/Jahr), gueltig_ab,
   vertragsstart, laufzeit (Text), kuendigungsfrist (Text), kundennummer. */
async function ladeEnergie(){
  ENERGIE={};
  if(!HH)return;
  try{
    var r=await sbPub.from("tariffs").select("*").eq("household_id",HH.id)
            .order("gueltig_ab",{ascending:false});
    if(!r||r.error)return;
    (r.data||[]).forEach(function(tar){
      var cat=tar.category;
      if(!cat)return;
      if(!ENERGIE[cat])ENERGIE[cat]=tar;   /* absteigend sortiert → der erste ist der jüngste */
    });
  }catch(e){}
}
function energieInfo(art){
  var r=ENERGIE[art];
  if(!r)return null;
  return {
    anbieter:r.anbieter||null,
    abschlag:numOrNull(r.abschlag),                                  /* € im Monat */
    arbeitspreisCt:r.arbeitspreis!=null?numOrNull(r.arbeitspreis)*100:null, /* € → ct */
    grundpreisMon:r.grundpreis_jahr!=null?numOrNull(r.grundpreis_jahr)/12:null,
    kundennummer:r.kundennummer||null,
    vertragsstart:r.vertragsstart||null,
    laufzeit:r.laufzeit||null,
    kuendigungsfrist:r.kuendigungsfrist||null,
    ab:r.gueltig_ab||null
  };
}
/* Monatskosten der gespiegelten Energie (für die Haushaltskosten) */
function energieMonat(art){var e=energieInfo(art);return (e&&e.abschlag)?e.abschlag:0;}

function authMsg(txt,kind){var m=$("#amsg");if(m){m.textContent=txt||"";m.className="amsg"+(kind?" "+kind:"");}}
function loginFehler(e){
  var m=errMsg(e);
  if(/invalid login/i.test(m))return "E-Mail oder Passwort ist falsch.";
  if(/email not confirmed/i.test(m))return "Bitte bestätige zuerst deine E-Mail-Adresse.";
  if(/already registered|already been registered/i.test(m))return "Für diese E-Mail gibt es bereits ein Konto. Bitte anmelden.";
  if(/rate limit|too many/i.test(m))return "Zu viele Versuche. Bitte kurz warten.";

async function doLogin(){
  var mail=($("#a_mail").value||"").trim(),pass=$("#a_pass").value||"";

  try{

  authMsg("Konto wird erstellt …");

    authMsg(r.data&&r.data.session?"Konto erstellt – du wirst angemeldet …":"Fast fertig! Wir haben dir eine Bestätigungs-E-Mail geschickt. Bitte klicke den Link darin an.","ok");

/* ================= Verträge einer Art ================= */
function vertraegeDerArt(k){
  return CONTRACTS.filter(function(c){return (c.art||"sonstiges")===k;});
}
function artMonatskosten(k){
  var a=artInfo(k);
  if(a.spiegel)return energieMonat(a.spiegel);
  return vertraegeDerArt(k).reduce(function(s,c){return s+monatskosten(c);},0);
}
/* Die dringendste Frist einer Art */
function artFrist(k){
  var best=null;
  vertraegeDerArt(k).forEach(function(c){
    if(c.status!=="aktiv")return;
    var f=fristInfo(c);
    if(f.days==null)return;
    if(!best||f.days<best.days)best={days:f.days,level:f.level,c:c,f:f};
  });
  return best;
}

/* ================= Termine ================= */
/* Sammelt Kündigungsfristen und Pflichttermine der nächsten n Tage */
function naheTermine(tage){
  var raus=[];
  CONTRACTS.forEach(function(c){
    var a=artInfo(c.art||"sonstiges");
    /* Kündigungsfrist */
    if(c.status==="aktiv"){
      var f=fristInfo(c);
      if(f.days!=null&&f.days<=tage)
        raus.push({days:f.days,level:f.level,icon:a.icon,
                   titel:(c.anbieter||a.label),text:t("Letzter Kündigungstag")+" · "+fmtDate(f.lastDay),
                   href:"#/vertrag?id="+c.id});
    }
    /* Pflichttermin aus den Zusatzfeldern */
    if(a.termin&&c.details&&c.details[a.termin.k]){
      var d=daysUntil(c.details[a.termin.k]);
      if(d!=null&&d<=tage)
        raus.push({days:d,level:ampel(d),icon:a.icon,
                   titel:(c.anbieter||a.label),text:t(a.termin.l)+" · "+fmtDate(c.details[a.termin.k]),
                   href:"#/vertrag?id="+c.id});
    }
  });
  raus.sort(function(x,y){return x.days-y.days;});
  return raus;
}
function terminZeile(x){
  return '<a class="trow" href="'+x.href+'">'+
    '<span class="dot '+x.level+'"></span>'+
    '<span class="tb"><span class="tn">'+esc(x.titel)+'</span><span class="tx">'+esc(x.text)+'</span></span>'+
    '<span class="tw '+(x.level==="red"?"red":(x.level==="amber"?"amber":""))+'">'+tageTxt(x.days)+'</span>'+
  '</a>';
}

async function speichereVertrag(){
  if(!FORM)return;
  var a=artInfo(FORM.art);
  var anbieter=a.kein_anbieter?"":val("f_anbieter");
  if(!a.kein_anbieter&&!anbieter){toast(t("Bitte mindestens den Anbieter angeben."),true);return;}
  var det={};
  artFelder(a.key).forEach(function(fd){
    var raw=val("f_d_"+fd.k);
    if(!raw)return;
    det[fd.k]=(fd.t==="eur"||fd.t==="num")?numOrNull(raw):raw;
  });
  var spalten={
    art:a.key,
    anbieter:anbieter||(a.kein_anbieter?(val("f_d_inhaber")||a.label):null),
    produkt:val("f_produkt")||null,
    kundennummer:val("f_kundennummer")||null,
    vertragsnummer:val("f_vertragsnummer")||null,
    vertragsstart:val("f_start")||null,
    mindestlaufzeit_monate:valNum("f_ml"),
    kuendigungsfrist_monate:valNum("f_kf"),
    verlaengerung_monate:valNum("f_vl"),
    kosten:valNum("f_kosten"),
    kosten_intervall:val("f_iv")||"monatlich",
    notizen:val("f_notizen")||null,
    details:Object.keys(det).length?det:null
  };
  /* Ganzzahl-Spalten runden, egal woher der Wert kommt */
  ["mindestlaufzeit_monate","verlaengerung_monate"].forEach(function(k){
    if(spalten[k]!=null)spalten[k]=Math.round(spalten[k]);
  });
  /* Plausibilität: warnen, nie blockieren */
  var warn=[];
  if(spalten.kuendigungsfrist_monate!=null&&spalten.mindestlaufzeit_monate>0&&spalten.kuendigungsfrist_monate>spalten.mindestlaufzeit_monate)
    warn.push(tf("Die Kündigungsfrist ({0}) ist länger als die Mindestlaufzeit.",fristTxt(spalten.kuendigungsfrist_monate)));
  if(spalten.vertragsstart&&spalten.vertragsstart>addMonthsISO(todayISO(),18))
    warn.push(tf("Der Vertragsbeginn liegt weit in der Zukunft ({0}).",fmtDate(spalten.vertragsstart)));
  if(spalten.kosten!=null&&spalten.kosten>3000&&spalten.kosten_intervall==="monatlich")
    warn.push(tf("Monatliche Kosten von {0} sind ungewöhnlich hoch – Tippfehler?",eur(spalten.kosten)));
  if(!FORM.id&&a.einzig&&vertraegeDerArt(a.key).some(function(c){return c.status==="aktiv";}))
    warn.push(tf("Für „{0}“ gibt es schon einen aktiven Vertrag. Doppelt versichert?",a.label));
  if(warn.length&&!confirm("🏠 "+t("All-Home ist stutzig:")+"\n\n• "+warn.join("\n• ")+"\n\n"+t("Trotzdem speichern?")))return;
  try{
    if(FORM.id){
      var r=await sb.from("contracts").update(spalten).eq("id",FORM.id);
      if(r.error)throw r.error;
    }else{
      spalten.household_id=HH.id;spalten.status="aktiv";
      var r2=await sb.from("contracts").insert(spalten).select("id").single();
      if(r2.error)throw r2.error;
      FORM.id=r2.data.id;
    }
    /* Ein mitgebrachtes Dokument gleich verknüpfen */
    if(FORM.prefill&&FORM.prefill._docId){
      try{await sb.from("documents").update({contract_id:FORM.id}).eq("id",FORM.prefill._docId);}catch(e){}
    }
    /* Die Art muss angehakt sein, sonst wäre der Vertrag unsichtbar */
    if(!artAktiv(a.key)){
      try{await speichereSetup(aktiveArten().concat([a.key]),true);}catch(e){}
    }
    var zielId=FORM.id;
    FORM=null;closeModal(true);
    await ladeDaten();
    toast(t("Gespeichert")+" ✅");
    go("#/vertrag?id="+zielId);
  }catch(e){toast(t("Speichern fehlgeschlagen")+": "+errMsg(e),true);}
}

function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function icsExport(id){
  var c=vertragById(id);if(!c)return;
  var f=fristInfo(c);
  if(!f.lastDay){toast(t("Für diesen Vertrag ist keine Frist berechenbar."),true);return;}

  var zeilen=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//All-Home//DE","BEGIN:VEVENT",
    "UID:allhome-"+c.id+"-"+dt+"@all-home","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+dt,
    "SUMMARY:"+icsEsc("⏰ "+tf("Kündigungsfrist: {0}",name)),
    "DESCRIPTION:"+icsEsc(tf("Letzter Kündigungstag für {0}. Sonst läuft der Vertrag weiter bis {1}.",name,fmtDate(f.end))),
    "BEGIN:VALARM","TRIGGER:-P14D","ACTION:DISPLAY",
    "DESCRIPTION:"+icsEsc(tf("In 14 Tagen: Kündigungsfrist {0}",name)),"END:VALARM",
    "END:VEVENT","END:VCALENDAR"];
  var blob=new Blob([zeilen.join("\r\n")],{type:"text/calendar;charset=utf-8"});
  lade(blob,"kuendigungsfrist-"+(c.anbieter||"vertrag").toLowerCase().replace(/[^a-z0-9]+/g,"-")+".ics");
  toast(t("Kalender-Datei erstellt 📅"));
}
function lade(blob,name){
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
}

/* ---- Zweisprachige KI-Texte (ai_lang + i18n) ---- */
function aiLangOf(r){return (r&&r.ai_lang)||"de";}
function aiVal(r,key){
  if(!r)return null;
  if(curLang===aiLangOf(r))return r[key];
  var box=r.i18n&&r.i18n[curLang];
  var v=box?box[key]:null;
  return (v==null||v==="")?r[key]:v;
}
function aiExt(d,key){
  var ext=(d&&d.extracted)||{};
  if(!d||curLang===aiLangOf(d))return ext[key];
  var box=d.i18n&&d.i18n[curLang];
  var v=box?box[key]:null;
  return (v==null||v===""||(Array.isArray(v)&&!v.length))?ext[key]:v;
}

/* Bild verkleinern (1-GB-Grenze im Speicher) */
function bildKlein(file){
  return new Promise(function(ok,fehler){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=1800,w=img.naturalWidth,h=img.naturalHeight;
      var s=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement("canvas");cv.width=Math.round(w*s);cv.height=Math.round(h*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){b?ok(b):fehler(new Error(t("Bild konnte nicht verarbeitet werden.")));},"image/jpeg",0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);fehler(new Error(t("Bildformat wird nicht unterstützt. Bitte JPG, PNG oder PDF.")));};
    img.src=url;
  });
}
function bytesBase64(bytes){
  var bin="",chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(bin);
}
/* Supabase-Storage verträgt nur ASCII im Pfad */
function pfadName(name){
  var s=String(name||"dokument");
  try{s=s.normalize("NFC");}catch(e){}
  s=s.replace(/[äöüÄÖÜß]/g,function(c){return {"ä":"ae","ö":"oe","ü":"ue","Ä":"Ae","Ö":"Oe","Ü":"Ue","ß":"ss"}[c];});
  try{s=s.normalize("NFKD").replace(/[̀-ͯ]/g,"");}catch(e){}
  return s.replace(/[^A-Za-z0-9._\-]+/g,"_").slice(-80);
}
function netzFehler(e){
  var m=errMsg(e).toLowerCase();
  if(m.indexOf("failed to fetch")>=0||m.indexOf("load failed")>=0||m.indexOf("network")>=0||m.indexOf("timeout")>=0)
    return t("Netzwerkfehler beim Hochladen – bitte Verbindung prüfen und erneut versuchen.");
  return errMsg(e);
}
async function hochladenMitWiederholung(pfad,bytes,mime){
  var letzter=null;
  for(var i=0;i<3;i++){
    if(i)await new Promise(function(r){setTimeout(r,700*i);});
    try{
      var up=await sb.storage.from(BUCKET).upload(pfad,bytes,{contentType:mime,upsert:false});
      if(!up.error)return up;
      if(i>0&&/exist|dupli|409/i.test(errMsg(up.error)))return {data:{path:pfad},error:null};
      letzter=up.error;
      if(netzFehler(up.error)===errMsg(up.error))return up;  /* echter Fehler: nicht wiederholen */
    }catch(e){letzter=e;}
  }
  return {error:letzter};
}

  IMPORT={laeuft:true,abbruch:false,gesamt:files.length,fertig:0,ergebnisse:[],guthabenLeer:false};
  REVIEW=null;
  for(var i=0;i<files.length;i++){
    IMPORT.fertig=i;
    zeigeArbeit(files.length>1?tf("Dokument {0} von {1} wird gelesen …",i+1,files.length)
                              :t("All-Home liest das Dokument … (10–30 Sek.)"));
    try{await einesVerarbeiten(files[i],ziel);}
    catch(e){IMPORT.ergebnisse.push({name:files[i].name||t("Datei"),icon:"⚠️",text:errMsg(e)});}
  }
  IMPORT.laeuft=false;versteckeArbeit();
  await ladeDaten();
  /* Genau ein Dokument → direkt zur Bestätigung, sonst Sammelbericht */
  if(IMPORT.ergebnisse.length===1&&IMPORT.ergebnisse[0].docId){
    REVIEW=DOCS.filter(function(d){return d.id===IMPORT.ergebnisse[0].docId;})[0]||null;
    IMPORT.ergebnisse=[];
  }
  render();
}
async function einesVerarbeiten(file,ziel){
  var istPdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name||"");
  if(!istPdf&&!ALLOWED_IMG[file.type]&&!/^image\//.test(file.type))
    throw new Error(t("Format nicht unterstützt (nur PDF oder Foto)."));
  if(istPdf&&file.size>12*1024*1024)throw new Error(t("PDF größer als 12 MB"));
  var blob=file,mime=file.type||"application/pdf",name=file.name||("scan-"+Date.now()+".jpg");
  if(!istPdf){blob=await bildKlein(file);mime="image/jpeg";name=name.replace(/\.[^.]+$/,"")+".jpg";}

  var bytes=new Uint8Array(await blob.arrayBuffer());
  /* Dubletten über den Inhalt erkennen: kein Upload, keine KI-Kosten */
  var hash=null;
  try{
    var hb=await crypto.subtle.digest("SHA-256",bytes);
    hash=Array.prototype.map.call(new Uint8Array(hb),function(x){return x.toString(16).padStart(2,"0");}).join("");
  }catch(e){}
  if(hash){
    var dup=DOCS.filter(function(d){return d.content_hash===hash;})[0];
    if(dup){
      IMPORT.ergebnisse.push({name:name,icon:"⏭️",
        text:tf("übersprungen – gleich wie „{0}“",dup.filename||"?"),docId:null});
      return;
    }
  }
  var pfad=HH.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,7)+"_"+pfadName(name);
  var up=await hochladenMitWiederholung(pfad,bytes,mime);
  if(up.error)throw new Error(netzFehler(up.error));
  var ins=await sb.from("documents").insert({
    household_id:HH.id,filename:name,storage_path:pfad,mime_type:mime,
    size_bytes:bytes.length,doc_type:"sonstiges",content_hash:hash,
    contract_id:(ziel&&ziel.vertrag)||null
  }).select("*").single();
  if(ins.error){
    try{await sb.storage.from(BUCKET).remove([pfad]);}catch(e){}
    throw new Error(netzFehler(ins.error));
  }
  var reihe=ins.data,ext=null;
  /* KI-Auslesung */
  try{
    var antwort=await edgeRuf(EDGE_EXTRACT,{fileBase64:bytesBase64(bytes),mimeType:mime,model:kiStufe(),lang:curLang});
    ext=antwort.dokument||null;
  }catch(e){
    if(e&&e.code==="ki_guthaben"){
      IMPORT.guthabenLeer=true;
      try{await sb.from("documents").update({ki_pending:true}).eq("id",reihe.id);}catch(_e){}
      IMPORT.ergebnisse.push({name:name,icon:"⏳",text:t("gespeichert – KI-Guthaben leer, Analyse später"),docId:reihe.id});
      return;
    }
    IMPORT.ergebnisse.push({name:name,icon:"⚠️",text:t("abgelegt, aber KI-Analyse fehlgeschlagen"),docId:reihe.id});
    return;
  }
  if(!ext){
    IMPORT.ergebnisse.push({name:name,icon:"⚠️",text:t("abgelegt, nichts erkannt"),docId:reihe.id});
    return;
  }
  /* Ergebnis speichern */
  var upd={extracted:ext,ai_lang:curLang,
    doc_type:(ext.docType&&DOCTYPE[ext.docType])?ext.docType:"sonstiges",
    doc_date:ext.datum||null,zusammenfassung:ext.zusammenfassung||null,
    titel:(ext.titel||name).slice(0,80)};
  if(ext.istMedizin){
    upd.bereich="medizin";
    upd.fachrichtung=(ext.fachrichtung&&FACH[ext.fachrichtung])?ext.fachrichtung:"sonstiges";
    upd.arzt=ext.arzt||null;
    upd.med_typ=(ext.medTyp&&MEDTYP[ext.medTyp])?ext.medTyp:(ext.docType==="rechnung"?"rechnung":"sonstiges");
    upd.betrag=ext.betrag!=null?Number(ext.betrag):null;
    upd.behandlungsdatum=ext.datum||null;
  }
  try{await sb.from("documents").update(upd).eq("id",reihe.id);}catch(e){}
  IMPORT.ergebnisse.push({name:name,icon:"✅",text:t("eingelesen"),docId:reihe.id});
}
/* Edge-Function aufrufen und Guthaben-/Fehlercode herausziehen */
async function edgeRuf(fn,body){
  var r=await sb.functions.invoke(fn,{body:body});
  if(r.error){
    var code=null,msg=null;
    try{
      if(r.error.context&&typeof r.error.context.json==="function"){
        var jb=await r.error.context.json();
        if(jb){code=jb.code||null;msg=jb.error||null;}
      }
    }catch(e){}
    var err=new Error(msg||errMsg(r.error));err.code=code;throw err;
  }
  var b=r.data||{};
  if(b.error){var e2=new Error(b.error);e2.code=b.code||null;throw e2;}
  return b;
}

/* Welche Art passt zu dem, was die KI gelesen hat? */
function artAusExtrakt(ext){
  if(!ext)return "sonstiges";
  if(ext.istMedizin)return "sonstiges";
  var k=ext.kategorie;
  /* Die groben KI-Kategorien auf den feinen Katalog abbilden */
  var karte={strom:"strom",gas:"gas",wasser:"wasser",internet:"internet",mobilfunk:"mobilfunk",
    streaming:"streaming_video",bank:"girokonto",kfz:"kfz_vers",wohnen:"miete",
    mitgliedschaft:"verein",versicherung:"vers_sonst",gesundheit:"kranken"};
  var art=karte[k]||"sonstiges";
  /* Feiner raten anhand des Anbieters und des Versicherungsworts */
  var txt=((ext.anbieter||"")+" "+(ext.produkt||"")+" "+(ext.zusammenfassung||"")).toLowerCase();
  if(k==="versicherung"||art==="vers_sonst"){
    if(/haftpflicht/.test(txt)&&!/tier|kfz|auto/.test(txt))art="haftpflicht";
    else if(/hausrat/.test(txt))art="hausrat";
    else if(/wohngeb/.test(txt))art="wohngebaeude";
    else if(/rechtsschutz/.test(txt))art="rechtsschutz";
    else if(/berufsunf/.test(txt))art="bu";
    else if(/unfall/.test(txt))art="unfall";
    else if(/zahn/.test(txt))art="zahnzusatz";
    else if(/kfz|auto|fahrzeug/.test(txt))art="kfz_vers";
  }
  if(/rundfunk|beitragsservice|gez/.test(txt))art="rundfunk";
  if(/fitness|gym|mcfit|clever fit/.test(txt))art="fitness";
  if(/adac|avd|acе/.test(txt))art="autoclub";
  return ARTEN[art]?art:"sonstiges";
}
/* Passt das zu einem bestehenden Vertrag? */
function findeVertrag(ext){
  if(!ext)return null;
  var kn=(ext.kundennummer||"").trim(),vn=(ext.vertragsnummer||"").trim();
  var treffer=null;
  CONTRACTS.forEach(function(c){
    if(treffer)return;
    if(kn&&c.kundennummer&&String(c.kundennummer).trim()===kn)treffer=c;
    else if(vn&&c.vertragsnummer&&String(c.vertragsnummer).trim()===vn)treffer=c;
  });
  if(treffer)return treffer;
  var ab=(ext.anbieter||"").trim().toLowerCase();
  if(!ab)return null;
  var art=artAusExtrakt(ext);
  return CONTRACTS.filter(function(c){
    var ca=(c.anbieter||"").trim().toLowerCase();
    if(!ca)return false;
    var passt=(ca===ab)||(ca.indexOf(ab)>=0)||(ab.indexOf(ca)>=0);
    return passt&&(c.art===art||artInfo(c.art).g===artInfo(art).g);
  })[0]||null;
}

var transBusy={};
async function uebersetzeDok(id){
  var d=DOCS.filter(function(x){return x.id===id;})[0];
  if(!d||curLang===aiLangOf(d)||transBusy[id])return false;
  var ext=d.extracted||{},quelle={};
  if(d.titel)quelle.titel=d.titel;
  if(d.zusammenfassung)quelle.zusammenfassung=d.zusammenfassung;
  if(Array.isArray(ext.wichtig)&&ext.wichtig.length)quelle.wichtig=ext.wichtig;
  if(ext.hinweise)quelle.hinweise=ext.hinweise;
  if(ext.behandlung)quelle.behandlung=ext.behandlung;
  if(d.med_recherche)quelle.med_recherche=d.med_recherche;
  var keys=Object.keys(quelle);if(!keys.length)return false;
  var box=(d.i18n&&d.i18n[curLang])||{};
  var fehlt=keys.some(function(k){var v=box[k];return v==null||v===""||(Array.isArray(v)&&!v.length);});
  if(!fehlt)return false;
  transBusy[id]=true;
  try{
    var b=await edgeRuf(EDGE_TRANS,{texte:quelle,ziel:curLang,quelle:aiLangOf(d),model:"basic"});
    if(!b.uebersetzung)return false;
    var neu=Object.assign({},d.i18n||{});
    neu[curLang]=Object.assign({},neu[curLang]||{},b.uebersetzung);
    var r=await sb.from("documents").update({i18n:neu}).eq("id",id);
    if(r.error)throw r.error;
    d.i18n=neu;return true;
  }catch(e){return false;}
  finally{transBusy[id]=false;}
}

var medBusy=false;
async function medErklaeren(id){
  var d=DOCS.filter(function(x){return x.id===id;})[0];if(!d||medBusy)return;
  medBusy=true;
  openModal('<h2 class="mhead">'+ic("search")+' '+t("Verständlich erklären")+'</h2>'+
    '<div class="abrbusy"><span class="spin"></span><span>'+
    t("All-Home liest das Dokument und recherchiert Abrechnungsziffern und Fachbegriffe im Internet … das kann bis zu einer Minute dauern.")+'</span></div>');
  try{
    var dl=await sb.storage.from(BUCKET).download(d.storage_path);
    if(dl.error)throw new Error(t("Datei konnte nicht geladen werden."));
    var bytes=new Uint8Array(await dl.data.arrayBuffer());
    var b=await edgeRuf(EDGE_MED,{fileBase64:bytesBase64(bytes),mimeType:d.mime_type||"application/pdf",
      model:kiStufe(),lang:curLang,
      kontext:{arzt:d.arzt||null,fachrichtung:d.fachrichtung||null,medTyp:d.med_typ||null,betrag:d.betrag!=null?d.betrag:null}});
    if(!b.recherche)throw new Error(t("Keine Erklärung erhalten."));
    /* In die Hauptspalte nur, wenn die Sprache zur übrigen KI-Ausgabe passt */
    var upd={med_recherche_am:new Date().toISOString()};
    if(curLang===aiLangOf(d))upd.med_recherche=b.recherche;
    else{
      var box=Object.assign({},d.i18n||{});
      box[curLang]=Object.assign({},box[curLang]||{},{med_recherche:b.recherche});
      upd.i18n=box;
      if(!d.med_recherche)upd.med_recherche=b.recherche;
    }
    var r=await sb.from("documents").update(upd).eq("id",id);
    if(r.error)throw r.error;
    closeModal(true);await ladeDaten();go("#/gesundheit?doc="+id);
    toast(t("Erklärung erstellt ✅"));
  }catch(e){
    closeModal(true);
    if(e&&e.code==="ki_guthaben")toast(t("Das KI-Guthaben ist aufgebraucht – bitte später erneut."),true);
    else toast(t("Erklären fehlgeschlagen")+": "+errMsg(e),true);
  }finally{medBusy=false;}
}

/* ---- Steuerübersicht als CSV ---- */
function medCsv(){
  var meds=DOCS.filter(function(d){return istMed(d)&&d.betrag!=null;});
  if(!meds.length){toast(t("Keine Arztkosten mit Betrag erfasst."),true);return;}
  meds=meds.slice().sort(function(a,b){
    return String(a.behandlungsdatum||a.doc_date||"").localeCompare(String(b.behandlungsdatum||b.doc_date||""));
  });
  function z(s){s=String(s==null?"":s);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
  function geld(n){return Number(n).toFixed(2).replace(".",",");}
  var reihen=[[t("Jahr"),t("Datum"),t("Patient"),t("Arzt / Praxis"),t("Fachrichtung"),t("Art"),t("Betrag (EUR)")]];
  meds.forEach(function(d){
    var dt=d.behandlungsdatum||d.doc_date||"";
    reihen.push([String(dt).slice(0,4),fmtDate(dt),personName(d.person_id)||"—",
      d.arzt||"",fachInfo(d.fachrichtung||"sonstiges").label,medTypInfo(d.med_typ).label,geld(d.betrag)]);
  });
  /* Summen je Jahr und Person */
  var agg={};
  meds.forEach(function(d){
    var j=String(d.behandlungsdatum||d.doc_date||"").slice(0,4),k=j+"|"+(d.person_id||"");
    if(!agg[k])agg[k]={j:j,p:d.person_id,sum:0,n:0};
    agg[k].sum+=Number(d.betrag);agg[k].n++;
  });
  reihen.push([]);reihen.push([t("Summen je Jahr und Person")]);
  reihen.push([t("Jahr"),t("Patient"),t("Anzahl"),t("Summe (EUR)")]);
  Object.keys(agg).sort().forEach(function(k){
    var a=agg[k];reihen.push([a.j,personName(a.p)||"—",a.n,geld(a.sum)]);
  });
  var csv="﻿"+reihen.map(function(r){return r.map(z).join(";");}).join("\r\n");
  lade(new Blob([csv],{type:"text/csv;charset=utf-8"}),"arztkosten-steuer.csv");
  toast(t("Steuerübersicht erstellt 📄"));
}

  {k:"fristen",  label:"Kündigungsfristen",        text:"Warnt, bevor eine Frist abläuft."},
  {k:"luecken",  label:"Vollständigkeits-Check",   text:"Zeigt, welche Verträge dem Haushalt noch fehlen."},
  {k:"preis",    label:"Preiserhöhungen",          text:"Startet die Uhr für das Sonderkündigungsrecht."},
  {k:"termine",  label:"Pflichttermine",           text:"HU/TÜV, Ausweise, Wartung."},
