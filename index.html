<style>
/* ================= Farben & Maße ================= */

:root{
  --bg:#f7f4ef;--surface:#ffffff;--surface-2:#f2eee7;--surface-3:#e9e3d9;
  --line:#e7e0d5;--line-2:#d9d0c2;
  --text:#231f1a;--muted:#6a6156;--muted-2:#a39a8d;
  --ink:#231f1a;--ink-fg:#fffaf2;
  --pos:#147a4a;--pos-bg:#e3f5ec;--neg:#b8352b;--neg-bg:#fde8e5;--warn:#965800;--warn-bg:#fff1d6;--info:#2f5cbb;--info-bg:#e6eefc;
  --strom:#e8930c;--strom-bg:#fff2d9;--wasser:#1a9fd8;--wasser-bg:#e0f3fb;--gas:#ec6431;--gas-bg:#fde7dc;
  --r-xl:28px;--r-lg:22px;--r:16px;--r-sm:12px;
  --sh-1:0 1px 2px rgba(35,31,26,.05);
  --sh-2:0 1px 2px rgba(35,31,26,.04),0 10px 28px -14px rgba(35,31,26,.22);
  --sh-3:0 18px 50px -18px rgba(35,31,26,.38);
  --nav-h:74px;--side-w:248px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html.dark{
  --bg:#15130f;--surface:#1f1c17;--surface-2:#28241e;--surface-3:#332e27;
  --line:#353029;--line-2:#453f36;
  --text:#f4efe7;--muted:#a89e90;--muted-2:#7e7569;
  --ink:#f4efe7;--ink-fg:#15130f;
  --pos:#45d28f;--pos-bg:rgba(69,210,143,.13);--neg:#ff7d70;--neg-bg:rgba(255,125,112,.13);--warn:#ffb547;--warn-bg:rgba(255,181,71,.13);--info:#86a8ff;--info-bg:rgba(134,168,255,.13);
  --strom:#ffb23e;--strom-bg:rgba(255,178,62,.14);--wasser:#4cc3f5;--wasser-bg:rgba(76,195,245,.14);--gas:#ff8757;--gas-bg:rgba(255,135,87,.14);
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  --sh-3:0 18px 50px -18px rgba(0,0,0,.75);
}/* ================= Grundlagen ================= */


*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{scrollbar-gutter:stable}
body{background:var(--bg);color:var(--text);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.ico{display:inline-block;vertical-align:middle;flex:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--info) 55%,transparent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}/* ================= App-Rahmen ================= */


.shell{min-height:100vh}/* width:100% – sonst schrumpft die Rasterzelle (margin:auto) auf Inhaltsbreite und jede Seite sitzt woanders */

.main{padding:18px 16px calc(var(--nav-h) + 52px + env(safe-area-inset-bottom));width:100%;max-width:1180px;margin:0 auto;min-width:0}
.side{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:stretch}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding:0 0 10px;color:var(--muted);font-size:.72rem;font-weight:700;border-radius:14px;transition:color .15s}
.nb[aria-current="page"]{color:var(--text)}
.nb[aria-current="page"] .nbi{background:var(--surface-2)}
.nbi{display:grid;place-items:center;width:44px;height:30px;border-radius:12px;transition:background .15s}/* Der runde Neu-Knopf schwebt ueber der Leiste und macht sie nicht hoeher. */

.nb-add{position:relative}/* Farbring als Verlaufsrand: haengt nicht von der Ebenen-Reihenfolge ab (transform erzeugt eine eigene). */

.nb-add .fab{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--ink-fg);border:4px solid transparent;background:linear-gradient(var(--ink),var(--ink)) padding-box,conic-gradient(from 200deg,var(--strom),var(--wasser),var(--gas),var(--strom)) border-box;box-shadow:var(--sh-3)}
.nb-add .lbl{margin-top:0}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:var(--side-w) 1fr}
  .bnav{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.25rem;padding:6px 10px 18px}
  .brand .logo{width:34px;height:34px;border-radius:10px;box-shadow:var(--sh-1)}
  .sb{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-weight:700;color:var(--muted)}
  .sb:hover{background:var(--surface-2);color:var(--text)}
  .sb[aria-current="page"]{background:var(--surface-2);color:var(--text)}
  .sb-add{margin:4px 0 12px;justify-content:center;background:var(--ink);color:var(--ink-fg)!important;box-shadow:var(--sh-2)}
  .sb-add:hover{background:var(--ink);filter:brightness(1.08)}
  .sb-add[aria-current="page"]{background:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 22%,transparent)}
  .main{padding:30px 34px 48px}
}/* ================= Kopfzeile ================= */


.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 18px}
.greet{color:var(--muted);font-weight:700;font-size:.92rem}
.hh{display:inline-flex;align-items:center;gap:6px;font-size:1.55rem;font-weight:900;letter-spacing:-.01em;line-height:1.15;border-radius:12px;padding:2px 4px;margin-left:-4px}
.hh.can:hover{background:var(--surface-2)}
.pt{font-size:1.55rem;font-weight:900;letter-spacing:-.01em;margin:4px 2px 16px}/* ================= Karten ================= */


.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px}
.grid{display:grid;gap:14px}/* Rasterzellen duerfen schrumpfen – sonst sprengt breiter Inhalt (Tabellen) die Seitenbreite */

.grid>*{min-width:0}
.sect{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-weight:900;font-size:1.05rem}
.sect .more{font-size:.86rem;font-weight:800;color:var(--muted)}/* Hero */
.hrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line)}
.hrow .v{margin-left:auto;font-weight:900}/* Bereichs-Abzeichen */


.cb{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.cb.strom{background:var(--strom-bg);color:var(--strom)}.cb.wasser{background:var(--wasser-bg);color:var(--wasser)}.cb.gas{background:var(--gas-bg);color:var(--gas)}
.cb.sm{width:30px;height:30px;border-radius:10px}/* Faellig-Karte *//* Kacheln */


.tiles{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-1);transition:transform .15s var(--ease),box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.tile .hd{display:flex;align-items:center;gap:10px}
.tile .nm{font-weight:900;font-size:1.05rem}
.tile .mt{color:var(--muted);font-size:.84rem;font-weight:700}
.tile .row{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.tile .cost{font-size:1.45rem;font-weight:900;letter-spacing:-.01em}
.tile .spark{display:block;width:100%;height:38px;margin-top:10px}/* Pillen & Chips */


.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-weight:900;font-size:.8rem;white-space:nowrap}
.pill.pos{background:var(--pos-bg);color:var(--pos)}.pill.mut{background:var(--surface-2);color:var(--muted)}/* Vorschlaege */


.sugs{display:grid;gap:10px}
.sug{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 14px 14px;box-shadow:var(--sh-1)}
.sug .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.sug.info .si{background:var(--info-bg);color:var(--info)}.sug.warn .si{background:var(--warn-bg);color:var(--warn)}.sug.good .si{background:var(--pos-bg);color:var(--pos)}.sug.bad .si{background:var(--neg-bg);color:var(--neg)}
.sug .sb2{flex:1;min-width:0}
.sug .st{font-weight:900}
.sug .sx{color:var(--muted);font-size:.9rem;margin-top:1px}
.sug .sa{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.sug .dis{color:var(--muted-2);padding:4px;border-radius:10px;margin:-4px -4px 0 0}
.sug .dis:hover{color:var(--text);background:var(--surface-2)}/* Knoepfe */


.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--ink-fg);font-weight:900;box-shadow:var(--sh-1);transition:filter .15s,transform .06s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(1px)}
.btn.lg{min-height:54px;font-size:1.05rem;padding:0 26px}
.btn.full{width:100%}
.btn.line{background:transparent;color:var(--text);border:1.5px solid var(--line-2);box-shadow:none}
.btn.sm{min-height:36px;padding:0 14px;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.lnk{font-weight:900;color:var(--text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:var(--surface-2);color:var(--text)}/* Bottom-Sheet / Popover */


.scrim{position:fixed;inset:0;z-index:80;background:rgba(21,19,15,.38);opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:81;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--sh-3);transform:translateY(100%);transition:transform .26s var(--ease)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line-2);margin:4px auto 12px}
.sheet h3{margin:4px 0 12px;font-size:1.15rem;font-weight:900}
@media (min-width:900px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:480px;border-radius:24px;transform:translate(-50%,-46%);opacity:0;transition:transform .2s var(--ease),opacity .2s}.sheet.on{transform:translate(-50%,-50%);opacity:1}.sheet .grab{display:none}}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;border-radius:14px;font-weight:800}
.opt:hover{background:var(--surface-2)}
.opt .ck{margin-left:auto;color:var(--pos)}/* Hinweise, Leerzustaende, Laden */
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 12px;color:var(--muted)}
.empty h3{color:var(--text);margin:0 0 6px;font-weight:900}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}/* Toast */


#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:90;width:max-content;max-width:calc(100% - 28px);background:var(--ink);color:var(--ink-fg);padding:12px 16px;border-radius:16px;font-weight:800;box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);display:flex;align-items:center;gap:12px}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast.err{background:var(--neg);color:#fff}/* bei offenem Fenster oben, damit keine Knoepfe verdeckt werden */

#toast.top{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px)}
#toast.top.on{transform:translate(-50%,0)}
#toast button{font-weight:900;text-decoration:underline;text-underline-offset:3px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:grid;gap:2px}
.kpi span{color:var(--muted);font-weight:800;font-size:.84rem}.kpi b{font-size:1.5rem;font-weight:900}.kpi small{color:var(--muted);font-weight:700}
@media (min-width:900px){#toast{bottom:28px}}/* Anmeldung */


.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.authc{width:100%;max-width:400px}
.authc .logo{display:block;width:64px;height:64px;border-radius:18px;margin-bottom:18px;box-shadow:var(--sh-2)}
.authc h1{font-size:2rem;font-weight:900;margin:0 0 4px;letter-spacing:-.02em}
.authc p{color:var(--muted);margin:0 0 22px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-weight:800;font-size:.88rem;margin:0 0 6px 4px}
.inp{width:100%;min-height:52px;padding:0 16px;border-radius:16px;border:1.5px solid var(--line-2);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 10%,transparent)}
.amsg{min-height:22px;margin:10px 4px;font-weight:800;font-size:.9rem}
.amsg.err{color:var(--neg)}.amsg.ok{color:var(--pos)}
.arow{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}/* ================= Formular-Fluss ================= */
.mhead{display:flex;align-items:center;gap:14px}
.mhead .cb{width:54px;height:54px;border-radius:17px}
.mhead h2{margin:0;font-size:1.7rem;font-weight:900;letter-spacing:-.01em}
.mrow{display:flex;gap:10px;align-items:stretch;margin-top:18px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{display:flex;align-items:flex-start;gap:8px;margin:10px 4px 0;font-weight:800;font-size:.9rem;color:var(--muted);min-height:22px}
.amp{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px;background:var(--line-2)}
.amp.green{background:var(--pos)}.amp.red{background:var(--neg)}
.hint.red{color:var(--neg)}.hint.green{color:var(--pos)}
.factions{display:grid;gap:12px;margin-top:22px}/* ================= Verlauf ================= */
.sel{min-height:38px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);padding:0 12px;font-weight:800}
.chart{display:block;width:100%;height:auto;margin-top:6px;overflow:visible}
.lg{display:inline-block;width:14px;height:10px;border-radius:3px}
.lg.dot{height:0;border-top:2.5px dotted var(--text);border-radius:0}
.lg.fc{border:1.5px dashed;background:transparent}
.tag{display:inline-block;padding:0 7px;border-radius:7px;background:var(--surface-2);color:var(--muted);font-weight:800;font-size:.74rem}
.dl{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.dl span{color:var(--muted);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;font-weight:800;margin:4px 4px 12px}
.chk input{width:20px;height:20px}/* ================= Vertraege ================= */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kv>div{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.kv span{color:var(--muted);font-weight:700;font-size:.8rem}.kv b{font-weight:900}
.drow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fld{min-width:0}
details.more{margin:4px 0 8px}
details.more summary{cursor:pointer;font-weight:800;color:var(--muted);padding:8px 2px}
select.inp{padding-right:10px}/* ================= Mehr ================= */


.mgrp{margin:22px 6px 8px;font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.mrow2{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);min-height:58px}
.mlist>.mrow2:last-child{border-bottom:0}
button.mrow2:hover,a.mrow2:hover{background:var(--surface-2)}
.mrow2 .mi{width:34px;height:34px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.mrow2 .mt2{flex:1;display:grid;min-width:0}.mrow2 .mt2 small{color:var(--muted);font-weight:700;font-size:.8rem}
.mrow2 .mr{display:flex;align-items:center;gap:4px;color:var(--muted);font-weight:800;font-size:.86rem;white-space:nowrap}
.mrow2.off{opacity:.5}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--muted);margin:2px 0}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setupcat{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:var(--r-lg);border:2px solid var(--line);background:var(--surface);font-size:1.1rem;text-align:left}
.setupcat .ck{margin-left:auto;color:var(--muted-2)}
.setupcat.on{border-color:var(--ink)}.setupcat.on .ck{color:var(--pos)}/* ================= Mehrschritt-Ansichten ================= */
.abrlvl>span:nth-child(2){flex:1;display:grid;gap:2px}
.abrbusy{display:grid;justify-items:center;gap:10px;padding:48px 20px;text-align:center}.abrbusy small{color:var(--muted);font-weight:700}

/* ================= All-Home: Vertragsarten ================= */

.grp{display:flex;align-items:center;gap:9px;margin:var(--sect) 4px 10px;font-weight:900;font-size:1.02rem}

.slots{display:grid;gap:12px;grid-template-columns:1fr}
.slot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh-1);transition:transform .15s var(--ease),box-shadow .15s,border-color .15s}

.slot .ai{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:1.15rem;flex:none}
.slot .sb3{flex:1;min-width:0}
.slot .sn{font-weight:900;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .ss{color:var(--muted);font-size:.84rem;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .srt{flex:none;display:flex;align-items:center;gap:8px}
.slot .scost{font-weight:900;font-size:.95rem;white-space:nowrap}
.slot .go{color:var(--muted-2);flex:none}/* Leerer Platz: gestrichelt, zurückgenommen – lädt zum Füllen ein */

.slot.leer{border-style:dashed;border-color:var(--line-2);background:transparent;box-shadow:none}
.slot.leer .ai{background:transparent;border:1.5px dashed var(--line-2);color:var(--muted-2)}
.slot.leer .sn{color:var(--muted);font-weight:800}
.slot.leer:hover{border-color:var(--ink);background:var(--surface)}/* Mehrere Verträge in einer Art */

.slot .cnt{background:var(--surface-2);color:var(--muted);font-weight:800;font-size:.76rem;border-radius:999px;padding:2px 8px;flex:none}/* Aus AllTrack gespiegelt */

.slot.mirror .ai{background:var(--info-bg);color:var(--info)}
.mlink{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.8rem;color:var(--info);background:var(--info-bg);border-radius:999px;padding:3px 10px}/* ================= All-Home: Einrichtung (Arten anhaken) ================= */


.setupgrid{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:620px){.setupgrid{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.setupgrid{grid-template-columns:1fr 1fr 1fr}}/* schlanker als .setupcat: es sind über 50 Zeilen, die müssen ruhig wirken */

.artpick{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:800;transition:border-color .12s,background .12s}
.artpick .pi{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:1rem;flex:none}
.artpick .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artpick .ck{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent}
.artpick:hover{border-color:var(--line-2);background:var(--surface-2)}
.artpick.on{border-color:var(--ink);background:var(--surface)}
.artpick.on .ck{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.artpick.on .pi{background:var(--surface-3)}/* Hinweis auf Arten, die der Haushalt vermutlich braucht */

.artpick .rec{flex:none;font-size:.7rem;font-weight:900;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:2px 7px}/* ================= All-Home: Fristen & Termine ================= */
/* Ampel als farbiger Punkt vor der Zeile */



.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.red{background:var(--neg)}.dot.amber{background:var(--warn)}.dot.green{background:var(--pos)}.dot.gray{background:var(--muted-2)}.dot.blue{background:var(--info)}
.trow{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow .tb{flex:1;min-width:0}
.trow .tn{font-weight:800;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tx{color:var(--muted);font-size:.82rem;font-weight:700;margin-top:1px}
.trow .tw{flex:none;font-weight:900;font-size:.85rem;white-space:nowrap}
.trow .tw.red{color:var(--neg)}.trow .tw.amber{color:var(--warn)}/* ================= All-Home: Dokumente am Vertrag ================= */


.dlist{display:flex;flex-direction:column}

.drow3 .dn{font-weight:800;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow3 .dm{color:var(--muted);font-size:.79rem;font-weight:700;margin-top:1px;display:flex;gap:8px;flex-wrap:wrap}/* fehlendes Dokument: gestrichelter Platzhalter wie beim Vertrags-Platz */

.drow3.fehlt{border:1.5px dashed var(--line-2);border-radius:var(--r-sm);margin:4px 0;padding:11px 10px}
.drow3.fehlt .di{background:transparent;border:1.5px dashed var(--line-2);color:var(--muted-2)}
.drow3.fehlt .dn{color:var(--muted);font-weight:800}/* ================= All-Home: Kostenaufschlüsselung ================= */


.krow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:.88rem}

.krow .kv{flex:none;font-weight:900;white-space:nowrap;display:block;margin:0}/* ================= All-Home: Sprache ================= */

.langrow .lb.on{border-color:var(--ink);background:var(--surface-2)}/* ================= All-Home: Breite im Griff ================= */
/* Eine Zeile darf die Seite nie verbreitern. Sonst rechnet das Handy mit einer
   breiteren Fläche, und die untere Leiste rutscht aus dem Bild (10.10.2026).

:where(.slots,.setupgrid,.tiles,.kpis,.kv,.two,.abrres,.mcols,.vgrid2)>*{min-width:0}/* 2) Text-Zeilen sind <span>: erst als Block greift das Abkürzen mit „…". */

.slot .sn,.slot .ss,.trow .tn,.trow .tx,.drow3 .dn{display:block}/* 3) Sicherung: was trotzdem übersteht, wird abgeschnitten statt die Seite aufzublähen. */

.main{overflow-x:clip}/* Filterzeile (Gesundheit): Auswahlfelder brechen um statt überzustehen */

.filt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filt .sel{flex:1 1 140px;min-width:0;max-width:100%}/* ================= All-Home: Knopf-Varianten & Kennzahlen ================= */
/* Zweitknopf: zurückgenommen neben dem Hauptknopf */



.btn.ghost{background:var(--surface-2);color:var(--text);box-shadow:none}
.btn.ghost:hover{filter:none;background:var(--surface-3)}/* Zerstörende Aktion: rot, aber nicht laut */

.kpi .kl{color:var(--muted);font-weight:800;font-size:.84rem}
.kpi .kv{display:block;margin:0;font-size:1.5rem;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .ks{color:var(--muted);font-weight:700;font-size:.84rem}
a.kpi:hover{border-color:var(--line-2)}/* drei Kacheln: auf dem Handy die dritte über die volle Breite */

@media (min-width:620px){.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k3>.kpi:last-child{grid-column:auto}}/* Angaben als Liste: Bezeichnung links, Wert rechts.

.kvl{display:flex;flex-direction:column}

.filt .sel:first-child{flex-basis:100%}/* .lg ist in AllTrack ein Legenden-Kästchen (14×10 px, 3 px Rundung) und

.inp.bad{border-color:var(--neg);box-shadow:0 0 0 3px var(--neg-bg)}/* ================= All-Home: Häuser & Mitglieder ================= */

.inp.code-in{text-transform:uppercase;letter-spacing:.2em;font-weight:900;text-align:center;font-size:1.2rem}/* Hausname oben: lang darf er sein, aber nicht die Kopfzeile sprengen */

.top .hh{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}/* ================= All-Home: Anbieter-Logos ================= */

html.dark .logo{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}/* Vertragskopf: Kachel neben Name und Art */

.vkopf .vk{display:flex;align-items:center;gap:14px;min-width:0}

.top>div{min-width:0}

.kz{display:inline-flex;align-items:stretch;flex:none;border:1.5px solid #231f1a;border-radius:5px;background:#fff;color:#111;

/* ================= 1.8.2: Lesbarkeit aus der Gesamtprüfung ================= */
/* Zweizeilig statt abgeschnitten, wo sonst Wichtiges fehlt (Kennzeichen, Kündigungsdatum, lange Vertragsarten) */
.trow .tn,.slot .sn,.slot .ss,.artpick .pn,.hhw,.hhwa,.fzn,.krow .kl,.drow3 .dn,.drow3.wahl .wtxt .dn{
  white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}
/* Trefferflächen mindestens 40 px hoch – Lage und Aussehen bleiben */
.back{padding:9px 0;margin:-7px 0}
main>a.lnk,.arow .lnk{display:inline-block;padding:9px 0;margin:-9px 0}
.drow3>.lnk{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 4px 0 8px;margin:-10px 0}
.sug .dis{padding:12px;margin:-12px -12px -8px 0}
.drow3.wahl .wbox{position:relative}
.drow3.wahl .wbox::after{content:"";position:absolute;inset:-9px}
/* Listen mit Hinweis-Farbe: untereinander (.hint ist sonst eine Flex-Zeile – die Punkte liefen ineinander) */
ul.hint,ol.hint{display:block}
ul.hint li+li,ol.hint li+li{margin-top:4px}
/* Auswahl-Blätter: Häkchen nur beim Gewählten (blasse Häkchen sahen wie „auch gewählt“ aus) */
.setupcat:not(.on) .ck{visibility:hidden}
/* Pflicht-Sternchen lesbar */
.fld .pfl,.pfl-leg .pfl{color:var(--warn)}

/* ================= 1.8.5: Knopf arbeitet ================= */
.laeuft{opacity:.6;cursor:progress;pointer-events:none}
.btn.laeuft::after{content:"";display:inline-block;width:14px;height:14px;margin-left:8px;vertical-align:-2px;
  border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}

/* ================= 1.9.0: Registrierungen ================= */
.regz{display:flex;flex-direction:column;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line)}
.regz:last-child{border-bottom:0}
.regz .db{display:flex;flex-direction:column;gap:3px;min-width:0}
.regz .dn{font-weight:800;overflow-wrap:anywhere}
.regz .dm{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13px;font-weight:600}
.regz .dm span{overflow-wrap:anywhere}
.regz .factions{margin:0}
.authc .kvl .kw{overflow-wrap:anywhere}

/* ================= 1.9.2: Kästen untereinander brauchen Luft ================= */
main>.sug+.card,main>.sug+.sug,main>.card+.sug,main>.card+.card{margin-top:12px}
.zv{display:grid;gap:12px;margin:0 0 14px}
.pickliste{display:grid;gap:8px}
.cause+.cause{margin-top:8px}
/* ---- Zentrale (1.10.0) ---- */
.langrow.zttabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.zttabs .lb{min-width:0;padding:10px 4px;font-size:.86rem;text-align:center}
.zttabs .lb .pill{margin-left:2px}
@media(min-width:560px){.langrow.zttabs{grid-template-columns:repeat(5,minmax(0,1fr))}.langrow.ztzr{grid-template-columns:repeat(4,minmax(0,1fr))}}
.langrow.ztzr{grid-template-columns:repeat(4,minmax(0,1fr))}
.ztbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.ztbar>i{display:block;height:100%;border-radius:inherit;background:var(--ink)}
.ztbar.warn>i{background:var(--warn)}.ztbar.bad>i{background:var(--neg)}
.ztbar.fein{height:6px;margin-top:4px}
.ztbk{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ztbk>span{color:var(--muted);font-weight:800;font-size:.88rem}
.ztbk b{font-size:1.15rem;font-weight:900}.ztbk b .mut{font-size:.86rem;font-weight:700}
.ztbm{color:var(--muted);font-weight:700;font-size:.8rem;margin-top:6px}
.kpis.ztkpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.kpis.ztkpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ztliste{display:grid;gap:12px}
.ztzk{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.ztzn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ztzw{white-space:nowrap}
.ztzm{color:var(--muted);font-weight:700;font-size:.78rem;margin-top:3px}
.ztkarte{margin-bottom:12px}
.ztkopf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}.ztkopf b{font-size:1.02rem;margin-right:4px}
.ztzahlen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
@media(min-width:480px){.ztzahlen{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ztzahlen>div{background:var(--surface-2);border-radius:var(--r-md,10px);padding:8px 6px;text-align:center;min-width:0}
.ztzahlen b{display:block;font-size:1.05rem;font-weight:900}.ztzahlen span{display:block;color:var(--muted);font-weight:700;font-size:.72rem;overflow:hidden;text-overflow:ellipsis}
.ztmeta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-weight:700;font-size:.8rem;margin-bottom:8px}
.ztmitgl{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;font-weight:700;overflow-wrap:anywhere}
.zte.warn .di{color:var(--warn)}.zte.fehler .di{color:var(--neg)}
.ztknoepfe{flex-direction:column;align-items:stretch}
.ztz{min-width:0}
.ztbudget .factions{margin-bottom:0}

/* ================= 1.12.0: Umbruch – Wörter nach Silben trennen, nie mitten im Wort ================= */
/* Vertragskopf: Text neben dem Logo nimmt die ganze freie Breite (sonst brach „Ostrom“ als „Ostro|m“ um) */
.vkopf .vk>div{flex:1 1 auto}
/* Lange Wörter (Tierkrankenversicherung, Nebenkostenabrechnung, Хронология) mit Trennstrich nach Silben */
.top div.hh,.trow .tn,.slot .sn,.slot .ss,.artpick .pn,.drow3 .dn,.st,.lb,.hhn,.kvr .kk,.sug .sx,.empty h3{-webkit-hyphens:auto;hyphens:auto}
/* Listentitel: drei statt zwei Zeilen, bevor gekürzt wird (Kennzeichen + langer Versicherername) */
.trow .tn,.slot .sn,.artpick .pn,.drow3 .dn,.drow3.wahl .wtxt .dn{-webkit-line-clamp:3}
/* Vorschlags-Einstellungen: Titel und Erklärung vollständig */
.pickliste .artpick .pn{display:block;-webkit-line-clamp:unset;overflow:visible}
/* Lange Werte (FIN, IBAN, Nummern) rutschen unter die Bezeichnung statt zerschnitten zu werden */
.kvr{flex-wrap:wrap}
.kvr .kw{margin-left:auto}
/* Gesundheit auf dem Handy: Reiter 2 × 2, Filter umbrechen statt abgeschnitten */
@media(max-width:559px){.langrow.medtabs{display:grid;grid-template-columns:1fr 1fr}.filt.medfilt .sel{flex:1 1 140px}}

/* ================= 1.13.0: Android-App ================= */
/* Update-Karte oben auf der Startseite */
.appupd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.appupd-z{display:flex;align-items:center;gap:12px;flex:1 1 auto;min-width:0}
.appupd .btn{flex:none;white-space:nowrap}
.appupd .di{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--info-bg);color:var(--info);flex:none}
.appupd .db{display:flex;flex-direction:column;min-width:0}
.appupd .dn{font-weight:800}
.appupd .dm{color:var(--muted);font-size:.86rem}
/* Versionszeile unter der Anmeldung (nur in der App) */
.authc .appv{margin:16px 0 0;text-align:center;font-size:.8rem}
/* Dokument-Ansicht: ganze Fläche, Kopf mit Schließen / Öffnen mit / Teilen */
#appAnsicht{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column}
body.ansicht-open{overflow:hidden}
.aa-kopf{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.aa-titel{flex:1 1 auto;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aa-flaeche{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(12px + env(safe-area-inset-bottom));touch-action:pan-x pan-y}
.aa-seiten{width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.aa-seite{width:100%;aspect-ratio:1/1.414;background:#fff;border-radius:6px;box-shadow:var(--sh-1);display:grid;place-items:center;overflow:hidden}
.aa-bild{display:block;width:100%;height:auto;border-radius:6px;background:#fff}
.aa-leer{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center;padding:16px}
/* Untertitel in Auswahl-Kacheln: eigener Absatz mit engem Zeilenabstand */
.artpick .pn .ps{display:block;margin-top:3px;font-size:.8rem;font-weight:700;line-height:1.35;color:var(--muted)}
/* Links in Werten (Nachfolger, Vorgänger): Tippfläche 44 px, ohne die Zeile zu verschieben */
.kvr .kw a.lnk{position:relative}
.kvr .kw a.lnk::after{content:"";position:absolute;inset:-11px -4px}

/* ================= 1.13.2: Statusleiste ================= */
/* Android-App (WebView ab 140) und iPhone-Vollbild zeichnen bis ganz oben. env() liefert der Browser,
   --safe-area-inset-top setzt Capacitor; im normalen Browser ist beides 0 und nichts verschiebt sich. */
:root{--oben:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))}
.shell{padding-top:var(--oben)}
.auth{padding-top:calc(24px + var(--oben))}
.side{top:var(--oben);height:calc(100vh - var(--oben))}
/* Beim Scrollen läuft nichts unter die Uhr: Streifen in Hintergrundfarbe (unter Blättern, Scanner und Ansicht) */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:var(--oben);background:var(--bg);z-index:60;pointer-events:none}

/* ================= 1.14.0: Download-Link der App ================= */
.appdl-kopf{display:flex;align-items:center;gap:12px}
.appdl-kopf .di{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--surface-2);flex:none}
.appdl-kopf .db{display:flex;flex-direction:column;min-width:0}
.appdl-kopf .dn{font-weight:800}
.appdl-kopf .dm{color:var(--muted);font-size:.86rem}
.appdl{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.appdl-l{display:flex;flex-direction:column;gap:4px;min-width:0}
.appdl-l .kk{color:var(--muted);font-size:.86rem;font-weight:700}
/* Adresse bricht nur an den Schrägstrichen um (<wbr>), nie mitten im Wort */
.appdl-url{font-size:.84rem;color:var(--text);overflow-wrap:break-word;user-select:all;-webkit-user-select:all}
.appdl-k{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.appdl-k .btn{flex:1 1 120px;justify-content:center;white-space:nowrap}
/* ================= Scanner =================
   Eigene Ebene über der App. Kamera und Seiten dunkel (wie jede Kamera-App),
   das Speichern-Blatt in den Farben der App. */
body.scan-open{overflow:hidden}
/* sonst bleibt am PC der reservierte Rollbalken-Streifen neben dem Scanner sichtbar */
html:has(body.scan-open){scrollbar-gutter:auto;overflow:hidden}
body.scan-open #toast{bottom:auto;top:calc(72px + env(safe-area-inset-top));transform:translate(-50%,-16px)}
body.scan-open #toast.on{transform:translate(-50%,0)}

.scan .ico{flex:none}
.sc-kam,.sc-inhalt{position:absolute;inset:0}
.sc-inhalt{background:#121212;display:flex;flex-direction:column;overflow:auto}

.sc-kam canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* Querformat (PC-Webcam, Tablet quer): Bild zwischen Kopf- und Fußleiste, nichts liegt auf dem Dokument */

.sc-fx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.sc-fx.an{animation:scfx .32s ease-out}
@keyframes scfx{0%{opacity:.85}100%{opacity:0}}
.sc-oben{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.sc-rund{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff}
.sc-rund.an{background:#4f8cff;color:#fff}
.sc-tipp{flex:1;min-width:0;text-align:center;font-weight:800;font-size:.92rem;line-height:1.3;padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.45)}
.sc-tipp:empty{visibility:hidden}
.sc-tipp.warn{background:rgba(196,110,0,.88)}
.sc-unten{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;padding:0 16px}
.sc-klein{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;padding:8px 10px;border-radius:16px;background:rgba(0,0,0,.4);color:#fff;font-size:.72rem;font-weight:800}
.sc-ausl{position:relative;width:80px;height:80px;border-radius:50%;display:grid;place-items:center}
.sc-ausl svg{position:absolute;inset:0;width:80px;height:80px;transform:rotate(-90deg)}
.sc-ring{fill:none;stroke:rgba(255,255,255,.92);stroke-width:4}
.sc-fort{fill:none;stroke:#4f8cff;stroke-width:6;stroke-linecap:round;stroke-dasharray:226.2;stroke-dashoffset:226.2;transition:stroke-dashoffset .09s linear}
.sc-knopf{width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .1s}
.sc-ausl:active .sc-knopf{transform:scale(.9)}
.sc-stapel{position:relative;padding:0;width:58px;height:74px;background:none}
.sc-daumen{display:block;width:58px;height:74px;border-radius:10px;overflow:hidden;background:#333;border:2px solid #fff}
.sc-daumen img{width:100%;height:100%;object-fit:cover;display:block}
.sc-zahl{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#4f8cff;color:#fff;font-size:.8rem;font-weight:900;display:grid;place-items:center}
.sc-auto{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom));padding:7px 14px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;font-weight:800;font-size:.8rem}
.sc-auto.an{background:rgba(79,140,255,.9)}
/* Kopfzeile der dunklen Ansichten */
.sc-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.sc-titel{font-weight:900;font-size:1.02rem;text-align:center;flex:1;min-width:0}
/* Seiten */
.sc-seiten,.sc-zuschnitt{display:flex;flex-direction:column;min-height:100%;height:100%}
.sc-buehne{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:6px 52px;touch-action:pan-y}
.sc-buehne img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.sc-buehne img:not([src]){visibility:hidden}
.sc-lade{position:absolute;left:50%;top:50%;margin:-11px 0 0 -11px}

.sc-pfeil:disabled{opacity:.25}
.sc-hinweis{position:absolute;left:16px;right:16px;bottom:10px;text-align:center;font-size:.84rem;font-weight:700;background:rgba(0,0,0,.7);border-radius:12px;padding:8px 12px}
.sc-filter{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px 10px 2px}
.sc-chip{flex:none;padding:7px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);color:#fff;font-weight:800;font-size:.8rem}

.sc-chip.alle{border-style:dashed}
.sc-leiste{display:flex;gap:10px;overflow-x:auto;padding:10px 12px 6px;scrollbar-width:none;touch-action:pan-x}
.sc-mini{position:relative;flex:none;width:52px;height:70px;border-radius:8px;overflow:hidden;background:#2a2a2a;border:2px solid transparent;display:grid;place-items:center;transition:transform .12s}
.sc-mini img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.sc-mini.an{border-color:#4f8cff}
.sc-mini.neu{border:2px dashed rgba(255,255,255,.35);color:#fff}
.sc-mini.zieht{z-index:2;transform:scale(1.08);box-shadow:0 8px 20px rgba(0,0,0,.6);transition:none}
.sc-mini.ziel{outline:2px dashed #4f8cff;outline-offset:2px}
.sc-nr{position:absolute;right:4px;bottom:2px;font-size:.72rem;font-weight:900;text-shadow:0 1px 3px #000}

.sc-klein-hinweis{text-align:center;color:rgba(255,255,255,.65);font-size:.84rem;font-weight:700;margin:0;padding:2px 16px calc(14px + env(safe-area-inset-bottom))}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* Zahl aus Eingabe oder Datenbank. Versteht „9,90", „9.90", „1.234,56", „12,50 €"
   und „65.000" (deutscher Tausenderpunkt). „0.086" bleibt 0,086. */
function numOrNull(v){
  if(v==null||v==="")return null;
  if(typeof v==="number")return isNaN(v)?null:v;
  var s=String(v).replace(/[€\s\u00a0]/g,"");
  if(!s)return null;
  if(s.indexOf(",")>=0)s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  var n=Number(s);return isNaN(n)?null:n;
}

function eur(n){if(n==null||isNaN(n))return "–";return Number(n).toLocaleString(locale(),{style:"currency",currency:"EUR",maximumFractionDigits:2});}
function eur0(n){if(n==null||isNaN(n))return "–";return Number(n).toLocaleString(locale(),{style:"currency",currency:"EUR",maximumFractionDigits:0});}
function num(n,d){if(n==null||isNaN(n))return "–";return Number(n).toLocaleString(locale(),{maximumFractionDigits:(d==null?2:d)});}

/* ---- Datum ---- */
function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(iso){if(!iso)return "–";var p=String(iso).slice(0,10).split("-");if(p.length<3)return String(iso);return p[2]+"."+p[1]+"."+p[0];}
/* Monate addieren; Bruchteile als 30-Tage-Schritte. Monatsende wird geklemmt. */
function addMonthsISO(iso,months){
  var p=String(iso).slice(0,10).split("-").map(Number);
  var whole=Math.trunc(months),days=Math.round((months-whole)*30);
  var d=new Date(Date.UTC(p[0],p[1]-1+whole,p[2]));
  if(d.getUTCDate()!==p[2])d=new Date(Date.UTC(p[0],p[1]+whole,0)); /* Monatsende geklemmt */
  if(days)d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}
function daysUntil(iso){
  var heute=new Date(todayISO()+"T00:00:00Z"),ziel=new Date(String(iso).slice(0,10)+"T00:00:00Z");
  return Math.round((ziel-heute)/86400000);
}
function tageTxt(n){
  if(n==null)return "–";
  if(n<0)return tf("vor {0} Tagen",Math.abs(n));
  if(n===0)return t("heute");
  if(n===1)return t("morgen");
  return tf("in {0} Tagen",n);
}

/* ---- Ampel ---- */
function ampel(days){return days==null?"gray":(days<=30?"red":(days<=90?"amber":"green"));}

/* ================= Fristenlogik =================
   Laufzeitende = letzter Vertragstag: Beginn 01.01. + 12 Monate → 31.12.
   (§ 187 Abs. 2, § 188 Abs. 2/3 BGB; fehlt der Kalendertag im Zielmonat → Monatsletzter).
   Letzter Kündigungstag = Ende minus Kündigungsfrist; endet der Vertrag am
   Monatsletzten, ist es der Monatsletzte davor (Ende 30.04. → 31.03.).
   Fenster verpasst → in Verlängerungsschritten weiterrechnen.
   Monatlich kündbar nach der Mindestlaufzeit nur, wo das Gesetz es vorschreibt:
   TKG § 56 (Internet, Mobilfunk) und § 309 Nr. 9 BGB für Abos/Dienstleistungen
   ab 1.3.2022 – NICHT für Versicherungen, Miete, Kredite, Energie. Im Zweifel
   lieber erinnern als schweigen.
   Liefert {kind, level, end, lastDay, days, label, sub}. */
var NEUES_RECHT_TKG={internet:1,mobilfunk:1};
var NEUES_RECHT_BGB={streaming_video:1,streaming_musik:1,presse:1,cloud:1,fitness:1,oepnv:1,heizungswartung:1};
function neuesRechtGilt(c){
  var k=(c&&c.art)||"sonstiges";
  if(NEUES_RECHT_TKG[k])return true;
  return !!(NEUES_RECHT_BGB[k]&&c.vertragsstart&&c.vertragsstart>=NEUES_RECHT_AB);
}
function isoAusUTC(d){return d.toISOString().slice(0,10);}
function monatsLetzter(j,m0){return new Date(Date.UTC(j,m0+1,0)).getUTCDate();}
/* Letzter Tag einer Laufzeit von m ganzen Monaten ab Beginn (Beginn zählt mit) */
function laufzeitEnde(start,m){
  var p=String(start).slice(0,10).split("-").map(Number),m0=p[1]-1+m;
  var tage=monatsLetzter(p[0],m0);
  if(p[2]>tage)return isoAusUTC(new Date(Date.UTC(p[0],m0,tage)));
  return isoAusUTC(new Date(Date.UTC(p[0],m0,p[2]-1)));
}
/* Bis wann muss die Kündigung spätestens zugehen? kf in Monaten, ,5 = 2 Wochen */
function kuendigungBis(ende,kf){
  var p=String(ende).slice(0,10).split("-").map(Number);
  var ganz=Math.floor(kf),rest=kf-ganz,m0=p[1]-1-ganz;
  var amEnde=p[2]===monatsLetzter(p[0],p[1]-1);
  var tag=amEnde?monatsLetzter(p[0],m0):Math.min(p[2],monatsLetzter(p[0],m0));
  var d=new Date(Date.UTC(p[0],m0,tag));
  if(rest>0)d.setUTCDate(d.getUTCDate()-Math.round(rest*28));
  return isoAusUTC(d);
}
/* Lebenslauf: kommend (Beginn in der Zukunft), laufend, gekuendigt (läuft noch bis gekuendigt_zum),
   beendet (Archiv: als beendet markiert oder Kündigungsdatum vorbei) – berechnet, nichts wird umgeschrieben */
function vertragPhase(c,heute){
  if(!c)return "beendet";heute=heute||todayISO();
  if(c.status==="beendet")return "beendet";
  if(c.status==="gekuendigt")return (c.gekuendigt_zum&&String(c.gekuendigt_zum).slice(0,10)<heute)?"beendet":"gekuendigt";
  if(c.vertragsstart&&String(c.vertragsstart).slice(0,10)>heute)return "kommend";
  return "laufend";
}
function imArchiv(c){return vertragPhase(c)==="beendet";}
/* Zählt heute zu den laufenden Kosten: läuft, oder gekündigt mit bekanntem Ende, das noch nicht erreicht ist */
function zaehltJetzt(c){var ph=vertragPhase(c);return ph==="laufend"||(ph==="gekuendigt"&&!!c.gekuendigt_zum);}
function fristInfo(c){
  var ph=vertragPhase(c);
  if(ph==="beendet")return {kind:"beendet",level:"gray",label:c.status==="gekuendigt"&&c.gekuendigt_zum?tf("Beendet am {0}",fmtDate(c.gekuendigt_zum)):t("Beendet"),sub:t("Im Archiv")};
  if(ph==="gekuendigt"){var rest=c.gekuendigt_zum?daysUntil(c.gekuendigt_zum):null;
    return {kind:"gekuendigt",level:"gray",label:c.gekuendigt_zum?tf("Gekündigt zum {0}",fmtDate(c.gekuendigt_zum)):t("Gekündigt"),
      sub:rest==null?"":(rest<=0?t("endet heute"):tn(rest,"endet morgen","endet in {0} Tagen"))};}
  if(ph==="kommend")return {kind:"kommend",level:"blue",label:tf("Beginnt am {0}",fmtDate(c.vertragsstart)),sub:""};
  if(!hatFristen(c.art))return {kind:"keine",level:"gray",label:"",sub:""};
  var ml=numOrNull(c.mindestlaufzeit_monate),kf=numOrNull(c.kuendigungsfrist_monate),vl=numOrNull(c.verlaengerung_monate);
  var neu=neuesRechtGilt(c);
  if(ml===0||(ml==null&&vl===1)){
    var f=(kf==null?1:kf);
    return {kind:"flex",level:"green",label:t("Jederzeit kündbar"),sub:tf("Kündigungsfrist {0}",fristTxt(f))};
  }
  if(!c.vertragsstart||ml==null){
    return {kind:"unbekannt",level:"gray",label:t("Fristen unbekannt"),
            sub:t("Vertragsbeginn und Laufzeit ergänzen, dann rechnet All-Home.")};
  }
  if(kf==null)kf=1;
  ml=Math.round(ml);
  var ersteEnde=laufzeitEnde(c.vertragsstart,ml);
  var letzter=kuendigungBis(ersteEnde,kf);
  var heute=todayISO();
  if(heute<=letzter){
    var d1=daysUntil(letzter);
    return {kind:"fest",level:ampel(d1),end:ersteEnde,lastDay:letzter,days:d1,
            label:tf("Kündbar zum {0}",fmtDate(ersteEnde)),
            sub:tf("Letzter Kündigungstag: {0} ({1})",fmtDate(letzter),tageTxt(d1))};
  }
  /* Erstlaufzeit vorbei → Verlängerungsphase */
  var effVl=neu?1:(vl==null?12:Math.max(1,Math.round(vl)));
  var effKf=neu?Math.min(kf,1):kf;
  if(effVl<=1){
    return {kind:"flex",level:"green",label:t("Jederzeit kündbar"),
            sub:tf("Kündigungsfrist {0}",fristTxt(effKf))+(neu?" · "+t("nach neuem Recht monatlich kündbar"):"")};
  }
  var n=0,ende=ersteEnde;
  while(kuendigungBis(ende,effKf)<heute&&n<600){n++;ende=laufzeitEnde(c.vertragsstart,ml+n*effVl);}
  var ld=kuendigungBis(ende,effKf),d2=daysUntil(ld);
  return {kind:"fest",level:ampel(d2),end:ende,lastDay:ld,days:d2,
          label:tf("Kündbar zum {0}",fmtDate(ende)),
          sub:tf("Letzter Kündigungstag: {0} ({1})",fmtDate(ld),tageTxt(d2))+" · "+tf("verlängert sich um {0} Monate",effVl)};
}
function terminInfo(c){
  var a=artInfo(c.art||"sonstiges"),w=a.termin&&c.details?c.details[a.termin.k]:null;
  if(!w)return null;
  var d=daysUntil(w);
  return {days:d,level:ampel(d),label:t(a.termin.l)+": "+fmtDate(w),sub:tageTxt(d)};
}
function fristTxt(m){
  m=numOrNull(m);
  if(m==null)return t("unbekannt");
  if(m===0.5)return t("2 Wochen");
  if(m===1)return t("1 Monat");
  if(m<1)return tn(Math.round(m*30),"{0} Tag","{0} Tage");
  return tn(m,"{0} Monat","{0} Monate");
}
function ivLabel(k){return INTERVALL_LABEL[k]?t(INTERVALL_LABEL[k]):"?";}
/* Monatskosten eines Vertrags (einmalige Zahlungen zählen nicht als laufend) */
function monatskosten(c){
  if(c.kosten==null||!zaehltJetzt(c))return 0;
  var m=INTERVALL[c.kosten_intervall];
  if(!m)return 0;
  return Number(c.kosten)/m;
}

function logoVon(name){
  if(!name)return null;
  var s=String(name).toLowerCase();
  for(var i=0;i<LOGOS.length;i++)if(LOGOS[i][1].test(s))return LOGOS[i];
  return null;
}
/* helle Markenfarbe → dunkles Zeichen, sonst weißes */
function logoHell(hex){
  var r=parseInt(hex.slice(0,2),16)/255,g=parseInt(hex.slice(2,4),16)/255,b=parseInt(hex.slice(4,6),16)/255;
  return 0.2126*r+0.7152*g+0.0722*b>0.6;
}
/* Kachel für einen Anbieter: Markenzeichen auf Markenfarbe, sonst das Symbol der Art */
function anbieterKachel(name,ersatz,cls,groesse){
  var R=logoEintragVon(name);
  if(R)return logoBildKachel(R,ersatz,cls);
  var L=logoVon(name),k=cls||"ai";
  if(!L)return '<span class="'+k+'">'+ersatz+'</span>';
  var px=groesse||22;
  return '<span class="'+k+' logo" style="background:#'+L[2]+';color:'+(logoHell(L[2])?"#231f1a":"#fff")+'" title="'+esc(L[3])+'">'+
    '<svg viewBox="0 0 24 24" width="'+px+'" height="'+px+'" fill="currentColor" aria-hidden="true"><path d="'+L[4]+'"/></svg></span>';
}

/* ================= Hell / Dunkel ================= */
function isDark(){return document.documentElement.classList.contains("dark");}
function applyTheme(dark){
  document.documentElement.classList.toggle("dark",!!dark);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute("content",dark?"#15130f":"#f7f4ef");
  try{localStorage.setItem("ahTheme",dark?"dark":"light");}catch(e){}
  systemLeisten();
}

/* ================= Routing ================= */
var ROUTES=["start","vertraege","neu","gesundheit","mehr","art","vertrag","einrichten","termine","kosten","vorschlaege","haushalte","haushalt","logos","ablage","dokumente","kikosten","scan","nebenkosten","freigabe","registrierungen","umzug","zentrale","nkanalyse","archiv"];
function route(){
  var h=location.hash||"";
  if(h.indexOf("#/")!==0)return {name:"start",params:{}};
  var q=h.slice(2).split("?"),name=q[0]||"start",params={};
  (q[1]||"").split("&").forEach(function(kv){
    if(!kv)return;var p=kv.split("=");
    params[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||"");
  });
  if(ROUTES.indexOf(name)<0)name="start";
  return {name:name,params:params};
}
function go(hash){if(location.hash===hash)render();else location.hash=hash;}
window.addEventListener("hashchange",function(){closeModal(true);render();window.scrollTo(0,0);});

var NAV=[
  ["start",     "house", "Start"],
  ["vertraege", "doc",   "Verträge"],
  ["neu",       "plus",  "Neu"],
  ["gesundheit","health","Gesundheit"],
  ["mehr",      "more",  "Mehr"]
];
function shell(content,cur,noNav){
  var side='<nav class="side" aria-label="'+t("Hauptnavigation")+'"><div class="brand"><img class="logo" src="icon.svg?v=2" alt="">All-Home</div>'+
    NAV.map(function(n){
      if(n[0]==="neu")return '<a class="sb sb-add" href="#/neu"'+(cur==="neu"?' aria-current="page"':"")+'>'+ic("plus")+' '+t("Neu hinzufügen")+'</a>';
      return '<a class="sb" href="#/'+n[0]+'"'+(cur===n[0]?' aria-current="page"':"")+'>'+ic(n[1])+t(n[2])+'</a>';
    }).join("")+
  '</nav>';
  var bottom='<nav class="bnav" aria-label="'+t("Hauptnavigation")+'">'+NAV.map(function(n){
    var on=cur===n[0]?' aria-current="page"':"";
    if(n[0]==="neu")return '<a class="nb nb-add" href="#/neu"'+on+'><span class="fab">'+ic("plus",26)+'</span><span class="lbl">'+t("Neu")+'</span></a>';
    return '<a class="nb" href="#/'+n[0]+'"'+on+'><span class="nbi">'+ic(n[1],22)+'</span>'+t(n[2])+'</a>';
  }).join("")+'</nav>';
  return '<div class="shell">'+side+'<main class="main" id="main">'+content+'</main></div>'+(noNav?"":bottom);
}
/* Kopfzeile: Begrüßung, Haushalt (umschaltbar), Suche */
function topBar(){
  var std=new Date().getHours();
  var gruss=std<5?"Gute Nacht":(std<11?"Guten Morgen":(std<18?"Hallo":"Guten Abend"));
  var name=HH?(HH.name||t("Haushalt")):t("Haushalt");
  return '<div class="top"><div style="min-width:0">'+
      '<div class="greet">'+t(gruss)+'</div>'+
      '<button class="hh can" data-a="hh-switch" aria-label="'+esc(t("Haus wählen"))+'">'+esc(name)+' '+ic("down",18)+'</button>'+
    '</div>'+

/* ================= Modal / Blatt ================= */
/* Im AllTrack-Stil erscheinen Blatt und Abdeckung erst mit der Klasse .on –
   ohne sie bleibt das Blatt unter dem Rand und die unsichtbare Abdeckung
   schluckt den nächsten Tipp (Fehler bis 10.10.2026). */
function openModal(html){
  var w=$("#modal");if(!w)return;
  var box=$("#modalBox"),scrim=w.querySelector(".scrim");
  box.innerHTML='<div class="grab"></div>'+html;
  box.scrollTop=0;
  box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");
  box.classList.remove("on");if(scrim)scrim.classList.remove("on");
  w.hidden=false;
  document.body.classList.add("modal-open");
  void box.offsetWidth;   /* Ausgangslage festschreiben, damit der Übergang läuft – ohne requestAnimationFrame */
  box.classList.add("on");if(scrim)scrim.classList.add("on");
}
function closeModal(still){
  var w=$("#modal");if(!w||w.hidden)return;
  var scrim=w.querySelector(".scrim");if(scrim)scrim.classList.remove("on");
  $("#modalBox").classList.remove("on");
  w.hidden=true;$("#modalBox").innerHTML="";
  document.body.classList.remove("modal-open");
  if(!still)render();
}

/* ---- Energie aus AllTrack spiegeln ----
   AllTrack führt Strom, Gas und Wasser mit Tarifen und Ablesungen im
   public-Schema. All-Home zeigt den aktuellen Tarif nur an und verlinkt dorthin;
   geschrieben wird hier nichts. */
var ALLTRACK_URL="../verbrauchs-tracker/";
/* Spalten von public.tariffs (AllTrack): category, anbieter, abschlag (€/Monat),
   arbeitspreis (€ je Einheit), grundpreis_jahr (€/Jahr), gueltig_ab,
   vertragsstart, laufzeit (Text), kuendigungsfrist (Text), kundennummer. */
async function ladeEnergie(){
  ENERGIE={};
  if(!HH)return;
  try{
    var r=await Promise.all([sbPub.from("tariffs").select("*").eq("household_id",HH.id),
      sbPub.from("abschlag_changes").select("*").eq("household_id",HH.id)]);
    if(!r[0]||r[0].error)return;
    ENERGIE=energieAuswerten(r[0].data||[],(r[1]&&!r[1].error&&r[1].data)||[],todayISO());
  }catch(e){}
}
/* Wie AllTrack: Es gilt der jüngste Tarif mit „gültig ab“ bis heute (am selben Tag der zuletzt angelegte).
   Der Abschlag ist der jüngste Eintrag aus Tarifen und Abschlagsänderungen bis heute – am selben Tag gewinnt die Änderung.
   Gilt noch kein Tarif, zeigt All-Home den nächsten. */
function energieAuswerten(tarife,aenderungen,heute){
  var aus={},nach={};
  (tarife||[]).forEach(function(x){if(x&&x.category)(nach[x.category]=nach[x.category]||[]).push(x);});
  Object.keys(nach).forEach(function(cat){
    var ts=nach[cat].slice().sort(function(a,b){var x=String(a.gueltig_ab||""),y=String(b.gueltig_ab||"");
      return x===y?(String(a.erstellt_am||"")<String(b.erstellt_am||"")?1:-1):(x<y?1:-1);});
    var tar=ts.filter(function(x){return String(x.gueltig_ab||"")<=heute;})[0]||ts[ts.length-1];
    var ev=ts.map(function(x){return {d:String(x.gueltig_ab||""),b:x.abschlag,r:0,o:String(x.erstellt_am||"")};})
      .concat((aenderungen||[]).filter(function(a){return a&&a.category===cat;}).map(function(a){return {d:String(a.gueltig_ab||""),b:a.betrag,r:1,o:String(a.erstellt_am||"")};}))
      .filter(function(e){return e.d<=heute&&e.b!=null;})
      .sort(function(a,b){if(a.d!==b.d)return a.d<b.d?1:-1;if(a.r!==b.r)return a.r<b.r?1:-1;return a.o<b.o?1:-1;});
    aus[cat]=Object.assign({},tar,{abschlag:ev.length?ev[0].b:tar.abschlag,abschlag_ab:ev.length?ev[0].d:(tar.gueltig_ab||null)});
  });
  return aus;
}
function energieInfo(art){
  var r=ENERGIE[art];
  if(!r)return null;
  return {
    anbieter:r.anbieter||null,
    abschlag:numOrNull(r.abschlag),                                  /* € im Monat */
    arbeitspreisCt:r.arbeitspreis!=null?numOrNull(r.arbeitspreis)*100:null, /* € → ct */
    grundpreisMon:r.grundpreis_jahr!=null?numOrNull(r.grundpreis_jahr)/12:null,
    kundennummer:r.kundennummer||null,
    vertragsstart:r.vertragsstart||null,
    laufzeit:r.laufzeit||null,
    kuendigungsfrist:r.kuendigungsfrist||null,
    ab:r.gueltig_ab||null,
    abschlagAb:r.abschlag_ab||null
  };
}
/* ---- Ist die AllTrack-Verbindung für dieses Haus an? ----
   household_setup.alltrack: true an, false aus, null automatisch (an, sobald
   AllTrack für dieses Haus Tarife führt). All-Home funktioniert auch ganz ohne. */
function alltrackModus(){var v=SETUP?SETUP.alltrack:null;return v===true?"an":(v===false?"aus":"auto");}
function alltrackHatDaten(){return Object.keys(ENERGIE||{}).length>0;}
function alltrackAn(){var m=alltrackModus();return m==="an"||(m==="auto"&&alltrackHatDaten());}
/* Wird diese Art gespiegelt? Wenn die Verbindung an ist und AllTrack dafür einen
   Tarif hat. Dann gilt AllTrack: eigene Einträge dieser Art bleiben sichtbar
   (Art-Ansicht), zählen aber nicht zu den Kosten – sonst stünde alles doppelt da. */
function spiegelArt(k){
  var a=ARTEN[k];
  if(!a||!a.spiegel||!alltrackAn()||!ENERGIE[a.spiegel])return null;
  return a.spiegel;
}

function authMsg(txt,kind){var m=$("#amsg");if(m){m.textContent=txt||"";m.className="amsg"+(kind?" "+kind:"");}}
function loginFehler(e){
  var m=errMsg(e);
  if(/invalid login/i.test(m))return "E-Mail oder Passwort ist falsch.";
  if(/email not confirmed/i.test(m))return "Bitte bestätige zuerst deine E-Mail-Adresse.";
  if(/already registered|already been registered/i.test(m))return "Für diese E-Mail gibt es bereits ein Konto. Bitte anmelden.";
  if(/rate limit|too many/i.test(m))return "Zu viele Versuche. Bitte kurz warten.";
  return m;
}
async function doLogin(){
  var mail=($("#a_mail").value||"").trim(),pass=$("#a_pass").value||"";
  if(!mail||!pass){authMsg("Bitte E-Mail und Passwort eingeben.","err");return;}
  authMsg("Anmeldung läuft …");
  try{
    var r=await sb.auth.signInWithPassword({email:mail,password:pass});
    if(r.error){authMsg(loginFehler(r.error),"err");return;}
    authMsg("");
  }catch(e){authMsg(loginFehler(e),"err");}
}
async function doSignup(){
  var mail=($("#a_mail").value||"").trim(),pass=$("#a_pass").value||"";
  var vn=(($("#a_vorname")||{}).value||"").trim(),nn=(($("#a_nachname")||{}).value||"").trim();
  if(!vn||!nn){authMsg("Bitte Vor- und Nachname eingeben.","err");return;}
  if(!mail||!pass){authMsg("Bitte E-Mail und Passwort eingeben.","err");return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)){authMsg("Bitte eine gültige E-Mail-Adresse eingeben.","err");return;}
  if(pass.length<8){authMsg("Das Passwort muss mindestens 8 Zeichen haben.","err");return;}
  authMsg("Konto wird erstellt …");
  try{
    var r=await sb.auth.signUp({email:mail,password:pass,options:{emailRedirectTo:location.origin+location.pathname,data:{vorname:vn.slice(0,80),nachname:nn.slice(0,80),app:"all-home"}}});
    if(r.error){authMsg(loginFehler(r.error),"err");return;}
    if(r.data&&r.data.session){authMsg("Konto erstellt – du wirst angemeldet …","ok");return;}
    AUTH_CODE={mail:mail,art:"signup"};AUTH_MODE="code";render();
    authMsg("Fast fertig! Bitte bestätige deine E-Mail-Adresse: Code aus unserer Mail an "+mail+" eingeben oder den Link öffnen. Danach gibt der Administrator dein Konto frei.","ok");
  }catch(e){authMsg(loginFehler(e),"err");}
}
async function doForgot(){
  var mail=($("#a_mail").value||"").trim();
  if(!mail){authMsg("Bitte zuerst deine E-Mail-Adresse eingeben.","err");return;}
  authMsg("E-Mail wird gesendet …");
  try{
    var r=await sb.auth.resetPasswordForEmail(mail,{redirectTo:location.origin+location.pathname});
    if(r.error){authMsg(loginFehler(r.error),"err");return;}
    /* Der Server sagt aus Datenschutzgründen nicht, ob es die Adresse gibt – darum ehrlich formulieren */
    AUTH_CODE={mail:mail,art:"recovery"};AUTH_MODE="code";render();
    authMsg("Falls es ein Konto mit "+mail+" gibt, ist jetzt eine E-Mail unterwegs. Code hier eingeben oder den Link in der Mail öffnen. Nichts angekommen? Spam-Ordner prüfen.","ok");
  }catch(e){authMsg(loginFehler(e),"err");}
}
async function doCode(){
  var mail=($("#a_mail").value||"").trim(),code=($("#a_code").value||"").replace(/\D/g,"");
  if(!mail){authMsg("Bitte deine E-Mail-Adresse eingeben.","err");return;}
  if(code.length<6||code.length>10){authMsg("Bitte den Code aus der Mail eingeben (nur Ziffern).","err");return;}
  var art=(AUTH_CODE&&AUTH_CODE.art)||"recovery";
  authMsg("Code wird geprüft …");
  try{
    var r=await sb.auth.verifyOtp({email:mail,token:code,type:art});
    if(r.error){authMsg(/expired|invalid/i.test(errMsg(r.error))?"Der Code ist falsch oder abgelaufen.":loginFehler(r.error),"err");return;}
    AUTH_CODE=null;
    if(art==="recovery"){AUTH_MODE="reset";render();authMsg("Code bestätigt – jetzt das neue Passwort.","ok");}
    else{AUTH_MODE="login";authMsg("E-Mail bestätigt ✅","ok");}
  }catch(e){authMsg(loginFehler(e),"err");}
}
async function codeNeuSenden(){
  var mail=($("#a_mail").value||"").trim();
  if(!mail){authMsg("Bitte deine E-Mail-Adresse eingeben.","err");return;}
  var art=(AUTH_CODE&&AUTH_CODE.art)||"recovery";

                        :await sb.auth.resetPasswordForEmail(mail,{redirectTo:location.origin+location.pathname});

    AUTH_CODE={mail:mail,art:art};

}

/* ================= Verträge einer Art ================= */
/* Ohne Archiv (beendete Verträge stehen unter #/archiv); mitArchiv=true: alle */
function vertraegeDerArt(k,mitArchiv){
  return CONTRACTS.filter(function(c){return (c.art||"sonstiges")===k&&(mitArchiv||!imArchiv(c));});
}
function artMonatskosten(k){
  var sp=spiegelArt(k);
  if(sp)return energieMonat(sp);
  return vertraegeDerArt(k).reduce(function(s,c){return s+monatskosten(c);},0);
}
/* Monatskosten je Posten: angehakte Arten (gespiegelte aus AllTrack) und
   „Weitere“ für Verträge ohne angehakte Art. Start und Kostenseite nutzen beide das. */
function kostenPosten(){
  var posten=[];
  aktiveArten().forEach(function(k){
    var m=artMonatskosten(k);
    if(m>0)posten.push({k:k,label:artInfo(k).label,icon:artInfo(k).icon,m:m});
  });
  var weitere=CONTRACTS.filter(function(c){var k=c.art||"sonstiges";return !imArchiv(c)&&(k==="sonstiges"||!ARTEN[k]||!artAktiv(k));})
    .reduce(function(s,c){return s+monatskosten(c);},0);
  if(weitere>0)posten.push({k:"weitere",label:t("Weitere"),icon:"📄",m:weitere});
  /* Nebenkosten-Vorauszahlung aus dem Mietvertrag – die „zweite Miete“ */
  var nkm=nkVorauszahlungMonat();
  if(nkm>0)posten.push({k:"nebenkosten",label:t("Nebenkosten-Vorauszahlung"),icon:"🧾",m:nkm});
  return posten.sort(function(a,b){return b.m-a.m;});
}
/* Die dringendste Frist einer Art */
function artFrist(k){
  var best=null;
  vertraegeDerArt(k).forEach(function(c){
    if(c.status!=="aktiv")return;
    var f=fristInfo(c);
    if(f.days==null)return;
    if(!best||f.days<best.days)best={days:f.days,level:f.level,c:c,f:f};
  });
  return best;
}

/* Ein Platz: gefüllt, gespiegelt oder sichtbar leer */
function artSlot(k){
  var a=artInfo(k),liste=vertraegeDerArt(k);
  /* Aus AllTrack gespiegelt – nur wenn die Verbindung an ist und Daten da sind */
  var sp=spiegelArt(k);
  if(sp){

    return '<a class="slot mirror" href="#/art?k='+k+'">'+
      anbieterKachel(e.anbieter,a.icon)+

      '<span class="ss">'+esc(a.label)+' · <span class="mlink">'+t("aus AllTrack")+'</span></span></span>'+
      '<span class="srt">'+(e.abschlag?'<span class="scost">'+eur0(e.abschlag)+'</span>':"")+
      '<span class="go">'+ic("right",18)+'</span></span></a>';

      '<span class="srt"><span class="go">'+ic("right",18)+'</span></span></a>';
  }
  /* Gefüllt: ein Vertrag direkt, mehrere über die Art-Ansicht */
  var kosten=artMonatskosten(k),fr=artFrist(k);
  var ti=!fr&&liste.length===1?terminInfo(liste[0]):null;
  if(ti)fr={level:ti.level,f:{label:ti.label}};
  var ziel=liste.length===1?("#/vertrag?id="+liste[0].id):("#/art?k="+k);
  var untertitel=liste.length===1
    ?(fr?esc(fr.f.label):esc(a.label))
    :tn(liste.length,"{0} Vertrag","{0} Verträge");
  var fz=liste.length===1?fahrzeugZeile(liste[0])
        :liste.map(function(c){var f=fahrzeugVon(c);return f&&f.kz?kzHtml(f.kz):"";}).join("");
  if(fz)fz='<span class="ss fzss">'+fz+'</span>';

    (liste.length===1?anbieterKachel(liste[0].anbieter,a.icon):'<span class="ai">'+a.icon+'</span>')+

    fz+'<span class="ss">'+(fr?'<span class="dot '+fr.level+'"></span> ':"")+untertitel+'</span></span>'+
    '<span class="srt">'+(kosten>0?'<span class="scost">'+eur0(kosten)+'</span>':"")+

/* ================= Termine ================= */
/* Kennzeichen zuerst: es unterscheidet zwei Autos beim selben Versicherer und darf nicht abgeschnitten werden */
function terminTitel(c,a){var f=fahrzeugVon(c);return (f&&f.kz?f.kz+" · ":"")+(c.anbieter||a.label);}
/* Sammelt Kündigungsfristen und Pflichttermine der nächsten n Tage */
function naheTermine(tage){
  var raus=[];
  CONTRACTS.forEach(function(c){
    var a=artInfo(c.art||"sonstiges");
    /* Kündigungsfrist */
    if(c.status==="aktiv"){
      var f=fristInfo(c);
      if(f.days!=null&&f.days<=tage)
        raus.push({days:f.days,level:f.level,icon:a.icon,
                   titel:terminTitel(c,a),text:t("Letzter Kündigungstag")+" · "+fmtDate(f.lastDay),
                   href:"#/vertrag?id="+c.id});
    }
    /* Pflichttermin aus den Zusatzfeldern */
    if(!imArchiv(c)&&a.termin&&c.details&&c.details[a.termin.k]){
      var d=daysUntil(c.details[a.termin.k]);
      if(d!=null&&d<=tage)
        raus.push({days:d,level:ampel(d),icon:a.icon,
                   titel:terminTitel(c,a),text:t(a.termin.l)+" · "+fmtDate(c.details[a.termin.k]),
                   href:"#/vertrag?id="+c.id});
    }
  });
  raus=raus.concat(nkTermine().filter(function(x){return x.days<=tage;}));
  raus.sort(function(x,y){return x.days-y.days;});
  return raus;
}
function terminZeile(x){
  return '<a class="trow" href="'+x.href+'">'+
    '<span class="dot '+x.level+'"></span>'+
    '<span class="tb"><span class="tn">'+esc(x.titel)+'</span><span class="tx">'+esc(x.text)+'</span></span>'+
    '<span class="tw '+(x.level==="red"?"red":(x.level==="amber"?"amber":""))+'">'+tageTxt(x.days)+'</span>'+
  '</a>';
}

/* ================= Formular-Bausteine ================= */
/* pflicht → dezentes Sternchen (Legende am Formularende) */
function fld(label,inner,pflicht){return '<label class="fld"><span>'+esc(label)+(pflicht?'<b class="pfl" aria-hidden="true">*</b>':"")+'</span>'+inner+'</label>';}
/* Zahlen als Textfeld mit Dezimal-Tastatur (wie AllTrack): type="number"
   verwirft „9,90" mit Komma stillschweigend – valNum() versteht beides. */
function inp(id,val,typ,extra){
  if(typ==="number"){
    var anzeige=(val==null||val==="")?"":String(val).replace(".",",");
    return '<input class="inp" id="'+id+'" type="text" inputmode="decimal" autocomplete="off" value="'+esc(anzeige)+'"'+(extra||"")+'>';
  }
  return '<input class="inp" id="'+id+'" type="'+(typ||"text")+'" value="'+esc(val==null?"":val)+'"'+(extra||"")+'>';
}
function sel(id,opts,cur){
  return '<select class="inp" id="'+id+'">'+opts.map(function(o){
    return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(cur)?" selected":"")+'>'+esc(o[1])+'</option>';
  }).join("")+'</select>';
}
function val(id){var e=$("#"+id);return e?(e.value||"").trim():"";}
function valNum(id){return numOrNull(val(id));}
/* Steht in einem Zahlfeld Text, der keine Zahl ist? Dann nicht leer speichern,
   sondern das Feld zeigen. */
function zahlFehlt(ids){
  for(var i=0;i<ids.length;i++){
    var r=val(ids[i]);
    if(r&&numOrNull(r)==null){var e=$("#"+ids[i]);if(e){e.focus();e.classList.add("bad");}return true;}
  }
  return false;
}

/* ================= Vertragsdetail ================= */
function vertragById(id){return CONTRACTS.filter(function(c){return c.id===id;})[0]||null;}
/* Wofür gilt ein Vertrag? Gleiche Art + gleicher Schlüssel = Vorgänger/Nachfolger.
   Fahrzeug (Kennzeichen/FIN), Zähler (MaLo/Zählernummer), sonst Arten, die es nur einmal gibt (Miete, Strom …) */
function objektSchluessel(c){
  var a=artInfo(c.art||"sonstiges"),d=c.details||{},f=fahrzeugVon(c);
  if(f&&f.kz)return "kz:"+String(f.kz).toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(d.fin)return "fin:"+String(d.fin).toUpperCase().replace(/\s+/g,"");
  if(d.malo)return "malo:"+String(d.malo);
  if(d.zaehlernummer)return "zn:"+String(d.zaehlernummer).toUpperCase().replace(/\s+/g,"");
  var A=ARTEN[a.key]||{};
  return (A.einzig||A.spiegel)?"art":null;
}
function gleichesObjekt(x,c){
  if(x.id===c.id||(x.art||"sonstiges")!==(c.art||"sonstiges"))return false;
  var kx=objektSchluessel(x),kc=objektSchluessel(c);
  if(kx&&kc&&kx===kc)return true;
  /* Zähler gewechselt: bei Arten, die es nur einmal gibt, zählt die Art */
  var A=ARTEN[c.art]||{};return !!(A.einzig||A.spiegel)&&!!kx&&!!kc&&kx.indexOf("kz:")<0&&kc.indexOf("kz:")<0;
}
/* Nachfolger: späterer Beginn, nicht im Archiv. Vorgänger: früherer Beginn (auch im Archiv) */
function nachfolgerVon(c){
  return CONTRACTS.filter(function(x){return gleichesObjekt(x,c)&&!imArchiv(x)&&x.vertragsstart&&(!c.vertragsstart||x.vertragsstart>c.vertragsstart);})
    .sort(function(x,y){return x.vertragsstart<y.vertragsstart?-1:1;})[0]||null;
}
function vorgaengerVon(c){
  if(!c.vertragsstart)return null;
  return CONTRACTS.filter(function(x){return gleichesObjekt(x,c)&&(!x.vertragsstart||x.vertragsstart<c.vertragsstart);})
    .sort(function(x,y){return String(x.vertragsstart||"")>String(y.vertragsstart||"")?-1:1;})[0]||null;
}
function tagDavor(iso){var d=new Date(String(iso).slice(0,10)+"T00:00:00Z");d.setUTCDate(d.getUTCDate()-1);return isoAusUTC(d);}
function statusText(c){
  var ph=vertragPhase(c);
  if(ph==="laufend")return "✅ "+t("aktiv");
  if(ph==="kommend")return "🕒 "+tf("beginnt am {0}",fmtDate(c.vertragsstart));
  if(ph==="gekuendigt")return "✂️ "+(c.gekuendigt_zum?tf("gekündigt zum {0}",fmtDate(c.gekuendigt_zum)):t("gekündigt"));
  return "📦 "+t("beendet")+" · "+t("Im Archiv");
}
/* Läuft der alte Vertrag noch, obwohl ein Nachfolger feststeht? Dann gleich passend als gekündigt markieren */
function abloeseKarte(c){
  if(vertragPhase(c)!=="laufend")return "";
  var n=nachfolgerVon(c);if(!n)return "";
  var zum=tagDavor(n.vertragsstart);
  return '<div class="sug warn" style="margin-bottom:12px"><span class="si">'+ic("alert")+'</span><div class="sb2">'+
    '<div class="st">'+tf("Nachfolger: {0} ab {1}",esc(n.anbieter||artInfo(n.art).label),fmtDate(n.vertragsstart))+'</div>'+
    '<div class="sx">'+t("Dieser Vertrag ist noch nicht gekündigt.")+'</div>'+
    '<div class="sa"><button class="btn sm" data-a="v-abloesen" data-id="'+c.id+'" data-k="'+n.id+'">✂️ '+tf("Zum {0} als gekündigt markieren",fmtDate(zum))+'</button></div></div></div>';
}
function vertragAbloesen(id,nid){
  var n=vertragById(nid);if(!n||!n.vertragsstart)return;
  return setzeStatus(id,"gekuendigt",tagDavor(n.vertragsstart));
}
/* Archiv: beendete Verträge, neueste zuerst; Dokumente bleiben daran */
function viewArchiv(){
  var k=route().params.k||"";
  var l=CONTRACTS.filter(function(c){return imArchiv(c)&&(!k||(c.art||"sonstiges")===k);})
    .sort(function(x,y){return String(y.gekuendigt_zum||y.updated_at||"").localeCompare(String(x.gekuendigt_zum||x.updated_at||""));});
  var kopf=zurueck(k?"#/art?k="+k:"#/vertraege",k?artInfo(k).label:t("Verträge"))+seitenTitel("📦 "+t("Archiv"));
  if(!l.length)return kopf+'<section class="card"><div class="empty"><div class="ei">📦</div><h3>'+t("Noch nichts im Archiv")+'</h3></div></section>';
  return kopf+'<div class="slots">'+l.map(function(c){
    var a=artInfo(c.art||"sonstiges"),f=fristInfo(c),nd=DOCS.filter(function(d){return d.contract_id===c.id;}).length;
    return '<a class="slot" href="#/vertrag?id='+c.id+'">'+anbieterKachel(c.anbieter,a.icon)+
      '<span class="sb3"><span class="sn">'+esc(c.anbieter||a.label)+'</span>'+(fahrzeugVon(c)?'<span class="ss">'+fahrzeugZeile(c)+'</span>':"")+
      '<span class="ss">'+esc(a.label)+' · '+esc(f.label)+(nd?' · '+tf("{0} Dok.",nd):"")+'</span></span>'+
      '<span class="srt"><span class="go">'+ic("right",18)+'</span></span></a>';
  }).join("")+'</div>';
}

  var doks=DOCS.filter(function(d){return d.contract_id===c.id;});

      (c.produkt?'<div class="greet">'+esc(c.produkt)+'</div>':"")+

    abloeseKarte(c)+

/* ================= Vertragsformular ================= */
var FORM=null;   /* {art, id, prefill} – offenes Formular */
/* Felder, die nebeneinander stehen (erstes Feld → Partner) */
/* Felder, die nebeneinander stehen; bei mehreren Kandidaten zählt der erste, den die Art hat */
var FELD_PAARE={marke:"modell",hsn:"tsn",sf_klasse:"sf_prozent",zaehlernummer:["malo","jahresverbrauch"],rufnummer:"datenvolumen"};
/* Eingaben, die als Großbuchstaben gespeichert werden */
var FELD_GROSS={kennzeichen:1,fin:1,hsn:1,tsn:1};
/* MaLo-ID (Marktlokation): 11 Ziffern, die letzte ist die Prüfziffer.
   BDEW: Ziffern an ungeraden Stellen + 2 × Ziffern an geraden Stellen, Prüfziffer = Rest bis zum nächsten Zehner. */
function maloOk(z){
  if(!/^\d{11}$/.test(z))return false;
  var a=0,b=0;for(var i=0;i<10;i++){if(i%2===0)a+=+z[i];else b+=+z[i];}
  return (10-(a+2*b)%10)%10===+z[10];
}
function maloNorm(s){var z=String(s==null?"":s).replace(/[\s.\-\/]/g,"");return maloOk(z)?z:null;}
var FELD_PLATZ={malo:"41373559241",kennzeichen:"FB-AB 1234",marke:"Volkswagen",modell:"Golf",fin:"WVWZZZ1KZ6W000000",hsn:"0603",tsn:"BJH"};
/* Art-Auswahl, nach Gruppen geordnet; leer = „bitte wählen“ */
function artAuswahl(akt){

    '<option value=""'+(akt?"":" selected")+'>'+t("Bitte wählen …")+'</option>'+
    GRUPPEN.map(function(g){
      return '<optgroup label="'+esc(t(g.label))+'">'+artenDerGruppe(g.k).map(function(k){
        var a=artInfo(k);
        return '<option value="'+k+'"'+(k===akt?" selected":"")+'>'+a.icon+' '+esc(a.label)+'</option>';
      }).join("")+'</optgroup>';
    }).join("")+
    '<option value="sonstiges"'+(akt==="sonstiges"?" selected":"")+'>📄 '+t("Sonstiges")+'</option>'+
  '</select>';
}

function formularEntwurf(){
  var e={details:{}};
  ["anbieter","produkt","kundennummer","vertragsnummer","notizen"].forEach(function(k){var el=$("#f_"+k);if(el)e[k]=el.value;});
  [["kosten","f_kosten"],["vertragsstart","f_start"],["mindestlaufzeit_monate","f_ml"],["kuendigungsfrist_monate","f_kf"],
   ["verlaengerung_monate","f_vl"],["kosten_intervall","f_iv"]].forEach(function(p){var el=$("#"+p[1]);if(el)e[p[0]]=el.value;});
  document.querySelectorAll('[id^="f_d_"]').forEach(function(el){if(el.value!=="")e.details[el.id.slice(4)]=el.value;});
  return e;
