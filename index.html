/* ---- Gesundheits-Recherche: Rechnung/Befund für Laien erklären lassen ----
   Lädt die Datei, schickt sie an butler-med-explain (liest + recherchiert per
   Websuche GOÄ-/GOZ-Ziffern, Diagnosen, Fachbegriffe) und speichert die
   Erklärung am Dokument (med_recherche). */
var medResearchBusy=false;
async function medResearch(docId){
  var d=DOCS.find(function(x){return x.id===docId;});if(!d)return;
  if(medResearchBusy)return;medResearchBusy=true;
  openModal('<h2 class="sect">🔍 Verständlich erklären</h2><div class="aiwork" style="justify-content:center"><span class="spin"></span><span class="aimsg">Der Butler liest das Dokument und recherchiert Abrechnungsziffern und Fachbegriffe im Internet … das kann bis zu einer Minute dauern.</span></div>');
  try{
    var dl=await sb.storage.from(BUCKET).download(d.storage_path);
    if(dl.error)throw new Error("Datei konnte nicht geladen werden.");
    var bytes=new Uint8Array(await dl.data.arrayBuffer());
    var r=await sb.functions.invoke("butler-med-explain",{body:{fileBase64:bytesToBase64(bytes),mimeType:d.mime_type||"application/pdf",model:modelPref(),kontext:{arzt:d.arzt||null,fachrichtung:d.fachrichtung||null,medTyp:d.med_typ||null,betrag:(d.betrag!=null?d.betrag:null)}}});
    if(r.error){
      var mcode=null,mmsg=null;
      try{if(r.error.context&&typeof r.error.context.json==="function"){var mjb=await r.error.context.json();if(mjb){mcode=mjb.code;mmsg=mjb.error;}}}catch(e){}
      if(mcode==="ki_guthaben"){closeModal();toast("Das KI-Guthaben ist aufgebraucht – bitte später erneut versuchen.",true);return;}
      throw new Error(mmsg||errMsg(r.error));
    }
    var body=r.data||{};
    if(body.error){if(body.code==="ki_guthaben"){closeModal();toast("Das KI-Guthaben ist aufgebraucht – bitte später erneut versuchen.",true);return;}throw new Error(body.error);}
    if(!body.recherche)throw new Error("Keine Erklärung erhalten.");
    var ur=await sb.from("documents").update({med_recherche:body.recherche,med_recherche_am:new Date().toISOString()}).eq("id",docId);
    if(ur.error)throw ur.error;
    try{await sb.from("ai_usage").insert({household_id:activeHousehold,user_email:(currentUser&&currentUser.email)||null,model:body.modell||null,input_tokens:(body.usage&&typeof body.usage.input==="number")?body.usage.input:null,output_tokens:(body.usage&&typeof body.usage.output==="number")?body.usage.output:null,filename:"🩺 Erklärung: "+(d.filename||"?")+((body.usage&&body.usage.searches)?" · "+body.usage.searches+" Suchen":"")});}catch(e){}
    await loadFromDB();
    closeModal();
    medEditId=docId;activeView="med-form";renderApp();window.scrollTo({top:0,behavior:"smooth"});
    toast("Erklärung erstellt ✅");
  }catch(e){closeModal();toast("Erklären fehlgeschlagen: "+errMsg(e),true);}
  finally{medResearchBusy=false;}
}

function viewAdd(){
  if(importResults.length&&!importBusy)return importSummaryCard();
  var review="";

    if(ext&&isMed(reviewDoc)){
      review=medReviewCard(reviewDoc,ext);

      var t=dtInfo(reviewDoc.doc_type),k=ext.kategorie?katInfo(ext.kategorie):null;

      var match=findMatch(ext);
      var smart=[],extraBtns="";
      /* Duplikat-Erkennung */
      var dup=DOCS.find(function(d){
        if(d.id===reviewDoc.id)return false;
        var dx=d.extracted;
        if(dx&&ext.vertragsnummer&&dx.vertragsnummer===ext.vertragsnummer&&ext.datum&&dx.datum===ext.datum&&dx.docType===ext.docType)return true;
        if(d.filename===reviewDoc.filename&&d.size_bytes===reviewDoc.size_bytes)return true;

      });
      if(dup)smart.push('⚠️ Ein sehr ähnliches Dokument liegt schon im Archiv („'+escapeHtml(dup.filename||"?")+'“ vom '+fmtDate(dup.doc_date||String(dup.created_at).slice(0,10))+') – möglicherweise doppelt hochgeladen.');
      /* Personen-Erkennung */
      if(reviewDoc.person_id){
        smart.push('👤 Zugeordnet zu '+personBadge(reviewDoc.person_id)+'.');
      }else if(ext.vertragspartner){
        var pmatch=matchPerson(ext.vertragspartner);
        if(pmatch){
          smart.push('👤 Vertragspartner „'+escapeHtml(ext.vertragspartner)+'“ → passt zu '+personBadge(pmatch.id)+'.');
          extraBtns+='<button class="ghost" data-action="review-setperson" data-id="'+pmatch.id+'">👤 '+escapeHtml(pmatch.name)+' zuordnen</button>';
        }else{
          smart.push('👤 Der Butler erkennt als Vertragspartner: <b>'+escapeHtml(ext.vertragspartner)+'</b>. Als eigene Person führen?');
          extraBtns+='<button class="ghost" data-action="review-createperson" data-name="'+escapeHtml(ext.vertragspartner)+'">👤 Person „'+escapeHtml(ext.vertragspartner)+'“ anlegen</button>';
        }
      }
      if(match){
        /* Kündigung erkannt → Status-Aktion anbieten */
        if(ext.docType==="kuendigung"&&match.status==="aktiv"){
          smart.push('✂️ Das sieht nach einer Kündigung bzw. Kündigungsbestätigung für diesen Vertrag aus.');
          extraBtns+='<button class="primary" data-action="review-cancel" data-id="'+match.id+'">✂️ „'+escapeHtml(match.anbieter||"Vertrag")+'“ als gekündigt markieren</button>';
        }
        /* Preisänderung erkannt → Übernahme anbieten */
        if(ext.docType!=="rechnung"&&ext.kosten!=null&&match.kosten!=null&&Math.abs(ext.kosten-match.kosten)>=0.01&&(!ext.kostenIntervall||ext.kostenIntervall===match.kosten_intervall)){
          var dir=ext.kosten>match.kosten?"steigt":"sinkt";
          smart.push('💶 Der Preis '+dir+': bisher '+fmtEur(match.kosten)+', laut Dokument '+fmtEur(ext.kosten)+' ('+(INTERVALL_LABEL[match.kosten_intervall]||"")+').');
          if(ext.kosten>match.kosten)smart.push('⚖️ Bei einer Preiserhöhung hast du oft ein <b>Sonderkündigungsrecht</b> – meist bis zum Wirksamwerden der Erhöhung.');
          extraBtns+='<button class="ghost" data-action="review-price" data-id="'+match.id+'" data-price="'+ext.kosten+'" data-iv="'+escapeHtml(ext.kostenIntervall||"")+'">💶 Preis auf '+fmtEur(ext.kosten)+' aktualisieren</button>';
        }
        /* Rechnungsbetrag gegen vereinbarten Preis prüfen */
        if(ext.docType==="rechnung"&&ext.betrag!=null&&match.kosten!=null){
          var diff=ext.betrag-match.kosten;
          if(Math.abs(diff)<=Math.max(0.5,match.kosten*0.02))smart.push('✅ Rechnungsbetrag '+fmtEur(ext.betrag)+' passt zum vereinbarten Preis ('+fmtEur(match.kosten)+' '+(INTERVALL_LABEL[match.kosten_intervall]||"")+').');

        }
        /* Dokument enthält Angaben, die dem Vertrag fehlen */
        var fills=missingFills(match,ext);

          extraBtns+='<button class="ghost" data-action="review-complete" data-id="'+match.id+'">🧩 Fehlende Daten übernehmen</button>';

        wichtig+
        (ext.hinweise?'<div class="ainote">💡 '+escapeHtml(ext.hinweise)+'</div>':"")+
        (match?'<div class="ainote">🔍 Das passt vermutlich zu deinem bestehenden Vertrag <b>'+escapeHtml(match.anbieter||"?")+(match.produkt?" – "+escapeHtml(match.produkt):"")+'</b>.</div>':"")+
        smart.map(function(s){return '<div class="ainote">'+s+'</div>';}).join("")+

  var personHint=(activePerson&&personById(activePerson))?'<div class="ainote">👤 Neue Dokumente werden automatisch <b>'+escapeHtml(personById(activePerson).name)+'</b> zugeordnet (aktiver Personen-Filter).</div>':"";
  var tCon=uploadTarget?contractById(uploadTarget):null;
  var targetHint=tCon?('<div class="ainote">📎 Neue Dokumente werden dem Vertrag <b>'+katInfo(tCon.kategorie).icon+' '+escapeHtml(tCon.anbieter||"?")+(tCon.produkt?" – "+escapeHtml(tCon.produkt):"")+'</b> zugeordnet. <button class="linkbtn" data-action="clear-upload-target" style="display:inline">Nicht zuordnen</button></div>'):"";
  return review+

/* ---------- Native App (Capacitor) – nur aktiv in der Android-App ---------- */
var CAP=window.Capacitor;
function isNative(){try{return !!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());}catch(e){return false;}}
function capPlugin(n){return (CAP&&CAP.Plugins&&CAP.Plugins[n])?CAP.Plugins[n]:null;}
function hashId(str,off){var h=5381;str=String(str||"");for(var i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))|0;}return (Math.abs(h)%1000000)+(off||0)*1000000+100000;}
function daysBeforeDate(iso,n){var d=new Date(String(iso).slice(0,10)+"T09:00:00");d.setDate(d.getDate()-n);return d;}

/* "An Butler teilen": aus anderer App geteilte Datei empfangen und einlesen */
var pendingSharedFile=null;
function shareExt(type){type=(type||"").toLowerCase();if(type.indexOf("pdf")>=0)return ".pdf";if(type.indexOf("png")>=0)return ".png";if(type.indexOf("jpeg")>=0||type.indexOf("jpg")>=0)return ".jpg";if(type.indexOf("rfc822")>=0||type.indexOf("eml")>=0)return ".eml";if(type.indexOf("image")>=0)return ".jpg";return "";}
async function handleSharedIntent(){
  var SI=capPlugin("SendIntent");if(!SI||!SI.checkSendIntentReceived)return;
  var res;try{res=await SI.checkSendIntentReceived();}catch(e){return;}
  if(!res||!res.url)return;
  try{
    var rawUrl=decodeURIComponent(res.url);
    var fetchUrl=(CAP&&CAP.convertFileSrc)?CAP.convertFileSrc(rawUrl):rawUrl;
    var resp=await fetch(fetchUrl);
    var blob=await resp.blob();
    var type=res.type||blob.type||"application/octet-stream";
    var base=(res.title||"geteilt").replace(/[^\wäöüÄÖÜß.\-]+/g,"_").slice(0,40)||"geteilt";
    var name=/\.[a-z0-9]{2,4}$/i.test(base)?base:base+shareExt(type);
    var file=new File([blob],name,{type:type});
    try{SI.finish&&SI.finish();}catch(e){}
    if(currentUser&&activeHousehold){go("add");onAddFile(file);}
    else{pendingSharedFile=file;}
  }catch(e){toast("Geteilte Datei konnte nicht gelesen werden: "+errMsg(e),true);}
}
/* Lokale Erinnerungen 30 und 7 Tage vor dem letzten Kündigungstag planen */
async function scheduleFristNotifications(){
  if(!isNative())return;
  var LN=capPlugin("LocalNotifications");if(!LN)return;
  try{
    var perm=await LN.checkPermissions();
    if(perm.display!=="granted"){perm=await LN.requestPermissions();}
    if(perm.display!=="granted")return;
    try{var pend=await LN.getPending();if(pend&&pend.notifications&&pend.notifications.length){await LN.cancel({notifications:pend.notifications.map(function(n){return {id:n.id};})});}}catch(e){}
    var now=Date.now(),list=[];
    CONTRACTS.forEach(function(c){
      if(c.status!=="aktiv")return;
      var f=fristInfo(c);if(!f.lastDay)return;
      var name=(c.anbieter||"Vertrag")+(c.produkt?" – "+c.produkt:"");
      [[30,0],[7,1]].forEach(function(p){
        var when=daysBeforeDate(f.lastDay,p[0]);
        if(when.getTime()>now+60000){
          list.push({id:hashId(c.id,p[1]),title:"⏰ Kündigungsfrist",body:name+": letzter Kündigungstag am "+fmtDate(f.lastDay)+" (in "+p[0]+" Tagen).",schedule:{at:when},smallIcon:"ic_stat_icon"});
        }
      });
    });
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){}
}

var PIN_LEN=4;
var lockMode="verify",lockBuf="",lockFirst="";
function pinStored(){try{return JSON.parse(localStorage.getItem("db_pin")||"null");}catch(e){return null;}}
function pinSet(){return !!pinStored();}
function bioEnabled(){try{return localStorage.getItem("db_bio")==="1";}catch(e){return false;}}
async function sha256hex(s){
  try{var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,"0");}).join("");}
  catch(e){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return "f"+h.toString(16);}
}
async function savePin(pin){var salt=Math.random().toString(36).slice(2)+Date.now();localStorage.setItem("db_pin",JSON.stringify({salt:salt,hash:await sha256hex(salt+"|"+pin)}));}
async function checkPinVal(pin){var st=pinStored();if(!st)return false;return (await sha256hex(st.salt+"|"+pin))===st.hash;}
function removePin(){try{localStorage.removeItem("db_pin");localStorage.removeItem("db_bio");}catch(e){}}
function lockRenderDots(){var el=$("#lockDots");if(!el)return;var h="";for(var i=0;i<PIN_LEN;i++)h+='<span class="lockdot'+(i<lockBuf.length?" on":"")+'"></span>';el.innerHTML=h;el.classList.remove("err");}
function lockBuildKeypad(){
  var el=$("#lockKeypad");if(!el)return;
  var h=["1","2","3","4","5","6","7","8","9"].map(function(k){return '<button class="keybtn" data-key="'+k+'">'+k+'</button>';}).join("");
  h+='<button class="keybtn wide" data-key="C">'+(lockMode==="verify"?"":"Abbr.")+'</button>';
  h+='<button class="keybtn" data-key="0">0</button>';
  h+='<button class="keybtn wide" data-key="B">⌫</button>';
  el.innerHTML=h;
}
function showLock(mode){
  lockMode=mode||"verify";lockBuf="";lockFirst="";
  var ls=$("#lockscreen");if(ls)ls.hidden=false;
  $("#lockTitle").textContent=lockMode==="verify"?"App entsperren":(lockMode==="set"?"Neue PIN festlegen":"PIN bestätigen");
  $("#lockSub").textContent=lockMode==="verify"?"Bitte gib deine PIN ein.":(lockMode==="set"?"Wähle eine 4-stellige PIN.":"Gib die PIN erneut ein.");
  lockBuildKeypad();lockRenderDots();
  var bio=$("#lockBioBtn");if(bio)bio.hidden=!(lockMode==="verify"&&bioEnabled());
  if(lockMode==="verify"&&bioEnabled())tryBiometric();
}
function hideLock(){var ls=$("#lockscreen");if(ls)ls.hidden=true;}
function lockError(msg){var d=$("#lockDots");if(d)d.classList.add("err");var s=$("#lockSub");if(s)s.textContent=msg;lockBuf="";setTimeout(lockRenderDots,340);}
async function lockKey(k){
  if(k==="B"){lockBuf=lockBuf.slice(0,-1);lockRenderDots();return;}
  if(k==="C"){if(lockMode!=="verify")hideLock();return;}
  if(lockBuf.length>=PIN_LEN)return;
  lockBuf+=k;lockRenderDots();
  if(lockBuf.length<PIN_LEN)return;
  var entered=lockBuf;
  if(lockMode==="verify"){
    if(await checkPinVal(entered))hideLock();else lockError("Falsche PIN. Bitte erneut.");
  }else if(lockMode==="set"){
    lockFirst=entered;lockBuf="";lockMode="confirm";$("#lockTitle").textContent="PIN bestätigen";$("#lockSub").textContent="Gib die PIN erneut ein.";lockRenderDots();
  }else{
    if(entered===lockFirst){await savePin(entered);hideLock();toast("PIN gespeichert 🔒");if(activeView==="settings")renderApp();maybeOfferBiometric();}
    else{lockMode="set";lockFirst="";lockError("PINs stimmen nicht überein.");}
  }
}
function bioPlugin(){return capPlugin("BiometricAuth")||capPlugin("NativeBiometric");}
async function bioAvailable(){
  var B=bioPlugin();if(!B)return false;
  try{
    if(B.checkBiometry){var r=await B.checkBiometry();return !!(r&&(r.isAvailable||r.biometryType));}
    if(B.isAvailable){var r2=await B.isAvailable();return !!(r2&&r2.isAvailable);}
  }catch(e){}
  return false;
}
async function tryBiometric(){
  var B=bioPlugin();if(!B)return;
  try{
    if(B.authenticate){await B.authenticate({reason:"Dokumenten-Butler entsperren",cancelTitle:"PIN verwenden",androidTitle:"Entsperren",androidSubtitle:"Fingerabdruck oder Gesicht"});hideLock();return;}
    if(B.verifyIdentity){await B.verifyIdentity({reason:"Dokumenten-Butler entsperren",title:"Entsperren"});hideLock();return;}
  }catch(e){}
}
async function maybeOfferBiometric(){
  if(bioEnabled())return;
  if(await bioAvailable()){try{if(confirm("Möchtest du zusätzlich per Fingerabdruck/Gesicht entsperren?"))localStorage.setItem("db_bio","1");}catch(e){}}
}
async function toggleBiometric(on){
  if(on){if(!(await bioAvailable())){toast("Auf diesem Gerät ist kein Fingerabdruck/Gesicht eingerichtet.",true);if(activeView==="settings")renderApp();return;}try{localStorage.setItem("db_bio","1");}catch(e){}toast("Fingerabdruck aktiviert ✅");}
  else{try{localStorage.removeItem("db_bio");}catch(e){}toast("Fingerabdruck deaktiviert");}
}
function securityCard(){
  if(!isNative())return "";
  var has=pinSet();
  return '<section class="card"><h2 class="sect">🔒 App-Sicherheit</h2>'+
    '<p class="muted" style="font-size:.9rem">Schütze deine Dokumente mit einer PIN'+(has?".":" – empfohlen, da hier medizinische und finanzielle Daten liegen.")+'</p>'+
    (has?
      '<div class="btnrow"><button class="ghost" data-action="pin-change">PIN ändern</button><button class="danger" data-action="pin-remove">PIN entfernen</button></div>'+
      '<label style="display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.95rem;cursor:pointer"><input type="checkbox" id="bioToggle" style="width:auto"'+(bioEnabled()?" checked":"")+'> Mit Fingerabdruck / Gesicht entsperren</label>'
      :
      '<div class="btnrow"><button class="primary" data-action="pin-set">🔒 PIN einrichten</button></div>')+
  '</section>';
}

/* ---------- Internet-Recherche am Vertrag (KI mit Websuche) ---------- */
var researchBusy=false;
async function researchContract(cid){
  var c=contractById(cid);if(!c)return;
  if(!c.anbieter){toast("Bitte zuerst einen Anbieter eintragen.",true);return;}
  if(researchBusy)return;
  researchBusy=true;
  openModal('<h2 class="sect">🌐 Internet-Recherche</h2><div class="aiwork" style="justify-content:center"><span class="spin"></span><span class="aimsg">Der Butler recherchiert zu „'+escapeHtml(c.anbieter)+(c.produkt?" – "+escapeHtml(c.produkt):"")+'“ … das kann bis zu einer Minute dauern.</span></div>');
  try{
    var r=await sb.functions.invoke("butler-research",{body:{anbieter:c.anbieter,produkt:c.produkt||null,kategorie:c.kategorie||null,kosten:c.kosten,kostenIntervall:c.kosten_intervall||null,vertragsstart:c.vertragsstart||null,model:modelPref()}});
    if(r.error){
      var rcode=null,rmsg=null;
      try{if(r.error.context&&typeof r.error.context.json==="function"){var rjb=await r.error.context.json();if(rjb){rcode=rjb.code;rmsg=rjb.error;}}}catch(e){}
      if(rcode==="ki_guthaben"){closeModal();toast("Das KI-Guthaben ist aufgebraucht – bitte später erneut recherchieren.",true);return;}
      throw new Error(rmsg||errMsg(r.error));
    }
    var body=r.data||{};if(body.error){if(body.code==="ki_guthaben"){closeModal();toast("Das KI-Guthaben ist aufgebraucht – bitte später erneut recherchieren.",true);return;}throw new Error(body.error);}
    if(!body.recherche)throw new Error("Keine Rechercheergebnisse erhalten.");
    await saveContractData({recherche:body.recherche,recherche_am:new Date().toISOString()},cid);
    try{await sb.from("ai_usage").insert({household_id:activeHousehold,user_email:(currentUser&&currentUser.email)||null,model:body.modell||null,input_tokens:(body.usage&&typeof body.usage.input==="number")?body.usage.input:null,output_tokens:(body.usage&&typeof body.usage.output==="number")?body.usage.output:null,filename:"🌐 Recherche: "+(c.anbieter||"?")+((body.usage&&body.usage.searches)?" · "+body.usage.searches+" Suchen":"")});}catch(e){}
    await loadFromDB();
    closeModal();
    detailId=cid;activeView="contract-detail";renderApp();
    toast("Recherche abgeschlossen ✅");
  }catch(e){closeModal();toast("Recherche fehlgeschlagen: "+errMsg(e),true);}
  finally{researchBusy=false;}
}
/* Recherchierte Konditionen, die dem Vertrag noch fehlen (konservativ: keine Preise) */
function rechercheFills(c){
  var td=(c&&c.recherche&&c.recherche.tarifdetails)||{};
  var map=[
    {col:"mindestlaufzeit_monate",k:"mindestlaufzeitMonate",label:"Mindestlaufzeit"},
    {col:"kuendigungsfrist_monate",k:"kuendigungsfristMonate",label:"Kündigungsfrist"},
    {col:"verlaengerung_monate",k:"verlaengerungMonate",label:"Verlängerung"}
  ];
  var out=[];
  map.forEach(function(f){
    var v=td[f.k];
    if(v!=null&&v!==""&&!isNaN(Number(v))&&(c[f.col]==null||c[f.col]===""))out.push({col:f.col,val:Number(v),label:f.label});
  });
  return out;
}
/* Recherche-Ergebnisse NUR nach Bestätigung übernehmen (Checkbox-Dialog wie beim Abgleich) */
var researchSugs=null;
function openResearchFillModal(cid){
  var c=contractById(cid);if(!c)return;
  var sug=rechercheFills(c);
  if(!sug.length){toast("Keine neuen Angaben aus der Recherche.");return;}
  researchSugs={cid:cid,items:sug};
  var rows=sug.map(function(s,i){
    return '<label class="adjrow"><input type="checkbox" class="rescb" checked data-i="'+i+'">'+
      '<span class="adjtxt"><b>'+s.label+':</b> <span class="adjarr">→</span> <b>'+adjFmt(s.col,s.val)+'</b>'+
      '<span class="adjsrc">aus der Internet-Recherche · bitte prüfen</span></span></label>';
  }).join("");
  openModal('<h2 class="sect">🌐 Recherche-Angaben übernehmen</h2>'+
    '<p class="muted" style="font-size:.85rem;margin:0 0 10px">Diese Angaben stammen aus öffentlicher Internet-Recherche und können vom individuell abgeschlossenen Vertrag abweichen. Wähle aus, was übernommen werden soll.</p>'+
    rows+
    '<div class="btnrow"><button class="primary" data-action="research-apply">Übernehmen</button><button class="ghost" data-action="modal-close">Abbrechen</button></div>');
}
async function applyResearchFill(){
  var a=researchSugs;if(!a)return;
  var boxes=Array.prototype.slice.call(document.querySelectorAll(".rescb"));
  var cols={},n=0;
  boxes.forEach(function(b){if(!b.checked)return;var s=a.items[parseInt(b.dataset.i,10)];if(!s)return;cols[s.col]=s.val;n++;});
  closeModal();
  if(!n){toast("Nichts ausgewählt.");return;}
  try{await saveContractData(cols,a.cid);await loadFromDB();detailId=a.cid;activeView="contract-detail";renderApp();toast(n+" Angabe"+(n===1?"":"n")+" übernommen ✅");}
  catch(e){toast("Übernehmen fehlgeschlagen: "+errMsg(e),true);}
}
function rechercheCard(c){
  if(!c.recherche)return "";
  var rc=c.recherche;
  var le=(Array.isArray(rc.leistungen)&&rc.leistungen.length)?'<ul class="wichtig">'+rc.leistungen.map(function(l){return '<li>'+escapeHtml(String(l))+'</li>';}).join("")+'</ul>':"";
  var qs=(Array.isArray(rc.quellen)&&rc.quellen.length)?'<p class="muted" style="font-size:.8rem;margin-top:8px">Quellen: '+rc.quellen.slice(0,5).map(function(q){var u=String((q&&q.url)||"");var t=String((q&&q.titel)||u||"Quelle");if(!/^https?:\/\//i.test(u))return escapeHtml(t);return '<a href="'+escapeHtml(u)+'" target="_blank" rel="noopener">'+escapeHtml(t)+'</a>';}).join(" · ")+'</p>':"";
  var sug=rechercheFills(c);
  var sugHtml=sug.length?('<div class="ainote">💡 Gefundene Konditionen, die dem Vertrag noch fehlen: '+sug.map(function(s){return s.label+" = "+adjFmt(s.col,s.val);}).join(", ")+' <button class="linkbtn" data-action="research-fill" data-id="'+c.id+'" style="display:inline">Übernehmen</button></div>'):"";
  return '<section class="card"><h2 class="sect">🌐 Internet-Recherche</h2>'+
    '<p class="muted" style="font-size:.8rem;margin:0 0 8px">Stand '+fmtDate(String(c.recherche_am||"").slice(0,10))+' · öffentliche Angaben – können vom individuell abgeschlossenen Vertrag abweichen.</p>'+
    (rc.zusammenfassung?'<p style="font-size:.92rem">'+escapeHtml(String(rc.zusammenfassung))+'</p>':"")+
    le+
    (rc.hinweise?'<div class="ainote">💡 '+escapeHtml(String(rc.hinweise))+'</div>':"")+
    sugHtml+qs+
    '<div class="btnrow"><button class="ghost" data-action="research-contract" data-id="'+c.id+'">🔄 Neu recherchieren</button></div>'+
  '</section>';
}

/* ---------- KI-Verbrauch (Tokens, Kosten, Budget, Historie) ---------- */
var AI_PRICE={"claude-haiku-4-5":{i:1,o:5},"claude-sonnet-5":{i:3,o:15},"claude-opus-4-8":{i:5,o:25}}; /* USD je Mio. Tokens */
function aiUsageCost(u){ /* geschätzte Kosten in Cent */
  var p=AI_PRICE[u.model]||AI_PRICE["claude-haiku-4-5"];
  return ((u.input_tokens||0)*p.i+(u.output_tokens||0)*p.o)/10000;
}
function fmtCent(c){
  if(c>=100)return (c/100).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
  return c.toLocaleString("de-DE",{maximumFractionDigits:c<1?2:1})+" ct";
}
function aiBudget(){try{var v=parseFloat((localStorage.getItem("db_ai_budget")||"").replace(",","."));return (v>0)?v:null;}catch(e){return null;}}
function aiUsageCard(){
  var mon=todayISO().slice(0,7);
  var month=AIUSAGE.filter(function(u){return String(u.created_at).slice(0,7)===mon;});
  var cents=month.reduce(function(s,u){return s+aiUsageCost(u);},0);
  var toks=month.reduce(function(s,u){return s+(u.input_tokens||0)+(u.output_tokens||0);},0);
  var budget=aiBudget(),bar="";
  if(budget){
    var used=cents/100,pct=Math.min(100,Math.round(used/budget*100));
    var rest=Math.max(0,budget-used);
    bar='<div class="aibar"><div class="aibarfill'+(pct>=90?" warn":"")+'" style="width:'+Math.max(2,pct)+'%"></div></div>'+
      '<p style="font-size:.9rem;margin:6px 0 0">Übrig: <b>'+rest.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+' €</b> von '+budget.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+' € Monatsbudget'+(pct>=90?' <span class="badge red">fast aufgebraucht</span>':'')+'</p>';
  }
  var hist=AIUSAGE.slice(0,5).map(aiRowHtml).join("");
  return '<section class="card"><h2 class="sect">🎛️ KI-Verbrauch</h2>'+
    '<p style="font-size:.92rem;margin:0 0 8px">Dieser Monat: <b>'+month.length+'</b> Analyse'+(month.length===1?"":"n")+' · '+toks.toLocaleString("de-DE")+' Tokens · <b>≈ '+fmtCent(cents)+'</b></p>'+
    bar+
    '<div class="gdpath" style="margin-top:12px"><input type="text" inputmode="decimal" id="ai_budget" value="'+(budget!=null?String(budget).replace(".",","):"")+'" placeholder="Monatsbudget in € (z. B. 2)"><button class="ghost" data-action="ai-budget-save" style="flex:none">Budget speichern</button></div>'+
    (AIUSAGE.length
      ?('<div class="acclabel accsep">Letzte Analysen</div><div class="aihist">'+hist+'</div>'+(AIUSAGE.length>5?'<button class="linkbtn" data-nav="ai-usage" style="margin-top:8px">Gesamte Liste ansehen ›</button>':""))
      :'<p class="muted" style="font-size:.85rem;margin-top:10px">Noch keine Analysen protokolliert – ab jetzt schreibt der Butler jede KI-Analyse hier mit.</p>')+
    '<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--muted);font-size:.78rem">ℹ️ Hinweis zu den Zahlen</summary><p class="muted" style="font-size:.78rem;margin:6px 0 0">Eigenes Verbrauchsprotokoll des Butlers – das echte Anthropic-Guthaben lässt sich aus der App nicht auslesen. Kostenangaben sind Näherungswerte auf Dollar-Basis.</p></details>'+
  '</section>';
}
function aiRowHtml(u){
  var d=new Date(u.created_at);
  var when=isNaN(d)?"–":(d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}));
  var who=(u.user_email||"?").split("@")[0];
  return '<div class="airow"><span class="aiwhen">'+when+'</span><span class="aiwho">'+escapeHtml(who)+'</span><span class="aifile">'+escapeHtml(u.filename||"Dokument")+'</span><span class="aicostv">≈ '+fmtCent(aiUsageCost(u))+'</span></div>';
}
/* Eigene Verbrauchsseite mit Suche + Filter (Nutzer/Monat) */
var aiFilter={q:"",user:"",month:""};
function viewAiUsage(){
  var users={},months={};
  AIUSAGE.forEach(function(u){var e=(u.user_email||"").split("@")[0];if(e)users[e]=1;var m=String(u.created_at).slice(0,7);if(/^\d{4}-\d{2}$/.test(m))months[m]=1;});
  var q=(aiFilter.q||"").toLowerCase();
  var list=AIUSAGE.filter(function(u){
    if(aiFilter.user&&(u.user_email||"").split("@")[0]!==aiFilter.user)return false;
    if(aiFilter.month&&String(u.created_at).slice(0,7)!==aiFilter.month)return false;
    if(q&&(u.filename||"").toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var cents=list.reduce(function(s,u){return s+aiUsageCost(u);},0);
  var toks=list.reduce(function(s,u){return s+(u.input_tokens||0)+(u.output_tokens||0);},0);
  function monLabel(m){var p=m.split("-");return ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"][parseInt(p[1],10)-1]+" "+p[0];}
  var userOpts='<option value="">Alle Nutzer</option>'+Object.keys(users).sort().map(function(u){return '<option value="'+escapeHtml(u)+'"'+(u===aiFilter.user?" selected":"")+'>'+escapeHtml(u)+'</option>';}).join("");
  var monOpts='<option value="">Alle Monate</option>'+Object.keys(months).sort().reverse().map(function(m){return '<option value="'+m+'"'+(m===aiFilter.month?" selected":"")+'>'+monLabel(m)+'</option>';}).join("");
  var rows=list.length?list.map(aiRowHtml).join(""):'<p class="muted" style="font-size:.88rem">Keine Einträge für diese Auswahl.</p>';
  return '<button class="linkbtn" data-nav="settings" style="margin-bottom:12px">← Einstellungen</button>'+
    '<section class="card"><h2 class="sect">🎛️ KI-Verbrauch – gesamte Liste</h2>'+
    '<p style="font-size:.9rem;margin:0 0 10px">Auswahl: <b>'+list.length+'</b> Analyse'+(list.length===1?"":"n")+' · '+toks.toLocaleString("de-DE")+' Tokens · <b>≈ '+fmtCent(cents)+'</b></p>'+
    '<div class="formrow" style="margin-bottom:8px">'+
      '<div><input type="search" id="ai_q" value="'+escapeHtml(aiFilter.q)+'" placeholder="🔎 Dokument suchen …"></div>'+
      '<div><select id="ai_fuser">'+userOpts+'</select></div>'+
      '<div><select id="ai_fmonth">'+monOpts+'</select></div>'+
    '</div>'+
    (aiFilter.q||aiFilter.user||aiFilter.month?'<button class="linkbtn" data-action="ai-filter-reset" style="margin:0 0 8px">Filter zurücksetzen</button>':"")+
    '<div class="aihist">'+rows+'</div>'+
    '<p class="muted" style="font-size:.78rem;margin-top:10px">Es werden die letzten 300 Analysen geführt. Kostenangaben sind Näherungswerte.</p>'+
  '</section>';
}

/* ---------- Dokument-Schnellansicht + Bearbeiten ---------- */
function openDocDetail(id){
  var d=DOCS.find(function(x){return x.id===id;});if(!d)return;

/* Dokument teilen: nativ per Web Share API (mit Datei), sonst signierte Ansehen-URL */
async function shareDoc(docId){
  var d=DOCS.find(function(x){return x.id===docId;});if(!d)return;
  toast("Wird zum Teilen vorbereitet …");
  try{
    var canFiles=false;
    try{
      var dl=await sb.storage.from(BUCKET).download(d.storage_path);
      if(!dl.error&&dl.data){
        var file=new File([dl.data],d.filename||"dokument",{type:d.mime_type||dl.data.type||"application/octet-stream"});
        if(navigator.canShare&&navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:d.filename||"Dokument"});
          canFiles=true;
        }
      }
    }catch(e){if(e&&e.name==="AbortError")return;}
    if(canFiles)return;
    /* Fallback: signierte Ansehen-URL (7 Tage) teilen/kopieren */
    var su=await sb.storage.from(BUCKET).createSignedUrl(d.storage_path,604800);
    if(su.error)throw su.error;
    var url=su.data.signedUrl;
    if(navigator.share){try{await navigator.share({title:d.filename||"Dokument",url:url});return;}catch(e){if(e&&e.name==="AbortError")return;}}
    try{await navigator.clipboard.writeText(url);toast("Link kopiert (7 Tage gültig) ✅");}
    catch(e){window.open(url,"_blank");}
  }catch(e){toast("Teilen fehlgeschlagen: "+errMsg(e),true);}
}

function gsRun(){
  var inp=$("#gSearch"),box=$("#gResults");if(!inp||!box)return;
  var q=(inp.value||"").trim().toLowerCase();
  if(!currentUser||q.length<2){gsHide();return;}
  function hit(s){return String(s||"").toLowerCase().indexOf(q)>=0;}
  var vc=[],vd=[],vm=[],vp=[];
  CONTRACTS.forEach(function(c){
    var k=katInfo(c.kategorie);
    if(hit(c.anbieter)||hit(c.produkt)||hit(c.kundennummer)||hit(c.vertragsnummer)||hit(c.notizen)||hit(k.label))
      vc.push({icon:k.icon,t:(c.anbieter||"?")+(c.produkt?" · "+c.produkt:""),s:k.label+(c.kosten!=null?" · "+fmtEur(c.kosten)+" / "+(INTERVALL_LABEL[c.kosten_intervall]||"?"):"")+(c.status!=="aktiv"?" · "+c.status:""),type:"contract",id:c.id});
  });
  DOCS.forEach(function(d){
    var e=d.extracted||{};
    if(hit(d.titel)||hit(d.filename)||hit(d.zusammenfassung)||hit(d.arzt)||hit(d.note)||hit(e.anbieter)||hit(e.kundennummer)||hit(e.vertragsnummer)||hit(e.behandlung)){
      if(isMed(d))vm.push({icon:fachInfo(d.fachrichtung||"sonstiges").icon,t:d.titel||d.arzt||fachInfo(d.fachrichtung||"sonstiges").label,s:medTypInfo(d.med_typ).label+" · "+fmtDate(d.behandlungsdatum||d.doc_date||String(d.created_at).slice(0,10))+(d.betrag!=null?" · "+fmtEur(d.betrag):""),type:"med",id:d.id});

    }
  });
  PERSONS.forEach(function(p){if(hit(p.name))vp.push({icon:"👤",t:p.name,s:"Person – tippen zum Filtern",type:"person",id:p.id});});
  function grp(label,arr){
    if(!arr.length)return "";
    return '<div class="grhead">'+label+'</div>'+arr.slice(0,5).map(function(r){
      return '<button class="grow" data-gres="'+r.type+'" data-id="'+r.id+'"><span class="gric">'+r.icon+'</span><div><div class="grt">'+escapeHtml(r.t)+'</div><div class="grs">'+escapeHtml(r.s)+'</div></div></button>';
    }).join("");
  }
  var html=grp("📑 Verträge",vc)+grp("📁 Dokumente",vd)+grp("🩺 Gesundheit",vm)+grp("👥 Personen",vp);
  box.innerHTML=html||'<div class="grempty">Nichts gefunden für „'+escapeHtml(q)+'“.</div>';
  box.hidden=false;
}

  else if(act==="set-theme"){applyTheme(b.dataset.val==="dark");renderApp();}
  else if(act==="set-model")setModel(b.dataset.val);
  else if(act==="acc-change-pass")changeAccountPassword();
  else if(act==="logout")doLogout();
}

  if(e.target.id==="cf_kategorie"){
    /* Kategorie gewechselt → passende Zusatzfelder zeigen (eingegebene Werte mitnehmen) */
    var box=$("#cfDetails");
    if(box){var kept=collectDetailInputs();box.innerHTML=detailFormHtml(e.target.value||"sonstiges",kept);}
    updateFormPreview();return;
  }
  if(e.target.id&&e.target.id.indexOf("cf_")===0){updateFormPreview();return;}
  if(e.target.id==="fileCam"||e.target.id==="filePick"){
    var files=Array.prototype.slice.call(e.target.files||[]);e.target.value="";
    if(files.length)processFiles(files);
  }
  else if(e.target.id==="df_kat"){docFilter.kat=e.target.value;renderApp();}
  else if(e.target.id==="df_typ"){docFilter.typ=e.target.value;renderApp();}
  else if(e.target.id==="df_jahr"){docFilter.jahr=e.target.value;renderApp();}
  else if(e.target.id==="df_sort"){docFilter.sort=e.target.value;renderApp();}
  else if(e.target.id==="mf_fach"){medFilter.fach=e.target.value;renderApp();}
  else if(e.target.id==="mf_typ"){medFilter.typ=e.target.value;renderApp();}
  else if(e.target.id==="mf_arzt"){medFilter.arzt=e.target.value;renderApp();}
  else if(e.target.id==="mf_jahr"){medFilter.jahr=e.target.value;renderApp();}
  else if(e.target.id==="mf_sort"){medFilter.sort=e.target.value;renderApp();}
  else if(e.target.id==="bioToggle"){toggleBiometric(e.target.checked);}
  else if(e.target.id==="ai_fuser"){aiFilter.user=e.target.value;renderApp();}
  else if(e.target.id==="ai_fmonth"){aiFilter.month=e.target.value;renderApp();}
  else if(e.target.id==="personSel"){activePerson=e.target.value||"";renderApp();}

function onAppInput(e){
  if(e.target.id&&e.target.id.indexOf("cf_")===0){updateFormPreview();return;}
  if(e.target.id==="df_q"){docFilter.q=e.target.value;
    clearTimeout(onAppInput._t);onAppInput._t=setTimeout(function(){var el=$("#df_q");var pos=el?el.selectionStart:0;renderApp();var el2=$("#df_q");if(el2){el2.focus();el2.setSelectionRange(pos,pos);}},350);return;}
  if(e.target.id==="ai_q"){aiFilter.q=e.target.value;
    clearTimeout(onAppInput._a);onAppInput._a=setTimeout(function(){var el=$("#ai_q");var pos=el?el.selectionStart:0;renderApp();var el2=$("#ai_q");if(el2){el2.focus();try{el2.setSelectionRange(pos,pos);}catch(_e){}}},350);}
}

/* Wisch-Gesten auf Dokumentzeilen (delegiert, nur Touch). Wischen deckt die
   Aktions-Buttons auf – ausgelöst wird ausschließlich per Tippen. Vertikales
   Scrollen wird nie blockiert (passive Listener, horizontale Dominanz-Schwelle). */
function initSwipe(app){
  var st=null;
  app.addEventListener("touchstart",function(e){
    var row=e.target.closest(".swrow");
    var open=app.querySelector(".swrow.swiped");
    if(open&&open!==row)open.classList.remove("swiped");
    if(!row){st=null;return;}
    var t=e.touches[0];
    st={row:row,front:row.querySelector(".swipefront"),x0:t.clientX,y0:t.clientY,dx:0,decided:false,horiz:false,wasOpen:row.classList.contains("swiped")};
    if(!st.front){st=null;return;}
  },{passive:true});
  app.addEventListener("touchmove",function(e){
    if(!st)return;
    var t=e.touches[0],dx=t.clientX-st.x0,dy=t.clientY-st.y0;
    if(!st.decided){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      st.decided=true;st.horiz=Math.abs(dx)>Math.abs(dy)+4;
      if(st.horiz)st.front.style.transition="none";else{st=null;return;}
    }
    if(!st.horiz)return;
    st.dx=dx;
    var x=Math.max(-136,Math.min(0,(st.wasOpen?-136:0)+dx));
    st.front.style.transform="translateX("+x+"px)";
  },{passive:true});
  function endSwipe(){
    if(!st)return;var s=st;st=null;
    if(!s.horiz)return;
    s.front.style.transition="";s.front.style.transform="";
    s.row.classList.toggle("swiped",((s.wasOpen?-136:0)+s.dx)<-50);
  }
  app.addEventListener("touchend",endSwipe,{passive:true});
  app.addEventListener("touchcancel",endSwipe,{passive:true});
}
/* ---------- Init ---------- */
function init(){
  var saved="";try{saved=localStorage.getItem("dbTheme")||"";}catch(e){}
  if(!saved)saved=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  applyTheme(saved==="dark");
  var kb=$("#kontoBtn");if(kb)kb.addEventListener("click",function(){go("settings");});
  var app=$("#app");
  app.addEventListener("click",onAppClick);
  app.addEventListener("change",onAppChange);
  app.addEventListener("input",onAppInput);
  initSwipe(app);
  /* Modal-Dialoge */
  var mbx=$("#modalBox");
  if(mbx){
    mbx.addEventListener("click",onAppClick);
    mbx.addEventListener("change",onAppChange);
    mbx.addEventListener("input",onAppInput);
    mbx.addEventListener("keydown",function(e){
      if(e.key!=="Enter"||!e.target)return;
      if(e.target.id==="mq_input"){var ok=mbx.querySelector('[data-action="mq-ok"]');if(ok)ok.click();}
      else if(e.target.id==="pp_new"){var pn=mbx.querySelector('[data-action="pick-person-new"]');if(pn)pn.click();}
    });
  }
  var mwrap=$("#modal");if(mwrap)mwrap.addEventListener("click",function(e){if(e.target===mwrap)closeModal();});
  /* Globale Suche */
  var gs=$("#gSearch");
  if(gs){
    gs.addEventListener("input",function(){clearTimeout(gsRun._t);gsRun._t=setTimeout(gsRun,180);});
    gs.addEventListener("focus",gsRun);
    gs.addEventListener("keydown",function(e){if(e.key==="Escape"){gs.value="";gsHide();gs.blur();}});
  }
  var gr=$("#gResults");if(gr)gr.addEventListener("click",function(e){var b=e.target.closest("[data-gres]");if(b)gsOpen(b.dataset.gres,b.dataset.id);});
  document.addEventListener("click",function(e){if(!e.target.closest(".gsearch"))gsHide();});
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")refreshIfStale();});
  /* Zurück-Geste / Browser-Zurück: erst Dialog/Suche schließen, sonst zur vorherigen Ansicht */
  window.addEventListener("popstate",function(){
    if(document.body.classList.contains("app-hidden"))return; /* nicht eingeloggt */
    var mw=$("#modal");if(mw&&!mw.hidden){closeModal();try{history.pushState({b:1},"");}catch(e){}return;}
    var gr=$("#gResults");if(gr&&!gr.hidden){gsHide();try{history.pushState({b:1},"");}catch(e){}return;}
    if(navHistory.length){navRestore(navHistory.pop());return;}
    /* nichts mehr im Verlauf: im Web verlässt der nächste Zurück-Schritt die Seite */
  });
  document.addEventListener("keydown",function(e){
    if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();var g=$("#gSearch");if(g)g.focus();}
    else if(e.key==="Escape"){var mw=$("#modal");if(mw&&!mw.hidden)closeModal();}
  });
  function onNav(e){var b=e.target.closest("[data-nav]");if(b){if(b.dataset.nav==="add"){reviewDoc=null;importResults=[];uploadTarget=null;}go(b.dataset.nav);}}
  var t=$("#tabs");if(t)t.addEventListener("click",onNav);
  var tf=$("#tabsFoot");if(tf)tf.addEventListener("click",onNav);
  var tm=$("#tabsMobile");if(tm)tm.addEventListener("click",onNav);
  $("#auth_login").addEventListener("click",doLogin);
  $("#auth_signup").addEventListener("click",doSignup);
  $("#auth_forgot").addEventListener("click",doForgot);
  $("#auth_setpass").addEventListener("click",doSetPassword);
  $("#auth_pass").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
  sb.auth.onAuthStateChange(function(event,session){
    if(event==="PASSWORD_RECOVERY"){enterRecovery(session);return;}
    if(pendingRecovery&&session){enterRecovery(session);return;}
    handleSession(session);
  });
  sb.auth.getSession().then(function(r){
    var session=r&&r.data?r.data.session:null;
    if(pendingRecovery&&session){enterRecovery(session);return;}
    handleSession(session);
  });
  var kp=$("#lockKeypad");if(kp)kp.addEventListener("click",function(e){var b=e.target.closest("[data-key]");if(b)lockKey(b.dataset.key);});
  var bb=$("#lockBioBtn");if(bb)bb.addEventListener("click",tryBiometric);
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
  try{nativeInit();}catch(e){}
}
window.addEventListener("error",function(e){logError("js",(e&&e.message?e.message:"Skriptfehler")+(e&&e.lineno?" @Zeile "+e.lineno:""));});
window.addEventListener("unhandledrejection",function(e){var rr=e&&e.reason;logError("js-promise",(rr&&(rr.message||String(rr)))||"unbekannt");});
document.addEventListener("DOMContentLoaded",init);
})();
</script>
