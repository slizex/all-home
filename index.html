async function loescheVertrag(id){
  var c=vertragById(id);if(!c)return;
  if(!confirm(tf("Vertrag „{0}“ wirklich löschen? Zugeordnete Dokumente bleiben im Archiv.",c.anbieter||artInfo(c.art).label)))return;
  try{
    var r=await sb.from("contracts").delete().eq("id",id).select("id");
    if(r.error)throw r.error;
    if(!r.data||!r.data.length)throw new Error(t("Es wurde nichts gelöscht – fehlende Berechtigung oder der Vertrag ist schon weg."));
    await ladeDaten();
    toast(t("Vertrag gelöscht ✅"));
    go("#/vertraege");
  }catch(e){toast(t("Löschen fehlgeschlagen")+": "+errMsg(e),true);}
}

/* ================= Kalender-Export (.ics) ================= */
function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function icsExport(id){
  var c=vertragById(id);if(!c)return;
  var f=fristInfo(c);
  if(!f.lastDay){toast(t("Für diesen Vertrag ist keine Frist berechenbar."),true);return;}
  var a=artInfo(c.art||"sonstiges");
  var name=(c.anbieter||a.label)+(c.produkt?" – "+c.produkt:"");
  var dt=f.lastDay.replace(/-/g,"");
  var stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  var zeilen=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//All-Home//DE","BEGIN:VEVENT",
    "UID:allhome-"+c.id+"-"+dt+"@all-home","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+dt,
    "SUMMARY:"+icsEsc("⏰ "+tf("Kündigungsfrist: {0}",name)),
    "DESCRIPTION:"+icsEsc(tf("Letzter Kündigungstag für {0}. Sonst läuft der Vertrag weiter bis {1}.",name,fmtDate(f.end))),
    "BEGIN:VALARM","TRIGGER:-P14D","ACTION:DISPLAY",
    "DESCRIPTION:"+icsEsc(tf("In 14 Tagen: Kündigungsfrist {0}",name)),"END:VALARM",
    "END:VEVENT","END:VCALENDAR"];
  var blob=new Blob([zeilen.join("\r\n")],{type:"text/calendar;charset=utf-8"});
  lade(blob,"kuendigungsfrist-"+(c.anbieter||"vertrag").toLowerCase().replace(/[^a-z0-9]+/g,"-")+".ics");
  toast(t("Kalender-Datei erstellt 📅"));
}
function lade(blob,name){
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();

/* Bild verkleinern (1-GB-Grenze im Speicher) */
function bildKlein(file){
  return new Promise(function(ok,fehler){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=1800,w=img.naturalWidth,h=img.naturalHeight;
      var s=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement("canvas");cv.width=Math.round(w*s);cv.height=Math.round(h*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){b?ok(b):fehler(new Error(t("Bild konnte nicht verarbeitet werden.")));},"image/jpeg",0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);fehler(new Error(t("Bildformat wird nicht unterstützt. Bitte JPG, PNG oder PDF.")));};
    img.src=url;
  });
}
function bytesBase64(bytes){
  var bin="",chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(bin);
}
/* Supabase-Storage verträgt nur ASCII im Pfad */
function pfadName(name){
  var s=String(name||"dokument");
  try{s=s.normalize("NFC");}catch(e){}
  s=s.replace(/[äöüÄÖÜß]/g,function(c){return {"ä":"ae","ö":"oe","ü":"ue","Ä":"Ae","Ö":"Oe","Ü":"Ue","ß":"ss"}[c];});
  try{s=s.normalize("NFKD").replace(/[̀-ͯ]/g,"");}catch(e){}
  return s.replace(/[^A-Za-z0-9._\-]+/g,"_").slice(-80);
}
function netzFehler(e){
  var m=errMsg(e).toLowerCase();
  if(m.indexOf("failed to fetch")>=0||m.indexOf("load failed")>=0||m.indexOf("network")>=0||m.indexOf("timeout")>=0)
    return t("Netzwerkfehler beim Hochladen – bitte Verbindung prüfen und erneut versuchen.");
  return errMsg(e);
}
async function hochladenMitWiederholung(pfad,bytes,mime){
  var letzter=null;
  for(var i=0;i<3;i++){
    if(i)await new Promise(function(r){setTimeout(r,700*i);});
    try{
      var up=await sb.storage.from(BUCKET).upload(pfad,bytes,{contentType:mime,upsert:false});
      if(!up.error)return up;
      if(i>0&&/exist|dupli|409/i.test(errMsg(up.error)))return {data:{path:pfad},error:null};
      letzter=up.error;
      if(netzFehler(up.error)===errMsg(up.error))return up;  /* echter Fehler: nicht wiederholen */
    }catch(e){letzter=e;}
  }
  return {error:letzter};
}

async function dateienVerarbeiten(files,ziel){
  files=Array.prototype.slice.call(files||[]).filter(Boolean);

async function einesVerarbeiten(file,ziel){
  var istPdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name||"");
  if(!istPdf&&!ALLOWED_IMG[file.type]&&!/^image\//.test(file.type))
    throw new Error(t("Format nicht unterstützt (nur PDF oder Foto)."));
  if(istPdf&&file.size>12*1024*1024)throw new Error(t("PDF größer als 12 MB"));
  var blob=file,mime=file.type||"application/pdf",name=file.name||("scan-"+Date.now()+".jpg");
  if(!istPdf){blob=await bildKlein(file);mime="image/jpeg";name=name.replace(/\.[^.]+$/,"")+".jpg";}

  var bytes=new Uint8Array(await blob.arrayBuffer());
  /* Dubletten über den Inhalt erkennen: kein Upload, keine KI-Kosten */
  var hash=null;
  try{
    var hb=await crypto.subtle.digest("SHA-256",bytes);
    hash=Array.prototype.map.call(new Uint8Array(hb),function(x){return x.toString(16).padStart(2,"0");}).join("");
  }catch(e){}
  if(hash){
    var dup=DOCS.filter(function(d){return d.content_hash===hash;})[0];
    if(dup){
      IMPORT.ergebnisse.push({name:name,icon:"⏭️",
        text:tf("übersprungen – gleich wie „{0}“",dup.filename||"?"),docId:null});
      return;
    }
  }
  var pfad=HH.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,7)+"_"+pfadName(name);
  var up=await hochladenMitWiederholung(pfad,bytes,mime);
  if(up.error)throw new Error(netzFehler(up.error));
  var ins=await sb.from("documents").insert({
    household_id:HH.id,filename:name,storage_path:pfad,mime_type:mime,
    size_bytes:bytes.length,doc_type:"sonstiges",content_hash:hash,
    contract_id:(ziel&&ziel.vertrag)||null
  }).select("*").single();
  if(ins.error){
    try{await sb.storage.from(BUCKET).remove([pfad]);}catch(e){}
    throw new Error(netzFehler(ins.error));
  }
  var reihe=ins.data,ext=null;
  /* KI-Auslesung */
  try{
    var antwort=await edgeRuf(EDGE_EXTRACT,{fileBase64:bytesBase64(bytes),mimeType:mime,model:kiStufe(),lang:curLang});
    ext=antwort.dokument||null;
  }catch(e){
    if(e&&e.code==="ki_guthaben"){
      IMPORT.guthabenLeer=true;
      try{await sb.from("documents").update({ki_pending:true}).eq("id",reihe.id);}catch(_e){}
      IMPORT.ergebnisse.push({name:name,icon:"⏳",text:t("gespeichert – KI-Guthaben leer, Analyse später"),docId:reihe.id});
      return;
    }
    IMPORT.ergebnisse.push({name:name,icon:"⚠️",text:t("abgelegt, aber KI-Analyse fehlgeschlagen"),docId:reihe.id});
    return;
  }
  if(!ext){
    IMPORT.ergebnisse.push({name:name,icon:"⚠️",text:t("abgelegt, nichts erkannt"),docId:reihe.id});
    return;
  }
  /* Ergebnis speichern */
  var upd={extracted:ext,ai_lang:curLang,
    doc_type:(ext.docType&&DOCTYPE[ext.docType])?ext.docType:"sonstiges",
    doc_date:ext.datum||null,zusammenfassung:ext.zusammenfassung||null,
    titel:(ext.titel||name).slice(0,80)};
  if(ext.istMedizin){
    upd.bereich="medizin";
    upd.fachrichtung=(ext.fachrichtung&&FACH[ext.fachrichtung])?ext.fachrichtung:"sonstiges";
    upd.arzt=ext.arzt||null;
    upd.med_typ=(ext.medTyp&&MEDTYP[ext.medTyp])?ext.medTyp:(ext.docType==="rechnung"?"rechnung":"sonstiges");
    upd.betrag=ext.betrag!=null?Number(ext.betrag):null;
    upd.behandlungsdatum=ext.datum||null;
  }
  try{await sb.from("documents").update(upd).eq("id",reihe.id);}catch(e){}
  IMPORT.ergebnisse.push({name:name,icon:"✅",text:t("eingelesen"),docId:reihe.id});
}
/* Edge-Function aufrufen und Guthaben-/Fehlercode herausziehen */
async function edgeRuf(fn,body){
  var r=await sb.functions.invoke(fn,{body:body});
  if(r.error){
    var code=null,msg=null;
    try{
      if(r.error.context&&typeof r.error.context.json==="function"){
        var jb=await r.error.context.json();
        if(jb){code=jb.code||null;msg=jb.error||null;}
      }
    }catch(e){}
    var err=new Error(msg||errMsg(r.error));err.code=code;throw err;
  }
  var b=r.data||{};
  if(b.error){var e2=new Error(b.error);e2.code=b.code||null;throw e2;}
  return b;
}

/* ================= Bestätigung nach dem Einlesen ================= */
/* Welche Art passt zu dem, was die KI gelesen hat? */
function artAusExtrakt(ext){
  if(!ext)return "sonstiges";
  if(ext.istMedizin)return "sonstiges";
  if(ext.docType==="fahrzeugschein")return "fahrzeug";
  var k=ext.kategorie;
  /* Die groben KI-Kategorien auf den feinen Katalog abbilden */
  var karte={strom:"strom",gas:"gas",wasser:"wasser",internet:"internet",mobilfunk:"mobilfunk",
    streaming:"streaming_video",bank:"girokonto",kfz:"kfz_vers",wohnen:"miete",
    mitgliedschaft:"verein",versicherung:"vers_sonst",gesundheit:"kranken"};
  var art=karte[k]||"sonstiges";
  /* Feiner raten anhand des Anbieters und des Versicherungsworts */
  var txt=((ext.anbieter||"")+" "+(ext.produkt||"")+" "+(ext.zusammenfassung||"")).toLowerCase();
  if(k==="versicherung"||art==="vers_sonst"){
    if(/haftpflicht/.test(txt)&&!/tier|kfz|auto/.test(txt))art="haftpflicht";
    else if(/hausrat/.test(txt))art="hausrat";
    else if(/wohngeb/.test(txt))art="wohngebaeude";
    else if(/rechtsschutz/.test(txt))art="rechtsschutz";
    else if(/berufsunf/.test(txt))art="bu";
    else if(/unfall/.test(txt))art="unfall";
    else if(/zahn/.test(txt))art="zahnzusatz";
    else if(/kfz|auto|fahrzeug/.test(txt))art="kfz_vers";
  }
  if(/rundfunk|beitragsservice|gez/.test(txt))art="rundfunk";
  if(/fitness|gym|mcfit|clever fit/.test(txt))art="fitness";
  if(/adac|avd|acе/.test(txt))art="autoclub";
  return ARTEN[art]?art:"sonstiges";
}
/* Passt das zu einem bestehenden Vertrag? */
function findeVertrag(ext){
  if(!ext)return null;
  var kn=(ext.kundennummer||"").trim(),vn=(ext.vertragsnummer||"").trim();
  var treffer=null;
  CONTRACTS.forEach(function(c){
    if(treffer)return;
    if(kn&&c.kundennummer&&String(c.kundennummer).trim()===kn)treffer=c;
    else if(vn&&c.vertragsnummer&&String(c.vertragsnummer).trim()===vn)treffer=c;
  });
  if(treffer)return treffer;
  var ab=(ext.anbieter||"").trim().toLowerCase();
  if(!ab)return null;
  var art=artAusExtrakt(ext);
  return CONTRACTS.filter(function(c){
    var ca=(c.anbieter||"").trim().toLowerCase();
    if(!ca)return false;
    var passt=(ca===ab)||(ca.indexOf(ab)>=0)||(ab.indexOf(ca)>=0);
    return passt&&(c.art===art||artInfo(c.art).g===artInfo(art).g);
  })[0]||null;
}

/* Analyse nachholen, wenn das Guthaben wieder da ist */
async function analyseNachholen(id){
  var d=DOCS.filter(function(x){return x.id===id;})[0];if(!d)return;
  toast(t("Analyse wird nachgeholt …"));
  try{
    var dl=await sb.storage.from(BUCKET).download(d.storage_path);
    if(dl.error)throw new Error(t("Datei konnte nicht geladen werden."));
    var bytes=new Uint8Array(await dl.data.arrayBuffer());
    var b=await edgeRuf(EDGE_EXTRACT,{fileBase64:bytesBase64(bytes),mimeType:d.mime_type||"application/pdf",model:kiStufe(),lang:curLang});
    var ext=b.dokument;
    if(!ext)throw new Error(t("Nichts erkannt."));
    await sb.from("documents").update({extracted:ext,ai_lang:curLang,ki_pending:false,
      doc_type:(ext.docType&&DOCTYPE[ext.docType])?ext.docType:"sonstiges",
      doc_date:ext.datum||null,zusammenfassung:ext.zusammenfassung||null,
      titel:(ext.titel||d.filename||"").slice(0,80)}).eq("id",id);
    closeModal(true);await ladeDaten();render();
    toast(t("Analyse nachgeholt ✅"));
  }catch(e){
    if(e&&e.code==="ki_guthaben")toast(t("Das KI-Guthaben ist noch leer."),true);
    else toast(t("Nachholen fehlgeschlagen")+": "+errMsg(e),true);
  }
}
/* ---- Nachübersetzen beim Öffnen ---- */
var transBusy={};
async function uebersetzeDok(id){
  var d=DOCS.filter(function(x){return x.id===id;})[0];
  if(!d||curLang===aiLangOf(d)||transBusy[id])return false;
  var ext=d.extracted||{},quelle={};
  if(d.titel)quelle.titel=d.titel;
  if(d.zusammenfassung)quelle.zusammenfassung=d.zusammenfassung;
  if(Array.isArray(ext.wichtig)&&ext.wichtig.length)quelle.wichtig=ext.wichtig;
  if(ext.hinweise)quelle.hinweise=ext.hinweise;
  if(ext.behandlung)quelle.behandlung=ext.behandlung;
  if(d.med_recherche)quelle.med_recherche=d.med_recherche;
  var keys=Object.keys(quelle);if(!keys.length)return false;
  var box=(d.i18n&&d.i18n[curLang])||{};
  var fehlt=keys.some(function(k){var v=box[k];return v==null||v===""||(Array.isArray(v)&&!v.length);});
  if(!fehlt)return false;
  transBusy[id]=true;
  try{
    var b=await edgeRuf(EDGE_TRANS,{texte:quelle,ziel:curLang,quelle:aiLangOf(d),model:"basic"});
    if(!b.uebersetzung)return false;
    var neu=Object.assign({},d.i18n||{});
    neu[curLang]=Object.assign({},neu[curLang]||{},b.uebersetzung);
    var r=await sb.from("documents").update({i18n:neu}).eq("id",id);
    if(r.error)throw r.error;
    d.i18n=neu;return true;
  }catch(e){return false;}
  finally{transBusy[id]=false;}
}

function viewGesundheit(){
  var p=route().params;

  var jahr=todayISO().slice(0,4);

  },0);
  var kostenGes=meds.reduce(function(s,d){return d.betrag!=null?s+Number(d.betrag):s;},0);
  /* Filter nur mit den Werten, die wirklich vorkommen */
  var faecher={},jahre={};
  meds.forEach(function(d){
    if(d.fachrichtung)faecher[d.fachrichtung]=1;
    var j=String(d.behandlungsdatum||d.doc_date||"").slice(0,4);
    if(/^\d{4}$/.test(j))jahre[j]=1;

  var gefiltert=meds.filter(function(d){
    if(medFilter.fach&&d.fachrichtung!==medFilter.fach)return false;

    if(medFilter.jahr&&String(d.behandlungsdatum||d.doc_date||"").slice(0,4)!==medFilter.jahr)return false;

    var bytes=new Uint8Array(await dl.data.arrayBuffer());
    var b=await edgeRuf(EDGE_MED,{fileBase64:bytesBase64(bytes),mimeType:d.mime_type||"application/pdf",
      model:kiStufe(),lang:curLang,
      kontext:{arzt:d.arzt||null,fachrichtung:d.fachrichtung||null,medTyp:d.med_typ||null,betrag:d.betrag!=null?d.betrag:null}});

    var upd={med_recherche_am:new Date().toISOString()};

      if(!d.med_recherche)upd.med_recherche=b.recherche;
    }

/* ---- Steuerübersicht als CSV ---- */
function medCsv(){
  var meds=DOCS.filter(function(d){return istMed(d)&&d.betrag!=null;});
  if(!meds.length){toast(t("Keine Arztkosten mit Betrag erfasst."),true);return;}
  meds=meds.slice().sort(function(a,b){
    return String(a.behandlungsdatum||a.doc_date||"").localeCompare(String(b.behandlungsdatum||b.doc_date||""));
  });
  function z(s){s=String(s==null?"":s);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
  function geld(n){return Number(n).toFixed(2).replace(".",",");}
  var reihen=[[t("Jahr"),t("Datum"),t("Patient"),t("Arzt / Praxis"),t("Fachrichtung"),t("Art"),t("Betrag (EUR)")]];
  meds.forEach(function(d){
    var dt=d.behandlungsdatum||d.doc_date||"";
    reihen.push([String(dt).slice(0,4),fmtDate(dt),personName(d.person_id)||"—",
      d.arzt||"",fachInfo(d.fachrichtung||"sonstiges").label,medTypInfo(d.med_typ).label,geld(d.betrag)]);
  });
  /* Summen je Jahr und Person */
  var agg={};
  meds.forEach(function(d){
    var j=String(d.behandlungsdatum||d.doc_date||"").slice(0,4),k=j+"|"+(d.person_id||"");
    if(!agg[k])agg[k]={j:j,p:d.person_id,sum:0,n:0};
    agg[k].sum+=Number(d.betrag);agg[k].n++;
  });
  reihen.push([]);reihen.push([t("Summen je Jahr und Person")]);
  reihen.push([t("Jahr"),t("Patient"),t("Anzahl"),t("Summe (EUR)")]);
  Object.keys(agg).sort().forEach(function(k){
    var a=agg[k];reihen.push([a.j,personName(a.p)||"—",a.n,geld(a.sum)]);
  });
  var csv="﻿"+reihen.map(function(r){return r.map(z).join(";");}).join("\r\n");
  lade(new Blob([csv],{type:"text/csv;charset=utf-8"}),"arztkosten-steuer.csv");
  toast(t("Steuerübersicht erstellt 📄"));
}

/* ---------------- Die Vorschläge sammeln ---------------- */
function vorschlaege(){
  var v=[];

  /* 1 – Kündigungsfristen */
  if(smartAn("fristen")){
    CONTRACTS.forEach(function(c){
      if(c.status!=="aktiv")return;
      var f=fristInfo(c);
      if(f.days==null||f.days>45)return;
      var a=artInfo(c.art||"sonstiges");
      v.push({key:"frist:"+c.id+":"+f.lastDay,art:f.days<=14?"bad":"warn",icon:"clock",
        titel:tn(f.days,"{0} ist nur noch {1} Tag kündbar","{0} ist nur noch {1} Tage kündbar",c.anbieter||a.label,f.days),
        text:tf("Letzter Kündigungstag: {0}",fmtDate(f.lastDay)),
        knopf:t("Ansehen"),href:"#/vertrag?id="+c.id});
    });
    /* Fristdaten fehlen → kann nicht überwacht werden */
    CONTRACTS.forEach(function(c){
      if(c.status!=="aktiv")return;
      if(fristInfo(c).kind!=="unbekannt")return;
      var a=artInfo(c.art||"sonstiges");
      v.push({key:"fristlos:"+c.id,art:"info",icon:"alert",
        titel:tf("{0}: Fristen unbekannt",c.anbieter||a.label),
        text:t("Vertragsbeginn und Mindestlaufzeit fehlen – ohne sie kann All-Home nicht warnen."),
        knopf:t("Ergänzen"),aktion:"v-edit",id:c.id});
    });
  }

  /* 2 – Vollständigkeits-Check: angehakte Arten ohne Vertrag + Übliches nicht angehakt */
  if(smartAn("luecken")){
    var leer=aktiveArten().filter(function(k){
      var a=artInfo(k);
      return !spiegelArt(k)&&!vertraegeDerArt(k).length;
    });
    if(leer.length){
      v.push({key:"leer:"+leer.length,art:"info",icon:"folder",
        titel:tn(leer.length,"{0} angehakte Art ist noch leer","{0} angehakte Arten sind noch leer"),
        text:leer.slice(0,4).map(function(k){return artInfo(k).label;}).join(", ")+(leer.length>4?" …":""),
        knopf:t("Verträge"),href:"#/vertraege"});
    }
    var fehltUeblich=standardArten().filter(function(k){return !artAktiv(k);});
    if(fehltUeblich.length){
      v.push({key:"ueblich:"+fehltUeblich.join(","),art:"info",icon:"sparkles",
        titel:t("Fast jeder Haushalt hat das"),
        text:fehltUeblich.map(function(k){return artInfo(k).label;}).join(", ")+" – "+t("bei dir nicht angehakt."),
        knopf:t("Prüfen"),href:"#/einrichten"});
    }
  }

  /* 3 – Preiserhöhung → Sonderkündigungsrecht (14 Tage ab Dokumentdatum sichtbar) */
  if(smartAn("preis")){
    DOCS.forEach(function(d){
      if(d.doc_type!=="preisaenderung")return;
      var c=d.contract_id?vertragById(d.contract_id):null;
      var dt=d.doc_date||String(d.created_at||"").slice(0,10);
      var alter=dt?-daysUntil(dt):999;
      if(alter>90)return;                      /* älter als 3 Monate: nicht mehr aktuell */
      v.push({key:"preis:"+d.id,art:"warn",icon:"alert",
        titel:t("Preiserhöhung erkannt"),
        text:(c?(c.anbieter||"")+" · ":"")+tf("Schreiben vom {0}. Bei einer Erhöhung hast du meist ein Sonderkündigungsrecht – oft nur bis zum Wirksamwerden.",fmtDate(dt)),
        knopf:c?t("Zum Vertrag"):t("Dokument"),
        href:c?("#/vertrag?id="+c.id):null,aktion:c?null:"d-open",id:c?null:d.id});
    });
  }

  /* 4 – Pflichttermine (HU/TÜV, Ausweise, Wartung) */
  if(smartAn("termine")){
    CONTRACTS.forEach(function(c){
      var a=artInfo(c.art||"sonstiges");
      if(!a.termin||!c.details||!c.details[a.termin.k])return;
      var d=daysUntil(c.details[a.termin.k]);
      if(d==null||d>60)return;
      v.push({key:"termin:"+c.id+":"+c.details[a.termin.k],art:d<=14?"bad":"warn",icon:"calendar",
        titel:a.icon+" "+t(a.termin.l)+": "+tageTxt(d),
        text:(c.anbieter||a.label)+" · "+fmtDate(c.details[a.termin.k]),
        knopf:t("Ansehen"),href:"#/vertrag?id="+c.id});
    });
  }

  /* 5 – Kosten & Wechsel: größter Posten ohne Recherche */
  if(smartAn("kosten")){
    var teuerste=null;
    aktiveArten().forEach(function(k){
      var a=artInfo(k);
      if(spiegelArt(k))return;                 /* Energie läuft über AllTrack */
      vertraegeDerArt(k).forEach(function(c){
        if(c.status!=="aktiv")return;
        var m=monatskosten(c);
        if(m<=0)return;
        if(!teuerste||m>teuerste.m)teuerste={m:m,c:c,a:a};
      });
    });
    if(teuerste&&teuerste.m>=15&&!teuerste.c.recherche){
      v.push({key:"wechsel:"+teuerste.c.id,art:"info",icon:"euro",
        titel:tf("{0} kostet {1} im Monat",teuerste.c.anbieter||teuerste.a.label,eur(teuerste.m)),
        text:t("Das ist dein größter Posten. Lohnt ein Vergleich?"),
        knopf:t("Markt prüfen"),aktion:"recherche",id:teuerste.c.id});
    }
  }

  /* 6 – Doppelt versichert */
  if(smartAn("doppelt")){
    Object.keys(ARTEN).forEach(function(k){
      if(!ARTEN[k].einzig)return;
      var aktiv=vertraegeDerArt(k).filter(function(c){return c.status==="aktiv";});
      if(aktiv.length<2)return;
      var a=artInfo(k);
      v.push({key:"doppelt:"+k+":"+aktiv.length,art:"bad",icon:"alert",
        titel:tf("Zwei Verträge für {0}",a.label),
        text:aktiv.map(function(c){return c.anbieter||"?";}).join(" · ")+" – "+t("meist zahlt man einen davon umsonst."),
        knopf:t("Ansehen"),href:"#/art?k="+k});
    });
  }

  /* 7 – Dokumenten-Lücken */
  if(smartAn("dokumente")){
    var ohne=CONTRACTS.filter(function(c){
      if(c.status!=="aktiv")return false;
      return !DOCS.some(function(d){return d.contract_id===c.id;});
    });
    if(ohne.length){
      v.push({key:"dok:"+ohne.length,art:"info",icon:"doc",
        titel:tn(ohne.length,"{0} Vertrag ohne Unterlagen","{0} Verträge ohne Unterlagen"),
        text:ohne.slice(0,3).map(function(c){return c.anbieter||artInfo(c.art).label;}).join(", ")+(ohne.length>3?" …":""),
        knopf:t("Verträge"),href:"#/vertraege"});
    }
    /* Dokumente, die keinem Vertrag zugeordnet sind */
    var frei=DOCS.filter(function(d){return !istMed(d)&&!d.contract_id&&!d.ki_pending;});
    if(frei.length){
      v.push({key:"frei:"+frei.length,art:"info",icon:"link",
        titel:tn(frei.length,"{0} Dokument ohne Vertrag","{0} Dokumente ohne Vertrag"),
        text:t("Zuordnen hilft dem Archiv und den Fristen."),
        knopf:t("Ansehen"),href:"#/ablage"});
    }
    /* Noch nicht ausgelesen (Guthaben war leer) */
    var offen=DOCS.filter(function(d){return d.ki_pending;});
    if(offen.length){
      v.push({key:"kipend:"+offen.length,art:"warn",icon:"refresh",
        titel:tn(offen.length,"{0} Dokument wartet auf die KI","{0} Dokumente warten auf die KI"),
        text:t("Das Guthaben war leer – jetzt nachholen?"),
        knopf:t("Nachholen"),aktion:"d-reanalyze",id:offen[0].id});
    }
  }

  return v.filter(function(x){return !istWeg(x.key);});
}

/* ---------------- Markt-Recherche am Vertrag ---------------- */
var rechBusy=false;
async function rechercheVertrag(id){
  var c=vertragById(id);if(!c||rechBusy)return;
  if(!c.anbieter){toast(t("Bitte zuerst einen Anbieter eintragen."),true);return;}
  rechBusy=true;
  openModal('<h2 class="mhead">'+ic("globe")+' '+t("Markt prüfen")+'</h2>'+
    '<div class="abrbusy"><span class="spin"></span><span>'+
    tf("All-Home recherchiert öffentliche Angaben zu „{0}“ … das kann eine Minute dauern.",esc(c.anbieter))+'</span></div>');
  try{
    var b=await edgeRuf(EDGE_RESEARCH,{anbieter:c.anbieter,produkt:c.produkt||null,
      kategorie:artInfo(c.art||"sonstiges").label,kosten:c.kosten,
      kostenIntervall:c.kosten_intervall||null,vertragsstart:c.vertragsstart||null,
      model:kiStufe(),lang:curLang});
    if(!b.recherche)throw new Error(t("Keine Antwort erhalten."));
    var r=await sb.from("contracts").update({recherche:b.recherche,recherche_am:new Date().toISOString(),ai_lang:curLang}).eq("id",id);
    if(r.error)throw r.error;
    closeModal(true);await ladeDaten();go("#/vertrag?id="+id);
    toast(t("Recherche fertig ✅"));
  }catch(e){
    closeModal(true);
    if(e&&e.code==="ki_guthaben")toast(t("Das KI-Guthaben ist aufgebraucht – bitte später erneut."),true);
    else toast(t("Recherche fehlgeschlagen")+": "+errMsg(e),true);
  }finally{rechBusy=false;}
}
/* Recherche-Karte im Vertragsdetail */
function rechercheKarte(c){
  var rc=c.recherche;
  if(!rc)return "";
  if(curLang!==aiLangOf(c)){
    var box=c.i18n&&c.i18n[curLang];
    if(box&&box.recherche)rc=box.recherche;
  }
  var td=rc.tarifdetails||{};
  var spar=null;
  if(td.kosten!=null&&c.kosten!=null){
    var m1=INTERVALL[c.kosten_intervall]||1,m2=INTERVALL[td.kostenIntervall||c.kosten_intervall]||1;
    var mein=Number(c.kosten)/m1,markt=Number(td.kosten)/m2;
    /* Größenordnung prüfen, sonst Fehlalarm bei Jahr-gegen-Monat */
    if(markt>0&&mein>0&&markt<mein&&markt>mein*0.3)spar=(mein-markt)*12;
  }
  return '<div class="sect">'+t("Markt-Recherche")+'</div><section class="card">'+
    '<p class="hint" style="margin:0 0 10px">'+tf("Stand {0}",fmtDate(String(c.recherche_am||"").slice(0,10)))+
      ' · '+t("öffentliche Angaben – können von deinem Vertrag abweichen.")+'</p>'+
    (spar?'<div class="sug good"><span class="si">'+ic("euro")+'</span><div class="sb2">'+
      '<div class="st">'+tf("Bis zu {0} im Jahr günstiger",eur0(spar))+'</div>'+
      '<div class="sx">'+t("laut Recherche – lohnt ein genauer Blick.")+'</div></div></div>':"")+
    (rc.zusammenfassung?'<p style="margin-top:10px">'+esc(String(rc.zusammenfassung))+'</p>':"")+
    ((Array.isArray(rc.leistungen)&&rc.leistungen.length)
      ?'<ul class="hint" style="padding-left:20px">'+rc.leistungen.map(function(l){return '<li>'+esc(String(l))+'</li>';}).join("")+'</ul>':"")+
    (rc.hinweise?'<div class="sug info"><span class="si">'+ic("info")+'</span><div class="sb2"><div class="sx">'+esc(String(rc.hinweise))+'</div></div></div>':"")+
    ((Array.isArray(rc.quellen)&&rc.quellen.length)
      ?'<p class="hint" style="margin-top:10px">'+t("Quellen")+': '+rc.quellen.slice(0,5).map(function(q){
         var u=String((q&&q.url)||""),ti=String((q&&q.titel)||u||t("Quelle"));
         return /^https?:\/\//i.test(u)?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(ti)+'</a>':esc(ti);
       }).join(" · ")+'</p>':"")+
    '<div class="factions" style="margin-top:12px"><button class="btn ghost" data-a="recherche" data-id="'+c.id+'">'+ic("refresh")+' '+t("Neu recherchieren")+'</button></div>'+
  '</section>';
}

/* ================= Häuser & Mitglieder =================
   Mehrere Häuser (Adressen) je Konto, Mitglieder mit Rollen.
   Grundsatz: Solange ein Haus Mitglieder hat, hat es einen Admin – das
   erzwingt die Datenbank (Trigger admin_pflicht); hier wird es nur freundlich
   erklärt, bevor jemand dagegenläuft. Haushalte teilt All-Home mit AllTrack. */
var ROLLEN=[];     /* public.household_members meiner Häuser: household_id, user_id, is_admin */
var MITGL={};      /* hid → Liste aus household_members_info (mit E-Mail) */
var hhBusy=false;

async function ladeRollen(){
  try{
    var r=await sbPub.from("household_members").select("household_id,user_id,is_admin");
    ROLLEN=(r&&!r.error&&r.data)?r.data:[];
  }catch(e){ROLLEN=[];}
}
function ichAdmin(hid){
  return !!me&&ROLLEN.some(function(r){return r.household_id===hid&&r.user_id===me.id&&r.is_admin;});
}
function mitgliederZahl(hid){return ROLLEN.filter(function(r){return r.household_id===hid;}).length;}
function adminZahl(hid){return ROLLEN.filter(function(r){return r.household_id===hid&&r.is_admin;}).length;}
/* Hausliste neu laden. Ändert sich dabei das aktive Haus (z. B. weil es
   gelöscht wurde), werden dessen Daten nachgeladen – sonst stünden die alten da. */
async function haeuserNeuLaden(){
  var vorher=HH?HH.id:null;
  await ladeHaushalte();await ladeRollen();
  if((HH?HH.id:null)!==vorher){
    LADEFEHLER=null;setupWahl=null;
    try{await ladeSetup();await ladeDaten();await ladeEnergie();}
    catch(e){LADEFEHLER=errMsg(e);}
  }
}
function hausById(id){return HOUSEHOLDS.filter(function(h){return h.id===id;})[0]||null;}

async function ladeMitglieder(hid){
  var r=await sbPub.rpc("household_members_info",{p_household_id:hid});
  if(r&&r.error)throw r.error;
  MITGL[hid]=(r&&r.data)||[];
  return MITGL[hid];
}
/* Fehlercodes der Datenbank in verständliche Sätze übersetzen */
function hausFehler(e){
  var m=errMsg(e);
  if(/last_admin/.test(m))return t("Es muss immer mindestens einen Admin geben. Ernenne zuerst jemand anderen zum Admin.");
  if(/last_household/.test(m))return t("Das ist dein einziger Haushalt. Lege zuerst einen weiteren an.");
  if(/not_admin/.test(m))return t("Dafür brauchst du Admin-Rechte in diesem Haus.");
  if(/cannot_remove_self/.test(m))return t("Dich selbst nimmst du über „Haushalt verlassen“ heraus.");
  if(/invalid_or_expired/.test(m))return t("Der Code ist ungültig oder abgelaufen.");
  if(/not.a.member/.test(m))return t("Du bist kein Mitglied dieses Hauses.");
  return m;
}

/* ================= Fahrzeuge =================
   Bei KFZ-Versicherung, Fahrzeug, Leasing und KFZ-Steuer soll man auf einen
   Blick sehen, um welches Auto es geht: Kennzeichen als Schild, dazu Marke und
   Modell. Werte aus dem Fahrzeugschein (FIN, HSN/TSN) stehen in den Details. */
function istFahrzeugArt(k){return artFelder(k).some(function(f){return f.k==="kennzeichen";});}
/* Kennzeichen vereinheitlichen: Großbuchstaben, einfache Leerzeichen */
function kzNorm(s){return String(s||"").toUpperCase().replace(/\s+/g," ").replace(/\s*-\s*/g,"-").trim();}
function fahrzeugVon(c){
  if(!c||!istFahrzeugArt(c.art))return null;
  var d=c.details||{};
  var kz=kzNorm(d.kennzeichen),name=[d.marke,d.modell].filter(function(x){return x&&String(x).trim();}).join(" ");
  if(!kz&&!name)return null;
  return {kz:kz,name:name};
}
/* Kennzeichen als kleines Schild (EU-Streifen links) */
function kzHtml(kz,gross){
  if(!kz)return "";
  return '<span class="kz'+(gross?" gross":"")+'" title="'+esc(t("Kennzeichen"))+'"><span>'+esc(kz)+'</span></span>';
}
/* Eine Zeile „[FB-SK 1990] VW Golf" für Listen */
function fahrzeugZeile(c,gross){
  var f=fahrzeugVon(c);if(!f)return "";
  return '<span class="fzg">'+kzHtml(f.kz,gross)+(f.name?'<span class="fzn">'+esc(f.name)+'</span>':"")+'</span>';

var KI_DETAIL_KARTE={
  versichertesObjekt:"versichert",deckungsart:"deckungsart",deckungssumme:"deckungssumme",
  selbstbeteiligung:"selbstbeteiligung",schadenfreiheitsklasse:"sf_klasse",sfProzent:"sf_prozent",
  kennzeichen:"kennzeichen",marke:"marke",modell:"modell",fin:"fin",hsn:"hsn",tsn:"tsn",
  erstzulassung:"erstzulassung",huBis:"hu_bis",
  rufnummer:"rufnummer",datenvolumen:"datenvolumen",endgeraet:"endgeraet",
  geschwindigkeit:"geschwindigkeit",router:"router",
  zaehlernummer:"zaehlernummer",jahresverbrauch:"jahresverbrauch",arbeitspreis:"arbeitspreis",grundpreis:"grundpreis",
  aboStufe:"tarif_stufe",profile:"profile",zinssatz:"zinssatz",iban:"iban",
  objekt:"objekt",flaeche:"flaeche",nebenkosten:"nebenkosten",
  leistungsumfang:"leistungsumfang",mitgliedsnummer:"mitgliedsnummer"
};
function detailsAusExtrakt(ext,art){
  var roh=(ext&&ext.details)||{},erlaubt={},aus={};
  artFelder(art).forEach(function(f){erlaubt[f.k]=f;});
  Object.keys(roh).forEach(function(k){
    var feld=KI_DETAIL_KARTE[k]||k,v=roh[k];
    if(!erlaubt[feld]||v==null||v==="")return;
    var typ=erlaubt[feld].t;
    if(typ==="eur"||typ==="num"){v=numOrNull(v);if(v==null)return;}
    else if(typ==="date"){v=String(v).slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;}
    else v=String(v).trim();
    if(feld==="kennzeichen")v=kzNorm(v);
    if(feld==="fin"||feld==="hsn"||feld==="tsn")v=String(v).toUpperCase().replace(/\s+/g,"");
    aus[feld]=v;
  });
  return aus;
}

/* Trifft ein Suchwort den Anbieternamen? Liefert die Länge des besten Treffers (0 = keiner).
   Wörter zählen nur als ganze Wörter; „=new“ trifft nur genau „NEW“. */
function normName(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim();}
function musterTrifft(muster,name){
  var n=normName(name),best=0,B=/[a-z0-9äöüß]/;
  if(!n)return 0;
  String(muster||"").split(",").forEach(function(w){
    w=normName(w);if(!w)return;
    if(w.charAt(0)==="="){if(n===w.slice(1).trim())best=Math.max(best,w.length+100);return;}
    var i=n.indexOf(w);
    while(i>=0){
      var vor=i?n.charAt(i-1):"",nach=n.charAt(i+w.length);
      if(!B.test(vor)&&!B.test(nach)){best=Math.max(best,w.length);break;}
      i=n.indexOf(w,i+1);
    }
  });
  return best;
}
function logoEintragVon(name){
  var k=normName(name);if(!k)return null;
  if(k in LOGO_CACHE)return LOGO_CACHE[k];
  var best=null,bp=0;
  LOGO_REG.forEach(function(e){
    if(!e.aktiv)return;
    var p=musterTrifft(e.muster,k);
    if(p>bp){bp=p;best=e;}
  });
  LOGO_CACHE[k]=best;
  return best;
}

/* Hochgeladenes Bild auf 128×128 PNG bringen (einheitlich, klein, ohne Metadaten) */
function logoVerkleinern(file){
  return new Promise(function(ok,fehler){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var cv=document.createElement("canvas");cv.width=128;cv.height=128;
      var s=Math.min(128/img.naturalWidth,128/img.naturalHeight),w=img.naturalWidth*s,h=img.naturalHeight*s;
      cv.getContext("2d").drawImage(img,(128-w)/2,(128-h)/2,w,h);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){b?ok(b):fehler(new Error(t("Bild konnte nicht verarbeitet werden.")));},"image/png");
    };
    img.onerror=function(){URL.revokeObjectURL(url);fehler(new Error(t("Bildformat wird nicht unterstützt. Bitte PNG, JPG oder WebP.")));};
    img.src=url;
  });
}
async function logoDatei(file){
  if(!file)return;
  if(!/^image\/(png|jpeg|webp)$/.test(file.type)){toast(t("Bildformat wird nicht unterstützt. Bitte PNG, JPG oder WebP."),true);return;}
  if(file.size>5*1024*1024){toast(t("Das Bild ist zu groß (max. 5 MB)."),true);return;}
  try{
    var blob=await logoVerkleinern(file);
    var pfad="upload-"+pfadName(val("l_name")||"logo").toLowerCase()+"-"+Date.now()+".png";
    var up=await sb.storage.from(LOGO_BUCKET).upload(pfad,blob,{contentType:"image/png",upsert:false});
    if(up.error)throw up.error;
    logoVorschau(sb.storage.from(LOGO_BUCKET).getPublicUrl(pfad).data.publicUrl);
    toast(t("Bild übernommen")+" ✅");
  }catch(e){toast(t("Hochladen fehlgeschlagen")+": "+errMsg(e),true);}
}

async function logoLoeschen(id){

document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-a]");
  if(!b)return;
  var a=b.dataset.a,id=b.dataset.id;

  /* --- Rahmen --- */

  if(a==="theme-set"){applyTheme(b.dataset.d==="1");render();return;}
  if(a==="lang"){setzeSprache(b.dataset.l);return;}
  if(a==="modal-close"){closeModal();return;}
  if(a==="logout"){doLogout();return;}
  if(a==="suche"){sucheOeffnen();return;}
  if(a==="noop"){return;}
  if(a==="neu-laden"){LADEFEHLER=null;SETUP_FEHLER=null;starteSitzung();return;}

  /* --- Anmeldung --- */
  if(a==="signup"){doSignup();return;}
  if(a==="forgot"){doForgot();return;}

  /* --- Haushalt --- */
  if(a==="hh-switch"){haushaltWaehlen();return;}
  if(a==="hh-pick"){haushaltSetzen(b.dataset.id);return;}
  if(a==="ki-set"){setzeKiStufe(b.dataset.v);return;}

  if(a==="alltrack-set"){setzeAlltrack(b.dataset.v);return;}
  if(a==="logo-neu"){logoFormular(null,b.dataset.name||"");return;}
  if(a==="logo-edit"){logoFormular(id);return;}
  if(a==="logo-holen"){logoHolen();return;}
  if(a==="logo-datei"){var lf=$("#l_file");if(lf)lf.click();return;}
  if(a==="logo-del"){logoLoeschen(id);return;}
  if(a==="hh-neu"){hausFormular(null);return;}
  if(a==="hh-edit"){hausFormular(id);return;}
  if(a==="hh-join"){beitretenFormular();return;}
  if(a==="hh-invite"){einladen(id);return;}
  if(a==="hh-copy"){kopieren(b.dataset.text);return;}
  if(a==="hh-share"){teilen(b.dataset.text);return;}
  if(a==="hh-leave"){hausVerlassen(id);return;}
  if(a==="hh-del"){loeschenFormular(id);return;}
  if(a==="mg-menu"){mitgliedMenue(id,b.dataset.uid);return;}
  if(a==="mg-admin"){mitgliedAdmin(id,b.dataset.uid,b.dataset.v==="1");return;}
  if(a==="mg-remove"){mitgliedEntfernen(id,b.dataset.uid);return;}

  /* --- Einrichtung --- */
  if(a==="art-toggle"){
    var k=b.dataset.k;
    if(!setupWahl)setupWahl=aktiveArten().slice();
    var i=setupWahl.indexOf(k);
    if(i>=0)setupWahl.splice(i,1);else setupWahl.push(k);
    render();return;
  }
  if(a==="setup-save"){setupSpeichern();return;}

  /* --- Verträge --- */
  if(a==="v-neu"){oeffneForm(b.dataset.k,null,null);return;}
  if(a==="v-edit"){var c=vertragById(id);if(c)oeffneForm(c.art||"sonstiges",id,null);return;}
  if(a==="v-del"){loescheVertrag(id);return;}
  if(a==="v-kuendigen"){kuendigenBlatt(id);return;}
  if(a==="v-kuend-ok"){var zum=val("k_zum");closeModal(true);setzeStatus(id,"gekuendigt",zum);return;}
  if(a==="v-aktiv"){setzeStatus(id,"aktiv");return;}
  if(a==="ics"){icsExport(id);return;}

  /* --- Hochladen --- */
  if(a==="pick-cam"){var fc=$("#fCam");if(fc)fc.click();return;}
  if(a==="pick-file"){var fp=$("#fPick");if(fp)fp.click();return;}
  if(a==="imp-mehr"){IMPORT.ergebnisse=[];REVIEW=null;render();return;}

  /* --- Bestätigung nach dem Einlesen --- */
  if(a==="rv-link"){reviewZuordnen(id);return;}
  if(a==="rv-neu"){reviewNeuerVertrag(b.dataset.k);return;}
  if(a==="rv-archiv"){REVIEW=null;go("#/vertraege");return;}
  if(a==="rv-med-ok"){REVIEW=null;go("#/gesundheit");return;}

  /* --- Dokumente --- */
  if(a==="d-open"){dokumentOeffnen(id);return;}
  if(a==="d-view"){dokumentAnzeigen(id);return;}
  if(a==="d-del"){dokumentLoeschen(id);return;}

  if(a==="d-link-pick"){dokumentVerknuepfen(id,b.dataset.cid);return;}
  if(a==="d-reanalyze"){analyseNachholen(id);return;}

  /* --- Gesundheit --- */
  if(a==="med-open"){go("#/gesundheit?doc="+id);return;}
  if(a==="med-edit"){medFormular(id);return;}
  if(a==="med-explain"){medErklaeren(id);return;}

/* ---- Bestätigungs-Aktionen ---- */
async function reviewZuordnen(cid){
  if(!REVIEW)return;
  var docId=REVIEW.id;
  try{
    var r=await sb.from("documents").update({contract_id:cid}).eq("id",docId);
    if(r.error)throw r.error;
    /* Angaben aus dem Dokument am Vertrag nachtragen, wo sie fehlen */
    await ergaenzeAusDokument(cid,REVIEW.extracted||{});
    REVIEW=null;await ladeDaten();
    toast(t("Dokument zugeordnet ✅"));
    go("#/vertrag?id="+cid);
  }catch(e){toast(t("Zuordnen fehlgeschlagen")+": "+errMsg(e),true);}
}
/* Leere Vertragsfelder aus der KI-Auslesung füllen – nie überschreiben */
async function ergaenzeAusDokument(cid,ext){
  var c=vertragById(cid);if(!c||!ext)return;
  var karte=[
    ["kundennummer","kundennummer"],["vertragsnummer","vertragsnummer"],
    ["vertragsstart","vertragsstart"],["produkt","produkt"],
    ["mindestlaufzeit_monate","mindestlaufzeitMonate"],
    ["kuendigungsfrist_monate","kuendigungsfristMonate"],
    ["verlaengerung_monate","verlaengerungMonate"]
  ];
  var neu={},n=0;
  karte.forEach(function(p){
    var alt=c[p[0]],wert=ext[p[1]];
    if(wert==null||wert==="")return;
    if(alt!=null&&alt!=="")return;
    neu[p[0]]=wert;n++;
  });
  ["mindestlaufzeit_monate","verlaengerung_monate"].forEach(function(k){
    if(neu[k]!=null)neu[k]=Math.round(Number(neu[k]));
  });
  var vorher=c.details||{},dazu=detailsAusExtrakt(ext,c.art||"sonstiges"),det=Object.assign({},vorher),nd=0;
  Object.keys(dazu).forEach(function(k){if(vorher[k]==null||vorher[k]===""){det[k]=dazu[k];nd++;}});
  if(nd){neu.details=det;n++;}
  if(!n)return;
  try{await sb.from("contracts").update(neu).eq("id",cid);}catch(e){}
}
function reviewNeuerVertrag(art){
  if(!REVIEW)return;
  var ext=REVIEW.extracted||{};
  art=art||artAusExtrakt(ext);
  oeffneForm(art,null,{
    details:detailsAusExtrakt(ext,art),
    anbieter:ext.anbieter||"",produkt:ext.produkt||"",
    kundennummer:ext.kundennummer||"",vertragsnummer:ext.vertragsnummer||"",
    vertragsstart:ext.vertragsstart||"",
    mindestlaufzeitMonate:ext.mindestlaufzeitMonate,
    kuendigungsfristMonate:ext.kuendigungsfristMonate,
    verlaengerungMonate:ext.verlaengerungMonate,
    kosten:ext.kosten,kostenIntervall:ext.kostenIntervall||"monatlich",
    _docId:REVIEW.id
  });
  REVIEW=null;
}

/* ---- Suche über alles ---- */
function sucheOeffnen(){
  openModal('<h2 class="mhead">'+ic("search")+' '+t("Suchen")+'</h2>'+
    fld(t("Vertrag, Anbieter, Dokument"),inp("sq","","search",' placeholder="'+t("Suchbegriff")+'"'))+
    '<div id="sErg"><p class="hint">'+t("Tippe, um zu suchen.")+'</p></div>'+
    '<div class="factions"><button class="btn ghost full" data-a="modal-close">'+t("Schließen")+'</button></div>');
  var feld=$("#sq");if(feld){feld.focus();feld.addEventListener("input",sucheLaufen);}
}
function sucheLaufen(){
  var q=(val("sq")||"").toLowerCase(),box=$("#sErg");
  if(!box)return;
  if(q.length<2){box.innerHTML='<p class="hint">'+t("Tippe, um zu suchen.")+'</p>';return;}
  var vt=CONTRACTS.filter(function(c){
    var d=c.details||{};
    return ((c.anbieter||"")+" "+(c.produkt||"")+" "+(c.kundennummer||"")+" "+(c.vertragsnummer||"")+" "+artInfo(c.art).label+" "+
      [d.kennzeichen,d.marke,d.modell,d.fin,d.versnummer].filter(Boolean).join(" ")).toLowerCase().indexOf(q)>=0;
  }).slice(0,6);
  var dk=DOCS.filter(function(d){
    return ((d.titel||"")+" "+(d.filename||"")+" "+(d.zusammenfassung||"")+" "+(d.arzt||"")).toLowerCase().indexOf(q)>=0;
  }).slice(0,6);
  var html="";
  if(vt.length)html+='<div class="mgrp">'+t("Verträge")+'</div><div class="dlist">'+vt.map(function(c){
    var a=artInfo(c.art||"sonstiges");
    return '<a class="drow3" href="#/vertrag?id='+c.id+'" data-a="modal-close">'+
      anbieterKachel(c.anbieter,a.icon,"di",18)+'<span class="db"><span class="dn">'+esc(c.anbieter||a.label)+'</span>'+
      '<span class="dm"><span>'+esc(a.label)+'</span></span></span></a>';
  }).join("")+'</div>';
  if(dk.length)html+='<div class="mgrp">'+t("Dokumente")+'</div><div class="dlist">'+dk.map(function(d){
    var ty=istMed(d)?medTypInfo(d.med_typ):dtInfo(d.doc_type);
    return '<button class="drow3" data-a="d-open" data-id="'+d.id+'">'+
      '<span class="di">'+ty.icon+'</span><span class="db"><span class="dn">'+esc(docTitel(d))+'</span>'+
      '<span class="dm"><span>'+ty.label+'</span><span>'+fmtDate(docDatum(d))+'</span></span></span></button>';
  }).join("")+'</div>';
  box.innerHTML=html||('<p class="hint">'+tf("Nichts gefunden für „{0}“.",esc(q))+'</p>');
}

var setupBusy=false;
async function setupSpeichern(){
  if(setupBusy)return;
  if(!setupWahl||!setupWahl.length){toast(t("Hake mindestens eine Art an."),true);return;}
  /* Sichtbar arbeiten: der Aufruf dauert einen Moment, und ein Knopf, bei dem
     nichts passiert, sieht aus wie ein Fehler. */
  setupBusy=true;
  var knopf=document.querySelector('[data-a="setup-save"]');
  if(knopf){knopf.disabled=true;knopf.textContent=t("Wird gespeichert …");}
  try{
    await speichereSetup(setupWahl.slice(),true);
    setupWahl=null;
    toast(t("Gespeichert")+" ✅");
    go("#/vertraege");
  }catch(e){
    /* Der Grund bleibt stehen, bis er gelesen wurde – nicht nur als Kurzmeldung. */
    SETUP_FEHLER=errMsg(e);
    toast(t("Speichern fehlgeschlagen")+": "+errMsg(e),true);
    render();
  }finally{setupBusy=false;}
}
/* ================= Start der App ================= */
async function boot(){
  if(/type=recovery/i.test(location.hash)||/[?&]type=recovery/i.test(location.search))AUTH_MODE="reset";
  sb.auth.onAuthStateChange(function(ereignis,sitzung){
    if(ereignis==="PASSWORD_RECOVERY"){AUTH_MODE="reset";me=null;booting=false;render();return;}
    var neuerUser=(sitzung&&sitzung.user)||null;
    var wechsel=(neuerUser&&neuerUser.id)!==(me&&me.id);
    me=neuerUser;
    if(!me){booting=false;render();return;}
    if(wechsel)starteSitzung();
  });
  try{
    var s=await sb.auth.getSession();
    me=(s&&s.data&&s.data.session&&s.data.session.user)||null;
  }catch(e){me=null;}
  if(AUTH_MODE==="reset"){booting=false;render();return;}
  if(me)await starteSitzung();
  else{booting=false;render();}
}
async function starteSitzung(){
  booting=true;render();
  try{await ladeAlles();}
  catch(e){LADEFEHLER=errMsg(e);}
  booting=false;
  if(!location.hash)location.hash="#/start";
  render();
}
boot();
})();
