   Grundsatz: Solange ein Haus Mitglieder hat, hat es einen Admin – das
   erzwingt die Datenbank (Trigger admin_pflicht); hier wird es nur freundlich
   erklärt, bevor jemand dagegenläuft. Haushalte teilt All-Home mit AllTrack. */
var ROLLEN=[];     /* public.household_members meiner Häuser: household_id, user_id, is_admin */
var MITGL={};      /* hid → Liste aus household_members_info (mit E-Mail) */
var hhBusy=false;

async function ladeRollen(){
  try{
    var r=await sbPub.from("household_members").select("household_id,user_id,is_admin");
    ROLLEN=(r&&!r.error&&r.data)?r.data:[];
  }catch(e){ROLLEN=[];}
}
function ichAdmin(hid){
  return !!me&&ROLLEN.some(function(r){return r.household_id===hid&&r.user_id===me.id&&r.is_admin;});
}
function mitgliederZahl(hid){return ROLLEN.filter(function(r){return r.household_id===hid;}).length;}
function adminZahl(hid){return ROLLEN.filter(function(r){return r.household_id===hid&&r.is_admin;}).length;}
/* Hausliste neu laden. Ändert sich dabei das aktive Haus (z. B. weil es
   gelöscht wurde), werden dessen Daten nachgeladen – sonst stünden die alten da. */
async function haeuserNeuLaden(){
  var vorher=HH?HH.id:null;
  await ladeHaushalte();await ladeRollen();
  if((HH?HH.id:null)!==vorher){
    LADEFEHLER=null;setupWahl=null;
    try{await ladeSetup();await ladeDaten();await ladeEnergie();}
    catch(e){LADEFEHLER=errMsg(e);}
  }
}
function hausById(id){return HOUSEHOLDS.filter(function(h){return h.id===id;})[0]||null;}

async function ladeMitglieder(hid){
  var r=await sbPub.rpc("household_members_info",{p_household_id:hid});
  if(r&&r.error)throw r.error;
  MITGL[hid]=(r&&r.data)||[];
  return MITGL[hid];
}
/* Fehlercodes der Datenbank in verständliche Sätze übersetzen */
function hausFehler(e){
  var m=errMsg(e);
  if(/last_admin/.test(m))return t("Es muss immer mindestens einen Admin geben. Ernenne zuerst jemand anderen zum Admin.");
  if(/last_household/.test(m))return t("Das ist dein einziger Haushalt. Lege zuerst einen weiteren an.");
  if(/not_admin/.test(m))return t("Dafür brauchst du Admin-Rechte in diesem Haus.");
  if(/cannot_remove_self/.test(m))return t("Dich selbst nimmst du über „Haus verlassen“ heraus.");
  if(/invalid_or_expired/.test(m))return t("Der Code ist ungültig oder abgelaufen.");
  if(/not.a.member/.test(m))return t("Du bist kein Mitglied dieses Hauses.");
  return m;
}

async function dateienEntfernen(client,bucket,tabelle,hid,mitSeiten){
  var r=await client.from(tabelle).select(mitSeiten?"storage_path,weitere_seiten":"storage_path").eq("household_id",hid);
  if(r.error)throw r.error;
  var pfade=[];(r.data||[]).forEach(function(d){pfade.push(d.storage_path);(d.weitere_seiten||[]).forEach(function(p){pfade.push(p);});});
  pfade=pfade.filter(Boolean);
  for(var i=0;i<pfade.length;i+=100){
    var x=await client.storage.from(bucket).remove(pfade.slice(i,i+100));
    if(x&&x.error)throw x.error;
  }
  return pfade.length;
}
async function hausLoeschen(hid){
  var h=hausById(hid);if(!h)return;
  if(val("h_bestaetigen").trim()!==(h.name||"").trim()){

  var knopf=document.querySelector('[data-form="haus-loeschen"] button[type=submit]');
  if(knopf){knopf.disabled=true;knopf.textContent=t("Wird gelöscht …");}
  try{
    await dateienEntfernen(sb,BUCKET,"documents",hid,true);     /* All-Home (mit weiteren Seiten) */
    await dateienEntfernen(sbPub,"documents","documents",hid);  /* AllTrack */
    var r=await sbPub.rpc("delete_household",{p_household_id:hid});
    if(r.error)throw r.error;
    delete MITGL[hid];

    toast(t("Löschen fehlgeschlagen")+": "+hausFehler(e),true);
    if(knopf){knopf.disabled=false;knopf.innerHTML=ic("trash")+' '+t("Endgültig löschen");}
  }
  finally{hhBusy=false;}
}

/* ================= Fahrzeuge =================
   Bei KFZ-Versicherung, Fahrzeug, Leasing und KFZ-Steuer soll man auf einen
   Blick sehen, um welches Auto es geht: Kennzeichen als Schild, dazu Marke und
   Modell. Werte aus dem Fahrzeugschein (FIN, HSN/TSN) stehen in den Details. */
function istFahrzeugArt(k){return artFelder(k).some(function(f){return f.k==="kennzeichen";});}
/* Kennzeichen vereinheitlichen: Großbuchstaben, einfache Leerzeichen */
function kzNorm(s){return String(s||"").toUpperCase().replace(/\s+/g," ").replace(/\s*-\s*/g,"-").trim();}
function fahrzeugVon(c){
  if(!c||!istFahrzeugArt(c.art))return null;
  var d=c.details||{};
  var kz=kzNorm(d.kennzeichen),name=[d.marke,d.modell].filter(function(x){return x&&String(x).trim();}).join(" ");
  if(!kz&&!name)return null;
  return {kz:kz,name:name};
}
/* Kennzeichen als kleines Schild (EU-Streifen links) */
function kzHtml(kz,gross){
  if(!kz)return "";
  return '<span class="kz'+(gross?" gross":"")+'" title="'+esc(t("Kennzeichen"))+'"><span>'+esc(kz)+'</span></span>';
}
/* Eine Zeile „[FB-SK 1990] VW Golf" für Listen */
function fahrzeugZeile(c,gross){
  var f=fahrzeugVon(c);if(!f)return "";
  return '<span class="fzg">'+kzHtml(f.kz,gross)+(f.name?'<span class="fzn">'+esc(f.name)+'</span>':"")+'</span>';
}

/* KI-Schlüssel → Felder des Katalogs. Nur Felder, die die Art kennt, werden übernommen. */
var KI_DETAIL_KARTE={
  versichertesObjekt:"versichert",deckungsart:"deckungsart",deckungssumme:"deckungssumme",
  selbstbeteiligung:"selbstbeteiligung",schadenfreiheitsklasse:"sf_klasse",sfProzent:"sf_prozent",
  kennzeichen:"kennzeichen",marke:"marke",modell:"modell",fin:"fin",hsn:"hsn",tsn:"tsn",
  erstzulassung:"erstzulassung",huBis:"hu_bis",
  rufnummer:"rufnummer",datenvolumen:"datenvolumen",endgeraet:"endgeraet",
  geschwindigkeit:"geschwindigkeit",router:"router",
  zaehlernummer:"zaehlernummer",malo:"malo",maloId:"malo",marktlokation:"malo",jahresverbrauch:"jahresverbrauch",arbeitspreis:"arbeitspreis",grundpreis:"grundpreis",
  aboStufe:"tarif_stufe",profile:"profile",zinssatz:"zinssatz",iban:"iban",
  objekt:"objekt",flaeche:"flaeche",nebenkosten:"nebenkosten",
  leistungsumfang:"leistungsumfang",mitgliedsnummer:"mitgliedsnummer"
};
function detailsAusExtrakt(ext,art){
  var roh=(ext&&ext.details)||{},erlaubt={},aus={};
  artFelder(art).forEach(function(f){erlaubt[f.k]=f;});
  Object.keys(roh).forEach(function(k){
    var feld=KI_DETAIL_KARTE[k]||k,v=roh[k];
    if(!erlaubt[feld]||v==null||v==="")return;
    var typ=erlaubt[feld].t;
    if(typ==="eur"||typ==="num"){v=numOrNull(v);if(v==null)return;}
    else if(typ==="date"){v=String(v).slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;}
    else v=String(v).trim();
    if(feld==="kennzeichen")v=kzNorm(v);
    if(feld==="fin"||feld==="hsn"||feld==="tsn")v=String(v).toUpperCase().replace(/\s+/g,"");
    if(feld==="malo"){v=maloNorm(v);if(!v)return;}
    aus[feld]=v;
  });
  /* Ältere Auslesungen nennen manches nur in den Stichpunkten („Zählernummer: 6DME…“, „Arbeitspreis: 14,14 → 14,28 ct/kWh“) */
  Object.keys(erlaubt).forEach(function(k){
    if(aus[k]!=null)return;
    var v=detailAusStichpunkten(ext,k,erlaubt[k].t);if(v==null)return;
    if(k==="kennzeichen")v=kzNorm(v);
    if(k==="fin"||k==="hsn"||k==="tsn")v=String(v).toUpperCase().replace(/\s+/g,"");
    if(k==="malo"){v=maloNorm(v);if(!v)return;}
    aus[k]=v;
  });
  /* Ausweise: Inhaber ist die Person, für die das Dokument ausgestellt ist */
  if(erlaubt.inhaber&&!aus.inhaber&&ext&&ext.vertragspartner)aus.inhaber=String(ext.vertragspartner).trim().slice(0,80);
  return aus;
}
/* Stichpunkt „Bezeichnung: Wert“ → Feldwert. Bei „alt → neu“ gilt der neue Wert. Nur exakte Bezeichnungen (oder feste Synonyme). */
var FELD_SYNONYME={zaehlernummer:["Zähler-Nr","Zählernr","Zähler-Nummer"],
  malo:["MaLo","MaLo-Id","MaLo-Nr","Marktlokation","Marktlokations-ID","Marktlokations-Id","Marktlokationsnummer","Marktlokations-Identifikationsnummer","ID der Marktlokation"],rufnummer:["Telefonnummer","Mobilfunknummer"],
  kennzeichen:["Amtliches Kennzeichen"],fin:["FIN","Fahrgestellnummer","Fahrzeug-Identifizierungsnummer"],mitgliedsnummer:["Mitglieds-Nr"],
  deckungssumme:["Versicherungssumme"],tarif_stufe:["Tarif"]};
function detailAusStichpunkten(ext,k,typ){
  var liste=Array.isArray(ext&&ext.wichtig)?ext.wichtig:[];
  if(!liste.length||!FELDER[k]||typ==="date")return null;
  var namen=[FELDER[k].l].concat(FELD_SYNONYME[k]||[]).map(function(n){return artText(String(n).replace(/\s*\([^)]*\)\s*$/,"")).trim();});
  for(var i=0;i<liste.length;i++){
    var s=String(liste[i]||""),p=s.indexOf(":");if(p<1)continue;
    if(namen.indexOf(artText(s.slice(0,p)).trim())<0)continue;
    var w=s.slice(p+1);if(w.indexOf("→")>=0)w=w.slice(w.lastIndexOf("→")+1);
    w=w.replace(/\s*\([^)]*\)\s*$/,"").trim();if(!w)continue;
    if(typ==="num"||typ==="eur"){
      var m=w.match(/-?\d[\d.]*(?:,\d+)?/),n=m?numOrNull(m[0]):null;if(n==null)continue;
      if(k==="arbeitspreis"&&/€|eur/i.test(w)&&!/ct|cent/i.test(w))n=Math.round(n*100000)/1000;   /* €/kWh → ct/kWh */
      return n;
    }
    return w.slice(0,80);
  }
  return null;
}
/* Plausibilität der Fahrzeugnummern: warnen, nie blockieren */
function fahrzeugWarnungen(det){
  var w=[];
  if(det.fin&&!/^[A-HJ-NPR-Z0-9]{17}$/.test(det.fin))w.push(t("Die FIN hat normalerweise 17 Zeichen (ohne I, O, Q)."));
  if(det.hsn&&!/^\d{4}$/.test(det.hsn))w.push(t("Die HSN (zu 2.1) besteht aus 4 Ziffern."));
  if(det.tsn&&!/^[A-Z0-9]{3,10}$/.test(det.tsn))w.push(t("Die TSN (zu 2.2) besteht aus Buchstaben und Ziffern – für die Versicherung zählen die ersten 3."));
  return w;
}

/* Trifft ein Suchwort den Anbieternamen? Liefert die Länge des besten Treffers (0 = keiner).
   Wörter zählen nur als ganze Wörter; „=new“ trifft nur genau „NEW“. */
function normName(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim();}
function musterTrifft(muster,name){
  var n=normName(name),best=0,B=/[a-z0-9äöüß]/;
  if(!n)return 0;
  String(muster||"").split(",").forEach(function(w){
    w=normName(w);if(!w)return;
    if(w.charAt(0)==="="){if(n===w.slice(1).trim())best=Math.max(best,w.length+100);return;}
    var i=n.indexOf(w);
    while(i>=0){
      var vor=i?n.charAt(i-1):"",nach=n.charAt(i+w.length);
      if(!B.test(vor)&&!B.test(nach)){best=Math.max(best,w.length);break;}
      i=n.indexOf(w,i+1);
    }
  });
  return best;
}
function logoEintragVon(name){
  var k=normName(name);if(!k)return null;
  if(k in LOGO_CACHE)return LOGO_CACHE[k];
  var best=null,bp=0;
  LOGO_REG.forEach(function(e){
    if(!e.aktiv)return;
    var p=musterTrifft(e.muster,k);
    if(p>bp){bp=p;best=e;}
  });
  LOGO_CACHE[k]=best;
  return best;
}

/* Hochgeladenes Bild auf 128×128 PNG bringen (einheitlich, klein, ohne Metadaten) */
function logoVerkleinern(file){
  return new Promise(function(ok,fehler){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var cv=document.createElement("canvas");cv.width=128;cv.height=128;
      var s=Math.min(128/img.naturalWidth,128/img.naturalHeight),w=img.naturalWidth*s,h=img.naturalHeight*s;
      cv.getContext("2d").drawImage(img,(128-w)/2,(128-h)/2,w,h);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){b?ok(b):fehler(new Error(t("Bild konnte nicht verarbeitet werden.")));},"image/png");
    };
    img.onerror=function(){URL.revokeObjectURL(url);fehler(new Error(t("Bildformat wird nicht unterstützt. Bitte PNG, JPG oder WebP.")));};
    img.src=url;
  });
}
async function logoDatei(file){
  if(!file)return;
  if(!/^image\/(png|jpeg|webp)$/.test(file.type)){toast(t("Bildformat wird nicht unterstützt. Bitte PNG, JPG oder WebP."),true);return;}
  if(file.size>5*1024*1024){toast(t("Das Bild ist zu groß (max. 5 MB)."),true);return;}
  try{
    var blob=await logoVerkleinern(file);
    var pfad="upload-"+pfadName(val("l_name")||"logo").toLowerCase()+"-"+Date.now()+".png";
    var up=await sb.storage.from(LOGO_BUCKET).upload(pfad,blob,{contentType:"image/png",upsert:false});

  if(!KI_KOSTEN||KI_KOSTEN.hh!==hh)KI_KOSTEN={hh:hh,zeilen:null,fehler:null};

/* ================= Scanner: Bildkern =================
   Reine Rechenfunktionen auf Bildpuffern {w,h,d} (d = RGBA, Uint8ClampedArray) –
   ohne DOM, damit sie sich auch außerhalb des Browsers prüfen lassen.
   Ablauf: Kanten (Canny, farbig) → Geraden (Hough) → bestes Viereck → Ecken
   verfeinern → entzerren (Homographie) → Filter → JPEG (Browser) → PDF. */
var SCAN_DPI=200,SCAN_A4_LANG=2339;         /* A4 bei 200 dpi: 1654 × 2339 Pixel */

function sbBild(w,h){return {w:w,h:h,d:new Uint8ClampedArray(w*h*4)};}
/* Verkleinern über Flächenmittel (für die Erkennung; im Browser macht es die Leinwand) */
function sbSkalieren(img,nw,nh){
  var o=sbBild(nw,nh),sx=img.w/nw,sy=img.h/nh,s=img.d,d=o.d;
  for(var y=0;y<nh;y++){
    var y0=Math.floor(y*sy),y1=Math.max(y0+1,Math.floor((y+1)*sy));
    for(var x=0;x<nw;x++){
      var x0=Math.floor(x*sx),x1=Math.max(x0+1,Math.floor((x+1)*sx)),r=0,g=0,b=0,n=0;
      for(var yy=y0;yy<y1;yy++)for(var xx=x0;xx<x1;xx++){var i=(yy*img.w+xx)*4;r+=s[i];g+=s[i+1];b+=s[i+2];n++;}
      var j=(y*nw+x)*4;d[j]=r/n;d[j+1]=g/n;d[j+2]=b/n;d[j+3]=255;
    }
  }
  return o;
}
function sbLum(img){
  var n=img.w*img.h,L=new Float32Array(n),d=img.d;
  for(var i=0,j=0;i<n;i++,j+=4)L[i]=0.299*d[j]+0.587*d[j+1]+0.114*d[j+2];
  return L;
}
/* Gauß 5×5 (1 4 6 4 1), getrennt in zwei Durchgänge */
function sbWeich(a,w,h){
  var tmp=new Float32Array(a.length),o=new Float32Array(a.length),x,y,i;
  for(y=0;y<h;y++){var r=y*w;for(x=0;x<w;x++){
    var x1=x>0?x-1:0,x2=x>1?x-2:0,x3=x<w-1?x+1:w-1,x4=x<w-2?x+2:w-1;
    tmp[r+x]=(a[r+x2]+4*a[r+x1]+6*a[r+x]+4*a[r+x3]+a[r+x4])/16;}}
  for(y=0;y<h;y++){var y1=y>0?y-1:0,y2=y>1?y-2:0,y3=y<h-1?y+1:h-1,y4=y<h-2?y+2:h-1;
    for(x=0;x<w;x++){i=y*w+x;o[i]=(tmp[y2*w+x]+4*tmp[y1*w+x]+6*tmp[i]+4*tmp[y3*w+x]+tmp[y4*w+x])/16;}}
  return o;
}

/* Glättung 3×3 (1 2 1) – reicht nach dem Verkleinern und kostet ein Drittel */
function sbWeich3(a,w,h){
  var tmp=new Float32Array(a.length),o=new Float32Array(a.length),x,y,r;
  for(y=0;y<h;y++){r=y*w;tmp[r]=(3*a[r]+a[r+1])/4;tmp[r+w-1]=(3*a[r+w-1]+a[r+w-2])/4;
    for(x=1;x<w-1;x++)tmp[r+x]=(a[r+x-1]+2*a[r+x]+a[r+x+1])/4;}
  for(x=0;x<w;x++){o[x]=(3*tmp[x]+tmp[x+w])/4;o[(h-1)*w+x]=(3*tmp[(h-1)*w+x]+tmp[(h-2)*w+x])/4;}
  for(y=1;y<h-1;y++){r=y*w;for(x=0;x<w;x++)o[r+x]=(tmp[r+x-w]+2*tmp[r+x]+tmp[r+x+w])/4;}
  return o;
}
/* ---- Kanten: Sobel je Farbkanal (der stärkste zählt), dünnen, Hysterese ----
   Farbig, weil helles Papier auf hellem Tisch oft nur im Farbton abweicht. */
function sbKanten(img){
  var w=img.w,h=img.h,n=w*h,d=img.d,k=[new Float32Array(n),new Float32Array(n),new Float32Array(n)],c,i;
  for(i=0;i<n;i++){k[0][i]=d[i*4];k[1][i]=d[i*4+1];k[2][i]=d[i*4+2];}
  for(c=0;c<3;c++)k[c]=sbWeich3(k[c],w,h);
  var mag=new Float32Array(n),gx=new Float32Array(n),gy=new Float32Array(n);
  var R=k[0],Gc=k[1],Bc=k[2];
  for(var y=1;y<h-1;y++)for(var x=1;x<w-1;x++){
    i=y*w+x;var a=i-w,z=i+w;
    var rx=(R[a+1]+2*R[i+1]+R[z+1])-(R[a-1]+2*R[i-1]+R[z-1]),ry=(R[z-1]+2*R[z]+R[z+1])-(R[a-1]+2*R[a]+R[a+1]);
    var hx=(Gc[a+1]+2*Gc[i+1]+Gc[z+1])-(Gc[a-1]+2*Gc[i-1]+Gc[z-1]),hy=(Gc[z-1]+2*Gc[z]+Gc[z+1])-(Gc[a-1]+2*Gc[a]+Gc[a+1]);
    var bx=(Bc[a+1]+2*Bc[i+1]+Bc[z+1])-(Bc[a-1]+2*Bc[i-1]+Bc[z-1]),by=(Bc[z-1]+2*Bc[z]+Bc[z+1])-(Bc[a-1]+2*Bc[a]+Bc[a+1]);
    var mr=rx*rx+ry*ry,mg=hx*hx+hy*hy,mb=bx*bx+by*by;
    if(mr>=mg&&mr>=mb){gx[i]=rx;gy[i]=ry;mag[i]=Math.sqrt(mr)/4;}
    else if(mg>=mb){gx[i]=hx;gy[i]=hy;mag[i]=Math.sqrt(mg)/4;}
    else{gx[i]=bx;gy[i]=by;mag[i]=Math.sqrt(mb)/4;}
  }
  /* dünnen: nur das Maximum quer zur Kante bleibt */
  var nms=new Float32Array(n),hist=new Uint32Array(256),cnt=0;
  for(y=1;y<h-1;y++)for(x=1;x<w-1;x++){
    i=y*w+x;var m0=mag[i];if(m0<2)continue;
    var ax=Math.abs(gx[i]),ay=Math.abs(gy[i]),q,o1,o2;
    q=ay<=ax*0.4142?0:(ax<=ay*0.4142?2:(gx[i]*gy[i]>0?1:3));
    if(q===0){o1=i-1;o2=i+1;}else if(q===2){o1=i-w;o2=i+w;}
    else if(q===1){o1=i+w+1;o2=i-w-1;}else{o1=i+w-1;o2=i-w+1;}
    if(m0>=mag[o1]&&m0>=mag[o2]){nms[i]=m0;hist[Math.min(255,m0|0)]++;cnt++;}
  }
  /* Schwellen am Rauschen messen, nicht an der Schrift: Text liefert die stärksten
     Kanten und würde die schwache Blattkante (helles Papier auf hellem Tisch) sonst
     unter die Schwelle drücken. Median aller Pixel ≈ Rauschpegel (die meisten sind flach). */
  var hoch=255,sum=0,med=0,alle=new Uint32Array(256);
  for(var b=255;b>=0;b--){sum+=hist[b];if(sum>=cnt*0.12){hoch=b;break;}}
  for(i=0;i<n;i++)alle[Math.min(255,mag[i]*4|0)]++;
  sum=0;for(b=0;b<256;b++){sum+=alle[b];if(sum>=n*0.5){med=b/4;break;}}
  hoch=Math.max(7,Math.min(hoch,4*med+8));var tief=hoch*0.5;
  var kante=new Uint8Array(n),stapel=[];
  for(i=0;i<n;i++)if(nms[i]>=hoch){kante[i]=1;stapel.push(i);}
  while(stapel.length){var p=stapel.pop(),px=p%w,py=(p-px)/w;
    for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
      var qx=px+dx,qy=py+dy;if(qx<0||qy<0||qx>=w||qy>=h)continue;
      var qi=qy*w+qx;if(!kante[qi]&&nms[qi]>=tief){kante[qi]=1;stapel.push(qi);}}}
  var ux=new Float32Array(n),uy=new Float32Array(n);
  for(i=0;i<n;i++)if(kante[i]){var gl=Math.sqrt(gx[i]*gx[i]+gy[i]*gy[i])||1;ux[i]=gx[i]/gl;uy[i]=gy[i]/gl;}
  return {w:w,h:h,kante:kante,mag:mag,gx:gx,gy:gy,ux:ux,uy:uy};
}

/* ---- Geraden: Hough, jeder Kantenpunkt stimmt nur nahe seiner Gradientenrichtung ab ---- */
function sbGeraden(K,maxN){
  var w=K.w,h=K.h,NT=180,D=Math.ceil(Math.sqrt(w*w+h*h)),NR=2*D+1;
  var acc=new Uint16Array(NT*NR),cs=new Float32Array(NT),sn=new Float32Array(NT),th;
  for(th=0;th<NT;th++){cs[th]=Math.cos(th*Math.PI/NT);sn[th]=Math.sin(th*Math.PI/NT);}
  var FEN=7;
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var i=y*w+x;if(!K.kante[i])continue;
    var a=Math.atan2(K.gy[i],K.gx[i]);if(a<0)a+=Math.PI;
    var t0=Math.round(a*NT/Math.PI);
    for(var dt=-FEN;dt<=FEN;dt++){
      th=((t0+dt)%NT+NT)%NT;
      var r=Math.round(x*cs[th]+y*sn[th])+D;acc[th*NR+r]++;
    }
  }
  /* Spitzen: lokale Maxima, dann Abstand halten (θ wickelt bei 180° mit ρ → −ρ) */
  var minV=Math.max(12,Math.round(Math.min(w,h)*0.12)),kand=[];
  for(th=0;th<NT;th++)for(var r2=1;r2<NR-1;r2++){
    var v=acc[th*NR+r2];if(v<minV)continue;
    var maxi=true;
    for(var u=-2;u<=2&&maxi;u++)for(var s=-2;s<=2;s++){
      if(!u&&!s)continue;var tt=th+u,rr=r2+s;
      if(tt<0){tt+=NT;rr=2*D-rr;}else if(tt>=NT){tt-=NT;rr=2*D-rr;}
      if(rr<0||rr>=NR)continue;
      var v2=acc[tt*NR+rr];if(v2>v||(v2===v&&(u<0||(u===0&&s<0)))){maxi=false;break;}
    }
    if(maxi)kand.push({t:th*Math.PI/NT,r:r2-D,v:v});
  }
  kand.sort(function(p,q){return q.v-p.v;});
  var aus=[];
  for(var k=0;k<kand.length&&aus.length<(maxN||24);k++){
    var L=kand[k],nah=false;
    for(var m=0;m<aus.length&&!nah;m++){
      var A=aus[m],dT=Math.abs(L.t-A.t),dR=Math.abs(L.r-A.r);
      if(dT>Math.PI/2){dT=Math.PI-dT;dR=Math.abs(L.r+A.r);}
      if(dT<5*Math.PI/180&&dR<Math.max(6,D*0.02))nah=true;
    }
    if(!nah)aus.push(L);
  }
  return aus;
}
function sbSchnitt(a,b){
  var c1=Math.cos(a.t),s1=Math.sin(a.t),c2=Math.cos(b.t),s2=Math.sin(b.t),det=c1*s2-s1*c2;
  if(Math.abs(det)<1e-6)return null;
  return [(a.r*s2-s1*b.r)/det,(c1*b.r-a.r*c2)/det];
}
/* Wo schneidet die Gerade die Bildmitte? (zum Ordnen oben/unten bzw. links/rechts) */
function sbLageY(L,x){var s=Math.sin(L.t);return Math.abs(s)<1e-6?null:(L.r-x*Math.cos(L.t))/s;}
function sbLageX(L,y){var c=Math.cos(L.t);return Math.abs(c)<1e-6?null:(L.r-y*Math.sin(L.t))/c;}

/* ---- Wie gut trägt eine Seite (p→q)? Kantenpunkte mit passender Richtung + Kontrast quer ---- */
function sbSeitenwert(K,img,L,p,q,mitte){
  var w=K.w,h=K.h,dx=q[0]-p[0],dy=q[1]-p[1],len=Math.sqrt(dx*dx+dy*dy);
  if(len<4)return {len:len,halt:0,kontrast:0,innen:0};
  var nx=-dy/len,ny=dx/len;
  /* Normale zeigt nach innen (zur Mitte des Vierecks) */
  var mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;
  if((mitte[0]-mx)*nx+(mitte[1]-my)*ny<0){nx=-nx;ny=-ny;}
  var n=Math.floor(len),treffer=0,gezaehlt=0,kon=0,kn=0,inn=0,d=img.d;
  for(var s=0;s<=n;s+=2){
    var x=p[0]+dx*s/n,y=p[1]+dy*s/n,xi=Math.round(x),yi=Math.round(y);
    if(xi<1||yi<1||xi>=w-1||yi>=h-1)continue;
    gezaehlt++;
    var gut=false;
    for(var oy=-1;oy<=1&&!gut;oy++)for(var ox=-1;ox<=1;ox++){
      var i=(yi+oy)*w+xi+ox;
      if(K.kante[i]&&Math.abs(K.ux[i]*nx+K.uy[i]*ny)>0.85){gut=true;break;}
    }
    if(gut)treffer++;
    if(s%4===0){
      var ax=Math.round(x+nx*4),ay=Math.round(y+ny*4),bx=Math.round(x-nx*4),by=Math.round(y-ny*4);
      if(ax>=0&&ay>=0&&ax<w&&ay<h&&bx>=0&&by>=0&&bx<w&&by<h){
        var ia=(ay*w+ax)*4,ib=(by*w+bx)*4;
        kon+=(Math.abs(d[ia]-d[ib])+Math.abs(d[ia+1]-d[ib+1])+Math.abs(d[ia+2]-d[ib+2]))/3;
        inn+=(d[ia]+d[ia+1]+d[ia+2])/3-(d[ib]+d[ib+1]+d[ib+2])/3;kn++;
      }
    }
  }
  return {len:len,halt:gezaehlt?treffer/gezaehlt:0,kontrast:kn?kon/kn:0,innen:kn?inn/kn:0};
}
/* Anteil papierartiger Punkte im Inneren (hell, wenig Farbe) */
function sbPapieranteil(img,E,ref){
  /* 9×9 Stichpunkte; einer zählt als Papier, wenn in seiner Umgebung (±2 Pixel) Papier ist – sonst
     entscheidet bei textreichen Seiten der Zufall, ob das Raster gerade eine Textzeile trifft (gemessen:
     ±17 % für dasselbe Blatt, das überstimmte die Kanten) */
  var n=0,ja=0,d=img.d,w=img.w,h=img.h;
  function papier(xi,yi){
    if(xi<0||yi<0||xi>=w||yi>=h)return false;
    var i=(yi*w+xi)*4,mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);
    /* Papier: hell und fast farblos – oder sehr hell und pastellfarben (gelber Durchschlag, rosa Formular) */
    return (mx>=ref*0.72&&(mx-mn)<=mx*0.28)||(mx>=ref*0.86&&(mx-mn)<=mx*0.45);
  }
  for(var a=1;a<10;a++)for(var b=1;b<10;b++){
    var u=a/10,v=b/10;
    var x=Math.round((1-u)*(1-v)*E[0][0]+u*(1-v)*E[1][0]+u*v*E[2][0]+(1-u)*v*E[3][0]);
    var y=Math.round((1-u)*(1-v)*E[0][1]+u*(1-v)*E[1][1]+u*v*E[2][1]+(1-u)*v*E[3][1]);
    if(x<0||y<0||x>=w||y>=h)continue;n++;
    if(papier(x,y)||papier(x,y-2)||papier(x,y+2)||papier(x-2,y)||papier(x+2,y))ja++;
  }
  return n?ja/n:0;
}
function sbFlaeche(E){var a=0;for(var i=0;i<4;i++){var p=E[i],q=E[(i+1)%4];a+=p[0]*q[1]-q[0]*p[1];}return Math.abs(a)/2;}
function sbKonvex(E){
  var vz=0;
  for(var i=0;i<4;i++){
    var a=E[i],b=E[(i+1)%4],c=E[(i+2)%4];
    var z=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);

/* ---- Bestes Viereck im (kleinen) Bild. Ecken im Uhrzeigersinn ab oben links. ---- */

      var xa=sbLageX(V[b1],h/2),xb=sbLageX(V[b2],h/2);if(xa==null||xb==null||Math.abs(xa-xb)<w*0.12)continue;

      for(var s=0;s<4;s++){

  best.guete=Math.min(1,best.wert/(2*(w+h)*0.9));   /* ~1 = umlaufend klare Kante über fast das ganze Bild */

/* ---- Ecken am größeren Bild nachschärfen: je Seite Kantenpunkte suchen, Gerade anpassen ---- */

    var fx=x-xi,fy=y-yi,i=yi*w+xi;return L[i]*(1-fx)*(1-fy)+L[i+1]*fx*(1-fy)+L[i+w]*(1-fx)*fy+L[i+w+1]*fx*fy;}

/* Gerade durch Punkte (Hauptachse), zweimal Ausreißer verwerfen. Rückgabe {px,py,dx,dy} */

    var gr=res.slice().sort(function(a,b){return a-b;})[Math.floor(n*0.7)]*2+0.75;

/* ---- Homographie: bildet die 4 Punkte src auf dst ab (3×3, h33 = 1) ---- */

/* ---- Wahres Seitenverhältnis aus der Perspektive (Zhang & He, Whiteboard-Scanning).

/* Zielgröße: höchstens A4 bei 200 dpi auf der langen Seite, nie größer als die Quelle */

/* ---- Papierfarbe je Bereich schätzen (Schatten, Farbstich) ----

}
/* Korn glätten, Kanten erhalten: weicht ein Pixel kaum vom 3×3-Mittel ab, gilt das Mittel
   (weich überblendet bis zur Schwelle). Schrift weicht stärker ab und bleibt scharf. */

  var x,y,i;
  for(i=0;i<w;i++){O[i]=G[i];O[(h-1)*w+i]=G[(h-1)*w+i];}
  for(y=1;y<h-1;y++){
    i=y*w;O[i]=G[i];O[i+w-1]=G[i+w-1];
    for(x=1,i=y*w+1;x<w-1;x++,i++){
      var v=G[i],m=(G[i-w-1]+G[i-w]+G[i-w+1]+G[i-1]+v+G[i+1]+G[i+w-1]+G[i+w]+G[i+w+1])/9;
      var a=1-Math.abs(v-m)/schwelle;O[i]=a>0?v+(m-v)*a:v;

/* ---- Filter: auto (Schatten weg, Papier weiß, Farben bleiben), grau, sw, original ---- */
function sbFilter(img,art){
  if(art==="original")return img;
  var w=img.w,h=img.h,d=img.d,P=sbPapierRaster(img),o=sbBild(w,h),od=o.d,n=w*h;
  var B=P.B,gw=P.gw,gh=P.gh,R=P.R,x,y,k,i,j;
  /* Papierfarbe für jede Spalte einer Zeile: erst zwischen den Blockzeilen, dann zwischen den Blockspalten */
  var zeile=new Float32Array(gw*3),bgR=new Float32Array(w),bgG=new Float32Array(w),bgB=new Float32Array(w);
  var gx0s=new Int32Array(w),fxs=new Float32Array(w);
  for(x=0;x<w;x++){var gxf=(x+0.5)/B-0.5;if(gxf<0)gxf=0;if(gxf>gw-1)gxf=gw-1;gx0s[x]=gxf|0;fxs[x]=gxf-(gxf|0);}
  function papierZeile(y){
    var gyf=(y+0.5)/B-0.5;if(gyf<0)gyf=0;if(gyf>gh-1)gyf=gh-1;
    var g0=gyf|0,g1=Math.min(gh-1,g0+1),fy=gyf-g0;
    for(k=0;k<gw*3;k++)zeile[k]=R[g0*gw*3+k]*(1-fy)+R[g1*gw*3+k]*fy;
    for(x=0;x<w;x++){
      var c0=gx0s[x]*3,c1=Math.min(gw-1,gx0s[x]+1)*3,fx=fxs[x];
      bgR[x]=Math.max(24,zeile[c0]*(1-fx)+zeile[c1]*fx);
      bgG[x]=Math.max(24,zeile[c0+1]*(1-fx)+zeile[c1+1]*fx);
      bgB[x]=Math.max(24,zeile[c0+2]*(1-fx)+zeile[c1+2]*fx);
    }
  }

     ein großes farbiges Logo selbst zum „Schwarz“ und säuft ab (gemessen: Magenta → 6,6,6) */
  var hist=new Uint32Array(256),tot=0;
  for(y=1;y<h;y+=4){papierZeile(y);for(x=1;x<w;x+=4){j=(y*w+x)*4;
    var qr=d[j]/bgR[x],qg=d[j+1]/bgG[x],qb=d[j+2]/bgB[x],mx=Math.max(qr,qg,qb),mn=Math.min(qr,qg,qb);

  var LUT=new Float32Array(1201),hoch=0.93,sw=art==="sw",grau=art==="grau";
  for(k=0;k<=1200;k++){var v=k/1000,t2=(v-tief)/(hoch-tief);t2=t2<0?0:t2>1?1:t2;LUT[k]=Math.pow(t2,1.18)*255;}

  var G=new Float32Array(n),Y=new Float32Array(n);

    papierZeile(y);
    for(x=0,i=y*w;x<w;x++,i++){j=i*4;
      var gv=(0.299*d[j]/bgR[x]+0.587*d[j+1]/bgG[x]+0.114*d[j+2]/bgB[x])*1000;G[i]=gv>1200?1200:gv;}
  }
  /* b) Korn glätten, Kanten lassen (Ergebnis in Y) – die steile Kurve blasser Vorlagen
        machte aus dem Rauschen im Schatten sonst graue Punkte */
  sbGlaetten(G,Y,w,h,30);G=null;

  for(y=0;y<h;y++){

    for(x=0,i=y*w;x<w;x++,i++){

      if(nr>1200)nr=1200;if(ng>1200)ng=1200;if(nb>1200)nb=1200;

         (vorher je Kanal: Magenta-Logo wurde rötlich) */
      var yn=(0.299*nr+0.587*ng+0.114*nb)|0,ly=LUT[Y[i]|0],r,g,bl;
      if(grau){r=g=bl=ly;}
      else{
        r=ly+(nr-yn)*0.28;g=ly+(ng-yn)*0.28;bl=ly+(nb-yn)*0.28;   /* 0,28 = 255/1000 × 1,1: Farben leicht kräftiger */
        /* Kräftige Farben (Logo, Stempel, Foto) nur aufhellen wie das Papier, nicht wie Schrift abdunkeln */
        var cmx=nr>ng?(nr>nb?nr:nb):(ng>nb?ng:nb),cmn=nr<ng?(nr<nb?nr:nb):(ng<nb?ng:nb);
        var sat=cmx>0?(cmx-cmn)/cmx:0;
        if(sat>0.15){
          var f=sat>=0.45?1:(sat-0.15)/0.3,lin=255/(hoch*1000);

    }

  for(y=1;y<h-1;y++)for(x=1,i=y*w+1;x<w-1;x++,i++){
    var yv=Y[i];if(yv>=254.5)continue;
    var m=(Y[i-w-1]+Y[i-w]+Y[i-w+1]+Y[i-1]+yv+Y[i+1]+Y[i+w-1]+Y[i+w]+Y[i+w+1])/9;

    j=i*4;od[j]+=dl;od[j+1]+=dl;od[j+2]+=dl;
  }

}

/* ---- Unschärfe als mittlere Kantenbreite (Marziliano 2002): an jedem kräftigen Übergang
   Papier ↔ Schrift von der steilsten Stelle aus nach beiden Seiten laufen, bis die Helligkeit
   nicht mehr steigt bzw. fällt. Scharfe Schrift: rund 2 Pixel, deutlich unscharf: ab SB_UNSCHARF –
   gemessen bei 150 dpi (A4 = 1754 Pixel hoch). Nur Kanten quer zur Laufrichtung zählen
   (schräg angeschnittene sähen breiter aus); die breitere Richtung gilt. null = kein Urteil. ---- */
var SB_UNSCHARF=8.2;   /* geeicht in scan-test/pruef-schaerfe.js (σ ≈ 2 px bei 150 dpi) */
function sbKantenbreite(img){
  var w=img.w,h=img.h,L=sbLum(img);
  /* je Richtung getrennt: Verwackeln macht die Kanten nur in einer Richtung breit – oder löscht sie ganz */
  var sum=0,n=0,erg=[],anzahl=[];
  function linie(get,len,quer){
    for(var x=2;x<len-2;x++){
      var g=get(x+1)-get(x-1),ga=g<0?-g:g;if(ga<24)continue;
      if(ga<Math.abs(get(x+2)-get(x))||ga<Math.abs(get(x)-get(x-2)))continue;
      if(Math.abs(quer(x))*1.5>ga)continue;
      /* laufen, solange es noch nennenswert steigt (8 % der steilsten Stelle) – nicht in Lichtverläufe hinein */
      var sg=g>0?1:-1,a=x,b=x,min=Math.max(0.5,ga*0.04);
      while(a>0&&x-a<20&&(get(a)-get(a-1))*sg>min)a--;
      while(b<len-1&&b-x<20&&(get(b+1)-get(b))*sg>min)b++;
      if(Math.abs(get(b)-get(a))<30)continue;
      sum+=b-a;n++;
    }
  }
  for(var y=2;y<h-2;y+=2)(function(y){linie(function(q){return L[y*w+q];},w,function(q){return L[(y+1)*w+q]-L[(y-1)*w+q];});})(y);
  erg.push(n>100?sum/n:null);anzahl.push(n);sum=0;n=0;
  for(var x=2;x<w-2;x+=2)(function(x){linie(function(q){return L[q*w+x];},h,function(q){return L[q*w+x+1]-L[q*w+x-1];});})(x);

  if((erg[0]==null||erg[1]==null)&&Math.max(anzahl[0],anzahl[1])>400)return 20;
  return Math.max(erg[0]||0,erg[1]||0);
}
/* ---- Licht auf dem erkannten Blatt (kleines Live-Bild, Ecken 0…1):

    var x=(1-u)*(1-v)*E[0][0]+u*(1-v)*E[1][0]+u*v*E[2][0]+(1-u)*v*E[3][0];
    var y=(1-u)*(1-v)*E[0][1]+u*(1-v)*E[1][1]+u*v*E[2][1]+(1-u)*v*E[3][1];
    var xi=Math.round(x),yi=Math.round(y);if(xi<0||yi<0||xi>=w||yi>=h)continue;
    var i=(yi*w+xi)*4,mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);

  return {papier:p75,glanz:glanz,dunkel:p75<70,spiegelung:glanz>=0.004&&glanz<0.35&&p50<=240};

/* Helligkeit des ganzen Bildes (Mittel) – „zu dunkel“, auch wenn kein Blatt erkannt ist */
function sbMittelhell(img){var d=img.d,s=0,n=0;for(var i=0;i<d.length;i+=16){s+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];n++;}return n?s/n:0;}

/* Seitengröße in Punkt (1/72 Zoll): Hat die Seite A4- oder Scheckkarten-Format, gilt genau dieses

function sbSeitenMass(w,h){
  var r=w/h,A4=[595.28,841.89],KARTE=[242.65,153.07];

  if(Math.abs(r-KARTE[0]/KARTE[1])<0.012)return KARTE;
  if(Math.abs(r-KARTE[1]/KARTE[0])<0.006)return [KARTE[1],KARTE[0]];

/* ================= PDF schreiben =================
   Jede Seite ist ein JPEG-Bild (DCTDecode), Seitengröße aus den Pixeln bei 200 dpi.
   seiten: [{jpeg:Uint8Array, w, h}] → Uint8Array */
function sbPdf(seiten,titel){
  var teile=[],laenge=0,offs=[];
  function txt(s){var b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i)&255;return b;}
  function dazu(b){teile.push(b);laenge+=b.length;}
  function obj(nr,kopf,strom){
    offs[nr]=laenge;
    if(strom){dazu(txt(nr+" 0 obj\n"+kopf+"\nstream\n"));dazu(strom);dazu(txt("\nendstream\nendobj\n"));}
    else dazu(txt(nr+" 0 obj\n"+kopf+"\nendobj\n"));
  }
  /* Titel als UTF-16BE (Umlaute), hexadezimal */
  function hex16(s){var h="FEFF";for(var i=0;i<s.length;i++)h+=("0000"+s.charCodeAt(i).toString(16).toUpperCase()).slice(-4);return "<"+h+">";}
  dazu(txt("%PDF-1.4\n%âãÏÓ\n"));
  var n=seiten.length,kids=[];
  for(var i=0;i<n;i++)kids.push((4+i*3)+" 0 R");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>");
  var jetzt=new Date(),zs="D:"+jetzt.getUTCFullYear()+("0"+(jetzt.getUTCMonth()+1)).slice(-2)+("0"+jetzt.getUTCDate()).slice(-2)+
    ("0"+jetzt.getUTCHours()).slice(-2)+("0"+jetzt.getUTCMinutes()).slice(-2)+("0"+jetzt.getUTCSeconds()).slice(-2)+"Z";
  obj(3,"<< /Producer (All-Home) /CreationDate ("+zs+")"+(titel?" /Title "+hex16(String(titel).slice(0,120)):"")+" >>");
  seiten.forEach(function(s,k){
    var pg=4+k*3,inh=pg+1,bild=pg+2;
    var mass=sbSeitenMass(s.w,s.h),W=mass[0].toFixed(2),H=mass[1].toFixed(2);
    obj(pg,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /XObject << /Im0 "+bild+" 0 R >> >> /Contents "+inh+" 0 R >>");
    var c=txt("q "+W+" 0 0 "+H+" 0 0 cm /Im0 Do Q");
    obj(inh,"<< /Length "+c.length+" >>",c);
    obj(bild,"<< /Type /XObject /Subtype /Image /Width "+s.w+" /Height "+s.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+s.jpeg.length+" >>",s.jpeg);
  });
  var anzahl=4+n*3,xref=laenge,z="xref\n0 "+anzahl+"\n0000000000 65535 f \n";
  for(var o=1;o<anzahl;o++)z+=("0000000000"+offs[o]).slice(-10)+" 00000 n \n";
  z+="trailer\n<< /Size "+anzahl+" /Root 1 0 R /Info 3 0 R >>\nstartxref\n"+xref+"\n%%EOF\n";
  dazu(txt(z));
  var aus=new Uint8Array(laenge),pos=0;
  teile.forEach(function(b){aus.set(b,pos);pos+=b.length;});
  return aus;
}
/* Breite/Höhe aus einem JPEG lesen (SOF-Marker) – für fremde Fotos beim Anfügen */
function sbJpegMasse(b){
  if(b[0]!==0xFF||b[1]!==0xD8)return null;
  var i=2;
  while(i+9<b.length){
    if(b[i]!==0xFF){i++;continue;}
    var m=b[i+1];if(m===0xD8||m===0x01||(m>=0xD0&&m<=0xD7)){i+=2;continue;}
    var len=(b[i+2]<<8)|b[i+3];
    if((m>=0xC0&&m<=0xC3)||(m>=0xC5&&m<=0xC7)||(m>=0xC9&&m<=0xCB)||(m>=0xCD&&m<=0xCF))
      return {h:(b[i+5]<<8)|b[i+6],w:(b[i+7]<<8)|b[i+8],k:b[i+9]};
    i+=2+len;
  }
  return null;
}

/* ================= Scanner =================
   Eigene Ebene über der App (#scan), damit Kamera und Seiten ein Neuzeichnen der
   App überstehen. Die Adresse #/scan hält den Scanner offen – Zurück-Geste schließt
   ihn, die Seiten bleiben als Entwurf auf dem Gerät (IndexedDB), bis gespeichert
   oder verworfen wird. Ablauf: Kamera → Seiten → (Zuschneiden) → Speichern. */
var SCAN=null,SCAN_INAPP=false,SCAN_UHR=null,SCAN_SPEICHERN=null;
var SCAN_MAX_SEITEN=40,SCAN_KI_SEITEN=20;
var SCAN_OHNE_KI={personalausweis:1,reisepass:1,fuehrerschein:1};
var SCAN_FILTER=[["auto","Auto"],["original","Original"],["grau","Graustufen"],["sw","Schwarzweiß"]];

/* ---- Einstieg: Knöpfe setzen die Adresse, das Zeichnen öffnet die Ebene ---- */
function scanStart(z){
  var q=[];
  ["vertrag","art","med","person","doc","nk"].forEach(function(k){if(z&&z[k])q.push(k+"="+encodeURIComponent(z[k]));});
  SCAN_INAPP=true;
  location.hash="#/scan"+(q.length?"?"+q.join("&"):"");
}
function scanZiel(p){
  var z={vertrag:p.vertrag||null,art:p.art||null,med:p.med==="1",person:p.person||null,doc:p.doc||null,nk:p.nk||null};
  if(z.vertrag&&!vertragById(z.vertrag))z.vertrag=null;
  if(z.nk&&z.nk!=="neu"&&!nkById(z.nk))z.nk="neu";
  if(z.doc&&!DOCS.some(function(d){return d.id===z.doc;}))z.doc=null;
  return z;
}
function zielSchluessel(z){return [z.vertrag,z.art,z.med?1:0,z.person,z.doc,z.nk].join("|");}
/* Vorgabe für die KI: Ausweise erst einmal nicht */
function scanKiVorgabe(z){
  var c=z.vertrag?vertragById(z.vertrag):null,art=(c&&c.art)||z.art;
  return !SCAN_OHNE_KI[art];
}
function anfuegenDok(){return SCAN&&SCAN.ziel.doc?DOCS.filter(function(d){return d.id===SCAN.ziel.doc;})[0]||null:null;}
function istPdfDok(d){return d&&(d.mime_type==="application/pdf"||/\.pdf$/i.test(d.storage_path||""));}

/* Wird beim Zeichnen der Route #/scan aufgerufen – mehrfach harmlos */
function scannerZeigen(p){
  var z=scanZiel(p);
  if(SCAN&&SCAN.zielKey===zielSchluessel(z))return;
  if(SCAN)scannerAus();
  SCAN={ziel:z,zielKey:zielSchluessel(z),seiten:[],akt:0,modus:"start",auto:true,blitz:false,
        ki:scanKiVorgabe(z),format:scanFormatGemerkt(),person:z.person||"",filterRow:false};
  var ad=anfuegenDok();
  if(ad){SCAN.format=istPdfDok(ad)?"pdf":"jpg";SCAN.ki=false;}
  ebeneAnlegen();
  document.body.classList.add("scan-open");systemLeisten();
  entwurfLaden().then(function(e){
    if(!SCAN)return;
    if(e&&e.seiten&&e.seiten.length){SCAN.entwurf=e;scanModus("entwurf");}
    else scanModus("kamera");
  });
}
/* Ebene schließen, ohne etwas zu verwerfen (Entwurf bleibt) */
function scannerAus(){
  kameraAus();
  if(SCAN)SCAN.seiten.forEach(function(s){if(s.vUrl)URL.revokeObjectURL(s.vUrl);});
  SCAN=null;SCAN_BILD=null;
  var e=$("#scan");if(e)e.remove();
  document.body.classList.remove("scan-open");systemLeisten();
}
function scanZurueck(){
  if(SCAN_INAPP){SCAN_INAPP=false;history.back();}
  else location.replace(location.pathname+location.search+"#/start");
}

        catch(e2){stream=await navigator.mediaDevices.getUserMedia(kameraWunsch(null));}

      }
    }

    var tr=stream.getVideoTracks()[0];SCAN.track=tr;
    var caps={};try{caps=tr.getCapabilities?tr.getCapabilities():{};}catch(e){}
    if(caps.focusMode&&caps.focusMode.indexOf("continuous")>=0){try{await tr.applyConstraints({advanced:[{focusMode:"continuous"}]});}catch(e){}}
    var bl=$("#scBlitz");if(bl)bl.hidden=!caps.torch;

    try{var stl=tr.getSettings?tr.getSettings():{};if(caps.zoom&&stl.zoom>1)await tr.applyConstraints({advanced:[{zoom:Math.max(caps.zoom.min||1,1)}]});}catch(e){}

async function ausloesen(auto){

  if(SCAN.seiten.length>=SCAN_MAX_SEITEN){toast(tf("Höchstens {0} Seiten je Dokument.",SCAN_MAX_SEITEN),true);return;}
  var vid=$("#scVid");if(!vid||!vid.videoWidth)return;
  SCAN.nimmt=true;clearTimeout(SCAN_UHR);tippSetzen();
  var fx=$("#scFx");if(fx){fx.classList.remove("an");void fx.offsetWidth;fx.classList.add("an");}
  try{if(navigator.vibrate)navigator.vibrate(25);}catch(e){}
  var quadVideo=SCAN.quad?SCAN.quad.map(function(q){return q.slice();}):null;
  var vorher=puffer(vid,vid.videoWidth,vid.videoHeight,320),dm=daumen(vorher);
  try{
    var bild=await fotoMachen(vid,dm);
    var seite=await seiteAusBild(bild.quelle,bild.w,bild.h,quadVideo&&Math.abs(bild.w/bild.h-vid.videoWidth/vid.videoHeight)<0.02?quadVideo:null);
    SCAN.sperre={quad:quadVideo,daumen:dm,weg:0};SCAN.stabil=null;
    entwurfMerken();

    var nr=SCAN.seiten.indexOf(seite)+1;
    if(seite.unscharf&&auto&&!seite.wiederholt){
      /* unscharf: gleich noch einmal – die nächste ruhige Aufnahme ersetzt diese Seite (nur einmal) */
      SCAN.ersetzen=seite.id;SCAN.stillErsetzen=true;SCAN.sperre=null;
      SCAN.meldung={txt:tf("Seite {0} wirkt unscharf – ruhig halten, sie wird neu aufgenommen",nr),bis:Date.now()+2600};
    }else if(seite.unscharf){
      SCAN.meldung={txt:tf("Seite {0} wirkt unscharf – unter „Seiten“ neu aufnehmen",nr),bis:Date.now()+3500};
    }

  }catch(e){toast(t("Aufnahme fehlgeschlagen")+": "+errMsg(e),true);}
  finally{
    if(SCAN){SCAN.nimmt=false;if(SCAN.modus==="kamera"){tippSetzen();SCAN_UHR=setTimeout(erkennenSchritt,150);}}
  }
}

  if(s.vKey===key&&s.vUrl)return s.vUrl;

  var pr=VORSCHAU_KETTE.then(async function(){

/* Sprechender Dateiname aus dem KI-Titel: „2026-10-14 Telekom Rechnung.pdf“ */
function dateiname(titel,datum,alt){
  var endung=(String(alt||"").match(/\.[a-z0-9]{2,4}$/i)||[".pdf"])[0].toLowerCase();
  var tt=String(titel||"").replace(/[\\\/:*?"<>|\u0000-\u001f]+/g," ").replace(/\s+/g," ").trim().slice(0,70);
  if(!tt)return alt;
  var d=/^\d{4}-\d{2}-\d{2}$/.test(String(datum||""))?datum+" ":"";
  return d+tt+endung;
}

async function volltextHolen(docId,seiten,vorher,ab){
  if(!seiten||!seiten.length)return;
  ab=ab||1;
  var pakete=[];for(var i=0;i<seiten.length;i+=4)pakete.push({ab:ab+i,seiten:seiten.slice(i,i+4)});
  var teile=new Array(pakete.length),naechstes=0;
  async function arbeiter(){
    while(naechstes<pakete.length){
      var k=naechstes++,pk=pakete[k];
      try{
        var bilder=[],streifen=[];
        for(var j=0;j<pk.seiten.length;j++){var st=await textStreifen(pk.seiten[j]);streifen.push(st.length);bilder=bilder.concat(st);}
        var b=await edgeRuf(EDGE_EXTRACT,{modus:"text",bilder:bilderFuerKi(bilder),streifen:streifen,ab:pk.ab,mimeType:"image/jpeg",lang:curLang});
        teile[k]=String(b.text||"").trim();
      }catch(e){teile[k]="";}
    }
  }
  await Promise.all([arbeiter(),arbeiter()]);
  var text=[vorher||""].concat(teile).filter(Boolean).join("\n\n").slice(0,200000);
  if(!text)return;
  try{await sb.from("documents").update({volltext:text}).eq("id",docId);}catch(e){}
}

async function anfuegenAusfuehren(d,seiten,opt){
  var neuPfade=[],alt=d.storage_path;

    arbeitText(t("PDF wird erweitert …"));
    var lib=await ladePdfLib();
    var dl=await sb.storage.from(BUCKET).download(d.storage_path);
    if(dl.error)throw new Error(t("Datei konnte nicht geladen werden."));
    var doc;
    try{doc=await lib.PDFDocument.load(new Uint8Array(await dl.data.arrayBuffer()));}
    catch(e){throw new Error(/encrypt/i.test(errMsg(e))?t("Dieses PDF ist geschützt – Seiten lassen sich nicht anfügen. Scanne die Seiten als eigenes Dokument."):t("Dieses PDF lässt sich nicht erweitern."));}
    for(var i=0;i<seiten.length;i++){
      var bild=await doc.embedJpg(seiten[i].jpeg),mass=sbSeitenMass(seiten[i].w,seiten[i].h),W=mass[0],H=mass[1];
      doc.addPage([W,H]).drawImage(bild,{x:0,y:0,width:W,height:H});
    }
    var bytes=await doc.save(),anzahl=doc.getPageCount();
    if(bytes.length>15*1024*1024)throw new Error(t("Das PDF wird größer als 15 MB – bitte als eigenes Dokument speichern."));

    if(r.error||!r.data||!r.data.length){await dateienWeg([pfad]);throw new Error(r.error?netzFehler(r.error):t("Das Dokument ließ sich nicht ändern."));}

    if(r2.error||!r2.data||!r2.data.length){await dateienWeg(neuPfade);throw new Error(r2.error?netzFehler(r2.error):t("Das Dokument ließ sich nicht ändern."));}
  }
  await entwurfLoeschen();
  var kiNeu=opt.ki,kiBilder=seiten.map(function(s){return s.ki;}).filter(Boolean),med=istMed(d);
  if(kiNeu){
    arbeitText(t("All-Home liest das Dokument … (10–30 Sek.)"));
    var quelle;
    if(pdfFuerKi&&pdfFuerKi.length<=10*1024*1024)quelle={pdf:pdfFuerKi};
    else if(!pdfFuerKi)quelle={bilder:(await bilderDesDokuments(d)).concat(kiBilder)};

  var neu=DOCS.filter(function(x){return x.id===d.id;})[0]||d;
  SCAN_SPEICHERN=null;scannerAus();SCAN_INAPP=false;
  if(kiNeu&&neu.extracted&&!neu.ki_pending){REVIEW=neu;REVIEW_WAHL=null;REVIEW_TROTZDEM=false;location.replace("#/neu");return;}
  toast(tn(seiten.length,"{0} Seite angefügt","{0} Seiten angefügt")+" ✅");
  location.replace(med?"#/gesundheit?doc="+d.id:(d.contract_id&&vertragById(d.contract_id)?"#/vertrag?id="+d.contract_id:"#/dokumente"));

var PDFLIB_URL="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js";
var PDFLIB_SRI="sha256-D5pcrQeUHwgmWGyU4InYm5GMRuXBfPLVo8b2ZuO8aU8=";
var PDFLIB_LADEN=null;
function ladePdfLib(){
  if(window.PDFLib)return Promise.resolve(window.PDFLib);
  if(PDFLIB_LADEN)return PDFLIB_LADEN;
  PDFLIB_LADEN=new Promise(function(ok,nein){

/* ================= Bedienung im Scanner ================= */
function scanKlick(ev){
  var b=ev.target.closest("[data-s]");if(!b||!SCAN)return;
  var a=b.getAttribute("data-s"),s=SCAN.seiten[SCAN.akt];
  if(b.closest("#scLeiste")&&$("#scLeiste").__ziehen&&Date.now()-$("#scLeiste").__ziehen<400)return;  /* Ende eines Ziehens ist kein Tipp */
  if(a==="zu"){
    if(SCAN.seiten.length&&!confirm(tn(SCAN.seiten.length,"Scan verwerfen? Die Seite geht verloren.","Scan verwerfen? {0} Seiten gehen verloren.")))return;
    entwurfLoeschen();scannerAus();scanZurueck();return;
  }
  if(a==="ausloesen"){ausloesen(false);return;}
  if(a==="auto"){SCAN.auto=!SCAN.auto;SCAN.stabil=null;autoZeichnen();tippSetzen();return;}
  if(a==="linse"){kameraWechseln();return;}
  if(a==="blitz"){
    SCAN.blitz=!SCAN.blitz;
    if(SCAN.track)SCAN.track.applyConstraints({advanced:[{torch:SCAN.blitz}]}).catch(function(){});
    b.classList.toggle("an",SCAN.blitz);return;
  }
  if(a==="galerie"){$("#scGal").click();return;}
  if(a==="kamapp"){$("#scCam").click();return;}
  if(a==="kamera-neu"){scanModus("kamera");return;}
  if(a==="kamera"){
    if(SCAN.modus==="ohnekamera"){$("#scCam").click();return;}
    scanModus("kamera");return;
  }
  if(a==="seiten"){SCAN.ersetzen=null;if(SCAN.seiten.length){SCAN.akt=Math.min(SCAN.akt,SCAN.seiten.length-1);if(SCAN.modus==="kamera")SCAN.akt=SCAN.seiten.length-1;scanModus("seiten");}return;}
  if(a==="vor"){seiteBlaettern(-1);return;}
  if(a==="nach"){seiteBlaettern(1);return;}
  if(a==="waehle"){SCAN.akt=+b.getAttribute("data-i");seitenZeichnen();return;}
  if(a==="filterrow"){SCAN.filterRow=!SCAN.filterRow;seitenZeichnen();return;}
  if(a==="filter"){if(s){s.filter=b.getAttribute("data-f");SCAN.filterStd=s.filter;entwurfMerken();seitenZeichnen();}return;}
  if(a==="filter-alle"){if(s){SCAN.seiten.forEach(function(p){p.filter=s.filter;});entwurfMerken();seitenZeichnen();toast(t("Filter für alle Seiten übernommen"));}return;}
  if(a==="drehen"){if(s){s.dreh=(s.dreh+1)%4;entwurfMerken();seitenZeichnen();}return;}
  if(a==="loeschen"){
    if(!s)return;
    if(s.vUrl)URL.revokeObjectURL(s.vUrl);
    SCAN.seiten.splice(SCAN.akt,1);entwurfMerken();
    if(!SCAN.seiten.length){scanModus("kamera");return;}
    SCAN.akt=Math.min(SCAN.akt,SCAN.seiten.length-1);seitenZeichnen();return;
  }
  if(a==="nochmal"){
    if(!s)return;
    /* Seite ersetzen: Kamera auf, die nächste Aufnahme tritt an ihre Stelle – bis dahin bleibt die alte */
    SCAN.ersetzen=s.id;scanModus("kamera");return;
  }
  if(a==="zuschnitt"){scanModus("zuschnitt");return;}
  if(a==="zs-ab"){scanModus("seiten");return;}
  if(a==="zs-ok"){
    var E=SCAN.zEcken;
    if(!sbKonvex(E)){toast(t("Die Ecken überkreuzen sich – bitte korrigieren."),true);return;}
    s.ecken=E;s.erkannt=true;entwurfMerken();scanModus("seiten");return;
  }
  if(a==="zs-auto"){zuschnittAuto();return;}
  if(a==="zs-ganz"){SCAN.zEcken=[[0,0],[1,0],[1,1],[0,1]];zuschnittSvg();return;}
  if(a==="weiter"){scanModus("speichern");return;}
  if(a==="format"){SCAN.format=b.getAttribute("data-v")==="jpg"?"jpg":"pdf";try{localStorage.setItem("ah_scan_format",SCAN.format);}catch(e){}entwurfMerken();scanModus("speichern");return;}
  if(a==="ki"){SCAN.ki=!SCAN.ki;scanModus("speichern");return;}
  if(a==="ok"){scanSpeichern();return;}
  if(a==="entwurf-weiter"){
    var e2=SCAN.entwurf;SCAN.entwurf=null;
    SCAN.seiten=e2.seiten.map(function(p){return Object.assign({},p);});
    if(e2.format)SCAN.format=e2.format;
    /* Der Entwurf behält sein Ziel, wenn es das noch gibt */
    if(e2.ziel){var z=scanZiel({vertrag:e2.ziel.vertrag,art:e2.ziel.art,med:e2.ziel.med?"1":"",person:e2.ziel.person,doc:e2.ziel.doc,nk:e2.ziel.nk});
      SCAN.ziel=z;SCAN.ki=scanKiVorgabe(z);if(anfuegenDok())SCAN.ki=false;}
    SCAN.akt=0;scanModus("seiten");return;
  }
  if(a==="entwurf-weg"){entwurfLoeschen();SCAN.entwurf=null;scanModus("kamera");return;}
}

  ["miteigentum","Miteigentumsanteile"],["direkt","Direkt zugeordnet"],["sonstig","Sonstiger Schlüssel"]];
var NK_ENERGIE=[["","–"],["gas","Gas"],["oel","Öl"],["fernwaerme","Fernwärme"],["waermepumpe","Wärmepumpe"],["pellets","Pellets / Holz"],["strom","Strom"],["sonstig","Sonstige"]];
var NK_FOSSIL={gas:1,oel:1,fernwaerme:1};
/* CO2KostAufG, Anlage: kg CO2 je m² und Jahr → Anteil des Mieters in % */
var NK_CO2=[[12,100],[17,90],[22,80],[27,70],[32,60],[37,50],[42,40],[47,30],[52,20],[1e9,5]];
var NK_FARBEN=["--nk1","--nk2","--nk3","--nk4","--nk5","--nk6","--nk7"];
var NK_DATEI_ZIEL=null;   /* Abrechnung, an die gewählte Dateien kommen (null = neue) */
/* Adresse wechseln und DANACH fn ausführen – der Adresswechsel schließt sonst ein eben geöffnetes Blatt */
function nkNach(hash,fn){
  if(location.hash===hash){render();fn();return;}
  var h=function(){window.removeEventListener("hashchange",h);setTimeout(fn,0);};
  window.addEventListener("hashchange",h);location.replace(hash);
}

/* ---------- Grundrechnung ---------- */
function nkById(id){return NK.filter(function(n){return n.id===id;})[0]||null;}
function nkSortiert(){return NK.slice().sort(function(a,b){return String(a.von).localeCompare(String(b.von));});}
function nkTage(n){return Math.round((Date.parse(n.bis+"T00:00:00Z")-Date.parse(n.von+"T00:00:00Z"))/864e5)+1;}
/* Länge in Kalendermonaten: 1.1.–31.12. sind genau 12, 1.4.–31.12. genau 9; Resttage anteilig */
function nkMonate(n){
  var a=String(n.von).split("-").map(Number),e=new Date(Date.parse(n.bis+"T00:00:00Z")+864e5);
  var m=(e.getUTCFullYear()-a[0])*12+(e.getUTCMonth()+1-a[1])-(e.getUTCDate()<a[2]?1:0);
  var anker=Date.parse(addMonthsISO(n.von,m)+"T00:00:00Z");
  return m+Math.max(0,(e.getTime()-anker)/864e5)/30.436875;
}
function nkFaktor(n){var m=nkMonate(n);return m>0?12/m:1;}
function nkVoll(n){return Math.abs(nkMonate(n)-12)<0.35;}
/* Zwei Zeiträume nur vergleichen, wenn beide fast ein Jahr umfassen – sonst verzerren Winter- oder Sommermonate die Hochrechnung */
function nkVergleichbar(a,b){return !!(a&&b)&&nkMonate(a)>=11&&nkMonate(b)>=11;}
/* Je Kategorie: Heizung hängt an der Jahreszeit (beide fast ein Jahr), alles andere lässt sich ab 3 Monaten hochrechnen */
function nkVergleichbarKat(k,a,b){return k==="heizung"?nkVergleichbar(a,b):(!!(a&&b)&&nkMonate(a)>=3&&nkMonate(b)>=3);}
/* „2025“ für ein Kalenderjahr, „2024/25“ für 12 Monate über den Jahreswechsel, sonst Monate */
function nkLabel(n){
  var v=String(n.von),b=String(n.bis);
  if(v.slice(5)==="01-01"&&b.slice(5)==="12-31"&&v.slice(0,4)===b.slice(0,4))return v.slice(0,4);
  if(nkVoll(n))return v.slice(0,4)+"/"+b.slice(2,4);
  return v.slice(5,7)+"/"+v.slice(2,4)+"–"+b.slice(5,7)+"/"+b.slice(2,4);
}
function nkPos(n){return Array.isArray(n&&n.positionen)?n.positionen:[];}
function nkBetrag(p){return numOrNull(p&&p.betrag)||0;}
function nkKatVon(p){return NK_KAT[p&&p.kat]?p.kat:"sonstige";}
function nkSumme(n){return nkPos(n).reduce(function(s,p){return s+nkBetrag(p);},0);}
function nkKat(n){var o={};nkPos(n).forEach(function(p){var k=nkKatVon(p);o[k]=(o[k]||0)+nkBetrag(p);});return o;}
function nkJeM2(betrag,n){var f=numOrNull(n.wohnflaeche);return f>0?betrag/f/nkMonate(n):null;}
/* Abrechnungen ohne Positionen (etwa weil die KI beim Hochladen gesperrt war) zählen bei Vergleichen und Grafiken nicht */
function nkOhneWerte(n){return !nkPos(n).length;}
function nkMitWerten(liste){return liste.filter(function(n){return !nkOhneWerte(n);});}
function nkLeerMitDok(){return nkSortiert().filter(function(n){return nkOhneWerte(n)&&DOCS.some(function(d){return d.nk_id===n.id;});});}
/* mitWerten: nur Abrechnungen mit Positionen (für Kosten- und Flächenvergleiche) */
function nkVorgaenger(n,mitWerten){var l=nkSortiert().filter(function(x){return !mitWerten||x.id===n.id||!nkOhneWerte(x);}),i=l.map(function(x){return x.id;}).indexOf(n.id);return i>0?l[i-1]:null;}
function nkNeueste(){var l=nkSortiert();return l.length?l[l.length-1]:null;}
function nkHeiz(n){return (n&&n.heizung&&typeof n.heizung==="object")?n.heizung:{};}
function nkHeizkosten(n){var k=numOrNull(nkHeiz(n).kosten);return k!=null?k:(nkKat(n).heizung||0);}
/* Hauswart: ohne eigene Reinigung/Garten ist der Vergleichswert höher (0,37 statt 0,21) */
function nkSpiegel(k,n){
  var sp=NK_KAT[k]?NK_KAT[k].sp:null;
  if(k==="hauswart"){var kk=nkKat(n);if(!kk.gebaeudereinigung&&!kk.garten)return 0.37;}
  return sp;
}
function nkErgebnis(n){
  var e=numOrNull(n.ergebnis);if(e!=null)return e;
  var v=numOrNull(n.vorauszahlungen);return v!=null?Math.round((nkSumme(n)-v)*100)/100:null;
}
/* Vorschlag für die monatliche Vorauszahlung: Jahreskosten / 12, auf 5 € aufgerundet */
function nkVorschlag(n){var m=nkSumme(n)*nkFaktor(n)/12;return m>0?Math.ceil(m/5)*5:null;}
function monatsEnde(iso){var p=String(iso).split("-").map(Number);return isoAusUTC(new Date(Date.UTC(p[0],p[1],0)));}
/* § 556 Abs. 3 BGB: Abrechnung binnen 12 Monaten nach Zeitraumende, Einwände bis Ende des 12. Monats nach Zugang */
function nkFristAbrechnung(n){return addMonthsISO(n.bis,12);}
function nkFristEinwand(n){return n.zugang_am?monatsEnde(addMonthsISO(n.zugang_am,12)):null;}
function nkCo2Anteil(kg){for(var i=0;i<NK_CO2.length;i++)if(kg<NK_CO2[i][0])return NK_CO2[i][1];return 5;}
function nkDelta(neu,alt){return (alt>0)?(neu-alt)/alt:null;}
function prozent(x,d){return (x>0?"+":"")+num(x*100,d==null?0:d)+" %";}
/* Mietvertrag des Hauses (für Zuordnung, Vorauszahlung und Vermieter) */
function nkMieteVertrag(n){
  if(n&&n.contract_id){var c=vertragById(n.contract_id);if(c)return c;}
  var m=CONTRACTS.filter(function(c){return c.art==="miete";});
  return m.filter(function(c){return c.status==="aktiv";})[0]||m[0]||null;
}

/* ================= Prüfungen =================
   Jede liefert {art, titel, text, betrag?}. art: bad = vermutlich zu viel berechnet / Recht verletzt,
   warn = prüfen, info = Hinweis, gut = alles in Ordnung. Keine Rechtsberatung – nur Anhaltspunkte. */
function nkPruefen(n){
  var h=[],vor=nkVorgaenger(n,true),vorZ=nkVorgaenger(n),summe=nkSumme(n),kat=nkKat(n),heiz=nkHeiz(n),heute=todayISO();
  /* art "bad#kennung": Kennung bleibt gleich, egal in welcher Sprache – damit lässt sich ein Hinweis dauerhaft wegklicken */
  var anz={};
  function dazu(art,titel,text,betrag){
    var a=String(art).split("#"),s=a[1]||"p";anz[s]=(anz[s]||0)+1;
    h.push({art:a[0],titel:titel,text:text,betrag:betrag==null?null:Math.round(betrag*100)/100,id:n.id+":"+s+(anz[s]>1?"-"+anz[s]:"")});
  }
  var erg=nkErgebnis(n);
  /* ---- Fristen & Formales ---- */
  var frist=nkFristAbrechnung(n);
  if(n.zugang_am&&n.zugang_am>frist){
    if(erg!=null&&erg>0)dazu("bad#abrechnung-zu-spaet-nachzahlun",t("Abrechnung zu spät – Nachzahlung meist nicht fällig"),
      tf("Sie kam am {0}, abrechnen musste der Vermieter bis {1} (§ 556 Abs. 3 BGB). Eine Nachforderung ist dann in der Regel ausgeschlossen, außer er hat die Verspätung nicht zu vertreten.",fmtDate(n.zugang_am),fmtDate(frist)),erg);
    else dazu("info#abrechnung-kam-verspaetet",t("Abrechnung kam verspätet"),tf("Frist war der {0} – ein Guthaben steht dir trotzdem zu.",fmtDate(frist)));
  }
  if(nkMonate(n)>12.1)dazu("warn#zeitraum-laenger-als-12-monate",t("Zeitraum länger als 12 Monate"),tf("{0} Tage abgerechnet – zulässig sind höchstens 12 Monate.",nkTage(n)));
  var einwand=nkFristEinwand(n);
  if(einwand&&einwand>=heute)dazu("info#einwaende-bis-moeglich",tf("Einwände bis {0} möglich",fmtDate(einwand)),t("Bis zum Ende des zwölften Monats nach Zugang kannst du der Abrechnung widersprechen und Belege einsehen."));
  if(!n.zugang_am)dazu("info#zugangsdatum-fehlt",t("Zugangsdatum fehlt"),t("Trag ein, wann die Abrechnung ankam – dann rechnet All-Home die Fristen."));
  if(vor){
    var fa=numOrNull(vor.wohnflaeche),fn=numOrNull(n.wohnflaeche);
    if(fa&&fn&&Math.abs(fa-fn)>0.05)dazu("warn#wohnflaeche-geaendert",t("Wohnfläche geändert"),tf("Vorher {0} m², jetzt {1} m² – das verschiebt alle flächenbezogenen Kosten.",num(fa,2),num(fn,2)));
    var sa={},sn={};
    nkPos(vor).forEach(function(p){if(p.schluessel)sa[nkKatVon(p)]=p.schluessel;});
    nkPos(n).forEach(function(p){if(p.schluessel)sn[nkKatVon(p)]=p.schluessel;});
    Object.keys(sn).forEach(function(k){
      if(sa[k]&&sa[k]!==sn[k])dazu("warn#verteilerschluessel-geaendert-"+k,tf("Verteilerschlüssel geändert: {0}",t(NK_KAT[k].l)),
        tf("Vorher „{0}“, jetzt „{1}“. Ein Wechsel ist nur in engen Grenzen erlaubt – lass dir den Grund nennen.",t(schluesselName(sa[k])),t(schluesselName(sn[k]))));
    });
  }
  /* Lücke/Überschneidung: auch zu einer Abrechnung, die noch nicht ausgelesen ist */
  if(vorZ){
    var nachVor=addMonthsISO(vorZ.bis,0);
    var tagNach=isoAusUTC(new Date(Date.parse(vorZ.bis+"T00:00:00Z")+864e5));
    if(n.von>tagNach)dazu("info#luecke-zur-vorigen-abrechnung",t("Lücke zur vorigen Abrechnung"),tf("Die vorige endete am {0}, diese beginnt am {1}.",fmtDate(nachVor),fmtDate(n.von)));
    else if(n.von<tagNach)dazu("warn#zeitraeume-ueberschneiden-sich",t("Zeiträume überschneiden sich"),tf("Die vorige endete am {0}, diese beginnt schon am {1}.",fmtDate(nachVor),fmtDate(n.von)));
  }
  var vz=numOrNull(n.vorauszahlungen),ergStand=numOrNull(n.ergebnis);
  if(vz!=null&&ergStand!=null&&summe>0&&Math.abs(summe-vz-ergStand)>1)
    dazu("warn#rechnung-geht-nicht-auf",t("Rechnung geht nicht auf"),tf("Kosten {0} − Vorauszahlungen {1} = {2}, auf der Abrechnung steht {3}. Vielleicht fehlt eine Position.",eur(summe),eur(vz),eur(summe-vz),eur(ergStand)));
  /* ---- Plausibilität: typische Lese- und Tippfehler ---- */
  var fl=numOrNull(n.wohnflaeche),pe=numOrNull(n.personen);
  if(fl!=null&&(fl<10||fl>400))dazu("warn#wohnflaeche-pruefen",t("Wohnfläche prüfen"),tf("{0} m² sind für eine Wohnung ungewöhnlich – steht hier vielleicht die Fläche des ganzen Hauses?",num(fl,2)));
  if(pe!=null&&(pe<0||pe>12))dazu("warn#personenzahl-pruefen",t("Personenzahl prüfen"),tf("{0} Personen sind für eine Wohnung ungewöhnlich – steht hier vielleicht die Zahl des ganzen Hauses?",num(pe,1)));
  if(n.bis>heute)dazu("warn#zeitraum-endet-in-der-zukunft",t("Zeitraum endet in der Zukunft"),tf("Eingetragen ist der {0} – bitte die Daten prüfen.",fmtDate(n.bis)));
  if(n.zugang_am&&n.zugang_am<n.bis)dazu("warn#erhalten-vor-ende-des-zeitraum",t("Erhalten vor Ende des Zeitraums?"),tf("Als Zugang steht der {0}, der Zeitraum endet aber erst am {1}.",fmtDate(n.zugang_am),fmtDate(n.bis)));
  if(n.erstellt_am&&n.zugang_am&&n.erstellt_am>n.zugang_am)dazu("warn#datum-pruefen",t("Datum prüfen"),tf("Die Abrechnung ist vom {0}, erhalten am {1} – das passt nicht zusammen.",fmtDate(n.erstellt_am),fmtDate(n.zugang_am)));
  var zuGross=nkPos(n).filter(function(p){var hs=numOrNull(p.haus);return hs!=null&&hs>0&&nkBetrag(p)>hs+0.5;});
  if(zuGross.length)dazu("warn#anteil-groesser-als-die-hausko",t("Anteil größer als die Hauskosten"),tf("Bei {0} ist dein Anteil höher als die Kosten des ganzen Hauses – vermutlich ein Lese- oder Rechenfehler.",zuGross.map(function(p){return p.bez||t(NK_KAT[nkKatVon(p)].l);}).join(", ")));
  var arbZuGross=nkPos(n).filter(function(p){var b=numOrNull(p.p35a_betrag);return b!=null&&b>nkBetrag(p)+0.5;});
  if(arbZuGross.length)dazu("warn#arbeitskosten-groesser-als-die",t("Arbeitskosten größer als die Position"),tf("Bei {0} sind die Arbeitskosten (§ 35a) höher als der Betrag selbst.",arbZuGross.map(function(p){return p.bez||t(NK_KAT[nkKatVon(p)].l);}).join(", ")));
  var hkAng=numOrNull(heiz.kosten),hkPos=kat.heizung||0;
  if(hkAng!=null&&hkAng>0&&hkPos>0&&Math.abs(hkAng-hkPos)>Math.max(1,hkPos*0.01))
    dazu("warn#heizkosten-weichen-ab",t("Heizkosten weichen ab"),tf("Im Heizungsteil stehen {0}, die Heizungs-Positionen ergeben {1}. Eines davon stimmt nicht – bitte mit dem Papier vergleichen.",eur(hkAng),eur(hkPos)));
  /* ---- Umlagefähigkeit ---- */
  var nu=[],nuSumme=0;
  nkPos(n).forEach(function(p){
    var bez=String(p.bez||"");
    var verdacht=nkKatVon(p)==="nicht_umlagefaehig"||(nkKatVon(p)!=="heizung"&&/verwalt|instandh|reparat|rücklage|ruecklage|kontof|bankgeb|porto|mahngeb|leerstand/i.test(bez));
    if(/rauch/i.test(bez)&&/miete|leasing|mietgeb/i.test(bez))verdacht=true;    /* BGH VIII ZR 379/20: Miete für Rauchmelder nicht umlagefähig */
    if(verdacht&&nkBetrag(p)>0){nu.push(bez||t(NK_KAT[nkKatVon(p)].l));nuSumme+=nkBetrag(p);}
  });
  if(nuSumme>0)dazu("bad#nicht-umlagefaehige-kosten",t("Nicht umlagefähige Kosten"),
    tf("{0} – Verwaltung, Instandhaltung, Reparaturen, Rücklagen, Bankgebühren oder gemietete Rauchmelder dürfen Mietern nicht berechnet werden.",nu.join(", ")),nuSumme);
  /* § 2 Nr. 15 BetrKV: seit 1.7.2024 keine Gebühren für den TV-Empfang mehr – Betriebsstrom und Wartung der Anlage schon.
     Glasfaser-Bereitstellungsentgelt höchstens 60 € je Wohnung und Jahr */
  var kabel=0,kabelUnklar=0,glas=0;
  nkPos(n).forEach(function(p){
    if(nkKatVon(p)!=="antenne")return;
    var bez=String(p.bez||"");
    if(/glasfaser/i.test(bez)){glas+=nkBetrag(p);return;}
    if(/strom|wartung|prüf|pruef|inspektion|einstell/i.test(bez))return;
    if(n.bis<"2024-07-01")return;
    var ab=n.von>"2024-07-01"?n.von:"2024-07-01";
    var anteil=(Date.parse(n.bis+"T00:00:00Z")-Date.parse(ab+"T00:00:00Z")+864e5)/(nkTage(n)*864e5);
    var teil=nkBetrag(p)*Math.max(0,Math.min(1,anteil));
    if(/kabel|tv|fernseh|grundgeb|sammel|nutzungsentgelt|urheber|vodafone|pyur|columbus|unitymedia|primacom|netcologne/i.test(bez))kabel+=teil;else kabelUnklar+=teil;
  });
  if(kabel>=1)dazu("bad#kabel-tv-seit-1-7-2024-nicht-m",t("Kabel-TV seit 1.7.2024 nicht mehr umlagefähig"),t("Das Nebenkostenprivileg ist entfallen. Gebühren für den TV-Empfang (Kabelanschluss, Sammelvertrag) darf der Vermieter für die Zeit ab Juli 2024 nicht mehr berechnen – nur noch Betriebsstrom und Wartung der Anlage."),kabel);
  if(kabelUnklar>=1)dazu("warn#antennenkosten-pruefen",t("Antennenkosten prüfen"),t("Seit Juli 2024 sind nur noch Betriebsstrom und Wartung der Antennenanlage umlagefähig, keine Gebühren für den TV-Empfang. Lass dir aufschlüsseln, was hier enthalten ist."),kabelUnklar);
  if(glas*nkFaktor(n)>60.5)dazu("warn#glasfaser-entgelt-ueber-60-im",t("Glasfaser-Entgelt über 60 € im Jahr"),tf("Für die Bereitstellung eines Glasfasernetzes dürfen höchstens 60 € je Wohnung und Jahr umgelegt werden – hier sind es {0} (auf 12 Monate gerechnet).",eur(glas*nkFaktor(n))),glas*nkFaktor(n)-60);
  if(kat.sonstige>0)dazu("info#sonstige-betriebskosten",t("Sonstige Betriebskosten"),t("Nur zulässig, wenn jede Kostenart im Mietvertrag ausdrücklich vereinbart ist (z. B. Dachrinnenreinigung, Rauchmelder-Wartung)."));
  /* ---- Heizkosten (HeizkostenV, CO2KostAufG) ---- */
  var hk=nkHeizkosten(n);
  if(hk>0){
    var va=numOrNull(heiz.verbrauchsanteil_pct);
    if(va!=null&&(va<50||va>70))dazu("warn#verbrauchsanteil",tf("Verbrauchsanteil {0} %",num(va,0)),t("Die Heizkostenverordnung verlangt, dass 50 bis 70 % nach Verbrauch abgerechnet werden."));
    if(heiz.verbrauchsabhaengig===false)dazu("bad#heizkosten-nicht-nach-verbrauc",t("Heizkosten nicht nach Verbrauch abgerechnet"),t("Dann darfst du deinen Heizkostenanteil um 15 % kürzen (§ 12 HeizkostenV)."),hk*0.15);
    var fossil=NK_FOSSIL[heiz.energietraeger]||!heiz.energietraeger;
    if(heiz.co2_ausgewiesen===false&&n.von>="2023-01-01"&&fossil)   /* § 11 Abs. 2 CO2KostAufG: Zeiträume ab 1.1.2023 */
      dazu("bad#co2-kostenaufteilung-fehlt",t("CO2-Kostenaufteilung fehlt"),t("Seit 2023 muss der Vermieter den CO2-Anteil nach dem Stufenmodell ausweisen. Fehlt er, darfst du die Heizkosten um 3 % kürzen (§ 7 Abs. 3 CO2KostAufG)."),hk*0.03);
    var kg=numOrNull(heiz.co2_kg_m2),ma=numOrNull(heiz.co2_mieteranteil_pct);
    if(kg!=null&&ma!=null&&Math.abs(nkCo2Anteil(kg)-ma)>0.5)
      dazu("warn#co2-anteil-passt-nicht-zur-stu",t("CO2-Anteil passt nicht zur Stufe"),tf("Bei {0} kg CO2 je m² trägst du laut Gesetz {1} %, berechnet wurden {2} %.",num(kg,1),nkCo2Anteil(kg),num(ma,0)));
    if(heiz.uvi===false&&heiz.fernablesbar===true&&n.bis>="2022-01-01")
      dazu("bad#monatliche-verbrauchsinfo-fehl",t("Monatliche Verbrauchsinfo fehlt"),t("Bei fernablesbaren Zählern muss der Vermieter monatlich über den Verbrauch informieren. Sonst darfst du um 3 % kürzen (§ 12 HeizkostenV)."),hk*0.03);
  }
  /* ---- Vergleich ---- */
  var flaeche=numOrNull(n.wohnflaeche);
  if(flaeche>0){
    Object.keys(kat).forEach(function(k){
      var sp=nkSpiegel(k,n),jm=nkJeM2(kat[k],n);
      if(!sp||jm==null)return;
      if(k==="antenne"&&kabel+kabelUnklar>=kat[k]-1)return;   /* ganz gestrichen – Vergleich sagt nichts mehr */
      if(jm>sp*1.5&&kat[k]*nkFaktor(n)>=60)
        dazu("warn#ueber-durchschnitt-"+k,tf("{0} deutlich über dem Durchschnitt",t(NK_KAT[k].l)),tf("{0} je m² und Monat – im Schnitt sind es {1} (Betriebskostenspiegel {2}).",eur(jm),eur(sp),NK_SPIEGEL.jahr));
    });
    var ges=nkJeM2(summe,n);
    if(ges!=null&&ges>NK_SPIEGEL.max)dazu("warn#nebenkosten-insgesamt-sehr-hoc",t("Nebenkosten insgesamt sehr hoch"),tf("{0} je m² und Monat – selbst mit allen Kostenarten liegt der Schnitt bei {1}.",eur(ges),eur(NK_SPIEGEL.max)));
  }else if(summe>0)dazu("info#wohnflaeche-fehlt",t("Wohnfläche fehlt"),t("Mit der Wohnfläche vergleicht All-Home deine Kosten mit dem Betriebskostenspiegel."));
  if(vor){
    var ka=nkKat(vor),fv=nkFaktor(vor),fn2=nkFaktor(n);
    Object.keys(kat).forEach(function(k){
      if(!nkVergleichbarKat(k,vor,n))return;
      var a=(ka[k]||0)*fv,b=kat[k]*fn2;
      if(a>0&&b-a>=40&&(b-a)/a>=0.2)
        dazu("warn#veraenderung-"+k,tf("{0}: {1} gegenüber {2}",t(NK_KAT[k].l),prozent((b-a)/a),nkLabel(vor)),
          k==="grundsteuer"&&n.bis>="2025-01-01"
            ?t("Seit 2025 gilt die neue Grundsteuer – höhere Bescheide sind möglich. Lass dir den Bescheid zeigen.")
            :tf("Hochgerechnet auf 12 Monate {0} statt {1}. Belege einsehen und Grund erfragen.",eur(b),eur(a)));
    });
  }
  if(erg!=null&&erg>0){
    var vor2=nkVorschlag(n),neu=numOrNull(n.vorauszahlung_neu),jetzt=neu!=null?neu:(nkMieteVertrag(n)&&numOrNull((nkMieteVertrag(n).details||{}).nebenkosten));
    if(vor2&&(jetzt==null||vor2>jetzt+4))dazu("info#vorauszahlung-auf-anheben",tf("Vorauszahlung auf {0} anheben?",eur(vor2)),tf("So deckt sie die Kosten dieses Zeitraums – statt {0} Nachzahlung im nächsten Jahr.",eur(erg)));
  }else if(erg!=null&&erg<-150){
    var vor3=nkVorschlag(n);
    if(vor3)dazu("info#vorauszahlung-senken-moeglich",t("Vorauszahlung senken möglich"),tf("{0} Guthaben – {1} im Monat würden die Kosten decken. Eine Senkung kannst du verlangen (§ 560 Abs. 4 BGB).",eur(-erg),eur(vor3)));
  }
  /* ---- Steuer (§ 35a EStG) ---- */
  var st=nkSteuer(n);
  if(st.dienst+st.handwerk>0)dazu("info#steuer-bis-ermaessigung",tf("Steuer: bis {0} Ermäßigung",eur(st.ermaessigung)),
    tf("20 % der Arbeitskosten aus Hausmeister, Reinigung, Garten, Winterdienst ({0}) und Wartung/Schornsteinfeger ({1}) zählen bei der Einkommensteuer (§ 35a EStG).",eur(st.dienst),eur(st.handwerk)));
  if(!h.some(function(x){return x.art==="bad"||x.art==="warn";}))dazu("gut#keine-auffaelligkeiten-gefunde",t("Keine Auffälligkeiten gefunden"),t("Fristen, umlagefähige Posten, Heizkosten und Vergleichswerte sind unauffällig."));
  var reihe={bad:0,warn:1,info:2,gut:3};
  return h.sort(function(a,b){return reihe[a.art]-reihe[b.art];});
}
function schluesselName(k){var s=NK_SCHLUESSEL.filter(function(x){return x[0]===k;})[0];return s?s[1]:String(k||"–");}
/* § 35a: begünstigte Arbeitskosten – ausgewiesener Betrag, sonst die Position selbst (Obergrenze unbekannt) */
function nkSteuer(n){
  var d=0,hw=0,geschaetzt=false;
  nkPos(n).forEach(function(p){
    var art=p.p35a||null;if(!art)return;
    var b=numOrNull(p.p35a_betrag);if(b==null){b=nkBetrag(p);geschaetzt=true;}
    if(art==="dienstleistung")d+=b;else if(art==="handwerk")hw+=b;
  });
  return {dienst:d,handwerk:hw,ermaessigung:Math.min(d*0.2,4000)+Math.min(hw*0.2,1200),geschaetzt:geschaetzt};
}

/* Hinweisliste: höchstens 3 sichtbar, der Rest zum Aufklappen; weggeklickte (je Person gespeichert) bleiben weg */
var NKH_AUF={};
/* Startseiten-Vorschlag gilt als weggeklickt, wenn ein früher weggeklickter Vorschlag derselben Abrechnung alle heutigen Auffälligkeiten schon enthielt */
function nkVorschlagWeg(id,badIds){

/* Größte Veränderungen gegenüber dem vorigen Zeitraum (auf 12 Monate gerechnet) */
function nkTreiber(n,vor){
  var a=nkKat(vor),b=nkKat(n),fa=nkFaktor(vor),fb=nkFaktor(n),keys={};
  Object.keys(a).concat(Object.keys(b)).forEach(function(k){keys[k]=1;});
  var l=Object.keys(keys).filter(function(k){return nkVergleichbarKat(k,vor,n);}).map(function(k){return {k:k,diff:(b[k]||0)*fb-(a[k]||0)*fa,alt:(a[k]||0)*fa};})
    .filter(function(x){return Math.abs(x.diff)>=5;}).sort(function(x,y){return Math.abs(y.diff)-Math.abs(x.diff);}).slice(0,4);
  if(!l.length)return "";
  return '<div class="sect">'+tf("Kostentreiber {0} gegenüber {1}",nkLabel(n),nkLabel(vor))+'</div><section class="card"><div class="nktreib">'+
    l.map(function(x){
      return '<div class="nktr"><span>'+NK_KAT[x.k].icon+' '+esc(t(NK_KAT[x.k].l))+'</span>'+
        '<span class="nkd '+(x.diff>0?"hoch":"runter")+'">'+(x.diff>0?"+":"−")+eur0(Math.abs(x.diff))+(x.alt>0?" ("+prozent(x.diff/x.alt)+")":"")+'</span></div>';
    }).join("")+'</div><p class="hint" style="margin-top:8px">'+t("Auf 12 Monate gerechnet.")+'</p></section>';
}

/* ---------- Grafiken (eigenes SVG, Farben aus dem Design) ---------- */
function nkGruppen(liste){
  var tot={};
  liste.forEach(function(n){var k=nkKat(n),f=nkFaktor(n);Object.keys(k).forEach(function(x){tot[x]=(tot[x]||0)+k[x]*f;});});
  var reihe=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a];});
  var haupt=reihe.slice(0,6),farbe={},frei=NK_FARBEN.slice(2);
  if(haupt.indexOf("heizung")>=0)farbe.heizung=NK_FARBEN[0];
  if(haupt.indexOf("wasser")>=0)farbe.wasser=NK_FARBEN[1];
  haupt.forEach(function(k){if(!farbe[k])farbe[k]=frei.shift()||"--muted-2";});
  return {haupt:haupt,farbe:farbe,rest:reihe.length>6};
}
function nkSaeulen(liste){
  var l=liste.slice(-6),g=nkGruppen(l),W=360,H=210,L=42,B=30,T=18,R=6;
  var werte=l.map(function(n){var k=nkKat(n),f=nkFaktor(n),seg=g.haupt.map(function(x){return (k[x]||0)*f;});
    var rest=Object.keys(k).filter(function(x){return g.haupt.indexOf(x)<0;}).reduce(function(s,x){return s+k[x]*f;},0);
    seg.push(rest);return seg;});
  var max=Math.max.apply(null,werte.map(function(s){return s.reduce(function(a,b){return a+b;},0);}).concat([1]));
  var schritt=Math.pow(10,Math.floor(Math.log(max)/Math.LN10)),top=Math.ceil(max/schritt)*schritt;
  if(top/schritt<3)schritt/=2;
  var bw=Math.min(40,(W-L-R)/l.length*0.56),svg='';
  for(var y=0;y<=top+0.001;y+=schritt){
    var py=H-B-(y/top)*(H-B-T);
    svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+py+'" y2="'+py+'" class="nkgrid"/><text x="'+(L-6)+'" y="'+(py+4)+'" class="nkax" text-anchor="end">'+esc(eur0(y))+'</text>';
  }
  l.forEach(function(n,i){
    var cx=L+(i+0.5)*(W-L-R)/l.length,yy=H-B,summe=0;
    werte[i].forEach(function(v,j){
      if(v<=0)return;summe+=v;
      var hgt=v/top*(H-B-T),farbe=j<g.haupt.length?g.farbe[g.haupt[j]]:"--muted-2";
      svg+='<rect x="'+(cx-bw/2)+'" y="'+(yy-hgt)+'" width="'+bw+'" height="'+Math.max(0,hgt-1)+'" rx="3" style="fill:var('+farbe+')"/>';
      yy-=hgt;
    });
    svg+='<text x="'+cx+'" y="'+(yy-5)+'" class="nkwert" text-anchor="middle">'+esc(eur0(summe))+(nkVoll(n)?"":"*")+'</text>'+
      '<text x="'+cx+'" y="'+(H-B+18)+'" class="nkax" text-anchor="middle">'+esc(nkLabel(n))+'</text>';
  });
  var aria=l.map(function(n,i){return nkLabel(n)+": "+eur0(werte[i].reduce(function(a,b){return a+b;},0));}).join(", ");
  return '<div class="nkchart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t("Kosten je Zeitraum")+": "+aria)+'">'+svg+'</svg></div>'+
    '<div class="nkleg">'+g.haupt.map(function(k){return '<span><i style="background:var('+g.farbe[k]+')"></i>'+esc(t(NK_KAT[k].l))+'</span>';}).join("")+
      (g.rest?'<span><i style="background:var(--muted-2)"></i>'+t("Weitere")+'</span>':"")+'</div>'+
    (l.some(function(n){return !nkVoll(n);})?'<p class="hint" style="margin-top:6px">* '+t("auf 12 Monate hochgerechnet")+'</p>':"");
}
function nkLinie(liste){
  var l=liste.slice(-6).filter(function(n){return numOrNull(n.wohnflaeche)>0;});
  if(!l.length)return "";
  var W=360,H=160,L=34,B=26,T=18,R=44,pkt=l.map(function(n){return nkJeM2(nkSumme(n),n);});
  /* Achse mit Luft nach oben, damit die Wertbeschriftung nicht an die oberste Linie stößt */
  var roh=Math.max.apply(null,pkt.concat([NK_SPIEGEL.gesamt]))*1.18,schritt=roh<=2?0.5:(roh<=6?1:2);
  var max=Math.ceil(roh/schritt)*schritt,min=0,EIN=16;
  function py(v){return H-B-(v-min)/(max-min)*(H-B-T);}
  function px(i){return l.length===1?(L+(W-L-R)/2):L+EIN+i*(W-L-R-2*EIN)/(l.length-1);}
  var svg='',sy=py(NK_SPIEGEL.gesamt);
  for(var v=0;v<=max+1e-9;v+=schritt)svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+py(v)+'" y2="'+py(v)+'" class="nkgrid"/><text x="'+(L-6)+'" y="'+(py(v)+4)+'" class="nkax" text-anchor="end">'+esc(num(v,v%1?1:0))+' €</text>';
  svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+sy+'" y2="'+sy+'" class="nkspiegel"/><text x="'+(W-R+4)+'" y="'+(sy+4)+'" class="nkax">'+esc(t("Schnitt"))+'</text>';
  if(l.length>1)svg+='<polyline class="nklinie" points="'+pkt.map(function(v,i){return px(i)+","+py(v);}).join(" ")+'"/>';
  l.forEach(function(n,i){svg+='<circle cx="'+px(i)+'" cy="'+py(pkt[i])+'" r="4.5" class="nkpunkt"/>'+
    '<text x="'+px(i)+'" y="'+(py(pkt[i])-10)+'" class="nkwert" text-anchor="middle">'+esc(num(pkt[i],2))+'</text>'+
    '<text x="'+px(i)+'" y="'+(H-B+18)+'" class="nkax" text-anchor="middle">'+esc(nkLabel(n))+'</text>';});
  return '<div class="nkkopf"><b>'+t("Je m² und Monat")+'</b><span class="hint" style="margin:0">'+tf("gestrichelt: Schnitt {0} (Mieterbund)",eur(NK_SPIEGEL.gesamt))+'</span></div>'+
    '<div class="nkchart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t("Je m² und Monat")+": "+l.map(function(n,i){return nkLabel(n)+" "+num(pkt[i],2)+" €";}).join(", "))+'">'+svg+'</svg></div>';
}

var NK_BUSY=false;
async function nkSpeichern(){
  if(NK_BUSY||!HH)return;
  var zahlen=["nk_flaeche","nk_personen","nk_vz","nk_erg","nk_vzneu","nh_kosten","nh_verbrauch","nh_va","nh_ww","nh_co2kg","nh_co2ma"];
  NK_FORM.positionen.forEach(function(p,i){zahlen.push("np_betrag_"+i,"np_haus_"+i,"np_p35b_"+i);});
  if(zahlFehlt(zahlen)){toast(t("Bitte eine Zahl eingeben, z. B. 9,90."),true);return;}
  var F=nkFormLesen(),w=F.w;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(w.von||"")||!/^\d{4}-\d{2}-\d{2}$/.test(w.bis||"")||w.bis<w.von){
    var e=$(!w.von?"#nk_von":"#nk_bis");if(e){e.classList.add("bad");e.focus();}
    toast(t("Bitte den Abrechnungszeitraum angeben (bis nach von)."),true);return;}
  var reihe=nkZeile(w,F.positionen,F.heizung,F.ki);
  /* Gleicher Zeitraum schon da → Korrektur ersetzt die Werte, Dokumente bleiben */
  var ziel=F.id,gleich=NK.filter(function(x){return x.von===w.von&&x.bis===w.bis&&x.id!==F.id;})[0];
  if(gleich){
    if(F.id){toast(t("Zwei Abrechnungen mit demselben Zeitraum – bitte zuerst die andere löschen."),true);return;}
    if(!confirm(tf("Für {0} gibt es schon eine Abrechnung. Als Korrektur übernehmen? Die bisherigen Werte werden ersetzt, ihre Dokumente bleiben erhalten.",nkLabel(gleich))))return;
    ziel=gleich.id;reihe.erledigt=false;
  }
  NK_BUSY=true;
  try{
    var r=ziel?await sb.from("nk_abrechnungen").update(reihe).eq("id",ziel).select("id")
              :await sb.from("nk_abrechnungen").insert(reihe).select("id");
    if(r.error)throw r.error;
    if(!r.data||!r.data.length)throw new Error(t("Es wurde nichts gespeichert – fehlende Berechtigung?"));
    var id=r.data[0].id;
    if(F.docIds.length){
      var dr=await sb.from("documents").update({nk_id:id,contract_id:reihe.contract_id,doc_type:"nebenkosten"}).in("id",F.docIds).select("id");
      if(dr.error)throw dr.error;
    }
    NK_FORM=null;closeModal(true);await ladeDaten();
    go("#/nebenkosten?id="+id);toast(t("Gespeichert")+" ✅");
  }catch(x){toast(t("Speichern fehlgeschlagen")+": "+errMsg(x),true);}
  finally{NK_BUSY=false;}
}
async function nkLoeschen(id){
  var n=nkById(id);if(!n)return;
  if(!confirm(tf("Abrechnung {0} löschen? Die Dokumente bleiben erhalten.",nkLabel(n))))return;
  try{
    var r=await sb.from("nk_abrechnungen").delete().eq("id",id).select("id");
    if(r.error)throw r.error;
    if(!r.data||!r.data.length)throw new Error(t("Es wurde nichts gelöscht – fehlende Berechtigung?"));
    await ladeDaten();go("#/nebenkosten");toast(t("Abrechnung gelöscht"));
  }catch(x){toast(t("Löschen fehlgeschlagen")+": "+errMsg(x),true);}
}
async function nkErledigt(id){
  var n=nkById(id);if(!n)return;
  try{var r=await sb.from("nk_abrechnungen").update({erledigt:!n.erledigt}).eq("id",id).select("id");
    if(r.error)throw r.error;await ladeDaten();render();
    toast(n.erledigt?t("Wieder offen"):t("Als bezahlt markiert")+" ✅");}
  catch(x){toast(t("Speichern fehlgeschlagen")+": "+errMsg(x),true);}
}
/* Neue Vorauszahlung in den Mietvertrag (Feld „Nebenkosten (€/Monat)“) */
async function nkVzUebernehmen(id){
  var n=nkById(id),c=n&&nkMieteVertrag(n);if(!c||n.vorauszahlung_neu==null)return;
